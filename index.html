<script id="hdrEarlyClose">
window.__hdrClose = null;
(function(){
  var swallowUntil = 0;
  var KEEP = '#walletButton,#qrButton,#searchButton,#searchInput,#searchPanel,#searchResults,#pageButton,#nexusLogo,#hdrTools,#hdrPanels';
  function kill(e){
    try{ e.stopImmediatePropagation(); }catch(_){}
    try{ if(e.cancelable) e.preventDefault(); }catch(_){}
  }
  function keep(e){
    var t = e.target;
    return !!(t && t.closest && t.closest(KEEP));
  }
  // awal sentuhan: kalau panel terbuka & ketukan di area kosong -> hanya tutup, ketukan dibuang
  ['pointerdown','touchstart','mousedown'].forEach(function(ev){
    window.addEventListener(ev,function(e){
      var now = performance.now();
      if(window.__hdrClose && window.__hdrClose(e)){
        if(!keep(e)){ swallowUntil = now+600; kill(e); }
        return;
      }
      if(now<swallowUntil && !keep(e)) kill(e);
    },true);
  });
  // akhir sentuhan / klik dari ketukan yang sama juga dibuang (supaya detail koin tidak terbuka)
  ['pointerup','touchend','mouseup','click','pointercancel'].forEach(function(ev){
    window.addEventListener(ev,function(e){
      if(performance.now()<swallowUntil && !keep(e)) kill(e);
    },true);
  });
})();
</script>

body{

.app{

  height:100%;

/* =====================================================

===================================================== */

.cryptofoamBrand{
  position:absolute;
  top:10px;
  left:16px;
  z-index:50001;
  color:#f4f1e6;
  font-size:18px;
  line-height:30px;
  font-weight:900;
  letter-spacing:.4px;
  white-space:nowrap;
  pointer-events:none;
  text-shadow:0 2px 10px rgba(255,255,255,.16);
}

.pageButton{
  position:absolute;
  top:9px;
  left:9px;
  width:30px;
  height:30px;
  z-index:50000;
  border-radius:50%;
  border:0;
  outline:0;
  background:transparent;
  color:#d5d8da;
  display:flex;
  align-items:center;
  justify-content:center;
  cursor:pointer;
  transition:
    transform .22s ease,
    filter .22s ease,
    opacity .22s ease;
}

.pageButton:hover{
  transform:translateY(-2px) scale(1.08);
  filter:drop-shadow(0 5px 10px rgba(255,255,255,.22));
}

.pageButton:active{
  transform:translateY(0) scale(.88);
}

.gridIcon{
  width:14px;
  height:14px;
  display:grid;
  grid-template-columns:repeat(2,1fr);
  grid-template-rows:repeat(2,1fr);
  gap:2px;
  filter:drop-shadow(0 3px 6px rgba(255,255,255,.18));
  transition:
    transform .22s ease,
    filter .22s ease;
}

.pageButton:hover .gridIcon{
  transform:translateY(-1px);
  filter:drop-shadow(0 5px 9px rgba(255,255,255,.30));
}

.gridIcon span{
  display:block;
  width:100%;
  height:100%;
  border:1.2px solid #fff;
  background:#fff;
  border-radius:2px;
  box-shadow:0 1px 4px rgba(255,255,255,.20);
}

/* =====================================================
   PAGE MENU
===================================================== */

.pageMenu{
  position:absolute;
  top:auto;
  left:auto;
  right:10px;
  bottom:10px;
  height:40px;
  z-index:49000;

  display:flex;
  align-items:center;
  gap:6px;

  overflow-x:auto;
  overflow-y:hidden;

  opacity:0;
  pointer-events:none;

  justify-content:flex-end;

  transform:translateY(8px);

  transition:
    opacity .2s ease,
    transform .2s ease;

  scrollbar-width:none;
}

.pageMenu::-webkit-scrollbar{
  display:none;
}

.pageMenu.show{
  opacity:1;
  pointer-events:auto;
  transform:translateY(0);
}

.pageItem{
  flex:0 0 auto;
  height:32px;
  padding:0 13px;
  border-radius:16px;
  border:1px solid #555b60;
  background:rgba(10,10,10,.9);
  color:#aeb4b9;
  font-size:10px;
  font-weight:800;
  white-space:nowrap;

  display:flex;
  align-items:center;
  justify-content:center;
}

.pageItem.active{
  color:#f4f1e6;
  border-color:#999fa4;
  background:rgba(130,135,140,.17);
}

/* =====================================================
   DETAIL KOIN: cache HP -> CoinGecko -> CoinMarketCap
   (deskripsi, kategori, website, explorer, smart contract)
===================================================== */

const CD_PREFIX =
  'cd_v2_';

const CD_TTL =
  7*24*3600*1000;

const cdMem =
  new Map();

const cdInflight =
  new Map();

function cdLoad(id){

  try{

    const j =
      JSON.parse(
        localStorage.getItem(
          CD_PREFIX+id
        )||'null'
      );

    return (
      j && j.t
        ?j
        :null
    );

  }catch(e){

    return null;

  }

}

function cdSave(id,data){

  try{

    localStorage.setItem(
      CD_PREFIX+id,
      JSON.stringify(data)
    );

  }catch(e){

    // penyimpanan penuh -> hapus cache detail lama lalu coba lagi
    try{

      Object.keys(
        localStorage
      )
      .filter(
        k=>k.startsWith(CD_PREFIX)
      )
      .forEach(
        k=>localStorage.removeItem(k)
      );

      localStorage.setItem(
        CD_PREFIX+id,
        JSON.stringify(data)
      );

    }catch(e2){}

  }

}

function cdClean(raw){

  return String(raw||'')
    .replace(/<[^>]*>/g,' ')
    .replace(/\s+/g,' ')
    .trim();

}

async function cdFetchCGRaw(id){

  let url =
    'https://api.coingecko.com/api/v3/coins/'+
    encodeURIComponent(id)+
    '?localization=false&tickers=false&market_data=false&community_data=false&developer_data=false&sparkline=false';

  if(CG_DEMO_KEY)
    url +=
      '&x_cg_demo_api_key='+
      encodeURIComponent(CG_DEMO_KEY);

  let lastError =
    null;

  for(let i=0;i<2;i++){

    try{

      const response =
        await fetchT(
          CG_ROUTES[i](url),
          {},
          i===0 ? 8000 : 12000
        );

      // id tidak dikenal CoinGecko (mis. koin dari CMC/Binance) -> langsung cadangan
      if(response.status===404){

        const err =
          new Error('CoinGecko 404');

        err.notFound =
          true;

        throw err;

      }

      if(!response.ok)
        throw new Error(
          'Coin detail HTTP '+
          response.status
        );

      const d =
        await response.json();

      if(!d || !d.id)
        throw new Error(
          'Detail CoinGecko kosong'
        );

      return d;

    }catch(e){

      lastError =
        e;

      if(e.notFound)
        break;

    }

  }

  throw lastError;

}

function cdFromCG(d){

  const links =
    d.links || {};

  const platforms =
    {};

  Object.entries(
    d.platforms || {}
  ).forEach(
    ([k,v])=>{

      if(
        k &&
        v &&
        String(v).trim() &&
        Object.keys(platforms).length<60
      )
        platforms[k] =
          String(v).trim();

    }
  );

  return {
    src:'cg',
    t:Date.now(),
    name:d.name,
    description:{
      en:cdClean(
        d.description &&
        d.description.en
      ).slice(0,900)
    },
    market_cap_rank:d.market_cap_rank || null,
    categories:(d.categories||[]).filter(Boolean).slice(0,4),
    genesis_date:d.genesis_date || '',
    platforms:platforms,
    links:{
      homepage:(links.homepage||[]).filter(Boolean).slice(0,3),
      blockchain_site:(links.blockchain_site||[]).filter(Boolean).slice(0,6)
    }
  };

}

async function cdFetchCMC(coin){

  const sym =
    String(coin.symbol||'')
      .toUpperCase();

  const query =
    coin._cmcId
      ?'id='+coin._cmcId
      :'symbol='+encodeURIComponent(sym);

  const url =
    CMC_BASE+
    '/v2/cryptocurrency/info?'+
    query;

  let lastError =
    null;

  for(let i=0;i<CG_ROUTES.length;i++){

    try{

      const response =
        await fetchT(
          CG_ROUTES[i](url),
          {},
          i===0 ? 10000 : 15000
        );

      if(!response.ok)
        throw new Error(
          'CMC info HTTP '+
          response.status
        );

      const json =
        await response.json();

      const map =
        json && json.data;

      if(!map)
        throw new Error(
          'CMC info kosong'
        );

      let v =
        coin._cmcId
          ?map[String(coin._cmcId)]
          :(
            map[sym] ||
            map[Object.keys(map)[0]]
          );

      // simbol bisa dipakai banyak koin -> pilih yang namanya sama
      if(Array.isArray(v)){

        const nm =
          x=>String(x||'')
            .toLowerCase()
            .replace(/[^a-z0-9]/g,'');

        v =
          v.find(
            x=>nm(x.name)===nm(coin.name)
          ) ||
          (
            v.length===1
              ?v[0]
              :null
          );

      }

      if(!v)
        throw new Error(
          'Koin tidak ada di CMC info'
        );

      return v;

    }catch(e){

      lastError =
        e;

    }

  }

  throw lastError;

}

function cdFromCMC(v){

  const urls =
    v.urls || {};

  const platforms =
    {};

  (v.contract_address||[]).forEach(
    x=>{

      const address =
        x && x.contract_address;

      const network =
        x &&
        x.platform &&
        x.platform.name;

      if(
        address &&
        network &&
        Object.keys(platforms).length<60
      )
        platforms[
          String(network).toLowerCase()
        ] =
          String(address);

    }
  );

  if(
    !Object.keys(platforms).length &&
    v.platform &&
    v.platform.token_address
  ){

    const network =
      v.platform.name ||
      v.platform.slug;

    if(network)
      platforms[
        String(network).toLowerCase()
      ] =
        String(v.platform.token_address);

  }

  return {
    src:'cmc',
    t:Date.now(),
    name:v.name,
    description:{
      en:cdClean(
        v.description
      ).slice(0,900)
    },
    market_cap_rank:null,
    categories:(v.tags||[])
      .map(
        t=>typeof t==='string'
          ?t
          :((t && t.name)||'')
      )
      .filter(Boolean)
      .slice(0,4),
    genesis_date:String(
      v.date_launched ||
      v.date_added ||
      ''
    ).slice(0,10),
    platforms:platforms,
    links:{
      homepage:(urls.website||[]).filter(Boolean).slice(0,3),
      blockchain_site:(urls.explorer||[]).filter(Boolean).slice(0,6)
    }
  };

}

function getCoinDetail(coin){

  const id =
    coin.id;

  if(cdMem.has(id))
    return Promise.resolve(
      cdMem.get(id)
    );

  if(cdInflight.has(id))
    return cdInflight.get(id);

  const job =
    (async()=>{

      const cached =
        cdLoad(id);

      // cache masih segar -> tanpa panggilan jaringan
      if(
        cached &&
        Date.now()-cached.t<CD_TTL
      ){

        cdMem.set(id,cached);

        return cached;

      }

      let data =
        null;

      try{

        data =
          cdFromCG(
            await cdFetchCG(id)
          );

      }catch(e){

        console.warn(
          'Detail CoinGecko gagal',
          e
        );

      }

      if(!data){

        try{

          data =
            cdFromCMC(
              await cdFetchCMC(coin)
            );

        }catch(e){

          console.warn(
            'Detail CoinMarketCap gagal',
            e
          );

        }

      }

      if(data){

        cdMem.set(id,data);

        cdSave(id,data);

        return data;

      }

      // semua sumber gagal -> data lama (kedaluwarsa) lebih baik daripada kosong
      if(cached){

        cdMem.set(id,cached);

        return cached;

      }

      throw new Error(
        'Detail koin tidak tersedia'
      );

    })();

  cdInflight.set(id,job);

  const done =
    ()=>cdInflight.delete(id);

  job.then(done,done);

  return job;

}

/* ---- Block Explorer: dari contract / jaringan koin ---- */

// koin native -> explorer chain-nya
const CD_NATIVE_EXPLORERS = {
  btc:'https://mempool.space',
  eth:'https://etherscan.io',
  bnb:'https://bscscan.com',
  sol:'https://solscan.io',
  trx:'https://tronscan.org',
  xrp:'https://xrpscan.com',
  doge:'https://blockchair.com/dogecoin',
  ltc:'https://blockchair.com/litecoin',
  ada:'https://cardanoscan.io',
  dot:'https://polkadot.subscan.io',
  avax:'https://snowtrace.io',
  ton:'https://tonviewer.com',
  xlm:'https://stellarchain.io',
  bch:'https://blockchair.com/bitcoin-cash',
  near:'https://nearblocks.io',
  atom:'https://www.mintscan.io/cosmos',
  sui:'https://suiscan.xyz',
  apt:'https://aptoscan.com',
  hbar:'https://hashscan.io',
  algo:'https://allo.info'
};

// token -> explorer jaringannya (urutan = prioritas jika ada di banyak jaringan)
const CD_TOKEN_EXPLORERS = [
  [/^ethereum$|^eth$|erc20/,'https://etherscan.io/token/'],
  [/binance|bnb|bep20|^bsc$/,'https://bscscan.com/token/'],
  [/^solana$|^sol$/,'https://solscan.io/token/'],
  [/^base$/,'https://basescan.org/token/'],
  [/arbitrum/,'https://arbiscan.io/token/'],
  [/polygon|matic/,'https://polygonscan.com/token/'],
  [/optimis/,'https://optimistic.etherscan.io/token/'],
  [/avalanche|avax/,'https://snowtrace.io/token/'],
  [/^tron$|trc20/,'https://tronscan.org/#/token20/'],
  [/^linea$/,'https://lineascan.build/token/']
];

function cdExplorerUrl(data,coin){

  const sym =
    String(coin.symbol||'')
      .toLowerCase();

  // koin native hanya jika id-nya memang koin aslinya (bukan token bersimbol sama)
  if(
    BN_KNOWN_IDS[sym]===coin.id &&
    CD_NATIVE_EXPLORERS[sym]
  )
    return CD_NATIVE_EXPLORERS[sym];

  const entries =
    Object.entries(
      (data && data.platforms) || {}
    ).filter(
      ([k,a])=>k && a && String(a).trim()
    );

  for(const [re,base] of CD_TOKEN_EXPLORERS){

    const hit =
      entries.find(
        ([k])=>re.test(
          String(k).toLowerCase()
        )
      );

    if(hit)
      return base+
        encodeURIComponent(
          String(hit[1]).trim()
        );

  }

  // jaringan tidak dikenal -> link explorer dari sumber data
  return (
    (
      data &&
      data.links &&
      data.links.blockchain_site
    ) || []
  ).find(Boolean) || '';

}

.menuItem,
.subToggle,
.wTile{

/* umpan balik sentuhan instan */
.pageButton,
.searchPanel .searchButton,
.walletButton,
.menuItem,
.subToggle,
.wTile,
.wClose{
  transition:
    transform .12s ease-out,
    background-color .15s ease,
    border-color .15s ease,
    color .15s ease,
    opacity .15s ease,
    filter .15s ease;
}

/* layar sentuh: matikan efek hover yang "nyangkut" setelah tap */

  .pageButton:hover{
    transform:none;
    filter:none;
    background:transparent;
  }
  .pageButton:hover .gridIcon{
    transform:none;
  }
  .walletButton:hover{
    background:transparent;
    color:#ffe600;
  }
  .menuItem:hover:not(.active){

    color:#ffe600;
  }
}

.pageButton:active{
  transform:scale(.86);
}

.searchPanel .searchButton:active{
  transform:scale(.84);
}

.walletButton:active{
  transform:scale(.84);
}

.menuItem:active{
  background:rgba(255,255,255,.09);

}

.subToggle:active{

}

.wTile:active{

}

.wClose:active{

/* panel menu: buka/tutup halus, tanpa blur berat di atas bubble yang bergerak */

  background:rgba(0,0,0,.86);

/* =====================================================
   EFEK MELETUS + KLIK LEBIH CEPAT
===================================================== */

.coinBurst{
  position:absolute;
  width:0;
  height:0;
  z-index:30;
  pointer-events:none;
}

.coinBurst .burstRing{
  position:absolute;
  left:0;
  top:0;
  width:0;
  height:0;
  border-radius:50%;
  border:2px solid rgba(255,214,10,.9);
  transform:translate(-50%,-50%);
  animation:burstRing .55s ease-out forwards;
}

.coinBurst b{
  position:absolute;
  left:0;
  top:0;
  width:6px;
  height:6px;
  margin:-3px 0 0 -3px;
  border-radius:50%;
  animation:burstDot .65s cubic-bezier(.15,.7,.3,1) forwards;
}

@keyframes burstRing{
  from{
    width:0;
    height:0;
    opacity:1;
  }
  to{
    width:var(--r);
    height:var(--r);
    opacity:0;
  }
}

@keyframes burstDot{
  from{
    transform:translate(0,0) scale(1);
    opacity:1;
  }
  to{
    transform:translate(var(--dx),var(--dy)) scale(.2);
    opacity:0;
  }
}

.coinCard.popIn .coinBody{
  animation:coinPopIn .6s cubic-bezier(.2,1.5,.4,1) both;
}

@keyframes coinPopIn{
  0%{
    transform:scale(0);
    opacity:0;
  }
  60%{
    opacity:1;
  }
  100%{
    transform:scale(1);
    opacity:1;
  }
}

/* menu & wallet: buka lebih cepat */
.pageMenu{
  transition:
    opacity .12s ease-out,
    transform .12s ease-out,
    visibility 0s linear .12s !important;
}

.pageMenu.show{
  transition-delay:0s !important;
}

.wOverlay{
  transition:
    opacity .1s ease-out,
    visibility 0s linear .1s !important;
}

.wOverlay.show{
  transition-delay:0s !important;
}

.wPanel{
  transition:transform .14s ease-out !important;
}

.pageButton,
.walletButton{
  touch-action:manipulation;
}

/* =====================================================
   UPDATE: TRANSISI HALUS + OUTLINE HIJAU/MERAH
===================================================== */

/* menu: muncul/hilang halus (tetap responsif karena mulai saat disentuh) */
.pageMenu{
  transform:translateY(12px) scale(.985);
  transition:
    opacity .3s cubic-bezier(.22,.8,.3,1),
    transform .3s cubic-bezier(.22,.8,.3,1),
    visibility 0s linear .3s !important;
}

.pageMenu.show{
  transform:none;
  transition-delay:0s !important;
}

.subMenu.show{
  animation:subMenuIn .28s cubic-bezier(.22,.8,.3,1);
}

/* wallet: overlay & panel halus */
.wOverlay{
  transition:
    opacity .28s ease,
    visibility 0s linear .28s !important;
}

.wOverlay.show{
  transition-delay:0s !important;
}

.wPanel{
  transform:translateY(14px) scale(.96);
  transition:
    transform .32s cubic-bezier(.22,.8,.3,1) !important;
}

.wOverlay.show .wPanel{
  transform:none;
}

/* tombol: tekan/lepas halus */
.pageButton,
.searchPanel .searchButton,
.walletButton,
.menuItem,
.subToggle,
.wTile,
.wClose{
  transition:
    transform .2s cubic-bezier(.22,.8,.3,1),
    background-color .25s ease,
    border-color .25s ease,
    color .25s ease,
    opacity .25s ease,
    filter .25s ease;
}

/* koin: perubahan warna outline halus */
.coinBody{
  transition:
    border-color .5s ease,
    box-shadow .5s ease;
}

.coinLogo,
.coinBody::after{
  transition:
    border-color .5s ease;
}

/* outline koin: hanya outline terluar, tipis. naik = hijau, turun = merah */
.coinBody{
  border-width:.8px;
  box-shadow:none;
}

.coinBody::after{
  display:none;
}

.coinLogo{
  border:0;
}

.coinCard:has(.coinGain.up) .coinBody,
.coinCard.gUp .coinBody{
  border-color:#7dfa00;
  box-shadow:none;
}

.coinCard:has(.coinGain.down) .coinBody,
.coinCard.gDown .coinBody{
  border-color:#fb038d;
  box-shadow:none;
}

/* ikon link eksternal di tiap kotak wallet */

/* =====================================================

===================================================== */
.pageSlider{
  position:relative;
  width:100%;
  padding:34px 0 22px;
  cursor:pointer;
  user-select:none;
  -webkit-user-select:none;
  touch-action:pan-y;
  outline:0;
}
.psRail{
  position:relative;
  height:20px;
  margin:0 34px;
}
.psLine,
.psFill{
  position:absolute;
  left:0;
  top:50%;
  height:3px;
  margin-top:-1.5px;
  border-radius:3px;
}
.psLine{
  width:100%;
  background:#3a3a3a;
}
.psFill{
  width:0;
  background:#6b6b6b;
}
.pageSlider.active .psFill{
  background:#ffe600;
}
.psDot{
  position:absolute;
  top:50%;
  width:8px;
  height:8px;
  margin:-4px 0 0 -4px;
  border-radius:50%;
  background:#000;
  border:2px solid #3a3a3a;
  box-sizing:border-box;
}
.psDot.on{
  border-color:#6b6b6b;
}
.pageSlider.active .psDot.on{
  border-color:#ffe600;
}
.psThumb{
  position:absolute;
  top:50%;
  left:0;
  width:20px;
  height:20px;
  margin:-10px 0 0 -10px;
  border-radius:50%;
  background:#111;
  border:3px solid #8a8a8a;
  box-sizing:border-box;
  transition:left .12s ease-out, transform .12s;
}
.pageSlider.drag .psThumb{
  transition:none;
  transform:scale(1.15);
}
.pageSlider.active .psThumb{
  border-color:#ffe600;
}
.pageSlider:focus-visible .psThumb{
  box-shadow:0 0 0 3px rgba(255,230,0,.35);
}
.psBubble{
  position:absolute;
  left:50%;
  bottom:calc(100% + 8px);
  transform:translateX(-50%);
  padding:3px 8px;
  border-radius:8px;
  background:#262626;
  color:#d0d0d0;
  font-size:11px;
  font-weight:800;
  white-space:nowrap;
  pointer-events:none;
}
.pageSlider.active .psBubble{
  color:#ffe600;
}

/* efek berlari */
.runBot{ overflow:visible; }
.runBot .rbBody{
  transform-box:fill-box;
  transform-origin:50% 100%;
  animation:rbBounce .5s ease-in-out infinite;
}
.runBot .rbLeg,
.runBot .rbArm{
  transform-box:fill-box;
  transform-origin:50% 0%;
}
.runBot .rbLegL{ animation:rbSwingA .5s ease-in-out infinite; }
.runBot .rbLegR{ animation:rbSwingB .5s ease-in-out infinite; }
.runBot .rbArmL{ animation:rbSwingB .5s ease-in-out infinite; }
.runBot .rbArmR{ animation:rbSwingA .5s ease-in-out infinite; }

@keyframes rbBounce{
  0%,100%{ transform:translateY(0) rotate(5deg); }
  50%{ transform:translateY(-1.1px) rotate(5deg); }
}
@keyframes rbSwingA{
  0%,100%{ transform:rotate(-38deg); }
  50%{ transform:rotate(38deg); }
}
@keyframes rbSwingB{
  0%,100%{ transform:rotate(38deg); }
  50%{ transform:rotate(-38deg); }
}
@media (prefers-reduced-motion:reduce){
  .runBot .rbBody,
  .runBot .rbLeg,
  .runBot .rbArm{ animation:none; }
}

/* ikon robot sedikit lebih besar */
.pageButton .gridIcon{
  width:34px !important;
  height:34px !important;
}

/* robot berjalan: lebih lambat & halus, ukuran lebih besar */
.pageButton .gridIcon{
  width:40px !important;
  height:40px !important;
}
.runBot .rbBody{
  animation:rbWalkBob .6s cubic-bezier(.37,0,.63,1) infinite !important;
  will-change:transform;
}
.runBot .rbLeg,
.runBot .rbArm{
  will-change:transform;
}
.runBot .rbLegL{ animation:rbWalkA 1.2s cubic-bezier(.37,0,.63,1) infinite alternate !important; }
.runBot .rbLegR{ animation:rbWalkB 1.2s cubic-bezier(.37,0,.63,1) infinite alternate !important; }
.runBot .rbArmL{ animation:rbWalkB 1.2s cubic-bezier(.37,0,.63,1) infinite alternate !important; }
.runBot .rbArmR{ animation:rbWalkA 1.2s cubic-bezier(.37,0,.63,1) infinite alternate !important; }

@keyframes rbWalkBob{
  0%,100%{ transform:translateY(0) rotate(0deg); }
  50%{ transform:translateY(-.55px) rotate(0deg); }
}
@keyframes rbWalkA{
  from{ transform:rotate(-24deg); }
  to{ transform:rotate(24deg); }
}
@keyframes rbWalkB{
  from{ transform:rotate(24deg); }
  to{ transform:rotate(-24deg); }
}
@media (prefers-reduced-motion:reduce){
  .runBot .rbBody,
  .runBot .rbLeg,
  .runBot .rbArm{ animation:none !important; }
}

#splash{position:fixed;inset:0;z-index:2147483000;background:#000;overflow:hidden;
  touch-action:none;user-select:none;-webkit-user-select:none;transition:opacity .45s ease,transform .45s ease;}
#splash.out{opacity:0;transform:scale(1.04);pointer-events:none;}
#splash .spStage{position:absolute;left:50%;top:50%;width:min(100vw,calc(100dvh * 898/1752));
  aspect-ratio:898/1752;transform:translate(-50%,-50%);}
#splash .spStage img{position:absolute;display:block;pointer-events:none;-webkit-user-drag:none;}
#splash .spImg{left:0;top:0;width:100%;height:100%;}
#splash .spBtnBg{left:40.0891%;top:88.1849%;width:59.0200%;height:7.7055%;}
#splash .spTxt{left:69.7105%;top:91.0959%;width:10.0223%;height:2.5114%;}
#splash .spShine{position:absolute;left:41.9822%;top:89.0982%;width:54.5657%;height:5.8790%;
  clip-path:polygon(14.90% 0.00%,100.00% 0.00%,85.71% 100.00%,0.00% 100.00%);overflow:hidden;pointer-events:none;}
#splash .spShine::before{content:"";position:absolute;top:0;bottom:0;left:-45%;width:34%;
  background:linear-gradient(100deg,transparent,rgba(255,255,255,.6),transparent);
  transform:skewX(-18deg);animation:spShine 2.2s ease-in-out infinite;}
@keyframes spShine{0%{left:-45%}60%,100%{left:125%}}
#splash .spFade{will-change:opacity;}
#splash .snap{transition:opacity .28s ease,transform .28s cubic-bezier(.22,.8,.2,1);}
#splash .spKnob{position:absolute;left:49.5546%;top:90.5822%;width:7.3497%;height:3.1963%;
  border:0;padding:0;margin:0;outline:0;background:transparent;border-radius:14px;
  display:flex;align-items:center;justify-content:center;cursor:grab;touch-action:none;will-change:transform;}
#splash .spKnob::after{content:"";position:absolute;inset:-14px;}
#splash .spKnob.drag{cursor:grabbing;}
#splash .spKnob svg{width:82%;height:auto;display:block;pointer-events:none;}
#splash .spKnob{z-index:3;}
#splash .spKnob::before{content:"";position:absolute;left:50%;top:50%;height:128%;aspect-ratio:1.5/1;
  transform:translate(-50%,-50%) skewX(-14deg);border-radius:16px;
  background:linear-gradient(145deg,#2b2b2b 0%,#000 65%);
  box-shadow:0 0 0 2px rgba(57,255,20,.9),0 6px 16px rgba(0,0,0,.55),0 0 18px rgba(57,255,20,.55),inset 0 1px 0 rgba(255,255,255,.18);
  animation:spPulse 1.8s ease-in-out infinite;}
#splash .spKnob.drag::before{animation:none;box-shadow:0 0 0 2px #39ff14,0 8px 22px rgba(0,0,0,.6),0 0 28px rgba(57,255,20,.85);}
@keyframes spPulse{0%,100%{box-shadow:0 0 0 2px rgba(57,255,20,.9),0 6px 16px rgba(0,0,0,.55),0 0 10px rgba(57,255,20,.35),inset 0 1px 0 rgba(255,255,255,.18)}
  50%{box-shadow:0 0 0 2px #39ff14,0 6px 16px rgba(0,0,0,.55),0 0 26px rgba(57,255,20,.85),inset 0 1px 0 rgba(255,255,255,.18)}}
#splash .spKnob svg{position:relative;z-index:1;width:72%;filter:drop-shadow(0 0 4px rgba(57,255,20,.8));}
#splash .spKnob svg path{stroke:#39ff14;}
#splash .spTrail{position:absolute;left:82.5%;top:90.58%;width:12%;height:3.2%;display:flex;align-items:center;
  justify-content:space-between;pointer-events:none;}
#splash .spTrail svg{width:26%;height:auto;opacity:.15;animation:spChev 1.3s ease-in-out infinite;}
#splash .spTrail svg:nth-child(2){animation-delay:.18s}
#splash .spTrail svg:nth-child(3){animation-delay:.36s}
@keyframes spChev{0%,100%{opacity:.12;transform:translateX(-10%)}45%{opacity:1;transform:translateX(10%)}}
#splash .spBtnBg:not(.snap){animation:spGlow 2s ease-in-out infinite;}
@keyframes spGlow{0%,100%{filter:drop-shadow(0 0 4px rgba(57,255,20,.25))}50%{filter:drop-shadow(0 0 16px rgba(57,255,20,.75))}}
#splash .spImg{animation:spFloat 6s ease-in-out infinite;transform-origin:50% 60%;}
@keyframes spFloat{0%,100%{transform:scale(1) translateY(0)}50%{transform:scale(1.015) translateY(-.6%)}}
#splash .spTxt{letter-spacing:.5px;}
/* tanpa background hijau: hanya garis tipis */
#splash .spBtnBg,#splash .spShine{display:none !important;}
#splash .spStage::after{content:"";position:absolute;left:41.5%;top:89.2%;width:55%;height:5.6%;pointer-events:none;
  border:1.5px solid rgba(57,255,20,.55);border-radius:14px;transform:skewX(-14deg);
  background:linear-gradient(90deg,rgba(57,255,20,.10),rgba(57,255,20,0));
  box-shadow:0 0 14px rgba(57,255,20,.18);}
#splash .spTxt{filter:brightness(0) invert(1);}
#splash .spStage::after{display:none !important;}
#splash .spKnob::before,#splash .spKnob.drag::before{box-shadow:none !important;animation:none !important;background:transparent !important;}
#splash .spTrail svg{stroke:#39ff14;}
@media (prefers-reduced-motion:reduce){#splash .spImg,#splash .spBtnBg,#splash .spKnob::before,#splash .spTrail svg{animation:none!important}}
#splash .spKnob:not(.drag):not(.snap) svg{animation:spNudge 1.3s ease-in-out infinite;}
@keyframes spNudge{0%,100%{transform:translateX(-4%)}50%{transform:translateX(16%)}}
@media (prefers-reduced-motion:reduce){#splash .spShine::before,#splash .spKnob svg{animation:none!important}}

/* Ukuran bubble berdasarkan PERINGKAT persentase (percentile)
   di antara koin yang sedang tampil (semua filter & interval), jadi sebaran ukuran
   selalu sama rata di 1h / 1d / 1w / 1m / 1y. */

let sizeRank = [];

function rebuildSizeRank(){

  sizeRank =
    visibleCoins
      .map(
        c=>Math.abs(getGain(c))
      )
      .sort((a,b)=>a-b);

}

function sizeFromGain(gain){

  const g =
    Math.abs(
      Number(gain)||0
    );

  let normalized = 0;

  const n =
    sizeRank.length;

  if(n===1)
    return (MIN_SIZE+MAX_SIZE)/2;

  if(n>1){

    // binary search: jumlah koin dengan |gain| < g
    let lo = 0;
    let hi = n;

    while(lo<hi){

      const mid =
        (lo+hi)>>1;

      if(sizeRank[mid]<g)
        lo = mid+1;
      else
        hi = mid;

    }

    normalized =
      lo/(n-1);

  }

  // kurva: kebanyakan koin kecil, hanya sedikit yang besar
  normalized =
    Math.pow(
      Math.min(1,normalized),
      1.8
    );

  return (
    MIN_SIZE+
    (
      MAX_SIZE-
      MIN_SIZE
    )*
    normalized
  );

}

function gtSleep(ms){

  return new Promise(
    r=>setTimeout(r,ms)
  );

async function gtFetchPages(
  path,
  pages,
  include,
  extra
){

  const out = [];

  for(
    let page=1;
    page<=pages;
    page++
  ){

    // GeckoTerminal gratis dibatasi ±30 request/menit:
    // jeda antar halaman + ulangi otomatis saat kena limit (429)
    let response =
      null;

    for(
      let attempt=0;
      attempt<4;
      attempt++
    ){

      try{

        response =
          await fetch(
            GT_BASE+path+
            '?include='+(include||'base_token')+
            '&page='+page+
            (extra||''),
            {
              headers:{
                accept:
                  'application/json;version=20230302'
              }
            }
          );

      }catch(e){

        response =
          null;

      }

      if(
        response &&
        response.ok
      )
        break;

      // error selain limit/server -> tidak perlu diulang
      if(
        response &&
        response.status!==429 &&
        response.status<500
      )
        break;

      await gtSleep(
        1500*(attempt+1)
      );

    }

    if(
      !response ||
      !response.ok
    ){

      // sebagian data sudah didapat -> pakai yang ada
      if(out.length)
        break;

      throw new Error(
        'GeckoTerminal HTTP '+
        (response?response.status:'network')
      );

    }

    if(page<pages)
      await gtSleep(350);

    const json =
      await response.json();

    if(!(json.data||[]).length)
      break;

    const tokens =
      new Map(
        (json.included||[])
          .map(
            t=>[t.id,t.attributes||{}]
          )
      );

    (json.data||[]).forEach(
      pool=>{

        const a =
          pool.attributes||{};

        const tokenId =
          pool.relationships
            ?.base_token
            ?.data
            ?.id;

        const token =
          tokens.get(tokenId)||{};

        const pc =
          a.price_change_percentage||{};

        const h1 =
          Number(pc.h1)||0;

        const h24 =
          Number(pc.h24)||0;

        const network =
          (
            pool.relationships
              ?.network
              ?.data
              ?.id
          )||
          (
            pool.id||''
          ).split('_')[0];

        out.push({

          id:
            'gt_'+pool.id,

          _terminal:
            true,

          _source:
            'GeckoTerminal',

          _dex:
            (
              pool.relationships
                ?.dex
                ?.data
                ?.id
            )||'',

          _contract:
            String(token.address||''),

          _addr:
            (
              token.address||''
            ).toLowerCase(),

          _network:
            network,

          _pool:
            a.address,

          _created:
            a.pool_created_at,

          name:
            token.name||
            (a.name||'').split(' / ')[0],

          symbol:
            token.symbol||

          image:
            (

          current_price:

            ),

            )||

            h24,

          price_change_percentage_30d_in_currency:
            h24,

          price_change_percentage_1y_in_currency:
            h24

        });

      }
    );

  }

  return out;

}


async function loadTerminal(
  kind,
  pages=5
){

  const now =
    Date.now();

  const key =
    kind==='NewPool'
      ?'new'
      :'trending';

  pages =
    Math.min(10,Math.max(1,pages));

  const cached =
    terminalCache[key];

  if(
    cached &&
    cached.pages>=pages &&
    now-cached.t<GT_TTL
  )
    return cached.coins;

  // request yang sama sedang berjalan -> tunggu, jangan kirim ulang
  const inflightKey =
    key+':'+pages;

  if(gtInflight[inflightKey])
    return gtInflight[inflightKey];

  gtInflight[inflightKey] =
    (async()=>{

      try{

        const coins =
          await gtFetchPages(
            key==='new'
              ?'/networks/new_pools'
              :'/networks/trending_pools',
            pages
          );

        terminalCache[key] =
          {
            t:Date.now(),
            pages,
            coins
          };

        return coins;

      }catch(e){

        // gagal -> pakai data lama (walau kadaluarsa) daripada kosong
        if(cached && cached.coins.length){

          console.warn(e);

          return cached.coins;

        }

        throw e;

      }finally{

        delete gtInflight[inflightKey];

      }

    })();

  return gtInflight[inflightKey];

}


// data Terminal untuk satu chain (endpoint GeckoTerminal per network)
async function loadTerminalChain(
  net,
  kind,
  pages=5
){

  const now =
    Date.now();

  const type =
    kind==='NewPool'
      ?'new'
      :kind==='Trending'
        ?'trending'
        :'pools';

  const key =
    net+':'+type;

  pages =
    Math.min(10,Math.max(1,pages));

  const cached =
    terminalChainCache[key];

  if(
    cached &&
    cached.pages>=pages &&
    now-cached.t<GT_TTL
  )
    return cached.coins;

  const inflightKey =
    'c:'+key+':'+pages;

  if(gtInflight[inflightKey])
    return gtInflight[inflightKey];

  gtInflight[inflightKey] =
    (async()=>{

      try{

        const path =
          '/networks/'+net+'/'+
          (
            type==='new'
              ?'new_pools'
              :type==='trending'
                ?'trending_pools'
                :'pools'
          );

        const coins =
          await gtFetchPages(
            path,
            pages,
            undefined,
            type==='pools'
              ?'&sort=h24_volume_usd_desc'
              :''
          );

        terminalChainCache[key] =
          {
            t:Date.now(),
            pages,
            coins
          };

        return coins;

      }catch(e){

        if(cached && cached.coins.length){

          console.warn(e);

          return cached.coins;

        }

        throw e;

      }finally{

        delete gtInflight[inflightKey];

      }

    })();

  return gtInflight[inflightKey];

}

      kind==='All' ||
      kind==='Gainer' ||
      kind==='Looser'
    ){

      // gabung trending + pool baru lalu urutkan
      // berurutan (bukan paralel) agar tidak kena limit API
      const need =

      const a =

      const unique =

      [...a,...b].forEach(
        c=>unique.set(c.id,c)
      );

      list =
        [...unique.values()]
          .filter(
            c=>c.current_price>0
          );

      if(kind!=='All')
        list.sort(
          (x,y)=>
            kind==='Gainer'
              ?getGain(y)-getGain(x)
              :getGain(x)-getGain(y)
        );

    }else{

      list =
        (
          await loadTerminal(
            kind,
            Math.min(10,(page+1)*5)
          )
        ).filter(
          c=>c.current_price>0

      '<div style="position:absolute;inset:0;'+
      'display:flex;align-items:center;'+
      'justify-content:center;color:#777;'+
      'font-size:11px;text-align:center;'+

      'GeckoTerminal.<br>Coba lagi sebentar.<br><br>'+
      '<button id=\"gtRetry\" style=\"padding:8px 16px;'+
      'border:0;border-radius:14px;background:#303030;'+
      'color:#f4f1e6;font-size:11px;font-weight:800;'+
      'cursor:pointer;\">Coba lagi</button>'+

  const byChain =
    new Map();

  [...top,...latest,...profiles,...takeovers,...ads].forEach(
    t=>{

      if(!t.chainId||!t.tokenAddress)
        return;

      if(t.icon)
        icons.set(
          key(t),
          t.icon
        );

      if(!byChain.has(t.chainId))
        byChain.set(
          t.chainId,
          new Set()
        );

      byChain
        .get(t.chainId)
        .add(t.tokenAddress);

    }
  );

  // ambil data pair per chain, maksimal 30 token per request
  const jobs = [];

  byChain.forEach(
    (set,chain)=>{

      const list =
        [...set];

      for(
        let i=0;
        i<list.length;
        i+=30
      ){

        jobs.push(
          dxJson(
            '/tokens/v1/'+chain+'/'+
            list
              .slice(i,i+30)
              .join(',')
          ).catch(
            ()=>[]
          )
        );

      }

    }
  );

  const searchPairs =
    (
      await Promise.all(searchJobs)
    ).flat().filter(
      pair=>
        pair &&
        (
          Number(pair.liquidity?.usd)||0
        )>=2000 &&
        (
          Number(pair.volume?.h24)||0
        )>0
    );

  const pairs =
    [
      ...(
        await Promise.all(jobs)
      ).flat(),
      ...searchPairs
    ];

  // pilih pair dengan likuiditas terbesar untuk tiap token
  const best =
    new Map();

  pairs.forEach(
    pair=>{

      if(
        !pair ||
        !pair.priceUsd ||
        !pair.baseToken
      )
        return;

      const k =
        pair.chainId+':'+
        (
          pair.baseToken.address||''
        ).toLowerCase();

      const liq =
        Number(pair.liquidity?.usd)||0;

      const old =
        best.get(k);

      if(
        !old ||
        liq>(
          Number(
            old.liquidity?.usd
          )||0
        )
      )
        best.set(k,pair);

    }
  );

  const coinOf =
    t=>{

      const pair =
        best.get(key(t));

      return pair
        ?dxToCoin(pair,icons)
        :null;

    };

  const uniq =
    arr=>{

      const seen =
        new Set();

      return arr.filter(
        c=>{

          if(!c||seen.has(c.id))
            return false;

          seen.add(c.id);

          return true;

        }
      );

    };

  const topCoins =
    uniq(top.map(coinOf));

  const freshCoins =
    uniq(
      [...latest,...profiles]
        .map(coinOf)
    ).sort(
      (a,b)=>b._created-a._created
    );

  // semua token unik dari seluruh sumber (boost + profil + pencarian)
  const extraCoins =
    uniq(
      [...best.values()].map(
        pair=>dxToCoin(pair,icons)
      )
    );

  const allCoins =
    uniq(
      [...topCoins,...freshCoins,...extraCoins]
    );

  // Trending = token boost dulu, lalu sisanya menurut volume 24 jam
  const trendCoins =
    uniq(
      [
        ...topCoins,
        ...[...allCoins].sort(
          (a,b)=>
            (b.total_volume||0)-
            (a.total_volume||0)
        )
      ]
    );

  // New Pair = semua pair diurutkan dari yang paling baru dibuat
  const newCoins =
    [...allCoins]
      .filter(c=>c._created)
      .sort(
        (a,b)=>b._created-a._created
      );

  dexCache = {
    t:now,
    top:trendCoins,
    fresh:newCoins,
    all:allCoins
  };

  return dexCache;

}

// data Dex untuk satu chain: data umum + pencarian khusus chain tsb
async function loadDexChain(chain){

  const now =
    Date.now();

  const cached =
    dexChainCache[chain];

  if(
    cached &&
    now-cached.t<120000
  )
    return cached.data;

  const base =
    await loadDex();

  const terms =
    [
      chain,
      DX_CHAIN_NATIVE[chain]||chain,
      'W'+(DX_CHAIN_NATIVE[chain]||chain),
      'USDC','USDT',
      'meme','ai','dog','cat','pepe','trump','agent'
    ];

  const found =
    (
      await Promise.all(
        terms.map(
          q=>dxJson(
            '/latest/dex/search?q='+
            encodeURIComponent(q)
          ).then(
            d=>(d&&d.pairs)||[]
          ).catch(
            ()=>[]
          )
        )
      )
    ).flat().filter(
      pair=>
        pair &&
        pair.chainId===chain &&
        pair.priceUsd &&
        pair.baseToken &&
        (Number(pair.liquidity?.usd)||0)>=2000 &&
        (Number(pair.volume?.h24)||0)>0
    );

  const best =
    new Map();

  found.forEach(
    pair=>{

      const k =
        (pair.baseToken.address||'').toLowerCase();

      const old =
        best.get(k);

      if(
        !old ||
        (Number(pair.liquidity?.usd)||0)>
        (Number(old.liquidity?.usd)||0)
      )
        best.set(k,pair);

    }
  );

  const uniq =
    arr=>{

      const seen =
        new Set();

      return arr.filter(
        c=>{

          if(!c||seen.has(c.id))
            return false;

          seen.add(c.id);

          return true;

        }
      );

    };

  const icons =
    new Map();

  const all =
    uniq(
      [
        ...base.all.filter(
          c=>c._network===chain
        ),
        ...[...best.values()].map(
          pair=>dxToCoin(pair,icons)
        )
      ]
    );

  const data = {
    all,
    top:uniq(
      [
        ...base.top.filter(
          c=>c._network===chain
        ),
        ...[...all].sort(
          (a,b)=>
            (b.total_volume||0)-
            (a.total_volume||0)
        )
      ]
    ),
    fresh:[...all]
      .filter(c=>c._created)
      .sort(
        (a,b)=>b._created-a._created
      )
  };

  dexChainCache[chain] =
    {
      t:now,
      data
    };

  return data;

}

const FM_API =
  'https://four.meme/meme-api/v1';

// jika ternyata nilai "increase" dari four.meme sudah berupa persen
// (bukan rasio 0.12 = 12%), ubah menjadi false.
const FM_INCREASE_IS_RATIO =
  true;

let launchMode =
  null;               // null | 'Trending' | 'Gainer' | 'Looser' | 'NewLaunch'

let launchCache =
  null;               // { t, hot, fresh, all }

let fmLogged =
  false;


async function fmRanking(type,size){

  const response =
    await fetch(
      FM_API+'/public/token/ranking',
      {
        method:'POST',
        headers:{
          'Content-Type':'application/json',
          Accept:'application/json'
        },
        body:JSON.stringify({
          type:type,
          pageSize:size
        })
      }
    );

  if(!response.ok)
    throw new Error(
      'four.meme HTTP '+
      response.status
    );

  const json =
    await response.json();

  const d =
    json && json.data;

  const list =
    Array.isArray(d)
      ?d
      :(
        d && (
          d.records||
          d.list||
          d.rows||
          d.tokenList||
          d.tokens
        )
      )||[];

  if(!fmLogged && list.length){

    fmLogged = true;

    // contoh 1 data asli four.meme, untuk pengecekan nama field
    console.info(
      'four.meme sample item:',
      list[0]
    );

  }

  return list;

}

function fmFirst(o,keys){

  for(const k of keys){

    if(
      o[k]!==undefined &&
      o[k]!==null &&
      o[k]!==''
    )
      return o[k];

  }

  return undefined;

}

function fmImage(u){

  if(!u)
    return '';

  if(/^https?:/i.test(u))
    return u;

  return 'https://static.four.meme/'+
         String(u).replace(/^\/+/,'');

}

function fmToCoin(it,bnbUsd){

  const addr =
    String(
      fmFirst(
        it,
        ['tokenAddress','address','token']
      )||''
    );

  if(!addr)
    return null;

  const symbol =
    fmFirst(
      it,
      ['shortName','tokenSymbol','symbol']
    )||'';

  const name =
    fmFirst(
      it,
      ['name','tokenName']
    )||symbol;

  const cap =
    Number(
      fmFirst(it,['cap','marketCap'])
    )||0;

  // harga: dari four.meme (dalam BNB) x harga BNB, atau cap / 1 miliar supply
  const rawPrice =
    Number(
      fmFirst(
        it,
        ['price','lastPrice','priceUsd']
      )
    )||0;

  const quote =
    String(
      fmFirst(
        it,
        ['raisedTokenSymbol','quoteSymbol']
      )||'BNB'
    ).toUpperCase();

  let priceUsd = 0;

  if(
    rawPrice>0 &&
    (
      quote==='USDT' ||
      quote==='USD1' ||
      quote==='USDC'
    )
  )
    priceUsd = rawPrice;

  else if(
    rawPrice>0 &&
    bnbUsd>0
  )
    priceUsd = rawPrice*bnbUsd;

  if(!(priceUsd>0) && cap>0)
    priceUsd = cap/1e9;

  if(!(priceUsd>0))
    return null;

  const toPct =
    v=>{

      const n =
        Number(v);

      if(!isFinite(n))
        return 0;

      return FM_INCREASE_IS_RATIO
        ?n*100
        :n;

    };

  const h24Raw =
    fmFirst(
      it,
      [
        'day1Increase',
        'dayIncrease',
        'increase',
        'priceChange24h'
      ]
    );

  const h1Raw =
    fmFirst(
      it,
      [
        'hourIncrease',
        'hour1Increase',
        'priceChange1h'
      ]
    );

  const h24 =
    toPct(h24Raw);

  const h1 =
    h1Raw===undefined
      ?h24
      :toPct(h1Raw);

  let created =
    Number(
      fmFirst(
        it,
        ['createDate','createTime','launchTime']
      )
    )||0;

  if(created && created<1e12)
    created *= 1000;

  return {

    id:
      'fm_'+addr.toLowerCase(),

    _terminal:
      true,

    _source:
      'four.meme',

    _contract:
      addr,

    _network:
      'bsc',

    _pool:
      addr,

    _url:
      'https://four.meme/token/'+addr,

    _created:
      created,

    name:
      name,

    symbol:
      symbol,

    image:
      fmImage(
        fmFirst(
          it,
          ['img','image','logo','icon']
        )
      ),

    current_price:
      priceUsd,

    market_cap:
      cap||undefined,

    total_volume:
      Number(
        fmFirst(
          it,
          ['day1Vol','volume','vol']
        )
      )||undefined,

    price_change_percentage_24h:
      h24,

    price_change_percentage_1h_in_currency:
      h1,

    price_change_percentage_7d_in_currency:
      h24,

    price_change_percentage_30d_in_currency:
      h24,

    price_change_percentage_1y_in_currency:
      h24

  };

}

async function loadLaunchpad(){

  const now =
    Date.now();

  if(
    launchCache &&
    now-launchCache.t<GT_TTL
  )
    return launchCache;

  const bnbUsd =
    Number(
      coinMap.get('binancecoin')
        ?.current_price
    )||0;

  const conv =
    arr=>arr
      .map(
        it=>fmToCoin(it,bnbUsd)
      )
      .filter(Boolean);

  const load =
    type=>fmRanking(type,500)
      .catch(
        ()=>fmRanking(type,100)
      )
      .catch(
        e=>{
          if(type==='HOT')
            throw e;   // HOT wajib berhasil
          console.warn(e);
          return [];
        }
      );

  const [hotRaw,volRaw,newRaw,progRaw] =
    await Promise.all([
      load('HOT'),
      load('VOL_DAY_1'),
      load('NEW'),
      load('PROGRESS')
    ]);

  const hot =
    conv(hotRaw);

  const fresh =
    conv(newRaw);

  const seen =
    new Set();

  const all =
    [
      ...hot,
      ...conv(volRaw),
      ...fresh,
      ...conv(progRaw)
    ].filter(
      c=>{

        if(seen.has(c.id))
          return false;

        seen.add(c.id);

        return true;

      }
    );

  launchCache = {
    t:now,
    hot,
    fresh,
    all
  };

  return launchCache;

}

async function baFetchList(){

    for(
      let k=0;
      k<BA_ROUTES.length;
      k++
    ){

        (baRouteIdx+k)%

      try{

          await fetchT(

            },
            12000
          );

        if(!response.ok)

            'Binance Alpha HTTP '+

          );

        const json =
          await response.json();

        const d =
          json && json.data;

        const list =
          Array.isArray(d)
            ?d
            :(
              d && Array.isArray(d.list)
                ?d.list
                :null
            );

        if(!list || !list.length)
          throw new Error(

        baRouteIdx =
          idx;

        return list;

async function loadAlpha(){

  const now =
    Date.now();

  if(
    alphaCache &&
    now-alphaCache.t<GT_TTL
  )
    return alphaCache.list;

  if(alphaInflight)
    return alphaInflight;

  alphaInflight =
    (async()=>{

      try{

        const raw =
          await baFetchList();

        const seen =
          new Set();

        const list =
          raw
            .map(baToCoin)
            .filter(
              c=>{

                if(!c || seen.has(c.id))
                  return false;

                seen.add(c.id);

                return true;

              }
            );

        if(!list.length)
          throw new Error(
            'Binance Alpha kosong'
          );

        alphaCache = {
          t:Date.now(),
          list
        };

        return list;

      }catch(e){

        // gagal tapi masih punya data lama -> pakai data lama
        if(alphaCache)
          return alphaCache.list;

        throw e;

      }finally{

        alphaInflight =
          null;

      }

    })();

  return alphaInflight;

}

/* =====================================================
   HYPERLIQUID  (API publik resmi: api.hyperliquid.xyz/info)
   Trending = volume 24 jam | Gainer / Loser = perubahan harga 24 jam

let web3Mode = false;   // halaman Web3 (placeholder 'Progress Upgrade')
let hlMode  = null;     // null | 'Trending' | 'Gainer' | 'Looser'
let hlCache = null;     // { t, list }
let hlInflight = null;

function hlToCoin(meta,ctx){

  if(!meta || !ctx || meta.isDelisted)
    return null;

  const name   = String(meta.name||'').trim();
  const price  = Number(ctx.markPx)||Number(ctx.midPx)||0;

  if(!name || !(price>0))
    return null;

  const prev = Number(ctx.prevDayPx)||0;
  const h24  = prev>0 ? (price/prev-1)*100 : 0;
  const vol  = Number(ctx.dayNtlVlm)||0;
  const oi   = (Number(ctx.openInterest)||0)*price;

  const logos = [
    'https://app.hyperliquid.xyz/coins/'+encodeURIComponent(name)+'.svg',
    letterLogo(name)
  ];

  return {
    id:'hl_'+name.toLowerCase(),
    _terminal:true,
    _source:'Hyperliquid',
    _network:'Hyperliquid',
    _pool:name,
    _url:'https://app.hyperliquid.xyz/trade/'+encodeURIComponent(name),
    _created:0,
    _contract:'',
    _oi:oi,
    name:name,
    symbol:name,
    image:logos[0],
    _imgs:logos,
    current_price:price,
    market_cap:undefined,
    total_volume:vol,
    price_change_percentage_24h:h24,
    price_change_percentage_1h_in_currency:h24,
    price_change_percentage_7d_in_currency:h24,
    price_change_percentage_30d_in_currency:h24,
    price_change_percentage_1y_in_currency:h24
  };

}

async function hlFetchList(){

  let lastError = null;

  for(let round=0; round<2; round++){

    try{

      const response =
        await fetchT(
          'https://api.hyperliquid.xyz/info',
          {
            method:'POST',
            headers:{'Content-Type':'application/json'},
            body:JSON.stringify({type:'metaAndAssetCtxs'}),
            cache:'no-store'
          },
          12000
        );

      if(!response.ok)
        throw new Error('Hyperliquid HTTP '+response.status);

      const json = await response.json();

      if(
        !Array.isArray(json) ||
        !json[0] || !Array.isArray(json[0].universe) ||
        !Array.isArray(json[1])
      )
        throw new Error('Hyperliquid format tidak dikenal');

      return json;

    }catch(e){
      lastError = e;
    }

    await gtSleep(1500);

  }

  throw lastError;

}

async function loadHyperliquid(){

  const now = Date.now();

  if(hlCache && now-hlCache.t<GT_TTL)
    return hlCache.list;

  if(hlInflight)
    return hlInflight;

  hlInflight =
    (async()=>{

      try{

        const json = await hlFetchList();
        const uni  = json[0].universe;
        const ctxs = json[1];
        const seen = new Set();

        const list = [];

        uni.forEach((m,i)=>{
          const c = hlToCoin(m,ctxs[i]);
          if(c && !seen.has(c.id)){
            seen.add(c.id);
            list.push(c);
          }
        });

        if(!list.length)
          throw new Error('Hyperliquid kosong');

        hlCache = {t:Date.now(),list};

        return list;

      }catch(e){

        if(hlCache)
          return hlCache.list;

        throw e;

      }finally{

        hlInflight = null;

      }

    })();

  return hlInflight;

}

  // slider halaman ala leverage Binance: garis horizontal + titik yang bisa digeser kiri/kanan
  function makePageSlider(parent,count,onCommit,labelFn,allTicks){

    labelFn = labelFn || pageLabel;

    const wrap =
      document.createElement('div');

    wrap.className =
      'pageSlider';

    wrap.setAttribute('role','slider');
    wrap.setAttribute('tabindex','0');
    wrap.setAttribute('aria-valuemin','1');
    wrap.setAttribute('aria-valuemax',String(count));

    let dots = '';

    for(let k=0;k<count;k++){

      dots +=
        '<i class="psDot" style="left:'+
        (k/(count-1)*100)+'%"></i>';

    }

    let ticks = '';

    if(allTicks){

      for(let k=0;k<count;k++){

        ticks +=
          '<span style="left:'+
          (k/(count-1)*100)+'%">'+
          labelFn(k)+'</span>';

      }

      ticks =
        '<div class="psTicks">'+ticks+'</div>';

    }else{

      ticks =
        '<div class="psEnds">'+
          '<span>'+labelFn(0)+'</span>'+
          '<span>'+labelFn(count-1)+'</span>'+
        '</div>';

    }

    wrap.innerHTML =
      '<div class="psRail">'+
        '<div class="psLine"></div>'+
        '<div class="psFill"></div>'+
        dots+
        '<div class="psThumb"><b class="psBubble"></b></div>'+
      '</div>'+
      ticks;

    parent.appendChild(wrap);

    // pill ikon + teks (gaya Chain); slider asli disembunyikan tapi tetap jadi sumber logika
    const PILL_ICON = allTicks
      ?'<circle cx="12" cy="12" r="9"/><polyline points="12 7 12 12 15.5 14"/>'
      :'<circle cx="12" cy="12" r="5" style="fill:#39ff14;stroke:none"/>';

    const pillRow = document.createElement('div');
    pillRow.className = 'subRow wrap pillRow chainGrid sliderPills';

    const pillEls = [];

    for(let k=0;k<count;k++){

      const pb = document.createElement('button');

      pb.className = 'subToggle iconBtn';
      pb.type = 'button';

      const txt = String(labelFn(k));

      pb.setAttribute('aria-label',txt);
      pb.title = txt;

      pb.innerHTML =
        '<svg viewBox="0 0 24 24" aria-hidden="true">'+PILL_ICON+'</svg>'+
        '<span class="modeName chainName"></span>';

      pb.querySelector('.chainName').textContent = (labelFn===pageLabel)?String(k+1):txt;

      pb.addEventListener('click',()=>{
        paintIdx(k);
        onCommit(k);
      });

      pillRow.appendChild(pb);
      pillEls.push(pb);

    }

    parent.insertBefore(pillRow,wrap);
    wrap.classList.add('psHidden');

    function syncPills(){

      pillEls.forEach(
        (b,k)=>b.classList.toggle(
          'on',
          k===idx
        )
      );

      pillRow.classList.toggle(
        'sliderActive',
        wrap.classList.contains('active')
      );

    }

    new MutationObserver(syncPills)
      .observe(wrap,{attributes:true,attributeFilter:['class']});

    const rail   = wrap.querySelector('.psRail');
    const thumb  = wrap.querySelector('.psThumb');
    const fill   = wrap.querySelector('.psFill');
    const bubble = wrap.querySelector('.psBubble');
    const dotEls = wrap.querySelectorAll('.psDot');

    let idx = 0;
    let dragging = false;

    function paintIdx(i){

      idx = i;

      const pct =
        i/(count-1)*100;

      thumb.style.left = pct+'%';
      fill.style.width = pct+'%';
      bubble.textContent = labelFn(i);

      dotEls.forEach(
        (d,k)=>d.classList.toggle('on',k<=i)
      );

      wrap.setAttribute('aria-valuenow',String(i+1));
      wrap.setAttribute('aria-valuetext',labelFn(i));

      syncPills();

    }

    function ratioFromX(x){

      const r =
        rail.getBoundingClientRect();

      return Math.min(1,Math.max(0,(x-r.left)/r.width));

    }

    // geser bebas (halus mengikuti jari), label = titik terdekat
    function paintFree(ratio){

      const i =
        Math.round(ratio*(count-1));

      idx = i;

      const pct = ratio*100;

      thumb.style.left = pct+'%';
      fill.style.width = pct+'%';
      bubble.textContent = labelFn(i);

      const pos = ratio*(count-1)+0.0001;

      dotEls.forEach(
        (d,k)=>d.classList.toggle('on',k<=pos)
      );

      wrap.setAttribute('aria-valuenow',String(i+1));
      wrap.setAttribute('aria-valuetext',labelFn(i));

    }

    // pembeda scroll vs geser: sentuhan baru dianggap "geser slider" hanya bila
    // gerakannya dominan horizontal; bila dominan vertikal, biarkan menu ter-scroll.
    // Ketukan singkat (tanpa gerak) tetap melompat ke titik yang diketuk.
    let pid = null, sx = 0, sy = 0, locked = false;

    const LOCK_PX = 9;

    function lockDrag(e){

      locked = true;
      dragging = true;
      wrap.classList.add('drag');

      try{ wrap.setPointerCapture(e.pointerId); }catch(_){}

      paintFree(ratioFromX(e.clientX));

    }

    wrap.addEventListener('pointerdown',e=>{

      if(e.pointerType==='mouse' && e.button!==0)
        return;

      e.stopPropagation();

      pid = e.pointerId;
      sx = e.clientX;
      sy = e.clientY;
      locked = false;

      // mouse tidak punya scroll sentuh: langsung geser
      if(e.pointerType==='mouse')
        lockDrag(e);

    });

    wrap.addEventListener('pointermove',e=>{

      if(e.pointerId!==pid)
        return;

      if(locked){

        paintFree(ratioFromX(e.clientX));

        return;

      }

      const dx = Math.abs(e.clientX-sx);
      const dy = Math.abs(e.clientY-sy);

      if(dx>LOCK_PX && dx>dy*1.2){

        lockDrag(e);

      }else if(dy>LOCK_PX){

        // gerakan vertikal = scroll menu, slider tidak ikut
        pid = null;

      }

    });

    function end(e,commit){

      if(!dragging)
        return;

      dragging = false;
      locked = false;
      pid = null;
      wrap.classList.remove('drag');

      try{ wrap.releasePointerCapture(e.pointerId); }catch(_){}

      // lepas jari: menempel ke titik terdekat lalu pindah halaman
      paintIdx(idx);

      if(commit)
        onCommit(idx);

    }

    wrap.addEventListener('pointerup',e=>{

      if(dragging){

        end(e,true);

        return;

      }

      // ketukan singkat (tidak bergeser, tidak scroll): lompat ke titik yang diketuk
      if(e.pointerId===pid){

        pid = null;

        paintFree(ratioFromX(e.clientX));

        paintIdx(idx);

        onCommit(idx);

      }

    });

    wrap.addEventListener('pointercancel',e=>{

      pid = null;

      end(e,false);

    });

    wrap.addEventListener('keydown',e=>{

      let n = idx;

      if(e.key==='ArrowRight'||e.key==='ArrowUp')
        n = Math.min(count-1,idx+1);
      else if(e.key==='ArrowLeft'||e.key==='ArrowDown')
        n = Math.max(0,idx-1);
      else
        return;

      e.preventDefault();

      paintIdx(n);
      onCommit(n);

    });

    paintIdx(0);

    return {
      el:wrap,
      set:(i)=>{ if(!dragging) paintIdx(i); }
    };

  }

  // ambil daftar koin satu chain dari CoinGecko (dipakai klik & pemanasan otomatis)
  async function getCgChainList(cfg,page,req){

    let url =
      'https://api.coingecko.com/api/v3/coins/markets?'+
      'vs_currency=usd'+
      '&category='+cfg[3]+
      '&order=market_cap_desc'+
      '&per_page='+COINS_PER_PAGE+
      '&page='+(page+1)+
      '&sparkline=false'+
      '&price_change_percentage=1h,24h,7d,30d,1y';

    if(CG_DEMO_KEY)
      url += '&x_cg_demo_api_key='+
        encodeURIComponent(CG_DEMO_KEY);

    let list =
      null;

    for(let a=0;a<4 && !list;a++){

      const route =
        (cgRoute+a)%CG_ROUTES.length;

      try{

        const r =
          await fetchT(
            CG_ROUTES[route](url),
            {},
            route===0?8000:12000
          );

        if(!r.ok)
          throw new Error('HTTP '+r.status);

        const d =
          await r.json();

        if(!Array.isArray(d))
          throw new Error('format');

        list = d;

        cgRoute = route;

      }catch(e){

        if(req!==undefined && req!==cgChainReq)
          return null;

        if(a<3)
          await cgSleep(1500*(a+1));

      }

    }

    return list;

  }

  // pemanasan otomatis: unduh & simpan daftar chain tanpa perlu diklik
  window.__cgChainWarm = {

        return;

      const hit =
        await idbGet('cgc:'+key);

      // masih segar (<9 menit) -> lewati
      if(hit && Date.now()-hit.t<540000)
        return;

      const list =
        await getCgChainList(cfg,0);

      if(list && list.length){

        idbSet('cgc:'+key,{t:Date.now(),v:list});

        list.forEach(c=>{ if(!coinMap.has(c.id)) coinMap.set(c.id,c); });

      }

    }
  };

  async function showCgChain(key,page){

    const cfg =
      CG_CHAINS.find(x=>x[0]===key);

    if(!cfg)
      return;

    const req =
      ++cgChainReq;

    cgChainMsg('Loading '+escapeHtml(cfg[1])+'...');

    // cache IndexedDB: daftar terakhir langsung tampil, lalu diperbarui di belakang layar
    let shown =
      false;

    try{

      const hit =
        await idbGet('cgc:'+key);

      if(req!==cgChainReq || cgChainKey!==key)
        return;

      if(hit && Array.isArray(hit.v) && hit.v.length){

        hit.v.forEach(c=>coinMap.set(c.id,c));

        visibleCoins =
          hit.v.slice(0,COINS_PER_PAGE);

        createCoinNodes();

        shown = true;

        if(Date.now()-hit.t<600000)
          return;

      }

    }catch(_){}

    const list =
      await getCgChainList(cfg,page,req);

    if(req!==cgChainReq || cgChainKey!==key)
      return;

    if(!list){

      if(shown)
        return;

      cgChainMsg(
        'Gagal mengambil data '+
        escapeHtml(cfg[1])+
        '.<br>Coba lagi sebentar.'
      );

      return;

    }

    if(!list.length){

      cgChainMsg('Tidak ada koin untuk chain ini.');

      return;

    }

    idbSet('cgc:'+key,{t:Date.now(),v:list});

    list.forEach(c=>coinMap.set(c.id,c));

    // jangan membangun ulang bubble saat pop up detail sedang dibuka
    if(shown && selectedCoin)
      return;

    visibleCoins =
      list.slice(0,COINS_PER_PAGE);

    createCoinNodes();

  }

  (function moveRowsToHeader(){

    const panels = {
      filter:   document.querySelector('#hdrPanels .hdrPanel[data-p="filter"]'),
      interval: document.querySelector('#hdrPanels .hdrPanel[data-p="interval"]'),
      rank:     document.querySelector('#hdrPanels .hdrPanel[data-p="rank"]')
    };

    if(!panels.filter||!panels.interval||!panels.rank)
      return;

    const KEY = {Filter:'filter',Interval:'interval',Ranking:'rank'};

    const secLabel = title =>
      catLabel(title)||String(title).replace(/\s*\(.*?\)\s*/g,' ').trim().replace(/^All\s+/i,'');

    menuSections.forEach((sec,i)=>{

      [].slice.call(sec.sub.children).forEach(t=>{

        if(!t.classList.contains('subTitle'))
          return;

        const k = KEY[t.textContent.trim()];

        if(!k)
          return;

        const row = t.nextElementSibling;

        const w = document.createElement('div');

        w.className = 'hdrSec';
        w.dataset.sec = String(i);

        if(row)
          w.appendChild(row);

        t.remove();

        panels[k].appendChild(w);

      });

      // kategori tanpa isi lain (Terminal, Launchpad, Alpha): beri petunjuk singkat
      if(!sec.sub.children.length){

        const h = document.createElement('div');

        h.className = 'subHint';
        h.textContent = 'Filter, Interval & Ranking ada di ikon header atas.';

        sec.sub.appendChild(h);

      }

    });

    window.__hdrSync = function(){

      let idx =
        menuSections.findIndex(s=>s.title===window.__activeCat);

      if(idx<0)
        idx = menuSections.findIndex(s=>s.item.classList.contains('active'));

      if(idx<0)
        idx = 0;

      document.querySelectorAll('#hdrPanels .hdrSec').forEach(
        w=>w.classList.toggle('on',+w.dataset.sec===idx)
      );

      const name =
        menuSections[idx]?secLabel(menuSections[idx].title):'';

      document.querySelectorAll('#hdrPanels .hdrTitle').forEach(
        t=>{ t.textContent = t.dataset.t+(name?' \u00b7 '+name:''); }
      );

    };

    window.__hdrSync();

  })();

function applyMarketFilter(
  type,
  page=0
){
  if(type==='NewListing'){
    showNewListing(page);
    return;
  }
  let result =
    [...allCoins];

  if(type==='Trending'){

    result.sort(
      (
        a,
        b
      )=>
        (
          Math.abs(
            getGain(b)
          )
        )-
        (
          Math.abs(
            getGain(a)
          )
        )
    );

  }

  else if(type==='Gainer'){

    result.sort(
      (
        a,
        b
      )=>
        (
          getGain(b)
        )-
        (
          getGain(a)
        )
    );

  }

  else if(type==='Looser'){

    result.sort(
      (
        a,
        b
      )=>
        (
          getGain(a)
        )-
        (
          getGain(b)
        )
    );

  }

  else if(type==='MarketCap'){
    result.sort((a,b)=>(Number(b.market_cap)||0)-(Number(a.market_cap)||0));
  }
  else if(type==='Favorite'){

    result =
      result.filter(
        coin=>
          localStorage.getItem(
            'fav_'+coin.id
          )==='1'
      );

  }

  visibleCoins =
    result.slice(
      page*COINS_PER_PAGE,
      (page+1)*COINS_PER_PAGE
    );

  nodes.clear();
  positions.clear();

  createCoinNodes();

}

/* =====================================================
   FETCH DENGAN TIMEOUT
   (tanpa AbortSignal: di preview Claude/WebView fetch
    diteruskan lewat postMessage dan AbortSignal tidak
    bisa di-clone -> DataCloneError)
===================================================== */

function fetchT(url,opts,ms){

  return new Promise(
    (resolve,reject)=>{

      const t =
        setTimeout(
          ()=>reject(
            new Error('timeout')
          ),
          ms||8000
        );

      fetch(
        url,
        opts||{}
      ).then(
        r=>{
          clearTimeout(t);
          resolve(r);
        },
        e=>{
          clearTimeout(t);
          reject(e);
        }
      );

    }
  );

}

const CG_PER_PAGE =
  250;

const CG_PAGES =
  Math.ceil(
    TOTAL_COINS /
    CG_PER_PAGE
  );

let cgLoading =
  false;

let cgRetrying =
  false;

let cgLastRun =

function cgSleep(ms){

  return new Promise(
    r=>setTimeout(r,ms)
  );

}

// Kunci API Demo CoinGecko (gratis, opsional): daftar di coingecko.com/en/api
// lalu tempel di sini agar limit jauh lebih longgar & stabil. Kosongkan jika tidak punya.
const CG_DEMO_KEY = '';

// Jalur akses: langsung dulu, lalu lewat proxy CORS publik bila jalur langsung gagal / kena 429.
const API_PROXY = '';   // contoh: 'https://crypto-proxy.namamu.workers.dev'
const CG_ROUTES = [
  ...(API_PROXY?[u=>API_PROXY+'/?u='+encodeURIComponent(u)]:[]),
  u=>u,
  u=>'https://corsproxy.io/?url='+encodeURIComponent(u),
  u=>'https://api.allorigins.win/raw?url='+encodeURIComponent(u)
];

let cgRoute = 0;          // jalur yang terakhir berhasil
const CG_GAP = 1800;      // jeda antar halaman (ms) supaya tidak kena limit 429

// Ambil 1 halaman CoinGecko. Gagal (429 / timeout / jaringan / CORS) -> ganti jalur
// dan ulangi sampai 6x dengan jeda makin lama. 429 diberi jeda ekstra.
async function loadCGPageRaw(
  page
){

  let url =
    'https://api.coingecko.com/api/v3/coins/markets?'+
    'vs_currency=usd'+
    '&order=market_cap_desc'+
    '&per_page='+CG_PER_PAGE+
    '&page='+page+
    '&sparkline=false'+
    '&price_change_percentage=1h,24h,7d,30d,1y';

  if(CG_DEMO_KEY)
    url += '&x_cg_demo_api_key='+
      encodeURIComponent(CG_DEMO_KEY);

  const waits =
    [1500,4000,8000];

  let lastError =
    null;

  for(
    let attempt=0;
    attempt<4;
    attempt++
  ){

    const route =
      (cgRoute+attempt) % CG_ROUTES.length;

    let wait =
      waits[Math.min(attempt,waits.length-1)];

    try{

      const response =
        await fetchT(
          CG_ROUTES[route](url),
          {},
          route===0 ? 8000 : 12000
        );

      if(!response.ok){

        if(response.status===429)
          wait *= 2;

        throw new Error(
          'CoinGecko HTTP '+
          response.status
        );

      }

      const data =
        await response.json();

      if(
        !Array.isArray(data) ||
        !data.length
      )
        throw new Error(
          'CoinGecko data kosong'
        );

      cgRoute =
        route;

      return data;

    }catch(e){

      lastError =
        e;

      if(attempt<3)
        await cgSleep(wait);

    }

  }

  throw lastError;

}

let bnTickerCache = null;

async function fetchBinanceTickers(){

  if(
    bnTickerCache &&
    Date.now()-bnTickerCache.t<60000
  )
    return bnTickerCache.list;

  let lastError =
    null;

  for(const host of BN_HOSTS){

    try{

      const response =
        await fetchT(
          host+'/api/v3/ticker/24hr',
          {},
          15000
        );

      if(!response.ok)
        throw new Error(
          'Binance HTTP '+
          response.status
        );

      const data =
        await response.json();

      if(
        !Array.isArray(data) ||
        !data.length
      )
        throw new Error(
          'Binance data kosong'
        );

      const list =
        [];

      const set =
        new Set();

      data.forEach(
        t=>{

          const sym =
            String(t.symbol||'');

          if(!/USDT$/.test(sym))
            return;

          const base =
            sym.slice(0,-4);

          if(
            !base ||
            BN_SKIP_BASE.includes(base)
          )
            return;

          const price =
            Number(t.lastPrice);

          const vol =
            Number(t.quoteVolume);

          if(
            !(price>0) ||
            !(vol>0)
          )
            return;

          set.add(
            sym.toLowerCase()
          );

          list.push({
            base:base,
            price:price,
            chg:Number(t.priceChangePercent)||0,
            vol:vol,
            high:Number(t.highPrice)||0,
            low:Number(t.lowPrice)||0
          });

        }
      );

      if(!list.length)
        throw new Error(
          'Binance tanpa pasangan USDT'
        );

      list.sort(
        (a,b)=>b.vol-a.vol
      );

      binanceSymSet =
        set;

      bnTickerCache = {
        t:Date.now(),
        list:list
      };

      return list;

    }catch(e){

      lastError =
        e;

    }

  }

  throw lastError ||
    new Error('Binance gagal');

}

function applyBinanceToCoins(coins,list){

  const bySym =
    new Map();

  list.forEach(
    t=>{
      const k =
        t.base.toLowerCase();

      if(!bySym.has(k))
        bySym.set(k,t);
    }
  );

  const seen =
    new Set();

  coins.forEach(
    c=>{

      const k =
        String(c.symbol||'')
          .toLowerCase();

      if(
        !k ||
        seen.has(k)
      )
        return;

      seen.add(k);

      const t =
        bySym.get(k);

      if(!t)

      c.current_price =

      if(t.high)
        c.high_24h =
          t.high;

      if(t.low)
        c.low_24h =
          t.low;

    }
  );

}

/* =====================================================
   CADANGAN 1: COINMARKETCAP (Keyless Public API, tanpa API key)
   Satu permintaan 1000 koin. Dipakai jika CoinGecko lambat / gagal.
   Data CMC dipetakan ke format CoinGecko; jika koin ada di cache,
   id & logo CoinGecko dipertahankan agar portofolio/favorit tetap cocok.
===================================================== */

const CMC_BASE =
  'https://pro-api.coinmarketcap.com/public-api';

async function fetchCMCListRaw(){

  const url =
    CMC_BASE+
    '/v3/cryptocurrency/listings/latest'+
    '?start=1&limit='+TOTAL_COINS+
    '&convert=USD';

  let lastError =
    null;

  for(
    let attempt=0;
    attempt<4;
    attempt++
  ){

    // langsung -> proxy -> proxy -> langsung
    const route =
      attempt % CG_ROUTES.length;

    try{

      const response =
        await fetchT(
          CG_ROUTES[route](url),
          {},
          route===0 ? 12000 : 18000
        );

      if(!response.ok)
        throw new Error(
          'CMC HTTP '+
          response.status
        );

      const json =
        await response.json();

      const ec =
        json &&
        json.status &&
        json.status.error_code;

      if(
        ec &&
        String(ec)!=='0'
      )
        throw new Error(
          'CMC '+ec+' '+
          (json.status.error_message||'')
        );

      const data =
        Array.isArray(json)
          ?json
          :(json && json.data);

      if(
        !Array.isArray(data) ||
        !data.length
      )
        throw new Error(
          'CMC data kosong'
        );

      return data;

    }catch(e){

      lastError =
        e;

      if(attempt<3)
        await cgSleep(
          [1000,2500,5000][attempt]
        );

    }

  }

  throw lastError;

}

function cmcToCoins(data,cachedList){

  const norm =
    v=>String(v||'')
      .toLowerCase()
      .replace(/[^a-z0-9]/g,'');

  const bySymName =
    new Map();

  const bySym =
    new Map();

  (cachedList||[]).forEach(
    c=>{

      const sy =
        String(c.symbol||'')
          .toLowerCase();

      bySymName.set(
        sy+'|'+norm(c.name),
        c
      );

      if(!bySym.has(sy))
        bySym.set(sy,c);

    }
  );

  const out =
    [];

  data.forEach(
    (d,i)=>{

      if(!d)
        return;

      const q =
        Array.isArray(d.quote)
          ?(
            d.quote.find(
              x=>x && x.symbol==='USD'
            ) ||
            d.quote[0]
          )
          :(
            d.quote &&
            (d.quote.USD || d.quote)
          );

      if(!q)
        return;

      const price =
        Number(q.price);

      if(!(price>=0))
        return;

      const sy =
        String(d.symbol||'')
          .toLowerCase();

      if(!sy)
        return;

      const rank =
        Number(d.cmc_rank) || (i+1);

      let hit =
        bySymName.get(
          sy+'|'+norm(d.name)
        );

      if(
        !hit &&
        rank<=150
      ){

        const c =
          bySym.get(sy);

        if(
          c &&
          Number(c.market_cap_rank)<=300
        )
          hit = c;

      }

      const base =
        hit
          ?Object.assign({},hit)
          :{};

      const num =
        v=>Number(v)||0;

      out.push(
        Object.assign(
          base,
          {
            id:
              hit
                ?hit.id
                :(
                  rank<=300 && BN_KNOWN_IDS[sy]
                    ?BN_KNOWN_IDS[sy]
                    :(d.slug || sy)
                ),
            symbol:sy,
            name:d.name || sy.toUpperCase(),
            image:
              (hit && hit.image) ||
              'https://s2.coinmarketcap.com/static/img/coins/64x64/'+
              d.id+'.png',
            current_price:price,
            market_cap:num(q.market_cap),
            market_cap_rank:rank,
            total_volume:num(q.volume_24h),
            price_change_percentage_24h:num(q.percent_change_24h),
            price_change_percentage_1h_in_currency:num(q.percent_change_1h),
            price_change_percentage_7d_in_currency:num(q.percent_change_7d),
            price_change_percentage_30d_in_currency:num(q.percent_change_30d),
            circulating_supply:num(d.circulating_supply),
            total_supply:num(d.total_supply),
            max_supply:
              d.max_supply==null
                ?null
                :num(d.max_supply),
            _cmcId:d.id,
            _source:'cmc'
          }
        )
      );

    }
  );

  // pastikan field yang tidak disediakan CMC tidak undefined
  out.forEach(
    c=>{

      [
        'high_24h',
        'low_24h',
        'ath',
        'atl',
        'price_change_percentage_1y_in_currency'
      ].forEach(
        k=>{
          if(c[k]==null)
            c[k] = 0;
        }
      );

    }
  );

  return out;

}
