  }
  window.addEventListener('resize',()=>{clearTimeout(t);t=setTimeout(refit,120);});
  if(window.visualViewport) window.visualViewport.addEventListener('resize',()=>{clearTimeout(t);t=setTimeout(refit,120);});
})();
</script>


<script>
/* =====================================================
   TAMPILAN: BUBBLE / LIST (halaman utama sama) / FAVORIT
===================================================== */
(function(){

  const tools   = pageMenu.querySelectorAll('.mtBtn');
  const btnBub  = pageMenu.querySelector('[data-view="bubble"]');
  const btnList = null;   // tombol List dihapus; bubble berganti ke list lewat klik ke-2
  const btnFav  = pageMenu.querySelector('[data-view="fav"]');
  const btnWal  = pageMenu.querySelector('[data-view="wallet"]');

  if(btnWal){
    const openWallet = e=>{
      e.preventDefault();
      e.stopPropagation();
      pageMenu.classList.remove('show');
      const wb = document.getElementById('walletButton');
      if(wb) wb.click();   // pakai pop up wallet yang sudah ada
      ignoreClickUntil = performance.now()+400;
    };
    btnWal.addEventListener('pointerdown',openWallet);
    btnWal.addEventListener('click',e=>{ e.preventDefault(); e.stopPropagation(); });
  }

  let asList   = false;   // tampilan: bubble atau list
  let favMode  = false;   // hanya koin favorit
  let savedVisible = null;
  let tick = 0;
  let keepScroll = 0;
  let listSort = 'trending';
  let sortOpen = false;
  let dropOpen = false;
  let pagerDragging = false;
  let ignoreClickUntil = 0;

  const SORTS = [
    ['trending','Trending'],
    ['gainer','Gainer'],
    ['looser','Looser'],
    ['marketcap','Marketcap']
  ];
  let mcDir = 'up';   // up = tertinggi dulu, down = terendah dulu

  const ARROW_UP =
    '<svg class="clArrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5.5 11.5L12 5l6.5 6.5"/></svg>';
  const ARROW_DOWN =
    '<svg class="clArrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5.5 12.5L12 19l6.5-6.5"/></svg>';

  const FUNNEL_SVG =
    '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" '+
    'stroke-linecap="round" stroke-linejoin="round"><path d="M4 6.5h16M4 12h16M4 17.5h16"/></svg>';

  function sortedCoins(arr){
    const a = arr.slice();
    const n = v=>Number(v)||0;
    let mode = listSort;
    if(mode==='trending'){
      const ab = document.querySelector('#hdrPanels .hdrPanel[data-p="filter"] .subToggle.active');
      const k = ab && ab.getAttribute('data-k');
      if(k==='Gainer') mode='gainer';
      else if(k==='Looser') mode='looser';
      else if(k==='MarketCap') mode='marketcap';
    }
    switch(mode){
      case 'gainer':    a.sort((x,y)=>getGain(y)-getGain(x)); break;
      case 'looser':    a.sort((x,y)=>getGain(x)-getGain(y)); break;
      case 'marketcap':
        a.sort((x,y)=> mcDir==='up'
          ? n(y.market_cap)-n(x.market_cap)
          : n(x.market_cap)-n(y.market_cap));
        break;
      case 'trending':
        if(a.some(c=>n(c.total_volume)>0))
          a.sort((x,y)=>n(y.total_volume)-n(x.total_volume));
        break;
    }
    return a;
  }

  // klik yang "tembus" tepat setelah ganti tampilan jangan membuka popup
  document.addEventListener('click',e=>{
    if(performance.now()<ignoreClickUntil){
      e.stopPropagation();
      e.preventDefault();
    }
  },true);

  cloud.addEventListener('scroll',()=>{
    if(asList && cloud.querySelector('.coinList'))
      keepScroll = cloud.scrollTop;
  });

  const STAR_SVG =
    '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" '+
    'stroke-linecap="round" stroke-linejoin="round"><path d="M12 3.6l2.6 5.3 5.8.8-4.2 4.1 1 5.8L12 16.9l-5.2 2.7 1-5.8L3.6 9.7l5.8-.8z"/></svg>';

  function isFav(id){
    return localStorage.getItem('fav_'+id)==='1';
  }

  function toggleFav(c){
    const on = !isFav(c.id);
    localStorage.setItem('fav_'+c.id,on?'1':'0');
    try{
      if(on) localStorage.setItem('favdata_'+c.id,JSON.stringify(snapshot(c)));
      else localStorage.removeItem('favdata_'+c.id);
    }catch(e){}
    return on;
  }

  function esc(t){
    return String(t==null?'':t).replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));
  }

  /* ---------- favorit ---------- */
  function snapshot(c){
    const o = {};
    Object.keys(c).forEach(k=>{
      const v = c[k];
      if(v==null) return;
      const t = typeof v;
      if(t==='string'||t==='number'||t==='boolean') o[k]=v;
      else if(k==='_imgs'&&Array.isArray(v))
        o[k]=v.filter(x=>typeof x==='string'&&!x.startsWith('data:')).slice(0,4);
    });
    return o;
  }

  function favCoins(){
    const out = [];
    for(let i=0;i<localStorage.length;i++){
      const k = localStorage.key(i);
      if(!k||k.indexOf('fav_')!==0||localStorage.getItem(k)!=='1') continue;
      const id = k.slice(4);
      let c = coinMap.get(id);
      if(!c){
        try{
          const raw = localStorage.getItem('favdata_'+id);
          if(raw){ c = JSON.parse(raw); coinMap.set(id,c); }
        }catch(e){}
      }
      if(c) out.push(c);
    }
    return out;
  }

  // bintang di popup detail: simpan / hapus salinan data
  const popupStar = document.getElementById('favoriteStar');
  if(popupStar){
    popupStar.addEventListener('click',()=>{
      if(!selectedCoin) return;
      const on = localStorage.getItem('fav_'+selectedCoin.id)==='1';
      try{
        if(on) localStorage.setItem('favdata_'+selectedCoin.id,JSON.stringify(snapshot(selectedCoin)));
        else localStorage.removeItem('favdata_'+selectedCoin.id);
      }catch(e){}
      if(favMode) refresh();
    });
  }

  /* ---------- list: halaman utama berubah jadi list ---------- */
  const TF_LABEL = {'1H':'1H','1D':'24H','1W':'7D','1M':'30D','1Y':'1Y'};

  function row(c,i){

    const gain = getGain(c);

    const el = document.createElement('div');
    el.className = 'clRow';
    el.dataset.id = c.id;

    el.innerHTML =
      '<span class="clRank">'+(i+1)+'</span>'+
      '<img class="clLogo" alt="" draggable="false">'+
      '<div class="clName">'+
        '<div class="clSym">'+esc((c.symbol||'').toUpperCase())+'</div>'+
        '<div class="clFull">'+esc(c.name||'')+'</div>'+
      '</div>'+
      '<div class="clPrice">'+price(c.current_price)+'</div>'+
      '<div class="clGain '+(gain>=0?'up':'down')+'">'+percent(gain)+'</div>'+
      '<button type="button" class="clStar'+(isFav(c.id)?' on':'')+'" aria-label="Favorite">'+STAR_SVG+'</button>';

    try{ attachLogo(el.querySelector('.clLogo'),c); }catch(e){}

    return el;
  }

  function renderList(){
    window.__listSig = null;

    const ae = document.activeElement;
    if(ae && ae.classList && ae.classList.contains('clSelect')) return;
    if(sortOpen) return;
    if(pagerDragging) return;

    const prevScroll = keepScroll;

    const coins = sortedCoins(visibleCoins.slice(0,100));

    const box = document.createElement('div');
    box.className = 'coinList';

    const head = document.createElement('div');
    head.className = 'clHead';

    const ctl = favMode ? null : (window.__pageCtls||{})[window.__activeCat];

    if(ctl){

      const dd = document.createElement('div');
      dd.className = 'clDrop';

      const cur = document.createElement('button');
      cur.type = 'button';
      cur.className = 'clDropBtn'+(dropOpen?' open':'');
      cur.textContent = ctl.label(ctl.index());
      dd.appendChild(cur);
      head.appendChild(dd);

      const pager = document.createElement('div');
      pager.className = 'clPager'+(dropOpen?' open':'');

      const endL = document.createElement('span');
      endL.className = 'clPagerEnd';
      endL.textContent = '1';
      pager.appendChild(endL);

      const rail = document.createElement('div');
      rail.className = 'clRail';

      const n = ctl.count;
      const denom = Math.max(1,n-1);
      const dots = [];

      for(let k=0;k<n;k++){
        const o = document.createElement('i');
        o.className = 'clPageBox';
        o.style.left = (k/denom*100)+'%';
        rail.appendChild(o);
        dots.push(o);
      }

      const thumb = document.createElement('div');
      thumb.className = 'clThumb';
      const bubble = document.createElement('b');
      bubble.className = 'clBubble';
      thumb.appendChild(bubble);
      const clFill = document.createElement('div');
      clFill.className = 'clFill';
      rail.insertBefore(clFill,rail.firstChild);
      rail.appendChild(thumb);
      pager.appendChild(rail);

      const endR = document.createElement('span');
      endR.className = 'clPagerEnd right';
      endR.textContent = (ctl.label(ctl.count-1).split('-')[1])||String(ctl.count*100);
      pager.appendChild(endR);

      let pIdx = Math.min(n-1,Math.max(0,ctl.index()));

      function paintPager(ratio){
        pIdx = Math.round(ratio*(n-1));
        thumb.style.left = (ratio*100)+'%';
        clFill.style.width = (ratio*100)+'%';
        bubble.textContent = ctl.label(pIdx);
        const pos = ratio*(n-1)+0.0001;
        dots.forEach((d,k)=>d.classList.toggle('on',k<=pos));
      }

      function pagerRatio(x){
        const r = rail.getBoundingClientRect();
        return Math.min(1,Math.max(0,(x-r.left)/(r.width||1)));
      }

      paintPager(pIdx/denom);

      pager.addEventListener('pointerdown',e=>{
        e.preventDefault();
        e.stopPropagation();
        pagerDragging = true;
        pager.classList.add('drag');
        try{ pager.setPointerCapture(e.pointerId); }catch(_){}
        paintPager(pagerRatio(e.clientX));
      });

      pager.addEventListener('pointermove',e=>{
        if(!pagerDragging) return;
        paintPager(pagerRatio(e.clientX));
      });

      function pagerEnd(e,commit){
        if(!pagerDragging) return;
        pagerDragging = false;
        pager.classList.remove('drag');
        try{ pager.releasePointerCapture(e.pointerId); }catch(_){}
        paintPager(pIdx/denom);
        if(commit){
          dropOpen = true;
          ctl.go(pIdx);
        }
      }

      pager.addEventListener('pointerup',e=>pagerEnd(e,true));
      pager.addEventListener('pointercancel',e=>pagerEnd(e,false));

      head.appendChild(pager);

      const sp = document.createElement('span');
      sp.className = 'clTitle';
      head.appendChild(sp);

    }else{

      head.innerHTML =
        '<span class="clTitle">'+(favMode?'Favorite':'Top '+coins.length)+'</span>';

    }

    const sw = document.createElement('div');
    sw.className = 'clSortWrap';
    sw.innerHTML =
      '<button type="button" class="clSortBtn'+(listSort!=='trending'?' on':'')+'" aria-label="Sort">'+FUNNEL_SVG+'</button>'+
      '<div class="clSortMenu">'+
        SORTS.map(s=>'<button type="button" class="clSortItem'+(s[0]===listSort?' active':'')+'" data-sort="'+s[0]+'"><span>'+s[1]+'</span>'+
          (s[0]==='marketcap'?'<span class="clSortArrow'+(listSort==='marketcap'?' on':'')+'">'+(mcDir==='up'?ARROW_UP:ARROW_DOWN)+'</span>':'')+
        '</button>').join('')+
      '</div>';
    head.appendChild(sw);

    box.appendChild(head);

    if(!coins.length){
      const e = document.createElement('div');
      e.className = 'clEmpty';
      e.textContent = favMode
        ? 'Belum ada koin favorit. Buka detail koin lalu ketuk bintang.'
        : 'Memuat data...';
      box.appendChild(e);
    }

    coins.forEach((c,i)=>box.appendChild(row(c,i)));

    const old = cloud.querySelector('.coinList');
    if(old) old.remove();

    cloud.appendChild(box);
    cloud.scrollTop = prevScroll;
    keepScroll = prevScroll;
  }

  cloud.addEventListener('click',e=>{
    if(!asList) return;

    if(e.target.closest('.clPager')) return;

    const dBtn = e.target.closest('.clDropBtn');
    if(dBtn){
      const l = dBtn.closest('.clHead').querySelector('.clPager');
      dropOpen = !l.classList.contains('open');
      l.classList.toggle('open',dropOpen);
      dBtn.classList.toggle('open',dropOpen);
      return;
    }

    const dItem = e.target.closest('.clDropItem');
    if(dItem){
      const ctl2 = (window.__pageCtls||{})[window.__activeCat];
      dropOpen = false;
      if(ctl2) ctl2.go(Number(dItem.dataset.k));
      return;
    }

    if(dropOpen){
      dropOpen = false;
      const l = cloud.querySelector('.clPager');
      if(l) l.classList.remove('open');
      const db = cloud.querySelector('.clDropBtn');
      if(db) db.classList.remove('open');
      return;
    }

    const sBtn = e.target.closest('.clSortBtn');
    if(sBtn){
      const m = sBtn.parentNode.querySelector('.clSortMenu');
      sortOpen = !m.classList.contains('open');
      m.classList.toggle('open',sortOpen);
      return;
    }

    const sItem = e.target.closest('.clSortItem');
    if(sItem){
      const picked = sItem.dataset.sort;
      if(picked==='marketcap'){
        // klik pertama = panah atas (kuning), klik lagi = panah bawah
        mcDir = (listSort==='marketcap' && mcDir==='up') ? 'down' : 'up';
      }
      listSort = picked;
      sortOpen = false;
      cloud.scrollTop = 0;
      keepScroll = 0;
      renderList();
      return;
    }

    if(sortOpen){
      sortOpen = false;
      const m = cloud.querySelector('.clSortMenu');
      if(m) m.classList.remove('open');
      if(!e.target.closest('.clRow')) return;
      return;
    }

    const r = e.target.closest('.clRow');
    if(!r) return;

    const star = e.target.closest('.clStar');

    if(star){
      const c = coinMap.get(r.dataset.id);
      if(c) star.classList.toggle('on',toggleFav(c));
      return;
    }

    openPopup(r.dataset.id);
  });

  /* ---------- terapkan tampilan ---------- */
  function refresh(){

    if(favMode) visibleCoins = favCoins();

    createCoinNodes();   // (dibungkus di bawah: ikut render list bila perlu)
  }

  function paintTools(){
    btnBub.classList.toggle('active',!favMode);
    btnFav.classList.toggle('active',favMode);
  }

  function applyDisplay(list){
    asList = list;
    keepScroll = 0;
    cloud.classList.toggle('asList',list);
    cloud.scrollTop = 0;
    clearInterval(tick);
    if(list) tick = setInterval(()=>{
      try{
        // jangan bangun ulang list saat pop up / menu terbuka, tab tersembunyi, atau jari sedang menyentuh
        if(document.hidden) return;
        const ov = document.getElementById('overlay');
        if(ov && ov.classList.contains('show')) return;
        if(pageMenu.classList.contains('show')) return;
        const hp = document.getElementById('hdrPanels');
        if(hp && hp.classList.contains('open')) return;
        if(performance.now()-(window.__lastTouch||0)<2500) return;
        // hanya render ulang bila data (harga/persen/urutan) berubah
        const sig = visibleCoins.map(c=>c.id+':'+c.current_price+':'+getGain(c)).join('|')+listSort+activeTimeFrame;
        if(sig===window.__listSig) return;
        window.__listSig = sig;
        renderList();
      }catch(e){}
    },4000);
  }

  function leaveFav(){
    favMode = false;
    if(savedVisible) visibleCoins = savedVisible;
    savedVisible = null;
  }

  function setDisplay(list){
    if(favMode) leaveFav();
    applyDisplay(list);
    paintTools();
    createCoinNodes();
  }

  let prevList = false;
  // dipakai tombol kembali: apakah sedang di tampilan list, dan pindah ke bubble
  window.__isListView = ()=>asList && !favMode;
  window.__setBubbleView = ()=>{
    applyDisplay(false);
    paintTools();
  };

  function setFav(on){

    if(on===favMode) return;

    if(on){
      prevList = asList;
      savedVisible = visibleCoins;
      favMode = true;
      applyDisplay(false);     // favorit tampil sebagai bubble
      paintTools();
      refresh();
    }
    else{
      leaveFav();
      applyDisplay(prevList);
      paintTools();
      createCoinNodes();
    }
  }

  // satu tombol: sedang di bubble -> ke list; sedang di list / favorit -> ke bubble
  btnBub.addEventListener('pointerdown',e=>{
    e.preventDefault();
    ignoreClickUntil = performance.now()+700;
    setDisplay(!favMode && !asList);
    pageMenu.classList.remove('show');
  });

  btnFav.addEventListener('pointerdown',e=>{
    e.preventDefault();
    ignoreClickUntil = performance.now()+700;
    setFav(!favMode);
    pageMenu.classList.remove('show');
  });

  // memilih kategori saat mode favorit aktif = keluar dari mode favorit dulu
  pageMenu.addEventListener('click',e=>{
    if(favMode && e.target.closest('.menuList')) setFav(false);
  },true);

  // setiap daftar koin dibangun ulang: favorit tetap berlaku, list ikut dirender
  const __cn = createCoinNodes;
  createCoinNodes = function(){
    if(favMode) visibleCoins = favCoins();
    const r = __cn.apply(this,arguments);
    try{ if(asList) renderList(); }catch(e){}
    return r;
  };

  paintTools();

})();

/* =====================================================
   QR CODE (scan -> webapp CryptoFoam)
===================================================== */
(function(){
  const ROWS = ["111111100101100010011011001111111", "100000100011000110101010001000001", "101110101110001110011110101011101", "101110101010100100110101101011101", "101110101101001110001101101011101", "100000101110110000110000001000001", "111111101010101010101010101111111", "000000001100000010111100000000000", "101111100100110011010011101111100", "111000000011010011011001001101101", "101000110100111101001010110010100", "110111000010110101101001000011111", "011000100010001010011110110011011", "111110011010000100100101001001011", "001000110110100111101100011101010", "011010001011101100000110111101100", "110110110010001101100010110110101", "101001000001111010110111011101101", "111000111101111100100100011110110", "111000010011000110011110111111110", "001101110100101100100100110011001", "110111001010001111001111000000101", "101001110010111001010000000001010", "100110001001010010111101011111110", "101010111100011011011001111111011", "000000001111101011110010100010101", "111111100010000111001011101010110", "100000101011111101100001100011101", "101110101000000010011110111111011", "101110101010010100100101110010101", "101110101010111111001000011100000", "100000100110001100000100010011100", "111111101100101101001001101101010"];
  const btn = document.getElementById('qrButton');
  const ov  = document.getElementById('qrOverlay');
  const box = document.getElementById('qrImg');
  const x   = document.getElementById('qrClose');
  if(!btn||!ov||!box) return;

  function build(){
    const n = ROWS.length, q = 1, size = n+q*2;
    const inFinder=(r,c)=> (r<7&&c<7) || (r<7&&c>=n-7) || (r>=n-7&&c<7);
    let dots = '';
    for(let r=0;r<n;r++)
      for(let c=0;c<n;c++)
        if(ROWS[r][c]==='1' && !inFinder(r,c))
          dots += '<rect x="'+(c+q+.01)+'" y="'+(r+q+.01)+'" width=".98" height=".98" rx=".3"/>';
    let fin = '';
    [[0,0],[0,n-7],[n-7,0]].forEach(function(f){
      const x=f[1]+q, y=f[0]+q;
      fin += '<rect x="'+x+'" y="'+y+'" width="7" height="7" rx="1.8"/>'+
             '<rect x="'+(x+1)+'" y="'+(y+1)+'" width="5" height="5" rx="1.1" fill="#fff"/>'+
             '<rect x="'+(x+2)+'" y="'+(y+2)+'" width="3" height="3" rx=".7"/>';
    });
    box.innerHTML =
      '<svg viewBox="0 0 '+size+' '+size+'" xmlns="http://www.w3.org/2000/svg">'+
      '<rect width="'+size+'" height="'+size+'" fill="#fff"/>'+
      '<g fill="#000">'+dots+fin+'</g></svg>';
  }

  let guard = 0;
  function open(){ if(!box.firstChild) build(); ov.classList.add('show'); guard = performance.now()+400; }
  function close(){ ov.classList.remove('show'); }

  btn.addEventListener('click',e=>{ e.preventDefault(); e.stopPropagation(); open(); });
  if(x) x.addEventListener('click',close);
  ov.addEventListener('click',e=>{
    if(performance.now()<guard) return;
    close();   // ketuk di mana saja pada layar = kembali
  });
  document.addEventListener('keydown',e=>{ if(e.key==='Escape') close(); });
})();
</script>


<script>
/* =====================================================
   LAYER GUARD: ketuk layar di luar pop up = tutup (tanpa tombol x),
   dan ketukan itu TIDAK tembus ke koin / daftar di bawahnya
===================================================== */
(function(){

  let until = 0;

  const $ = id=>document.getElementById(id);

  // tombol header yang boleh tetap menerima ketukan saat sebuah layer ditutup
  const KEEP =
    '#walletButton,#qrButton,#searchButton,#searchInput,#searchPanel,#searchResults,#pageButton,#nexusLogo,#hdrTools,#hdrPanels';

  function layer(){

    const ov = $('overlay');
    const w  = $('walletOverlay');
    const q  = $('qrOverlay');

    if(w && w.classList.contains('show'))
      return {inside:'.wPanel',close:()=>w.classList.remove('show')};

    if(q && q.classList.contains('show'))
      return {inside:'.qrBox',close:()=>q.classList.remove('show')};

    if(ov && ov.classList.contains('show'))
      return {inside:'#popup',close:()=>closePopup()};

    if(pageMenu.classList.contains('show'))
      return {inside:'#pageMenu,#pageButton',close:()=>pageMenu.classList.remove('show')};

    return null;

  }

  window.addEventListener('pointerdown',e=>{

    const L = layer();

    if(!L) return;

    const t = e.target;

    if(!t || !t.closest) return;

    if(t.closest(L.inside)) return;

    L.close();

    until = performance.now()+450;

    if(!t.closest(KEEP)){
      e.preventDefault();
      e.stopPropagation();
    }

  },true);

  window.addEventListener('click',e=>{

    if(performance.now()>=until) return;

    const t = e.target;

    if(t && t.closest && !t.closest(KEEP+',#pageMenu')){
      e.preventDefault();
      e.stopPropagation();
    }

  },true);

  // pop up QR: ketuk di mana saja menutup (kecuali link)
  const q = $('qrOverlay');

  if(q)
    q.addEventListener('click',e=>{
      if(e.target.closest && e.target.closest('a')) return;
      q.classList.remove('show');
    });

})();
</script>

<style>
/* pop up detail coin (klik bubble / list crypto): background hitam */

<script>
/* =====================================================
   TOMBOL KEMBALI:
   1) tutup pop up / menu yang sedang terbuka
   2) kalau tidak ada, kembali ke halaman intro (splash)
   3) kalau sudah di intro, baru keluar dari aplikasi
===================================================== */
(function(){

  const $ = id=>document.getElementById(id);

  // tandai: aplikasi sedang membuka link eksternal
  function markExt(){
    try{ sessionStorage.setItem('cf_ext',String(Date.now())); }catch(_){}
    try{ if(window.__cfSaveCoin) window.__cfSaveCoin(); }catch(_){}
  }
  const _open = window.open;
  window.open = function(){
    markExt();
    return _open.apply(window,arguments);
  };
  document.addEventListener('click',function(e){
    const a = e.target && e.target.closest ? e.target.closest('a[href]') : null;
    if(a && /^https?:/i.test(a.getAttribute('href')||'') && a.target==='_blank') markExt();
  },true);

  // Chrome/Android melewati entri riwayat yang dibuat tanpa sentuhan pengguna, sehingga tombol
  // kembali bisa langsung menutup aplikasi. Karena itu satu entri "guard" juga dibuat tepat saat
  // pengguna menyentuh layar (user activation), supaya tombol kembali selalu tertangkap aplikasi.
  let guardAct = false;

  function pushGuard(){
    guardAct = false;
    try{ history.pushState({guard:1},'',location.href); }catch(_){}
  }

  // pasang guard hanya bila entri saat ini belum guard (hindari entri berlebih)
  function ensureGuard(){
    const st = history.state;
    if(st && st.guard) return;
    pushGuard();
  }

  window.__selfBack = 0;

  function actGuard(){
    if(guardAct) return;
    guardAct = true;
    try{ history.pushState({guard:1},'',location.href); }catch(_){}
  }

  ['pointerdown','touchstart','click','keydown'].forEach(function(ev){
    document.addEventListener(ev,actGuard,{capture:true,passive:true});
  });

  (function(){
    const st = history.state;
    if(st && st.guard) return;                 // sudah ada guard (mis. kembali dari link eksternal)
    try{
      if(!(st && st.base)) history.replaceState({base:1},'',location.href);
    }catch(_){}
    pushGuard();
  })();

  // tutup satu layer teratas, return true kalau ada yang ditutup
  function closeTopLayer(){

    const w = $('walletOverlay');
    if(w && w.classList.contains('show')){
      w.classList.remove('show');
      return true;
    }

    const q = $('qrOverlay');
    if(q && q.classList.contains('show')){
      q.classList.remove('show');
      return true;
    }

    const nw = $('newsOverlay');
    if(nw && nw.classList.contains('show')){
      nw.classList.remove('show');
      return true;
    }

    const ov = $('overlay');
    if(ov && ov.classList.contains('show')){
      if(typeof closePopup==='function') closePopup();
      else ov.classList.remove('show');
      return true;
    }

    const pm = $('pageMenu');
    if(pm && pm.classList.contains('show')){
      pm.classList.remove('show');
      return true;
    }

    const sr = $('searchResults'), si = $('searchInput');
    if((sr && sr.classList.contains('show')) ||
       (si && (si.value || document.activeElement===si))){
      if(typeof closeSearch==='function') closeSearch();
      return true;
    }

    return false;
  }

  /* ---------- riwayat tampilan: kembali ke halaman kategori sebelumnya ---------- */
  const viewStack = [];
  let curView = {key:'main|All|0',restore:()=>window.showMainList()};

  window.__setView = function(key,restore){
    if(window.__restoringView){ curView = {key:key,restore:restore}; return; }
    if(curView && curView.key===key){ curView.restore = restore; return; }
    viewStack.push(curView);
    if(viewStack.length>40) viewStack.shift();
    curView = {key:key,restore:restore};
  };

  function goBackView(){
    while(viewStack.length){
      const v = viewStack.pop();
      if(!v || v.key===curView.key) continue;
      window.__restoringView = true;
      try{ v.restore(); }catch(_){}
      window.__restoringView = false;
      curView = v;
      return true;
    }
    // riwayat habis tapi bukan di daftar utama -> kembali ke daftar utama
    if(curView && curView.key!=='main|All|0' && typeof window.showMainList==='function'){
      window.__restoringView = true;
      try{ window.showMainList(); }catch(_){}
      window.__restoringView = false;
      curView = {key:'main|All|0',restore:()=>window.showMainList()};
      return true;
    }
    return false;
  }

  function toast(msg){
    let t = $('backToast');
    if(!t){
      t = document.createElement('div');
      t.id = 'backToast';
      t.style.cssText =
        'position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 84px);'+
        'transform:translateX(-50%);background:rgba(20,20,20,.92);color:#f4f1e6;'+
        'font:700 12px Arial,sans-serif;padding:9px 16px;border-radius:999px;'+
        'border:1px solid rgba(57,255,20,.5);z-index:2147483600;pointer-events:none;'+
        'opacity:0;transition:opacity .2s ease;white-space:nowrap;';
      document.body.appendChild(t);
    }
    t.textContent = msg;
    t.style.opacity = '1';
    clearTimeout(t._h);
    t._h = setTimeout(()=>{ t.style.opacity = '0'; },1800);
  }

  // tampilan list (kategori apa pun): kembali -> bubble kategori Cryptocurrency
  function listToBubble(){
    if(typeof window.__isListView!=='function' || !window.__isListView())
      return false;
    window.__restoringView = true;
    try{
      window.__setBubbleView();
      if(typeof window.showMainList==='function') window.showMainList();
    }catch(_){}
    window.__restoringView = false;
    viewStack.length = 0;
    curView = {key:'main|All|0',restore:()=>window.showMainList()};
    return true;
  }
  let lastExitTap = 0;

  window.addEventListener('popstate',function(){

    // kembali yang dipicu aplikasi sendiri (menutup pop up lewat tombol X) -> abaikan
    if(window.__selfBack>0){
      window.__selfBack--;
      ensureGuard();
      return;
    }

    // sedang di intro -> tekan kembali 2x untuk keluar (tidak langsung menutup aplikasi)
    if(typeof isSplashVisible==='function' && isSplashVisible()){
      const now = Date.now();
      if(now-lastExitTap<2000){
        history.back();
        return;
      }
      lastExitTap = now;
      toast('Tekan kembali sekali lagi untuk keluar');
      ensureGuard();
      return;
    }

    if(closeTopLayer()){
      ensureGuard();
      return;
    }

    // dari tampilan list -> bubble Cryptocurrency (tidak langsung keluar)
    if(listToBubble()){
      ensureGuard();
      return;
    }
    // kembali ke halaman / kategori sebelumnya
    if(goBackView()){
      ensureGuard();
      return;
    }

    // halaman utama -> kembali ke intro
    if(typeof showSplash==='function'){
      window.__popBack=Date.now();
      showSplash();
      ensureGuard();
    }

  });

})();
</script>

<script>
/* =====================================================
   NEWS: ikon di menu (sebelah bintang) -> pop up besar, daftar berita
   - semua sumber di-cache saat aplikasi dibuka (juga disimpan di HP), jadi list langsung tampil
   - diperbarui otomatis di latar belakang setiap 10 menit
===================================================== */
(function(){

  const SOURCES = [
    ['CoinDesk','https://www.coindesk.com/arc/outboundfeeds/rss/','https://www.coindesk.com/'],
    ['Cointelegraph','https://cointelegraph.com/rss','https://cointelegraph.com/'],
    ['Decrypt','https://decrypt.co/feed','https://decrypt.co/news'],
    ['The Block','https://www.theblock.co/rss.xml','https://www.theblock.co/'],
    ['Bitcoin Magazine','https://bitcoinmagazine.com/feed','https://bitcoinmagazine.com/',
     ['https://bitcoinmagazine.com/news/feed','https://bitcoinmagazine.com/.rss/full/','https://news.bitcoin.com/feed/']],
    ['CryptoSlate','https://cryptoslate.com/feed/','https://cryptoslate.com/'],
    ['BeInCrypto','https://beincrypto.com/feed/','https://beincrypto.com/']
  ];

  const REFRESH_MS = 10*60*1000;
  const LS_KEY = 'cfNewsCache_v1';

  const cache = {};     // idx -> {t, items}
  let ov = null, tabsEl = null, listEl = null, subEl = null;
  let cur = 0, refreshing = false, lastRun = 0;

  /* ---------- cache tersimpan di HP ---------- */

  try{
    const saved = JSON.parse(localStorage.getItem(LS_KEY)||'{}');
    Object.keys(saved).forEach(k=>{
      const c = saved[k];
      if(c && Array.isArray(c.items) && c.items.length)
        cache[k] = c;
    });
  }catch(_){}

  function persist(){
    try{ localStorage.setItem(LS_KEY,JSON.stringify(cache)); }catch(_){}
  }

  /* ---------- util ---------- */

  function el(tag,cls,text){
    const e = document.createElement(tag);
    if(cls) e.className = cls;
    if(text!=null) e.textContent = text;
    return e;
  }

  function ago(ts){

    if(!ts || isNaN(ts)) return '';

    const m = Math.max(0,Math.round((Date.now()-ts)/60000));

    if(m<1)   return 'baru saja';
    if(m<60)  return m+' mnt lalu';

    const h = Math.round(m/60);

    if(h<24)  return h+' jam lalu';

    return Math.round(h/24)+' hari lalu';

  }

  function clock(t){

    const d = new Date(t);

    return String(d.getHours()).padStart(2,'0')+':'+
           String(d.getMinutes()).padStart(2,'0');

  }

  function parseDate(v){

    if(!v) return NaN;

    let d = Date.parse(v);

    if(isNaN(d))
      d = Date.parse(String(v).replace(' ','T')+'Z');   // rss2json: "YYYY-MM-DD hh:mm:ss" (UTC)

    return d;

  }

  /* ---------- ambil data ---------- */

  async function viaRss2Json(url){

    const r = await fetch(
      'https://api.rss2json.com/v1/api.json?rss_url='+encodeURIComponent(url)
    );

    if(!r.ok) throw new Error('HTTP '+r.status);

    const j = await r.json();

    if(j.status!=='ok' || !Array.isArray(j.items))
      throw new Error('rss2json');

    return j.items.map(x=>({
      title:(x.title||'').trim(),
      link:x.link,
      ts:parseDate(x.pubDate)
    }));

  }

  // baca RSS (item) maupun Atom (entry) dari teks XML
  function parseXml(text){

    const xml = new DOMParser().parseFromString(text,'text/xml');

    let nodes = Array.from(xml.querySelectorAll('item'));

    const atom = !nodes.length;

    if(atom)
      nodes = Array.from(xml.querySelectorAll('entry'));

    if(!nodes.length) throw new Error('kosong');

    return nodes.map(n=>{

      const q = sel=>((n.querySelector(sel)||{}).textContent||'').trim();

      let link = q('link');

      if(!link || atom){
        const l = n.querySelector('link[href]');
        if(l) link = l.getAttribute('href')||link;
      }

      return {
        title:q('title'),
        link:link,
        ts:parseDate(q('pubDate')||q('published')||q('updated'))
      };

    });

  }

  async function viaProxy(url,build){

    const r = await fetch(build(url));

    if(!r.ok) throw new Error('HTTP '+r.status);

    return parseXml(await r.text());

  }

  const PROXIES = [
    u=>'https://api.allorigins.win/raw?url='+encodeURIComponent(u),
    u=>'https://corsproxy.io/?url='+encodeURIComponent(u),
    u=>'https://api.codetabs.com/v1/proxy?quest='+encodeURIComponent(u)
  ];

  // coba berurutan: rss2json -> tiap proxy; untuk tiap alamat feed (utama + cadangan)
  async function loadFeed(src){

    const urls = [src[1]].concat(src[3]||[]);

    let lastErr = null;

    for(const u of urls){

      try{ return await viaRss2Json(u); }catch(e){ lastErr = e; }

      for(const p of PROXIES){

        try{ return await viaProxy(u,p); }catch(e){ lastErr = e; }

      }

    }

    throw lastErr || new Error('gagal');

  }

  // ambil baru dari internet -> simpan ke cache; gagal = cache lama tetap dipakai
  async function fetchSource(i){

    let items = await loadFeed(SOURCES[i]);

    items = items.filter(x=>x.title && x.link).slice(0,40);

    if(!items.length) throw new Error('kosong');

    const old = cache[i];

    cache[i] = {t:Date.now(),items};

    persist();

    const changed =
      !old ||
      old.items.length!==items.length ||
      old.items[0].link!==items[0].link;

    if(ov && ov.classList.contains('show') && i===cur)
      showCurrent(changed);

  }

  async function refreshAll(){

    if(refreshing) return;

    refreshing = true;
    lastRun = Date.now();

    for(let i=0;i<SOURCES.length;i++){

      try{ await fetchSource(i); }catch(_){}

      await new Promise(r=>setTimeout(r,350));

    }

    refreshing = false;

    updateSub();

  }

  /* ---------- tampilan ---------- */

  function updateSub(){

    if(!subEl) return;

    const c = cache[cur];

    subEl.textContent = c ? 'Update '+clock(c.t) : 'Memuat...';

  }

  function showMsg(text,withRetry){

    listEl.innerHTML = '';

    const box = el('div','nwMsg',text);

    if(withRetry){

      const b = el('button','nwRetry','Coba lagi');
      b.type = 'button';
      b.addEventListener('click',()=>{
        showMsg('Memuat berita...',false);
        fetchSource(cur).catch(()=>{
          if(!cache[cur]) showMsg('Berita belum bisa dimuat.',true);
        });
      });
      box.appendChild(b);

      const a = el('a','nwSite','Buka situs '+SOURCES[cur][0]);
      a.href = SOURCES[cur][2];
      a.target = '_blank';
      a.rel = 'noopener noreferrer';
      box.appendChild(a);

    }

    listEl.appendChild(box);

  }

  function renderItems(items,i,keepScroll){

    const top = listEl.scrollTop;

    listEl.innerHTML = '';

    items.forEach(x=>{

      const a = el('a','nwItem');
      a.href = x.link;
      a.target = '_blank';
      a.rel = 'noopener noreferrer';

      a.appendChild(el('div','nwTitle',x.title));

      const metaEl = el('div','nwMeta','');
      const srcEl = el('span','nwSrc',SOURCES[i][0]);
      metaEl.appendChild(srcEl);
      const agoTxt = ago(x.ts);
      if(agoTxt) metaEl.appendChild(document.createTextNode(' • '+agoTxt));

      a.appendChild(metaEl);

      listEl.appendChild(a);

    });

    listEl.scrollTop = keepScroll ? top : 0;

  }

  // tampilkan dari cache (langsung, tanpa loading)
  function showCurrent(rerender){

    const c = cache[cur];

    updateSub();

    if(!c){
      showMsg('Memuat berita...',false);
      return;
    }

    if(rerender!==false)
      renderItems(c.items,cur,rerender===true);

  }

  function select(i){

    cur = i;

    Array.from(tabsEl.children).forEach(
      (t,k)=>t.classList.toggle('on',k===i)
    );

    const tab = tabsEl.children[i];

    if(tab && tab.scrollIntoView)
      tab.scrollIntoView({inline:'center',block:'nearest',behavior:'smooth'});

    showCurrent();

    // belum ada cache untuk tab ini -> ambil sekarang
    if(!cache[i]){
      fetchSource(i).catch(()=>{
        if(cur===i && !cache[i]) showMsg('Berita belum bisa dimuat.',true);
      });
    }

  }

  function build(){

    ov = el('div','nwOverlay');
    ov.id = 'newsOverlay';

    const panel = el('div','nwPanel');

    const head = el('div','nwHead');

    const ht = el('div','nwHeadText');
    ht.appendChild(el('div','nwHeadTitle','Cryptocurrency News'));
    subEl = el('div','nwHeadSub','');
    ht.appendChild(subEl);
    head.appendChild(ht);

    const close = el('button','nwClose','\u00d7');
    close.type = 'button';
    close.setAttribute('aria-label','Close');
    head.appendChild(close);

    tabsEl = el('div','nwTabs');

    SOURCES.forEach((x,i)=>{

      const t = el('button','nwTab',x[0]);
      t.type = 'button';
      t.addEventListener('click',()=>select(i));
      tabsEl.appendChild(t);

    });

    listEl = el('div','nwList');

    panel.appendChild(head);
    panel.appendChild(tabsEl);
    panel.appendChild(listEl);
    ov.appendChild(panel);

    document.body.appendChild(ov);

    ov.addEventListener('click',e=>{
      if(e.target===ov || e.target.closest('.nwClose,.nwHeadText'))
        closeNews();
    });

  }

  function openNews(){

    const first = !ov;

    if(first) build();

    pageMenu.classList.remove('show');
    ov.classList.add('show');

    if(first)
      select(0);
    else
      showCurrent(true);

  }

  function closeNews(){
    if(ov) ov.classList.remove('show');
  }

  pageMenu.addEventListener('click',e=>{

    const b = e.target.closest('[data-view="news"]');

    if(!b)
      return;

    e.preventDefault();
    e.stopPropagation();
    openNews();

  },true);

  /* ---------- cache awal + perbarui otomatis tiap 10 menit ---------- */

  setTimeout(refreshAll,1200);                 // saat aplikasi dibuka
  setInterval(refreshAll,REFRESH_MS);          // tiap 10 menit

  document.addEventListener('visibilitychange',()=>{
    if(!document.hidden && Date.now()-lastRun>=REFRESH_MS)
      refreshAll();
  });

})();
</script>

<script id="menuDrag">
(function(){
  var KEY='cf_menu_pos', btn=null, st=null, THRESH=8;
  function el(){ return btn||(btn=document.getElementById('pageButton')); }
  function clamp(x,y,w,h){
    var m=6,W=window.innerWidth,H=window.innerHeight;
    return {x:Math.max(m,Math.min(W-w-m,x)), y:Math.max(m,Math.min(H-h-m,y))};
  }
  function place(x,y){
    var b=el(); if(!b) return;
    var r=b.getBoundingClientRect(), c=clamp(x,y,r.width,r.height), S=b.style;
    S.setProperty('left',c.x+'px','important');
    S.setProperty('top',c.y+'px','important');
    S.setProperty('right','auto','important');
    S.setProperty('bottom','auto','important');
    S.setProperty('margin-left','0','important');
    S.setProperty('margin-top','0','important');
    return c;
  }
  function save(c){
    try{ localStorage.setItem(KEY,JSON.stringify({fx:c.x/window.innerWidth,fy:c.y/window.innerHeight})); }catch(_){}
  }
  function restore(){
    try{
      var d=JSON.parse(localStorage.getItem(KEY)||'null');
      if(d&&isFinite(d.fx)&&isFinite(d.fy)) place(d.fx*window.innerWidth,d.fy*window.innerHeight);
    }catch(_){}
  }
  window.addEventListener('pointerdown',function(e){
    var b=el(); if(!b||e.__tap) return;
    if(!(e.target&&e.target.closest&&e.target.closest('#pageButton'))) return;
    var r=b.getBoundingClientRect();
    st={id:e.pointerId,sx:e.clientX,sy:e.clientY,ox:r.left,oy:r.top,moved:false};
    try{ b.setPointerCapture(e.pointerId); }catch(_){}
  },true);
  window.addEventListener('pointermove',function(e){
    if(!st||e.pointerId!==st.id) return;
    var dx=e.clientX-st.sx, dy=e.clientY-st.sy;
    if(!st.moved){
      if(Math.hypot(dx,dy)<THRESH) return;
      st.moved=true; el().classList.add('cfDragging');
      var pm=document.getElementById('pageMenu'); if(pm) pm.classList.remove('show');
    }
    e.preventDefault();
    st.last=place(st.ox+dx,st.oy+dy);
  },true);
  function end(e){
    if(!st||e.pointerId!==st.id) return;
    var b=el(); b.classList.remove('cfDragging');
    try{ b.releasePointerCapture(e.pointerId); }catch(_){}
    if(st.moved&&st.last) save(st.last);
    st=null;
  }
  window.addEventListener('pointerup',end,true);
  window.addEventListener('pointercancel',end,true);
  window.addEventListener('resize',function(){
    var b=el(); if(!b||!b.style.getPropertyValue('left')) return;
    var r=b.getBoundingClientRect(), c=place(r.left,r.top); if(c) save(c);
  });
  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',restore); else restore();
  window.addEventListener('load',restore);
})();
</script>
<script id="fixPatchJS">
(function(){

  const $ = id=>document.getElementById(id);

  const LAYERS = ['overlay','walletOverlay','qrOverlay','newsOverlay'];

  function layerShown(){
    for(const i of LAYERS){
      const e=$(i);
      if(e && e.classList.contains('show')) return true;
    }
    const pm=$('pageMenu');
    return !!(pm && pm.classList.contains('show'));
  }

  // dipakai tugas latar belakang (cache logo / data) agar tidak mengganggu saat menu dibuka
  window.__uiBusy = layerShown;

  /* ---------- A. Ikon menu: aktif saat jari DIANGKAT (tap), bukan saat menyentuh ----------
     Sebelumnya aksi jalan di pointerdown, jadi menyentuh/menggeser menu bisa memicu
     pop up sendiri. Sekarang hanya ketukan asli yang diproses, tetap instan. */
  const TAP_SEL =
    '#pageButton,.mtBtn[data-view="bubble"],.mtBtn[data-view="list"],.mtBtn[data-view="fav"],#searchButton';

  let tp = null;

  window.addEventListener('pointerdown',e=>{

    if(e.__tap) return;

    const t = e.target && e.target.closest ? e.target.closest(TAP_SEL) : null;

    if(!t) return;

    e.stopImmediatePropagation();
    e.preventDefault();

    tp = {el:t,x:e.clientX,y:e.clientY,t:performance.now(),id:e.pointerId};

  },true);

  window.addEventListener('pointerup',e=>{

    if(!tp || e.pointerId!==tp.id) return;

    const d = tp;
    tp = null;

    if(Math.hypot(e.clientX-d.x,e.clientY-d.y)>10) return;
    if(performance.now()-d.t>800) return;

    const under = document.elementFromPoint(e.clientX,e.clientY);

    if(!under || !under.closest || under.closest(TAP_SEL)!==d.el) return;

    const ev = new PointerEvent('pointerdown',{
      bubbles:true,
      cancelable:true,
      pointerId:e.pointerId,
      pointerType:e.pointerType,
      clientX:e.clientX,
      clientY:e.clientY
    });

    ev.__tap = true;

    d.el.dispatchEvent(ev);

  },true);

  window.addEventListener('pointercancel',()=>{ tp=null; },true);


  /* ---------- B. Ketuk di luar hasil search: tutup saja, jangan tembus ke bawah ---------- */
  let shieldUntil = 0;

  window.addEventListener('pointerdown',e=>{

    if(e.__tap) return;

    const sr=$('searchResults');

    if(!(sr && sr.classList.contains('show'))) return;

    const t=e.target;

    if(!t || !t.closest) return;

    if(t.closest('#searchPanel,#searchResults,#pageButton')) return;

    if(typeof closeSearch==='function') closeSearch();

    shieldUntil = performance.now()+150;

    e.preventDefault();
    e.stopPropagation();

  },true);

  // setelah pop up / menu menutup, klik "sisa" tidak boleh membuka daftar di bawahnya
  try{

    const mo = new MutationObserver(ms=>{
      for(const m of ms){
        const el=m.target;
        if(!el.classList.contains('show') && (m.oldValue||'').indexOf('show')>-1)
          shieldUntil = performance.now()+150;
      }
    });

    LAYERS.concat(['pageMenu']).forEach(i=>{
      const e=$(i);
      if(e) mo.observe(e,{attributes:true,attributeFilter:['class'],attributeOldValue:true});
    });

    // newsOverlay dibuat belakangan
    new MutationObserver(()=>{
      const n=$('newsOverlay');
      if(n && !n.__mo){
        n.__mo=1;
        mo.observe(n,{attributes:true,attributeFilter:['class'],attributeOldValue:true});
      }
    }).observe(document.body,{childList:true});

  }catch(_){}

  window.addEventListener('click',e=>{

    if(performance.now()>=shieldUntil) return;

    const t=e.target;

    if(t && t.closest && t.closest('#cloud')){
      e.preventDefault();
      e.stopPropagation();
    }

  },true);


  /* ---------- C. Pop up detail koin hanya untuk ketukan asli di atas bubble ---------- */
  window.addEventListener('pointerup',e=>{

    try{

      if(!drag || e.pointerId!==drag.pid) return;

      const n = nodes.get(drag.id);

      const under = document.elementFromPoint(e.clientX,e.clientY);

      const onCoin =
        n && n.isConnected &&
        under && under.closest &&
        under.closest('.coinCard')===n;

      if(!onCoin || performance.now()-drag.t>800 || layerShown())
        drag.moved = true;      // handler asli akan mengabaikan (tidak membuka pop up)

    }catch(_){}

  },true);

  // daftar koin dibangun ulang saat jari menahan bubble -> batalkan, jangan buka pop up lama
  const _cn = createCoinNodes;

  createCoinNodes = function(){

    try{ if(drag) cancelDrag(); }catch(_){}

    return _cn.apply(this,arguments);

  };

  // pop up koin tidak boleh muncul di atas menu / wallet / QR / news yang sedang terbuka
  const _op = openPopup;

  openPopup = function(id){

    const pm=$('pageMenu');

    if(pm && pm.classList.contains('show')) return;

    for(const i of ['walletOverlay','qrOverlay','newsOverlay']){
      const e=$(i);
      if(e && e.classList.contains('show')) return;
    }

    return _op.apply(this,arguments);

  };


  /* ---------- D. Animasi bubble ringan ---------- */

  // posisi langsung lewat transform (tanpa mengubah CSS variable tiap frame)
  applyPosition = function(id){

    const p = positions.get(id);
    const n = nodes.get(id);

    if(!p || !n) return;

    n.style.transform =
      'translate3d('+p.x.toFixed(1)+'px,'+p.y.toFixed(1)+'px,0) rotate('+p.rotation.toFixed(2)+'deg)';

  };

  // animasi berhenti saat pop up detail / wallet / QR / news terbuka
  const _an = animate;

  animate = function(){

    if(layerShown()){
      requestAnimationFrame(animate);
      return;
    }

    _an();

  };

})();
</script>

<script id="noOldVersionJS">
(function(){
  var BUILD='2026-10-25-nexus1';

  /* A. Hapus semua versi lama: service worker + cache lama (sekali per build) */
  try{
    if(localStorage.getItem('cf_build')!==BUILD){
      if(navigator.serviceWorker && navigator.serviceWorker.getRegistrations){
        navigator.serviceWorker.getRegistrations().then(function(rs){
          rs.forEach(function(r){ try{ r.unregister(); }catch(_){} });
        }).catch(function(){});
      }
      if(window.caches && caches.keys){
        caches.keys().then(function(ks){
          return Promise.all(ks.map(function(k){ return caches.delete(k); }));
        }).catch(function(){});
      }
      localStorage.setItem('cf_build',BUILD);
    }
  }catch(_){}

  var $=function(id){ return document.getElementById(id); };

  function closeAllLayers(keepCoin){
    ['pageMenu','overlay','walletOverlay','qrOverlay','newsOverlay','searchResults'].forEach(function(i){
      if(keepCoin && i==='overlay') return;
      var e=$(i); if(e && e.classList) e.classList.remove('show');
    });
  }

  /* B. Intro hanya boleh muncul dari tombol kembali (popstate), tidak dari error / proses lain.
        Saat intro tampil, menu & pop up selalu ditutup. */
  var _show=window.showSplash, fromBack=false;
  window.addEventListener('popstate',function(){ fromBack=true; setTimeout(function(){ fromBack=false; },300); },true);
  if(typeof _show==='function'){
    window.showSplash=function(){
      if(!fromBack && Date.now()-(window.__popBack||0)>400) return;
      closeAllLayers();
      return _show.apply(this,arguments);
    };
  }

  /* C. Error JS / promise tidak dibiarkan merusak tampilan: jangan buka ulang halaman utama,
        dan jangan biarkan menu terbuka menutupi layar. */
  function onErr(e){
    try{
      if(e && e.target && e.target!==window && e.target.tagName) return; // error gambar/resource: abaikan
      console.error(e && (e.reason||e.error||e.message)||e);
      var sp=$('splash');
      if(sp && sp.style.display==='none') closeAllLayers(true);
    }catch(_){}
    if(e && e.preventDefault) try{ e.preventDefault(); }catch(_){}
  }
  window.addEventListener('error',onErr);
  window.addEventListener('unhandledrejection',onErr);

  /* D. Kembali dari background / bfcache: pakai halaman yang sedang jalan, bukan versi tersimpan */
  window.addEventListener('pageshow',function(e){
    if(e.persisted){
      var keepCoin=false;
      try{ keepCoin=!!(window.__cfKeepCoin && window.__cfKeepCoin()); }catch(_){}
      closeAllLayers(keepCoin);
    }
  });
})();
</script>

<script id="frontByGainJS">
(function(){
  /* Bubble |gain| terbesar (plus maupun minus) selalu paling depan.
     Sumber kebenaran = angka persen yang tampil di bubble, jadi berlaku
     di semua halaman & kategori (Cryptocurrency, Gecko, DEX, dll). */
  var busy=false, timer=null;

  function pct(card){
    var g=card.querySelector('.coinGain');
    if(!g) return 0;
    var v=parseFloat(String(g.textContent).replace(/[^0-9.\-]/g,''));
    return isFinite(v)?Math.abs(v):0;
  }

  function reorder(){
    if(busy) return; busy=true;
    try{
      var cloud=document.getElementById('cloud');
      if(!cloud || cloud.classList.contains('asList') || document.hidden){ busy=false; return; }
      var cards=Array.prototype.slice.call(cloud.querySelectorAll('.coinCard'));
      var arr=cards.map(function(c){ return {c:c,g:pct(c)}; });
      arr.sort(function(a,b){ return a.g-b.g; });          // kecil -> besar
      arr.forEach(function(o,i){
        if(o.c.classList.contains('dragging')) return;
        var z=String(100+i);                                // besar = angka z lebih tinggi
        if(o.c.style.zIndex!==z) o.c.style.zIndex=z;
      });
    }catch(_){}
    busy=false;
  }

  function schedule(){
    if(timer) return;
    timer=setTimeout(function(){ timer=null; reorder(); },60);
  }

  function boot(){
    var cloud=document.getElementById('cloud');
    if(!cloud){ setTimeout(boot,300); return; }
    new MutationObserver(schedule).observe(cloud,{childList:true,subtree:true,characterData:true});
    setInterval(reorder,700);   // jaga-jaga: harga/persen diperbarui otomatis
    reorder();
  }
  boot();

  /* terapkan juga saat applyPosition menulis zIndex lama -> tulis ulang berdasarkan persen */
  try{
    var _ap=window.applyPosition;
    if(typeof _ap==='function'){
      window.applyPosition=function(id){
        var r=_ap.apply(this,arguments);
        schedule();
        return r;
      };
    }
  }catch(_){}
})();
</script>

      return 'https://dexscreener.com/'+encodeURIComponent(net)+'/'+encodeURIComponent(pool)+
             '?embed=1&theme=dark&trades=0&info=0';

    if(src==='GeckoTerminal' && net && pool)
      return 'https://www.geckoterminal.com/'+encodeURIComponent(net)+'/pools/'+encodeURIComponent(pool)+
             '?embed=1&info=0&swaps=0&grayscale=0&light_chart=0';

    if(src==='four.meme' && pool)
      return 'https://dexscreener.com/bsc/'+encodeURIComponent(pool)+
             '?embed=1&theme=dark&trades=0&info=0';

    if(src==='Binance Alpha' && pool && CH[norm(net)])
      return 'https://dexscreener.com/'+encodeURIComponent(chain)+'/'+
             encodeURIComponent(chain==='solana'?pool:String(pool).toLowerCase())+
             '?embed=1&theme=dark&trades=0&info=0';

    return '';
  }

  function fallbackUrl(c){
    if(c._url) return c._url;
    if(c._network && c._pool) return 'https://www.geckoterminal.com/'+c._network+'/pools/'+c._pool;
    return '';
  }

  function openViewer(c,urlOverride){
    clearWidget();
    var u=(urlOverride!==undefined)?urlOverride:embedFor(c);
    extUrl=(urlOverride!==undefined)?'':(fallbackUrl(c)||u);
    var _t=$('cvTitle'); if(_t) _t.textContent=(c.symbol||c.name||'Chart').toString().toUpperCase()+' · '+(c._source||'DexScreener');
    frame.classList.remove('ready');
    load.classList.remove('hide');
    load.textContent='Memuat chart...';
    viewer.classList.add('show');
    viewer.setAttribute('aria-hidden','false');
    opened=true;
    try{ history.pushState({guard:1,chart:1},'',location.href); }catch(_){}
    frame.onload=function(){
      clearTimeout(timer);
      frame.classList.add('ready');
      load.classList.add('hide');
    };
    clearTimeout(timer);
    // kalau situs menolak ditampilkan di dalam aplikasi -> buka tab langsung
    timer=setTimeout(function(){
      if(!frame.classList.contains('ready')) load.textContent='Chart lambat dimuat... mohon tunggu.';
    },9000);
    if(u) frame.src=u;
  }

  // koin Cryptocurrency biasa: chart candlestick GeckoTerminal (pool likuiditas terbesar) di dalam aplikasi
  var wBox=null;
  var poolCache={};
  function clearWidget(){
    if(wBox && wBox.parentNode) wBox.parentNode.removeChild(wBox);
    wBox=null;
  }

  async function findPool(c){
    var sym=String(c.symbol||'').toUpperCase().replace(/[^A-Z0-9]/g,'');
    var key=String(c.id||sym);
    if(poolCache[key]!==undefined) return poolCache[key];
    var ref=Number(c.current_price)||0, res=null;
    try{
      var r=await fetch('https://api.geckoterminal.com/api/v2/search/pools?query='+encodeURIComponent(sym)+'&page=1');
      if(r.ok){
        var j=await r.json();
        var list=((j&&j.data)||[]).filter(function(d){
          var a=d.attributes||{};
          var base=String(a.name||'').split('/')[0].trim().toUpperCase();
          var pr=Number(a.base_token_price_usd)||0;
          var okPrice=!(ref>0) || (pr>0 && Math.abs(pr/ref-1)<=0.3);
          return base===sym && okPrice && a.address &&
                 d.relationships && d.relationships.network && d.relationships.network.data;
        }).sort(function(x,y){
          return (Number(y.attributes.reserve_in_usd)||0)-(Number(x.attributes.reserve_in_usd)||0);
        });
        if(list.length) res={net:list[0].relationships.network.data.id, pool:list[0].attributes.address};
      }
    }catch(_){}
    poolCache[key]=res;
    return res;
  }

  async function findAlt(c,sym){
    var ref=Number(c.current_price)||0;
    try{
      if(sym && typeof TV_SOURCES!=='undefined'){
        var prices=await Promise.all(TV_SOURCES.map(function(s){
          return Promise.resolve().then(function(){return s.price(sym);}).catch(function(){return 0;});
        }));
        for(var i=0;i<prices.length;i++){
          if(tvPriceOk(prices[i],ref)){
            var s=TV_SOURCES[i], sy=s.tv+':'+s.pair(sym);
            return {
              name:'TradingView',
              u:'https://s.tradingview.com/widgetembed/?symbol='+encodeURIComponent(sy)+
                '&interval=60&theme=dark&style=1&hide_side_toolbar=1&withdateranges=1&locale=en&toolbarbg=000000',
              ext:'https://www.tradingview.com/chart/?symbol='+encodeURIComponent(sy)
            };
          }
        }
      }
    }catch(_){}
    try{
      if(sym && typeof tvDexUrl==='function'){
        var d=await tvDexUrl(sym,ref);
        if(d && d.indexOf('/search')<0)
          return {name:'DexScreener',u:d+(d.indexOf('?')<0?'?':'&')+'embed=1&theme=dark&trades=0&info=0',ext:d};
      }
    }catch(_){}
    return null;
  }

  function showNoChart(title){
    var old=document.getElementById('noChartDlg'); if(old) old.remove();
    var o=document.createElement('div');
    o.id='noChartDlg';
    o.style.cssText='position:fixed;inset:0;z-index:70000;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.55);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)';
    o.innerHTML='<div style="width:min(300px,84vw);padding:20px 18px 16px;text-align:center;color:#f4f1e6;border:1.5px solid #39ff14;border-radius:18px;background:rgba(18,18,20,.92);box-shadow:0 0 14px rgba(57,255,20,.35);font-family:inherit">'+
      '<div style="font-size:16px;font-weight:800;margin-bottom:8px">Chart belum tersedia</div>'+
      '<div style="font-size:13px;line-height:1.5;color:#b8bec4">Chart untuk <b style="color:#f4f1e6">'+title+'</b> belum tersedia di bursa maupun DEX yang didukung.</div>'+
      '<button type="button" style="margin-top:14px;padding:9px 28px;border:1.5px solid #39ff14;border-radius:10px;background:transparent;color:#39ff14;font-size:13px;font-weight:800;font-family:inherit">OK</button></div>';
    o.addEventListener('click',function(e){ if(e.target===o || e.target.tagName==='BUTTON') o.remove(); });
    document.body.appendChild(o);
  }

  async function openRegular(c){
    openViewer(c,'');                 // tampilkan layar chart + "Memuat chart..."
    var _t=$('cvTitle');
    var sym=String(c.symbol||'').toUpperCase().replace(/[^A-Z0-9]/g,'');
    var tTitle=(c.symbol||c.name||'Chart').toString().toUpperCase();
    var p=await findPool(c);
    if(!opened) return;               // sudah ditutup saat mencari pool
    var u;
    if(p){
      u='https://www.geckoterminal.com/'+encodeURIComponent(p.net)+'/pools/'+encodeURIComponent(p.pool)+
        '?embed=1&info=0&swaps=0&grayscale=0&light_chart=0';
      extUrl='https://www.geckoterminal.com/'+p.net+'/pools/'+p.pool;
      if(_t) _t.textContent=tTitle+' · GeckoTerminal';
      openLine(c,p.net,p.pool,tTitle,u,'GeckoTerminal');
      return;
    }else{
      // tidak ada pool on-chain -> cari di bursa (TradingView) lalu DexScreener
      var alt=await findAlt(c,sym);
      if(!opened) return;
      if(!alt){                       // benar-benar tidak ada chart -> pop up keterangan
        closeViewer();
        showNoChart(tTitle);
        return;
      }
      u=alt.u; extUrl=alt.ext;
      if(_t) _t.textContent=tTitle+' · '+alt.name;
    }
    clearTimeout(timer);
    timer=setTimeout(function(){
      if(!frame.classList.contains('ready')) load.textContent='Chart lambat dimuat... mohon tunggu.';
    },9000);
    frame.src=u;
  }


  /* ===== chart garis (model CoinGecko) untuk koin DEX / GeckoTerminal / four.meme / Binance Alpha ===== */
  var GTMAP={ethereum:'eth',polygon:'polygon_pos',avalanche:'avax',matic:'polygon_pos',avax:'avax'};
  function gtId(n){ n=String(n||'').toLowerCase(); return GTMAP[n]||n; }
  var RANGES=[['24J','minute',15,96],['7H','hour',1,168],['30H','hour',4,180],['90H','day',1,90],['1T','day',1,365]];
  var lcCache={};

  function lcFmt(p){
    if(!isFinite(p)) return '-';
    var a=Math.abs(p);
    if(a>=1000) return '$'+p.toLocaleString('en-US',{maximumFractionDigits:2});
    if(a>=1) return '$'+p.toFixed(a>=100?2:3);
    if(a>=0.01) return '$'+p.toFixed(4);
    if(a===0) return '$0';
    var e=Math.floor(Math.log10(a)), z=-e-1;           // jumlah nol setelah koma
    if(z<4) return '$'+p.toFixed(z+4);
    var d=String(Math.round(a*Math.pow(10,z+4))).slice(0,4);
    var sub='₀₁₂₃₄₅₆₇₈₉';
    return '$0.0'+String(z).split('').map(function(x){return sub[+x];}).join('')+d;
  }
  function lcDate(t,long){
    var d=new Date(t*1000), m=['Jan','Feb','Mar','Apr','Mei','Jun','Jul','Agu','Sep','Okt','Nov','Des'][d.getMonth()];
    var hh=('0'+d.getHours()).slice(-2)+':'+('0'+d.getMinutes()).slice(-2);
    return long ? d.getDate()+' '+m+' '+d.getFullYear()+', '+hh : d.getDate()+' '+m;
  }

  var lcPoolMap={};
  function lcSleep(ms){ return new Promise(function(r){setTimeout(r,ms);}); }
  // alamat token (four.meme / Binance Alpha) -> alamat pool likuiditas terbesar
  async function lcResolve(net,addr){
    var k=net+'|'+addr; if(lcPoolMap[k]) return lcPoolMap[k];
    var out='';
    try{
      var r=await fetch('https://api.geckoterminal.com/api/v2/networks/'+encodeURIComponent(net)+'/tokens/'+encodeURIComponent(addr)+'/pools?page=1');
      if(r.ok){ var j=await r.json(); var d=(j&&j.data)||[]; if(d.length) out=d[0].attributes.address; }
    }catch(_){}
    if(!out){
      try{
        var r2=await fetch('https://api.dexscreener.com/latest/dex/tokens/'+encodeURIComponent(addr));
        if(r2.ok){
          var j2=await r2.json(), best=null, ch={eth:'ethereum',polygon_pos:'polygon',avax:'avalanche'}[net]||net;
          (j2.pairs||[]).forEach(function(x){
            if(x.chainId!==ch) return;
            if(!best || ((x.liquidity&&x.liquidity.usd)||0)>((best.liquidity&&best.liquidity.usd)||0)) best=x;
          });
          if(best) out=best.pairAddress;
        }
      }catch(_){}
    }
    if(out) lcPoolMap[k]=out;
    return out;
  }
  async function lcGet(net,pool,r){
    var url='https://api.geckoterminal.com/api/v2/networks/'+encodeURIComponent(net)+'/pools/'+encodeURIComponent(pool)+
            '/ohlcv/'+r[1]+'?aggregate='+r[2]+'&limit='+r[3]+'&currency=usd';
    var res=null;
    for(var i=0;i<3;i++){
      res=await fetch(url);
      if(res.ok||res.status===404) break;
      await lcSleep(1200*(i+1));
    }
    return res;
  }
  async function lcFetch(net,pool,r){
    var key=net+'|'+pool+'|'+r[0];
    var hit=lcCache[key];
    if(hit && Date.now()-hit.t<60000) return hit.d;
    var pl=lcPoolMap[net+'|'+pool]||pool;
    var res=await lcGet(net,pl,r);
    if(res.status===404){                       // mungkin alamat token, bukan pool
      var rp=await lcResolve(net,pool);
      if(!rp) throw new Error('pool tidak ditemukan');
      res=await lcGet(net,rp,r);
    }
    if(!res.ok) throw new Error('HTTP '+res.status);
    var j=await res.json();
    var l=(j&&j.data&&j.data.attributes&&j.data.attributes.ohlcv_list)||[];
    var d=l.map(function(x){return [x[0],Number(x[4])];}).filter(function(x){return x[1]>0;})
           .sort(function(a,b){return a[0]-b[0];});
    if(d.length<2) throw new Error('kosong');
    lcCache[key]={t:Date.now(),d:d};
    return d;
  }

  // gambar chart garis + area gradasi, crosshair saat disentuh
  function lcDraw(cv,data,idx,up){
    var dpr=window.devicePixelRatio||1, W=cv.clientWidth, H=cv.clientHeight;
    if(cv.width!==Math.round(W*dpr)||cv.height!==Math.round(H*dpr)){ cv.width=Math.round(W*dpr); cv.height=Math.round(H*dpr); }
    var x=cv.getContext('2d'); x.setTransform(dpr,0,0,dpr,0,0); x.clearRect(0,0,W,H);
    var padR=58, padB=20, padT=8, cw=W-padR, ch=H-padB-padT;
    var mn=Infinity,mx=-Infinity,i;
    for(i=0;i<data.length;i++){ if(data[i][1]<mn)mn=data[i][1]; if(data[i][1]>mx)mx=data[i][1]; }
    var pad=(mx-mn)*0.08||mx*0.01; mn-=pad; mx+=pad;
    var col=up?'#39ff14':'#ff4d4f', t0=data[0][0], t1=data[data.length-1][0];
    function X(t){return (t-t0)/((t1-t0)||1)*cw;}
    function Y(v){return padT+(1-(v-mn)/((mx-mn)||1))*ch;}
    x.font="11px Inter, Arial"; x.textBaseline='middle'; x.fillStyle='#6d747a'; x.strokeStyle='rgba(255,255,255,.07)'; x.lineWidth=1;
    for(i=0;i<5;i++){ var v=mn+(mx-mn)*i/4, y=Y(v);
      x.beginPath(); x.moveTo(0,y); x.lineTo(cw,y); x.stroke();
      x.textAlign='left'; x.fillText(lcFmt(v).replace('$',''),cw+6,Math.min(H-padB-4,Math.max(8,y))); }
    x.textBaseline='alphabetic'; x.textAlign='center';
    for(i=0;i<4;i++){ var tt=t0+(t1-t0)*(i+.5)/4; x.fillText(lcDate(tt,false),X(tt),H-5); }
    x.beginPath();
    for(i=0;i<data.length;i++){ var px=X(data[i][0]),py=Y(data[i][1]); if(i)x.lineTo(px,py); else x.moveTo(px,py); }
    var g=x.createLinearGradient(0,padT,0,padT+ch); g.addColorStop(0,up?'rgba(57,255,20,.45)':'rgba(255,77,79,.45)'); g.addColorStop(.55,up?'rgba(57,255,20,.12)':'rgba(255,77,79,.12)'); g.addColorStop(1,'rgba(0,0,0,0)');
    x.save(); x.lineTo(X(t1),padT+ch); x.lineTo(0,padT+ch); x.closePath(); x.fillStyle=g; x.fill(); x.restore();
    x.beginPath();
    for(i=0;i<data.length;i++){ var qx=X(data[i][0]),qy=Y(data[i][1]); if(i)x.lineTo(qx,qy); else x.moveTo(qx,qy); }
    x.save(); x.shadowColor=col; x.shadowBlur=8; x.shadowOffsetY=4; x.strokeStyle=col; x.lineWidth=1.2; x.lineJoin='round'; x.stroke(); x.restore();
    if(idx>=0){
      var cx=X(data[idx][0]), cy=Y(data[idx][1]);
      x.strokeStyle='rgba(255,255,255,.35)'; x.setLineDash([4,4]); x.beginPath(); x.moveTo(cx,padT); x.lineTo(cx,padT+ch); x.stroke(); x.setLineDash([]);
      x.beginPath(); x.arc(cx,cy,5,0,6.2832); x.fillStyle=col; x.fill(); x.lineWidth=2; x.strokeStyle='#000'; x.stroke();
    }
  }

  function openLine(c,net,pool,tTitle,fallbackSrc,source){
    clearWidget();
    var _t=$('cvTitle'); if(_t) _t.textContent=tTitle+' · '+source;
    var body=viewer.querySelector('.cvBody');
    var box=document.createElement('div'); box.id='cvLine';
    box.innerHTML='<div class="lcTop"><div class="lcTitle"></div><button type="button" class="lcX" aria-label="Tutup">✕</button></div>'+
      '<div class="lcPrice">-</div><div class="lcSub"></div>'+
      '<div class="lcRanges"></div>'+
      '<div class="lcWrap"><canvas></canvas><div class="lcMsg">Memuat chart...</div></div>'+
      '<div class="lcFoot"><span>Sumber: GeckoTerminal</span><a href="#" class="lcExt">Buka di web</a></div>';
    body.appendChild(box); wBox=box;
    box.querySelector('.lcTitle').textContent=tTitle+' · '+source;
    box.querySelector('.lcX').addEventListener('click',function(){ closeViewer(); });
    box.querySelector('.lcExt').addEventListener('click',function(e){ e.preventDefault(); if(extUrl) window.open(extUrl,'_blank'); });
    var priceEl=box.querySelector('.lcPrice'), subEl=box.querySelector('.lcSub'), rbox=box.querySelector('.lcRanges'),
        cv=box.querySelector('canvas'), msg=box.querySelector('.lcMsg');
    var cur=1, data=null, up=true, token=0, hover=-1;

    function showHeader(i){
      if(!data) return;
      if(i<0){
        var f=data[0][1], l=data[data.length-1][1], pc=(l/f-1)*100;
        priceEl.textContent=lcFmt(l);
        subEl.innerHTML='<b class="'+(pc>=0?'lcUp':'lcDn')+'">'+(pc>=0?'▲ ':'▼ ')+Math.abs(pc).toFixed(2)+'%</b> · '+RANGES[cur][0];
      }else{
        priceEl.textContent=lcFmt(data[i][1]);
        subEl.textContent=lcDate(data[i][0],true);
      }
    }
    function redraw(){ if(data) lcDraw(cv,data,hover,up); }
    function pick(ev){
      if(!data) return;
      var rc=cv.getBoundingClientRect(), cw=rc.width-58;
      var px=Math.max(0,Math.min(cw,ev.clientX-rc.left));
      var t=data[0][0]+(px/cw)*(data[data.length-1][0]-data[0][0]), best=0, bd=1e18;
      for(var i=0;i<data.length;i++){ var d=Math.abs(data[i][0]-t); if(d<bd){bd=d;best=i;} }
      hover=best; showHeader(best); redraw();
    }
    function endPick(){ hover=-1; showHeader(-1); redraw(); }
    cv.addEventListener('pointerdown',function(e){ try{cv.setPointerCapture(e.pointerId);}catch(_){} pick(e); });
    cv.addEventListener('pointermove',function(e){ if(e.pointerType==='mouse'||e.buttons) pick(e); });
    cv.addEventListener('pointerup',endPick); cv.addEventListener('pointercancel',endPick); cv.addEventListener('pointerleave',function(e){ if(e.pointerType==='mouse') endPick(); });

    async function load(i){
      cur=i; var my=++token; hover=-1;
      [].forEach.call(rbox.children,function(b,k){ b.classList.toggle('on',k===i); });
      msg.style.display='flex'; msg.textContent='Memuat chart...';
      try{
        var d=await lcFetch(net,pool,RANGES[i]);
        if(my!==token||!opened) return;
        data=d; up=d[d.length-1][1]>=d[0][1];
        msg.style.display='none'; showHeader(-1); redraw();
      }catch(err){
        if(my!==token||!opened) return;
        msg.style.display='flex';
        msg.innerHTML='Data chart belum tersedia.<br><br><button type="button" class="lcR" style="flex:none;padding:8px 18px">Coba lagi</button>';
        msg.style.pointerEvents='auto';
        msg.querySelector('button').addEventListener('click',function(){ msg.style.pointerEvents=''; load(cur); });
      }
    }
    RANGES.forEach(function(r,i){
      var b=document.createElement('button'); b.type='button'; b.className='lcR'; b.textContent=r[0];
      b.addEventListener('click',function(){ load(i); }); rbox.appendChild(b);
    });
    new ResizeObserver(redraw).observe(cv);
    load(1);
  }

  function closeViewer(fromPop){
    if(!opened) return;
    opened=false;
    clearTimeout(timer);
    clearWidget();
    viewer.classList.remove('show');
    viewer.setAttribute('aria-hidden','true');
    frame.onload=null; frame.classList.remove('ready');
    // tirai hitam saat keluar chart: apa pun yang muncul di belakang (kilatan putih) tertutup, lalu memudar halus
    try{
      var _cv=document.getElementById('cvBlackCover');
      if(!_cv){
        _cv=document.createElement('div'); _cv.id='cvBlackCover';
        _cv.style.cssText='position:fixed;inset:0;z-index:130000;background:#000;opacity:1;pointer-events:none;transition:opacity .28s ease';
        document.body.appendChild(_cv);
      }
      _cv.style.transition='none'; _cv.style.opacity='1'; _cv.style.display='block';
      void _cv.offsetWidth;
      setTimeout(function(){ _cv.style.transition='opacity .28s ease'; _cv.style.opacity='0'; },160);
      setTimeout(function(){ if(!opened) _cv.style.display='none'; },520);
    }catch(_){}
    setTimeout(function(){ if(!opened){ frame.onload=null; frame.src='about:blank'; } },220);
    if(!fromPop){ try{ if(history.state && history.state.chart) history.back(); }catch(_){} }
  }


  // tombol back perangkat: tutup chart dulu, jangan keluar/ke intro
  window.addEventListener('popstate',function(e){
    if(opened){
      e.stopImmediatePropagation();
      closeViewer(true);
      try{ history.pushState({guard:1},'',location.href); }catch(_){}
    }
  },true);

  // tombol chart di pop up: koin Dex / Gecko / four.meme / Binance Alpha -> langsung chart di dalam aplikasi
  var btn=$('tradingViewIcon');
  if(btn){
    btn.addEventListener('click',function(e){
      var c=null;
      try{ c=selectedCoin; }catch(_){}
      if(!c) return;
      e.stopImmediatePropagation();
      e.preventDefault();
      if(!c._terminal){                             // Cryptocurrency: chart CoinGecko embed di dalam aplikasi
        openRegular(c);
        return;
      }
      var u=embedFor(c);
      if(u && c._pool && (c._source==='DexScreener' || c._source==='GeckoTerminal' || c._source==='four.meme' || c._source==='Binance Alpha')){
        openViewer(c);                              // DexScreener / GeckoTerminal embed masing-masing; four.meme & Binance Alpha -> embed DexScreener
        return;
      }
      if(u && c._pool){                             // four.meme / Binance Alpha: chart garis dari data GeckoTerminal
        var _n=(c._source==='four.meme')?'bsc':c._network;
        if(_n){
          var _p=(c._source==='Binance Alpha' && String(CH[norm(c._network)]||'')!=='solana')?String(c._pool).toLowerCase():c._pool;
          openViewer(c,'');                         // buka layar chart (sekali), lalu pasang chart garis
          extUrl=fallbackUrl(c)||u;
          openLine(c,gtId(CH[norm(_n)]||_n),_p,(c.symbol||c.name||'Chart').toString().toUpperCase(),u,c._source||'DEX');
          return;
        }
      }
      if(!u){                                       // sumber tidak bisa di-embed: buka tab langsung
        var f=fallbackUrl(c);
        if(f) window.open(f,'_blank');
        return;
      }
      openViewer(c);
    },true);
  }
})();
</script>

<script id="inlineChartJS">
(function(){
  var $=function(i){return document.getElementById(i);};
  var box=null, curId='', lastH=0, ro=null, rebuildT=null;

  function ensureBox(){
    if(box && box.isConnected) return box;
    var d=$('pDescription');
    if(!d || !d.parentNode) return null;
    box=document.createElement('div');
    box.id='pInlineChart';
    d.parentNode.insertBefore(box,d);      // tepat di atas teks detail koin
    return box;
  }

  function loadScript(){
    return;   /* tidak memuat script CoinGecko */
    var sc=document.createElement('script');
    sc.src='';
    sc.async=true; sc.setAttribute('data-cgw','1');
    document.head.appendChild(sc);
  }

  function setFit(on){
    /* mode full halaman dimatikan: pop up kembali ke ukuran sesuai isi detail */
    var ov=$('overlay'), pp=$('popup');
    if(ov) ov.classList.remove('fitFullOv');
    if(pp) pp.classList.remove('fitFull');
  }

  function clearBox(){
    if(ro){ try{ro.disconnect();}catch(_){} ro=null; }
    clearTimeout(rebuildT);
    if(box){ box.classList.remove('on'); box.innerHTML=''; }
    curId=''; lastH=0;
    setFit(false);
  }

  function build(id){
    var b=box; if(!b) return;
    b.innerHTML='';
    var h=Math.max(90,Math.floor(b.clientHeight*0.6));  // area grafik; header widget ditambahkan di luar angka ini
    lastH=b.clientHeight;
    var el=document.createElement('gecko-coin-price-chart-widget');
    el.setAttribute('locale','en');
    el.setAttribute('dark-mode','true');
    el.setAttribute('transparent-background','true');
    el.setAttribute('coin-id',id);
    el.setAttribute('initial-currency','usd');
    el.setAttribute('height',String(h));
    var ld=document.createElement('div');
    ld.className='icLoad'; ld.textContent='Memuat chart...';
    b.appendChild(el); b.appendChild(ld);
    loadScript();
    // perkecil seluruh widget (judul + grafik) agar tampil utuh di kotak, tanpa terpotong
    function fit(){
      if(!el.isConnected || !b.isConnected) return;
      el.style.transform='none';
      el.style.width='100%';
      var bh=b.clientHeight-6, bw=b.clientWidth;
      var eh=el.getBoundingClientRect().height;
      if(eh>bh && eh>0 && bh>40){
        var k=bh/eh;
        el.style.transformOrigin='top left';
        el.style.transform='scale('+k.toFixed(3)+')';
        el.style.width=(100/k).toFixed(2)+'%';
      }
    }
    if(window.customElements && customElements.whenDefined){
      customElements.whenDefined('gecko-coin-price-chart-widget').then(function(){
        setTimeout(function(){ if(ld.parentNode) ld.parentNode.removeChild(ld); fit(); el.classList.add('cgReady'); },1400);
        setTimeout(fit,2000);
        setTimeout(fit,4000);
      });
    }
    setTimeout(function(){ el.classList.add('cgReady'); },6000);
    setTimeout(function(){
      if(ld.parentNode && !(window.customElements && customElements.get('gecko-coin-price-chart-widget')))
        ld.textContent='Chart tidak dapat dimuat';
    },9000);
  }

  function show(){
    var c=null;
    try{ c=selectedCoin; }catch(_){}
    var ov=$('overlay');
    clearBox(); return;   /* widget CoinGecko dihapus: chart virtual dipakai untuk semua koin */
    var b=ensureBox(); if(!b) return;
    var id=String(c.id||'');
    if(curId===id && b.firstChild) return;
    curId=id;
    setFit(true);
    b.classList.add('on');
    // tunggu layout full halaman terbentuk, lalu ukur sisa tinggi
    requestAnimationFrame(function(){ requestAnimationFrame(function(){
      if(curId!==id) return;
      build(id);
      // teks detail dimuat belakangan -> ruang chart berubah -> sesuaikan tinggi
      if(window.ResizeObserver){
        if(ro) ro.disconnect();
        ro=new ResizeObserver(function(){
          if(curId!==id || !box) return;
          if(Math.abs(box.clientHeight-lastH)<10) return;
          clearTimeout(rebuildT);
          rebuildT=setTimeout(function(){ if(curId===id) build(id); },350);
        });
        ro.observe(b);
      }
    });});
  }

  // tampilkan saat pop up detail koin dibuka
  try{
    var orig=openPopup;
    openPopup=function(){
      var r=orig.apply(this,arguments);
      try{ show(); }catch(_){}
      return r;
    };
  }catch(_){}

  // bersihkan saat pop up ditutup
  var ov=$('overlay');
  if(ov){
    new MutationObserver(function(){
      if(!ov.classList.contains('show')){
        var run=function(){ if(!ov.classList.contains('show')) clearBox(); };
        if(window.requestIdleCallback) requestIdleCallback(run,{timeout:600}); else setTimeout(run,250);
      }
    }).observe(ov,{attributes:true,attributeFilter:['class']});
  }
})();
</script>

<script id="menuFixedSizeJS">
(function(){
  /* ukur tinggi menu saat kategori four.meme / Binance terbuka, lalu kunci sebagai tinggi tetap semua kategori */
  var pm=document.getElementById('pageMenu');
  if(!pm) return;
  function measure(){
    var items=[].slice.call(pm.querySelectorAll('.menuItem'));
    var subs=[].slice.call(pm.querySelectorAll('.subMenu'));
    if(!items.length||items.length!==subs.length) return;
    var prevA=items.map(function(i){return i.classList.contains('active');});
    var prevS=subs.map(function(x){return x.classList.contains('show');});
    pm.style.setProperty('height','auto','important');
    pm.style.setProperty('max-height','none','important');
    var h=0, found=false;
    items.forEach(function(it,idx){
      var t=(it.title||it.textContent||'').toLowerCase().trim();
      if(true){
        found=true;
        items.forEach(function(x,j){ x.classList.toggle('active',j===idx); subs[j].classList.toggle('show',j===idx); });
        h=Math.max(h,pm.offsetHeight);
      }
    });
    items.forEach(function(x,j){ x.classList.toggle('active',prevA[j]); subs[j].classList.toggle('show',prevS[j]); });
    pm.style.removeProperty('height');
    pm.style.removeProperty('max-height');
    if(found&&h>120) pm.style.setProperty('--menuH',Math.ceil(h)+'px');
  }
  function run(){ if(!pm.classList.contains('show')) measure(); }
  if(document.readyState==='complete') setTimeout(run,600);
  else window.addEventListener('load',function(){ setTimeout(run,800); });
  window.addEventListener('resize',function(){ setTimeout(run,200); });
  // ukur ulang bila menu ditutup (mis. setelah rotasi / font termuat)
  new MutationObserver(function(){ if(!pm.classList.contains('show')) setTimeout(run,350); })
    .observe(pm,{attributes:true,attributeFilter:['class']});
})();
</script>
<script id="popupHistoryJS">
/* Pop up detail koin punya entri riwayat sendiri: tombol kembali menutup pop up lalu
   kembali ke bubble / list coin (tidak keluar aplikasi). Berlaku untuk semua cara membuka/menutup. */
(function(){
  var ov=document.getElementById('overlay');
  if(!ov) return;
  var wasOpen=ov.classList.contains('show');
  new MutationObserver(function(){
    var open=ov.classList.contains('show');
    if(open===wasOpen) return;
    wasOpen=open;
    try{
      if(open){
        if(!(history.state && history.state.popup))
          history.pushState({guard:1,popup:1},'',location.href);
      }else if(history.state && history.state.popup){
        // ditutup lewat tombol X / klik luar: buang entri riwayat pop up
        window.__selfBack=(window.__selfBack||0)+1;
        history.back();
      }
    }catch(_){}
  }).observe(ov,{attributes:true,attributeFilter:['class']});
})();
</script>

<script id="snappyJS">

  window.addEventListener('popstate',function(){

})();
