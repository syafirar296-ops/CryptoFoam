/* =====================================================
   POSITIONS
===================================================== */

function random(
  min,
  max
){

  return (
    Math.random()*
    (
      max-min
    )+
    min
  );

}


function createPositions(){

  positions.clear();

  const width =
    innerWidth;

  const height =
    innerHeight;

  const placed =
    [];

  visibleCoins.forEach(
    coin=>{

      const size =
        sizeFromGain(getGain(coin));

      let x=0;
      let y=0;

      let found=false;

      for(
        let attempt=0;
        attempt<350;
        attempt++
      ){

        x =
          random(
            1,
            Math.max(
              2,
              width-size-1
            )
          );

        y =
          random(
            SAFE_TOP,
            Math.max(
              SAFE_TOP+1,
              height-size-1
            )
          );

        let good =
          true;

        for(
          const p of placed
        ){

          const dx =
            (
              x+
              size/2
            )-
            (
              p.x+
              p.size/2
            );

          const dy =
            (
              y+
              size/2
            )-
            (
              p.y+
              p.size/2
            );

          const distance =
            Math.sqrt(
              dx*dx+
              dy*dy
            );

          const minimum =
            (
              size/2+
              p.size/2
            )*.78;

          if(
            distance<
            minimum
          ){

            good=false;

            break;

          }

        }

        if(good){

          found=true;

          break;

        }

      }

      if(!found){

        x =
          random(
            0,
            Math.max(
              1,
              width-size
            )
          );

        y =
          random(
            SAFE_TOP,
            Math.max(
              SAFE_TOP+1,
              height-size
            )
          );

      }

      const p = {

        x:x,
        y:y,

        homeX:x,
        homeY:y,

        vx:0,
        vy:0,

        size:size,

        phaseX:
          Math.random()*
          Math.PI*2,

        phaseY:
          Math.random()*
          Math.PI*2,

        speedX:
          random(
            .00032,
            .00072
          ),

        speedY:
          random(
            .00032,
            .00072
          ),

        amplitudeX:
          random(
            4,
            12
          ),

        amplitudeY:
          random(
            4,
            12
          ),

        rotation:0,

        rotSpeed:
          random(
            .0002,
            .0005
          )

      };

      positions.set(
        coin.id,
        p
      );

      placed.push(
        p
      );

    }
  );

  positions.forEach(
    (
      p,
      id
    )=>
      applyPosition(
        id
      )
  );

}


/* =====================================================
   APPLY POSITION
===================================================== */

function applyPosition(
  id
){

  const p =
    positions.get(
      id
    );

  const node =
    nodes.get(
      id
    );

  if(!p||!node)
    return;

  node.style.setProperty(
    '--x',
    p.x+'px'
  );

  node.style.setProperty(
    '--y',
    p.y+'px'
  );

  node.style.setProperty(
    '--rot',
    p.rotation+'deg'
  );

}


/* =====================================================
   CLAMP
===================================================== */

function clampPosition(
  p
){

  const width =
    innerWidth;

  const height =
    innerHeight;

  p.x =
    Math.max(
      0,
      Math.min(
        width-p.size,
        p.x
      )
    );

  p.y =
    Math.max(
      SAFE_TOP,
      Math.min(
        height-p.size,
        p.y
      )
    );

}


/* =====================================================
   POINTER
===================================================== */

function pointerDown(
  e,
  id
){

  e.preventDefault();

  const node =
    nodes.get(
      id
    );

  const p =
    positions.get(
      id
    );

  if(!node||!p)
    return;

  drag = {

    id:id,

    startX:e.clientX,
    startY:e.clientY,

    originalX:p.x,
    originalY:p.y,

    moved:false

  };

  node.classList.add(
    'dragging'
  );

  try{
    node.setPointerCapture(
      e.pointerId
    );
  }catch(err){}

}


window.addEventListener(
  'pointermove',
  e=>{

    if(!drag)
      return;

    const p =
      positions.get(
        drag.id
      );

    if(!p)
      return;

    const dx =
      e.clientX-
      drag.startX;

    const dy =
      e.clientY-
      drag.startY;

    if(
      Math.abs(dx)>4||
      Math.abs(dy)>4
    ){

      drag.moved=true;

    }

    p.x =
      drag.originalX+
      dx;

    p.y =
      drag.originalY+
      dy;

    clampPosition(
      p
    );

    applyPosition(
      drag.id
    );

  },
  {
    passive:false
  }
);


window.addEventListener(
  'pointerup',
  e=>{

    if(!drag)
      return;

    const id =
      drag.id;

    const node =
      nodes.get(
        id
      );

    const moved =
      drag.moved;

    if(node){

      node.classList.remove(
        'dragging'
      );

    }

    drag =
      null;

    if(!moved){

/* =====================================================
   PHYSICS
===================================================== */

function bounceFromEdges(
  p
){

  const width =
    innerWidth;

  const height =
    innerHeight;

  if(
    p.x<=0
  ){

    p.x=0;

    p.vx=
      Math.abs(
        p.vx
      )*.5;

  }

  if(
    p.x+p.size>=width
  ){

    p.x=
      width-
      p.size;

    p.vx=
      -Math.abs(
        p.vx
      )*.5;

  }

  if(
    p.y<=SAFE_TOP
  ){

    p.y=
      SAFE_TOP;

    p.vy=
      Math.abs(
        p.vy
      )*.5;

  }

  if(
    p.y+p.size>=height
  ){

    p.y=
      height-
      p.size;

    p.vy=
      -Math.abs(
        p.vy
      )*.5;

  }

}


function resolveCollisions(){

  const ids =
    [...positions.keys()];

  for(
    let i=0;
    i<ids.length;
    i++
  ){

    const a =
      positions.get(
        ids[i]
      );

    if(!a)
      continue;

    for(
      let j=i+1;
      j<ids.length;
      j++
    ){

      const b =
        positions.get(
          ids[j]
        );

      if(!b)
        continue;

      const dx =
        (
          b.x+
          b.size/2
        )-
        (
          a.x+
          a.size/2
        );

      const dy =
        (
          b.y+
          b.size/2
        )-
        (
          a.y+
          a.size/2
        );

      const distance =
        Math.sqrt(
          dx*dx+
          dy*dy
        );

      const minimum =
        (
          a.size/2+
          b.size/2
        )*.82;

      if(
        distance<
        minimum &&
        distance>
        .001
      ){

        const nx =
          dx/
          distance;

        const ny =
          dy/
          distance;

        const overlap =
          minimum-
          distance;

        const push =
          overlap*.045;

        a.x-=
          nx*
          push;

        a.y-=
          ny*
          push;

        b.x+=
          nx*
          push;

        b.y+=
          ny*
          push;

        const bounce =
          .008;

        a.vx-=
          nx*
          bounce;

        a.vy-=
          ny*
          bounce;

        b.vx+=
          nx*
          bounce;

        b.vy+=
          ny*
          bounce;

        clampPosition(a);
        clampPosition(b);

      }

    }

  }

}


/* =====================================================
   FLOATING PHYSICS
===================================================== */

let _wOv = null;

function animate(){

  _wOv =
    _wOv ||
    document.getElementById(
      'walletOverlay'
    );

  // menu / wallet menutupi layar: jangan hitung animasi koin (klik jadi ringan)
  if(
    pageMenu.classList.contains('show') ||
    (_wOv && _wOv.classList.contains('show'))
  ){

    requestAnimationFrame(
      animate
    );

    return;

  }

  const now =
    performance.now();

  positions.forEach(
    (
      p,
      id
    )=>{

      const held =
        drag &&
        drag.id===
        id;

      if(!held){

        const fx =
          Math.sin(
            now*
            p.speedX+
            p.phaseX
          )*
          p.amplitudeX;

        const fy =
          Math.cos(
            now*
            p.speedY+
            p.phaseY
          )*
          p.amplitudeY;

        const targetX =
          p.homeX+
          fx;

        const targetY =
          p.homeY+
          fy;

        p.vx+=
          (
            targetX-
            p.x
          )*.012;

        p.vy+=
          (
            targetY-
            p.y
          )*.012;

        p.vx*=.93;
        p.vy*=.93;

        p.x+=
          p.vx;

        p.y+=
          p.vy;

        p.rotation =
          Math.sin(
            now*
            p.rotSpeed+
            p.phaseX
          )*
          2.2;

      }

      bounceFromEdges(
        p
      );

      applyPosition(
        id
      );

    }
  );

  resolveCollisions();

  requestAnimationFrame(
    animate
  );

}

let searchSeq =
  0;

async function searchCoinGecko(
  query
){

  const seq =
    ++searchSeq;

  const q =
    query.trim();

  // null = masih memuat, [] = tidak ada hasil
  const groups = {
    cg:null,
    dx:null,
    gt:null,
    fm:null
  };

  searchResults.classList.add(
    'show'
  );

  const note =
    text=>(
      '<div style="padding:12px;color:#777;'+
      'font-size:11px;text-align:center;">'+
      text+
      '</div>'
    );

  function render(){

    if(seq!==searchSeq)
      return;

    const items =
      [
        ...(groups.cg||[]),
        ...(groups.dx||[]),
        ...(groups.gt||[]),
        ...(groups.fm||[])
      ];

    const loading =
      Object.values(groups).some(
        g=>g===null
      );

    searchResults.innerHTML =
      '';

    if(!items.length){

      searchResults.innerHTML =
        note(
          loading
            ?'Searching CoinGecko, DexScreener, GeckoTerminal, four.meme...'
            :'Coin tidak ditemukan.'
        );

      return;

    }

    items.forEach(
      it=>{

        const d =
          document.createElement(
            'div'
          );

        d.className =
          'searchResult';

        d.innerHTML =
          '<img src="'+
          escapeHtml(it.image||'')+
          '" alt="" onerror="this.style.visibility=\'hidden\'">'+
          '<b>'+
          escapeHtml(it.name||'')+
          '<br><small>'+
          escapeHtml(
            String(it.symbol||'').toUpperCase()
          )+
          ' · '+
          escapeHtml(it.tag||'')+
          '</small></b>'+
          '<span>'+
          (it.priceText||'')+
          '</span>';

        d.addEventListener(
          'click',
          ()=>{

            searchInput.blur();

            searchResults.classList.remove(
              'show'
            );

            searchInput.value='';

            it.open();

          }
        );

        searchResults.appendChild(
          d
        );

      }
    );

    if(loading){

      const l =
        document.createElement('div');

      l.innerHTML =
        note('Memuat sumber lain...');

      searchResults.appendChild(l);

    }

  }

  render();

  // hasil dari DexScreener / GeckoTerminal / four.meme -> buka popup langsung
  const openCoin =
    coin=>()=>{

      coinMap.set(
        coin.id,
        coin
      );

      openPopup(
        coin.id
      );

    };

  const asItem =
    (coin,tag)=>({

      name:coin.name,
      symbol:coin.symbol,
      image:coin.image,
      tag:tag,
      priceText:price(
        coin.current_price
      ),
      open:openCoin(coin)

    });

  const jobs = [];

  // 1. CoinGecko
  jobs.push(
    (async()=>{

      try{

        const response =
          await fetch(
            'https://api.coingecko.com/api/v3/search?query='+
            encodeURIComponent(q),
            {cache:'no-store'}
          );

        if(!response.ok)
          throw new Error(
            'Search HTTP '+response.status
          );

        const data =
          await response.json();

        const hits =
          (data.coins||[]).slice(0,15);

        const marketMap =
          new Map();

        if(hits.length){

          try{

            const marketResponse =
              await fetch(
                'https://api.coingecko.com/api/v3/coins/markets?'+
                'vs_currency=usd&ids='+
                encodeURIComponent(
                  hits.map(c=>c.id).filter(Boolean).join(',')
                )+
                '&order=market_cap_desc&per_page=250&page=1'+
                '&sparkline=false'+
                '&price_change_percentage=1h,24h,7d,30d,1y',
                {cache:'no-store'}
              );

            if(marketResponse.ok){

              (
                await marketResponse.json()
              ).forEach(
                coin=>{

                  marketMap.set(coin.id,coin);

                  coinMap.set(coin.id,coin);

                }
              );

            }

          }catch(err){

            console.warn(
              'Market search error',
              err
            );

          }

        }

        groups.cg =
          hits.map(
            c=>{

              const market =
                marketMap.get(c.id);

              return {

                name:c.name,
                symbol:c.symbol,
                image:
                  market?.image||
                  c.large||
                  c.thumb||
                  '',
                tag:'CoinGecko',
                priceText:
                  market
                    ?price(market.current_price)
                    :'',
                open:()=>openSearchCoin(
                  c.id,
                  market
                )

              };

            }
          );

      }catch(error){

        console.warn(error);

        groups.cg =
          [];

      }

      render();

    })()
  );

  // 2. DexScreener
  jobs.push(
    (async()=>{

      try{

        const d =
          await dxJson(
            '/latest/dex/search?q='+
            encodeURIComponent(q)
          );

        const seen =
          new Set();

        groups.dx =
          ((d&&d.pairs)||[])
            .filter(
              pair=>
                pair &&
                pair.priceUsd &&
                pair.baseToken
            )
            .sort(
              (a,b)=>
                (Number(b.liquidity?.usd)||0)-
                (Number(a.liquidity?.usd)||0)
            )
            .filter(
              pair=>{

                const k =
                  pair.chainId+':'+
                  (pair.baseToken.address||'').toLowerCase();

                if(seen.has(k))
                  return false;

                seen.add(k);

                return true;

              }
            )
            .slice(0,15)
            .map(
              pair=>{

                const coin =
                  dxToCoin(pair,new Map());

                return asItem(
                  coin,
                  'Dex · '+pair.chainId
                );

              }
            );

      }catch(error){

        console.warn(error);

        groups.dx =
          [];

      }

      render();

    })()
  );

  // 3. GeckoTerminal
  jobs.push(
    (async()=>{

      try{

        const list =
          await gtFetchPages(
            '/search/pools',
            1,
            'base_token',
            '&query='+encodeURIComponent(q)
          );

        const seen =
          new Set();

        groups.gt =
          list
            .filter(
              c=>c.current_price>0
            )
            .filter(
              c=>{

                const k =
                  c._network+':'+
                  (c._addr||c.id);

                if(seen.has(k))
                  return false;

                seen.add(k);

                return true;

              }
            )
            .slice(0,12)
            .map(
              c=>asItem(
                c,
                'GeckoTerminal · '+c._network
              )
            );

      }catch(error){

        console.warn(error);

        groups.gt =
          [];

      }

      render();

    })()
  );

  // 4. four.meme (endpoint pencarian; jika gagal -> cari di daftar four.meme)
  jobs.push(
    (async()=>{

      const bnbUsd =
        Number(
          coinMap.get('binancecoin')
            ?.current_price
        )||0;

      let coins =
        [];

      try{

        const response =
          await fetch(
            FM_API+'/public/token/search',
            {
              method:'POST',
              headers:{
                'Content-Type':'application/json',
                Accept:'application/json'
              },
              body:JSON.stringify({
                keyword:q,
                pageIndex:1,
                pageSize:30
              })
            }
          );

        if(response.ok){

          const json =
            await response.json();

          const dd =
            json && json.data;

          const list =
            Array.isArray(dd)
              ?dd
              :(
                dd && (
                  dd.records||
                  dd.list||
                  dd.rows||
                  dd.tokenList||
                  dd.tokens
                )
              )||[];

          coins =
            list
              .map(
                it=>fmToCoin(it,bnbUsd)
              )
              .filter(Boolean);

        }

      }catch(error){

        console.warn(error);

      }

      if(!coins.length){

        try{

          const data =
            await loadLaunchpad();

          const low =
            q.toLowerCase();

          coins =
            data.all.filter(
              c=>
                String(c.name||'').toLowerCase().includes(low) ||
                String(c.symbol||'').toLowerCase().includes(low) ||
                String(c._pool||'').toLowerCase()===low
            );

        }catch(error){

          console.warn(error);

        }

      }

      groups.fm =
        coins
          .slice(0,12)
          .map(
            c=>asItem(
              c,
              'four.meme'
            )
          );

      render();

    })()
  );

  await Promise.all(jobs);

}

/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHtml(
  value
){

  return String(
    value==null
      ?''
      :value
  )
  .replace(
    /&/g,
    '&amp;'
  )
  .replace(
    /</g,
    '&lt;'
  )
  .replace(
    />/g,
    '&gt;'
  )
  .replace(
    /"/g,
    '&quot;'
  )
  .replace(
    /'/g,
    '&#039;'
  );

}

// satu tick harga dari Binance -> koin dengan peringkat tertinggi untuk simbol itu
function handleBinanceTick(data){

  if(!data)
    return;

  const symbol =
    String(data.s)
    .replace(/USDT$/i,'')
    .toLowerCase();

  const coin =
    wsCoinBySym.get(symbol);

  if(!coin)
    return;

  const px =
    Number(data.c);

  if(!(px>0))
    return;

  // tick pertama harus mirip harga koin (cegah simbol kembar / koin lain)
  if(!coin._bnOk){

    const ref =
      Number(coin.current_price)||0;

    if(
      ref>0 &&
      (
        px/ref>3 ||
        px/ref<0.33
      )
    )
      return;

    coin._bnOk =
      true;

  }

  coin.current_price =
    px;

  coin.price_change_percentage_24h =
    Number(data.P);

  const node =
    nodes.get(
      coin.id
    );

  if(node){

    const priceEl =
      node.querySelector(
        '.coinPrice'
      );

    const gainEl =
      node.querySelector(
        '.coinGain'
      );

    if(priceEl)
      priceEl.textContent =
        price(
          coin.current_price
        );

    if(
      gainEl &&
      activeTimeFrame==='1D'
    ){

      const gain =
        Number(
          data.P
        )||0;

      gainEl.textContent =
        percent(
          gain
        );

      gainEl.className =
        'coinGain '+
        (
          gain>=0
            ?'up'
            :'down'
        );

    }

  }

  if(
    selectedCoin &&
    selectedCoin.id===
    coin.id
  )
    updatePopup(
      coin
    );

}

function createBinanceSocket(symbols,gen){

  let ws;

  try{

    ws =
      new WebSocket(
        'wss://stream.binance.com:9443/stream?streams='+
        symbols
          .map(v=>v+'@ticker')
          .join('/')
      );

  }catch(error){

    console.error(
      error
    );

    return;

  }

  wsSockets.push(
    ws
  );

  ws.onmessage =
    event=>{

      if(gen!==wsGen)
        return;

      wsBackoff =
        0;

      try{

        const packet =
          JSON.parse(
            event.data
          );

        handleBinanceTick(
          packet.data
        );

      }catch(error){

        console.warn(
          error
        );

      }

    };

  ws.onclose =
    ()=>{

      // socket lama yang sengaja ditutup tidak memicu sambung ulang
      if(gen!==wsGen)
        return;

      clearTimeout(
        reconnectTimer
      );

      wsBackoff =
        Math.min(
          wsBackoff+1,
          5
        );

      reconnectTimer =
        setTimeout(
          connectBinance,
          Math.min(
            5000*Math.pow(2,wsBackoff-1),
            60000
          )
        );

    };

  ws.onerror =
    ()=>{

      try{
        ws.close();
      }catch(e){}

    };

}

async function connectBinanceOld(){

  const gen =
    ++wsGen;

  clearTimeout(
    reconnectTimer
  );

  // lepas handler socket lama dulu, baru ditutup
  wsSockets.forEach(
    ws=>{

      try{

        ws.onclose =
          null;

        ws.onerror =
          null;

        ws.onmessage =
          null;

        ws.close();

      }catch(e){}

    }
  );

  wsSockets =
    [];

  try{

    // simbol -> koin peringkat tertinggi (urutan allCoins = urutan peringkat)
    const bySym =
      new Map();

    allCoins.forEach(
      coin=>{

        const key =
          String(coin.symbol||'')
            .toLowerCase()
            .replace(/[^a-z0-9]/g,'');

        if(
          key &&
          !bySym.has(key)
        )
          bySym.set(
            key,
            coin
          );

      }
    );

    wsCoinBySym =
      bySym;

    let symbols =
      Array.from(
        bySym.keys()
      ).map(
        k=>k+'usdt'
      );

    if(!binanceSymSet)
      await loadBinanceSymbolSet();

    if(gen!==wsGen)
      return;

    // hanya pasangan yang ada di Binance
    if(binanceSymSet)
      symbols =
        symbols.filter(
          v=>binanceSymSet.has(v)
        );

    if(!symbols.length)
      return;

    // dipecah beberapa koneksi agar URL tidak terlalu panjang
    const CHUNK =
      150;

    for(
      let i=0;
      i<symbols.length;
      i+=CHUNK
    )
      createBinanceSocket(
        symbols.slice(
          i,
          i+CHUNK
        ),
        gen
      );

  }catch(error){

    console.error(
      error
    );

  }

}

// explorer per jaringan untuk koin Terminal / Dex / Launchpad / Alpha
const TERM_EXPLORERS = [
  [/^(eth|ethereum)$/,'https://etherscan.io'],
  [/^(bsc|bnb|binance|bnb chain|bnbchain|smartchain)/,'https://bscscan.com'],
  [/^(solana|sol)$/,'https://solscan.io'],
  [/^base$/,'https://basescan.org'],
  [/^(arbitrum|arbitrum_one|arbitrum-one)$/,'https://arbiscan.io'],
  [/^(polygon|polygon_pos|matic|polygon pos)$/,'https://polygonscan.com'],
  [/^(optimism|optimistic-ethereum)$/,'https://optimistic.etherscan.io'],
  [/^(avax|avalanche)$/,'https://snowtrace.io'],
  [/^(tron|trx)$/,'https://tronscan.org'],
  [/^linea$/,'https://lineascan.build'],
  [/^(ton)$/,'https://tonviewer.com'],
  [/^(sui|sui-network)$/,'https://suiscan.xyz'],
  [/^(cronos)$/,'https://cronoscan.com'],
  [/^(fantom|ftm)$/,'https://ftmscan.com'],
  [/^(blast)$/,'https://blastscan.io'],
  [/^(scroll)$/,'https://scrollscan.com'],
  [/^(zksync|zksync-era)$/,'https://explorer.zksync.io']
];

function termExplorerUrl(c){

  const net =
    String(c._network||'')
      .toLowerCase()
      .trim();

  const hit =
    TERM_EXPLORERS.find(
      ([re])=>re.test(net)
    );

  if(!hit)
    return '';

  const base =
    hit[1];

  // token contract bila ada, kalau tidak pakai alamat pool/pair
  const token =
    c._addr ||
    (
      (
        c._source==='four.meme' ||
        c._source==='Binance Alpha'
      )
        ?c._pool
        :''
    );

  const addr =
    token || c._pool;

  if(!addr)
    return base;

  if(net==='solana' || net==='sol')
    return base+(token?'/token/':'/account/')+addr;

  if(net==='ton')
    return base+'/'+addr;

  if(net==='sui' || net==='sui-network')
    return base+(token?'/coin/':'/object/')+addr;

  if(net==='tron' || net==='trx')
    return base+'/#/'+(token?'token20/':'contract/')+addr;

  return base+(token?'/token/':'/address/')+addr;

}

function termWebsiteUrl(c){

  if(c._website)
    return c._website;

  // tanpa website resmi: buka halaman koin di sumber datanya
  if(c._url)
    return c._url;

  if(c._pool && c._network)
    return 'https://dexscreener.com/'+
      encodeURIComponent(c._network)+'/'+
      encodeURIComponent(c._pool);

  return 'https://dexscreener.com/search?q='+
    encodeURIComponent(c._addr||c.symbol||c.name||'');

}

// harga bursa harus mirip harga koin (cegah salah koin karena simbol kembar)
function tvPriceOk(p,ref){

  if(!(p>0))
    return false;

  if(!(ref>0))
    return true;

  return Math.abs(p/ref-1)<=0.3;

}

async function tvDexUrl(sym,ref){

  const j =
    await tvJson(
      DX_BASE+
      '/latest/dex/search?q='+
      encodeURIComponent(sym),
      5000
    );

  const same =
    (
      (j&&j.pairs)||[]
    ).filter(
      pair=>
        pair &&
        pair.url &&
        pair.baseToken &&
        String(pair.baseToken.symbol||'').toUpperCase()===sym &&
        Number(pair.priceUsd)>0
    );

  const close =
    same.filter(
      pair=>
        !(ref>0) ||
        Math.abs(Number(pair.priceUsd)/ref-1)<=0.5
    );

  const list =
    (close.length?close:same)
      .sort(
        (x,y)=>
          (Number(y.liquidity?.usd)||0)-
          (Number(x.liquidity?.usd)||0)
      );

  return list.length
    ?list[0].url
    :'https://dexscreener.com/search?q='+
     encodeURIComponent(sym);

}

async function tvResolve(coin){

  if(tvCache.has(coin.id))
    return tvCache.get(coin.id);

  const sym =
    String(coin.symbol||'')
      .toUpperCase()
      .replace(/[^A-Z0-9]/g,'');

  const ref =
    Number(coin.current_price)||0;

  let url =
    '';

  if(sym){

    const prices =
      await Promise.all(
        TV_SOURCES.map(
          src=>src.price(sym)
        )
      );

    const hit =
      TV_SOURCES.findIndex(
        (src,i)=>tvPriceOk(prices[i],ref)
      );

    if(hit>=0)
      url =
        'https://www.tradingview.com/chart/?symbol='+
        TV_SOURCES[hit].tv+'%3A'+
        encodeURIComponent(
          TV_SOURCES[hit].pair(sym)
        );

    else
      url =
        await tvDexUrl(sym,ref);

  }else{

    url =
      'https://dexscreener.com/search?q='+
      encodeURIComponent(coin.name||'');

  }

  tvCache.set(coin.id,url);

  return url;

}

let cdQ=Promise.resolve(), cdLast=0;
const cdInflight=new Map();
async function cdFetchCG(id){
  const key='cd:'+id, hit=await idbGet(key);
  if(hit&&Date.now()-hit.t<1800000) return hit.v;
  if(cdInflight.has(id)) return cdInflight.get(id);
  const p=cdQ=cdQ.catch(()=>{}).then(async()=>{
    const w=cdLast+2000-Date.now();
    if(w>0) await new Promise(r=>setTimeout(r,w));
    try{
      const d=await cdFetchCGRaw(id);

      if(hit&&!e.notFound) return hit.v;
      throw e;
    }finally{cdLast=Date.now();}
  });
  cdInflight.set(id,p);
  p.finally(()=>cdInflight.delete(id)).catch(()=>{});
  return p;
}

      for(const t of a){

const LV_CHAIN={eth:'ethereum',polygon_pos:'polygon',avax:'avalanche','sui-network':'sui',bsc:'bsc',solana:'solana'};
let lvBusy=false, lvPause=0;
async function lvJson(path){
  const r=await fetchT(DX_BASE+path,{},9000);
  if(r.status===429){ lvPause=Date.now()+60000; throw new Error('429'); }
  if(!r.ok) throw new Error('HTTP '+r.status);
  return r.json();
}
async function lvPoll(){
  if(lvBusy||document.hidden||Date.now()<lvPause) return;
  const list=liveVisible(x=>x==='DexScreener'||x==='GeckoTerminal'||x==='four.meme');
  if(!list.length) return;
  lvBusy=true;
  try{
    const pools=new Map(), toks=[];   // chain -> [coin]
    list.forEach(c=>{
      if(c._source==='four.meme'){ if(c._pool) toks.push(c); return; }
      const ch=LV_CHAIN[c._network]||c._network;
      if(!ch||!c._pool) return;
      if(!pools.has(ch)) pools.set(ch,[]);
      pools.get(ch).push(c);
    });
    const jobs=[];
    pools.forEach((cs,ch)=>{
      for(let i=0;i<cs.length;i+=30){
        const part=cs.slice(i,i+30), by=new Map(part.map(c=>[String(c._pool).toLowerCase(),c]));
        jobs.push(lvJson('/latest/dex/pairs/'+ch+'/'+part.map(c=>c._pool).join(',')).then(j=>{
          (j.pairs||[]).forEach(p=>{
            const c=by.get(String(p.pairAddress||'').toLowerCase());
            if(c&&p.priceUsd) liveApply(c,p.priceUsd,Number(p.priceChange&&p.priceChange.h24),Number(p.priceChange&&p.priceChange.h1));
          });
        }));
      }
    });
    for(let i=0;i<toks.length;i+=30){
      const part=toks.slice(i,i+30), by=new Map(part.map(c=>[String(c._pool).toLowerCase(),c]));
      jobs.push(lvJson('/tokens/v1/bsc/'+part.map(c=>c._pool).join(',')).then(j=>{
        const best=new Map();
        (Array.isArray(j)?j:(j.pairs||[])).forEach(p=>{
          const k=String(p.baseToken&&p.baseToken.address||'').toLowerCase();
          const o=best.get(k);
          if(by.has(k)&&(!o||(p.liquidity&&p.liquidity.usd||0)>(o.liquidity&&o.liquidity.usd||0))) best.set(k,p);
        });
        best.forEach((p,k)=>{ if(p.priceUsd) liveApply(by.get(k),p.priceUsd,Number(p.priceChange&&p.priceChange.h24),Number(p.priceChange&&p.priceChange.h1)); });
      }));
    }
    await Promise.allSettled(jobs);
  }finally{ lvBusy=false; }
}

/* =====================================================
   CACHE BERTINGKAT untuk Terminal / DEX / four.meme / Alpha
   L1 memori (TTL asli tiap menu) -> L2 IndexedDB (tahan refresh, maks 6 jam)
   -> L3 jaringan. Buka pertama setelah refresh: tampil dari L2 dulu,
   lalu diperbarui di belakang layar. Jaringan gagal/429: pakai L2.
===================================================== */
const TIER_STALE=6*3600*1000, tierWarm={}, tierT={};
function wrapTier(orig,keyOf,getMem,setMem,pick,okHit){
  return async function(...a){
    const key=keyOf(...a);
    const persist=()=>{
      const m=getMem(...a);
      if(m&&m.t&&tierT[key]!==m.t){ tierT[key]=m.t; idbSet('tier:'+key,m); }
    };
    const usable=h=>h&&Date.now()-h.t<TIER_STALE&&(!okHit||okHit(h,...a));
    if(!tierWarm[key]&&!getMem(...a)){
      const h=await idbGet('tier:'+key);
      if(usable(h)){
        tierWarm[key]=1; tierT[key]=h.t; setMem(h,...a);
        orig.apply(this,a).then(persist,()=>{});   // segarkan di belakang layar
        return pick(h);
      }
    }
    tierWarm[key]=1;
    try{
      const r=await orig.apply(this,a);
      persist();
      return r;
    }catch(e){
      const h=await idbGet('tier:'+key);
      if(usable(h)){ setMem(h,...a); return pick(h); }
      throw e;
    }
  };
}

  let e=document.getElementById('logoToast');
  if(!e){
    e=document.createElement('div'); e.id='logoToast';
    e.style.cssText='position:fixed;left:8px;bottom:8px;z-index:99999;background:rgba(17,17,17,.85);color:#c5cacf;font:11px Arial,sans-serif;padding:5px 9px;border-radius:8px;pointer-events:none';

async function logoBlobData(u){
  const r=await fetchT(u,{referrerPolicy:'no-referrer'},9000);
  if(!r.ok) throw new Error('http');
  const b=await r.blob();
  if(b.size<100||(b.type&&b.type.indexOf('image/')!==0)) throw new Error('bukan gambar');
  try{
    const bm=await createImageBitmap(b);
    const c=document.createElement('canvas'); c.width=c.height=64;
    const k=Math.min(64/bm.width,64/bm.height);
    c.getContext('2d').drawImage(bm,(64-bm.width*k)/2,(64-bm.height*k)/2,bm.width*k,bm.height*k);
    let d=c.toDataURL('image/webp',0.85);
    if(d.indexOf('data:image/webp')!==0) d=c.toDataURL('image/png');
    return d;
  }catch(e){
    if(b.size>30000) throw e;   // SVG kecil boleh disimpan apa adanya
    return new Promise((res,rej)=>{ const f=new FileReader(); f.onload=()=>res(f.result); f.onerror=rej; f.readAsDataURL(b); });
  }
}

async function logoPass(){
  if(logoRun||document.hidden||!allCoins.length) return;
  if(allCoins.length<750&&Date.now()-logoT0<120000) return;   // tunggu daftar hampir lengkap
  const list=allCoins.slice().sort((a,b)=>(a.market_cap_rank||9999)-(b.market_cap_rank||9999));
  const todo=list.filter(c=>c&&c.id&&!logoCache.has(c.id)&&!(logoFail.get(c.id)>Date.now()));
  if(!todo.length) return;
  logoRun=true;
  const total=list.length;
  const worker=async()=>{
    while(todo.length){
      const c=todo.shift();
      let d=null;
      for(const u of logoChain(c).filter(x=>x.indexOf('data:')!==0)){
        try{ d=await logoBlobData(u); break; }catch(e){}
      }
      if(d){ logoCache.set(c.id,d); idbSet('logo:'+c.id,{id:c.id,d:d,t:Date.now()}); logoSwap(c,d); }
      else logoFail.set(c.id,Date.now()+600000);   // coba lagi 10 menit kemudian
      logoToast('Menyimpan logo… '+logoCache.size+'/'+total);
    }
  };
  await Promise.all(Array.from({length:6},worker));
  logoRun=false;
  logoToast('Logo tersimpan '+logoCache.size+'/'+total);
  setTimeout(()=>logoToast(''),4000);
}

      '<svg class="wIcon" viewBox="0 0 44 44"><circle cx="22" cy="22" r="22" fill="#ff007a"/><path d="M15 12v13a7 7 0 0 0 14 0V12" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round"/></svg>',

    pancake:
      '<svg class="wIcon" viewBox="0 0 44 44"><circle cx="22" cy="22" r="22" fill="#1fc7d4"/><ellipse cx="22" cy="26" rx="12" ry="9" fill="#d1884f"/><ellipse cx="22" cy="24" rx="12" ry="8" fill="#fef0d0"/><circle cx="18" cy="24" r="1.6" fill="#452a7a"/><circle cx="26" cy="24" r="1.6" fill="#452a7a"/><ellipse cx="14" cy="13" rx="3" ry="6" fill="#d1884f"/><ellipse cx="30" cy="13" rx="3" ry="6" fill="#d1884f"/></svg>',

    jupiter:
      '<svg class="wIcon" viewBox="0 0 44 44"><circle cx="22" cy="22" r="22" fill="#0b1e1a"/><circle cx="22" cy="22" r="12" fill="none" stroke="#c7f284" stroke-width="3"/><path d="M11 19c6 3 16-3 22 1M11 26c6 3 16-3 22 1" fill="none" stroke="#19a89a" stroke-width="2.5"/></svg>',

    raydium:
      '<svg class="wIcon" viewBox="0 0 44 44"><circle cx="22" cy="22" r="22" fill="#12132b"/><path d="M22 9l12 22H10z" fill="none" stroke="#5ac4be" stroke-width="3" stroke-linejoin="round"/><path d="M22 16l6 11H16z" fill="#7b5cff"/></svg>',

    okx:
      '<svg class="wIcon" viewBox="0 0 44 44"><circle cx="22" cy="22" r="22" fill="#000"/><rect x="12" y="12" width="6" height="6" fill="#fff"/><rect x="19" y="19" width="6" height="6" fill="#fff"/><rect x="26" y="12" width="6" height="6" fill="#fff"/><rect x="12" y="26" width="6" height="6" fill="#fff"/><rect x="26" y="26" width="6" height="6" fill="#fff"/></svg>'

  };

  const DOMAINS = {
    phantom:'phantom.com',
    metamask:'metamask.io',
    okx:'okx.com',
    uniswap:'uniswap.org',
    pancake:'pancakeswap.finance',
    jupiter:'jup.ag',
    raydium:'raydium.io',
    trust:'trustwallet.com',
    coinbase:'wallet.coinbase.com',
    solflare:'solflare.com',
    rabby:'rabby.io',
    binance:'binance.com',
    sushi:'sushi.com',
    oneinch:'1inch.io'
  };

  // buka link eksternal (tab baru)
  function openExt(u){

    try{

      const a =
        document.createElement('a');

      a.href = u;
      a.target = '_blank';
      a.rel = 'noopener noreferrer';

      document.body.appendChild(a);

      a.click();

      a.remove();

    }catch(e){

      window.open(u,'_blank');

    }

  }

  // ikon cadangan berupa huruf bila logo gagal dimuat
  function fallbackIcon(w){

    return '<svg class="wIcon" viewBox="0 0 44 44"><rect width="44" height="44" rx="11" fill="#2a2d31"/>'+
      '<text x="22" y="29" font-size="20" font-weight="700" font-family="Arial,sans-serif" text-anchor="middle" fill="#fff">'+
      w.name.charAt(0)+'</text></svg>';

  }

  function pickEvm(test){

    const eth =
      window.ethereum;

    if(!eth)
      return null;

    const list =
      Array.isArray(eth.providers)
        ?eth.providers
        :[eth];

    return list.find(test)||null;

  }

  // type 'connect' = bisa disambung lewat extension; 'link' = buka situs resminya
  const WALLETS = [

    {
      id:'phantom',
      name:'Phantom',
      type:'connect',
      url:'https://phantom.com/download',
      detect:()=>window.phantom?.solana||null,
      connect:async p=>{
        const r = await p.connect();
        return r.publicKey.toString();
      },
      disconnect:p=>p.disconnect&&p.disconnect()
    },

    {
      id:'metamask',
      name:'MetaMask',
      type:'connect',
      url:'https://metamask.io/download/',
      detect:()=>pickEvm(x=>x.isMetaMask&&!x.isBraveWallet&&!x.isOkxWallet),
      connect:async p=>(
        await p.request({method:'eth_requestAccounts'})
      )[0]
    },

    {
      id:'okx',
      name:'OKX Wallet',
      type:'connect',
      url:'https://www.okx.com/web3',
      detect:()=>window.okxwallet||null,
      connect:async p=>(
        await p.request({method:'eth_requestAccounts'})
      )[0]
    },

    {
      id:'uniswap',
      name:'Uniswap',
      type:'link',
      url:'https://wallet.uniswap.org/'
    },

    {
      id:'pancake',
      name:'PancakeSwap',
      type:'link',
      url:'https://pancakeswap.finance/'
    },

    {
      id:'jupiter',
      name:'Jupiter',
      type:'link',
      url:'https://jup.ag/'
    },

    {
      id:'raydium',
      name:'Raydium',
      type:'link',
      url:'https://raydium.io/'
    },

    {
      id:'trust',
      name:'Trust Wallet',
      type:'link',
      url:'https://trustwallet.com/download'
    },

    {
      id:'coinbase',
      name:'Coinbase Wallet',
      type:'link',
      url:'https://www.coinbase.com/wallet'
    },

    {
      id:'solflare',
      name:'Solflare',
      type:'link',
      url:'https://solflare.com/'
    },

    {
      id:'rabby',
      name:'Rabby',
      type:'link',
      url:'https://rabby.io/'
    },

    {
      id:'binance',
      name:'Binance Wallet',
      type:'link',
      url:'https://www.binance.com/en/web3wallet'
    },

    {
      id:'sushi',
      name:'SushiSwap',
      type:'link',
      url:'https://www.sushi.com/swap'
    },

    {
      id:'oneinch',
      name:'1inch',
      type:'link',
      url:'https://app.1inch.io/'
    }

  ];

  const btn =
    document.getElementById('walletButton');

  const overlay =
    document.getElementById('walletOverlay');

  const grid =
    document.getElementById('walletGrid');

  const note =
    document.getElementById('walletNote');

  let connectedId =
    null;

  let connectedAddr =
    '';

  function short(a){

    return a.length>12
      ?a.slice(0,5)+'…'+a.slice(-4)
      :a;

  }

  function render(){

    grid.innerHTML =
      '';

    WALLETS.forEach(
      w=>{

        const found =
          w.type==='connect'
            ?w.detect()
            :null;

        const isOn =
          connectedId===w.id;

        const tile =
          document.createElement('button');

        tile.className =
          'wTile'+(isOn?' connected':'');

        let status =
          '';

        if(isOn)
          status = short(connectedAddr);
        else if(w.type==='link')
          status = 'Open';
        else if(!found)
          status = 'Install';

        tile.innerHTML =
          '<span class="wIconBox"></span>'+
          '<span class="wName">'+w.name+'</span>'+
          '<span class="wStatus">'+status+'</span>'+
          '';

        const box =
          tile.querySelector('.wIconBox');

        const img =
          document.createElement('img');

        img.className =
          'wIcon';

        img.alt =
          w.name;

        img.draggable =
          false;

        img.referrerPolicy =
          'no-referrer';

        img.src =
          'https://www.google.com/s2/favicons?sz=128&domain='+
          DOMAINS[w.id];

        // jika logo gagal dimuat (offline/diblokir) -> pakai ikon cadangan
        img.onerror =
          ()=>{ box.innerHTML = ICONS[w.id]||fallbackIcon(w); };

        box.appendChild(img);

        const ext =
          document.createElement('span');

        ext.className =
          'wExt';

        ext.setAttribute('role','link');

        ext.setAttribute('aria-label','Buka situs '+w.name);

        ext.innerHTML =
          '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M7 17 17 7"/><path d="M8 7h9v9"/></svg>';

        ext.addEventListener(
          'click',
          e=>{
            e.stopPropagation();
            openExt(w.url);
          }
        );

        tile.appendChild(ext);

        tile.addEventListener(
          'click',
          ()=>onTile(w,found)
        );

        grid.appendChild(tile);

      }
    );

    btn.classList.toggle(
      'connected',
      !!connectedId
    );

  }

  async function onTile(w,found){

    note.textContent =
      '';

    if(w.type==='link'){

      openExt(w.url);

      return;

    }

    if(!found){

      openExt(w.url);

      note.textContent =
        w.name+' belum terpasang. Pasang lalu muat ulang halaman.';

      return;

    }

    // klik lagi wallet yang sedang tersambung = putuskan
    if(connectedId===w.id){

      try{
        w.disconnect&&await w.disconnect(found);
      }catch(e){}

      connectedId =
        null;

      connectedAddr =
        '';

      render();

      return;

    }

    try{

      note.textContent =
        'Menunggu persetujuan di '+w.name+'…';

      const addr =
        await w.connect(found);

      connectedId =
        w.id;

      connectedAddr =
        addr||'';

      note.textContent =
        '';

      render();

    }catch(e){

      note.textContent =
        'Koneksi dibatalkan atau gagal.';

    }

  }

  function sig(){

    return WALLETS.map(
      w=>(
        w.type==='connect' &&
        w.detect()
          ?1
          :0
      )
    ).join('')+'|'+connectedId;

  }

  let lastSig =
    '';

  function open(){

    note.textContent =
      '';

    // tampilkan dulu, gambar ulang hanya bila status wallet berubah
    overlay.classList.add('show');

    overlay._openAt =
      performance.now();

    if(sig()!==lastSig){

      render();

      lastSig =
        sig();

    }

  }

  function close(){

    overlay.classList.remove('show');

  }

  btn.addEventListener(
    'pointerdown',
    e=>{

      e.preventDefault();

      btn._t =
        performance.now();

      open();

    }
  );

  btn.addEventListener(
    'click',
    ()=>{

      if(
        performance.now()-
        (btn._t||0)<800
      )
        return;

      open();

    }
  );

  // siapkan isi wallet di awal supaya saat diklik langsung muncul
  render();

  lastSig =
    sig();

  document
    .getElementById('walletClose')
    .addEventListener('click',close);

  overlay.addEventListener(
    'click',
    e=>{

      // tutup saat layar diklik (di luar tombol wallet), bukan saat memilih wallet
      if(
        e.target.closest('.wTile,.wClose')
      )
        return;

      if(performance.now()-(overlay._openAt||0)<350)
        return;

      close();

    }
  );

  document.addEventListener(
    'keydown',
    e=>{

      if(e.key==='Escape')
        close();

    }
  );

})();


// cadangan outline hijau/merah untuk browser lama tanpa :has()
(function(){
  try{
    if(CSS.supports('selector(:has(*))')) return;
    const sync=()=>{
      document.querySelectorAll('.coinCard').forEach(c=>{
        const g=c.querySelector('.coinGain');
        if(!g) return;
        const up=g.classList.contains('up');
        c.classList.toggle('gUp',up);
        c.classList.toggle('gDown',!up);
      });
    };
    new MutationObserver(sync).observe(document.body,{subtree:true,childList:true,attributes:true,attributeFilter:['class']});
    sync();
  }catch(e){}
})();

// Cloudflare Worker: proxy + cache 60 detik. Secret opsional: CG_KEY (API key demo CoinGecko)
const ALLOW=['api.coingecko.com','pro-api.coinmarketcap.com','api.dexscreener.com','api.geckoterminal.com','www.binance.com'];
export default{
  async fetch(req,env,ctx){
    const h={'access-control-allow-origin':'*'};
    if(req.method==='OPTIONS') return new Response(null,{headers:{...h,'access-control-allow-methods':'GET','access-control-allow-headers':'*'}});
    let u;
    try{u=new URL(new URL(req.url).searchParams.get('u'));}catch(e){return new Response('bad url',{status:400,headers:h});}
    if(!ALLOW.includes(u.hostname)) return new Response('forbidden',{status:403,headers:h});
    if(u.hostname==='api.coingecko.com'&&env.CG_KEY) u.searchParams.set('x_cg_demo_api_key',env.CG_KEY);
    const key=new Request(u.toString()),cache=caches.default;
    let r=await cache.match(key);
    if(!r){
      const o=await fetch(u,{headers:{accept:'application/json'}});
      r=new Response(o.body,o);
      r.headers.set('cache-control','public, max-age=60');
      if(o.ok) ctx.waitUntil(cache.put(key,r.clone()));
    }
    r=new Response(r.body,r);
    for(const k in h) r.headers.set(k,h[k]);
    return r;
  }
};
