/* =====================================================
   DETAIL KOIN: cache HP -> CoinGecko -> CoinMarketCap
   (deskripsi, kategori, website, explorer, smart contract)
===================================================== */

const CD_PREFIX =
  'cd_v1_';

const CD_TTL =
  7*24*3600*1000;

const cdMem =
  new Map();

const cdInflight =
  new Map();

function cdLoad(id){

  try{

    const j =
      JSON.parse(
        localStorage.getItem(
          CD_PREFIX+id
        )||'null'
      );

    return (
      j && j.t
        ?j
        :null
    );

  }catch(e){

    return null;

  }

}

function cdSave(id,data){

  try{

    localStorage.setItem(
      CD_PREFIX+id,
      JSON.stringify(data)
    );

  }catch(e){

    // penyimpanan penuh -> hapus cache detail lama lalu coba lagi
    try{

      Object.keys(
        localStorage
      )
      .filter(
        k=>k.startsWith(CD_PREFIX)
      )
      .forEach(
        k=>localStorage.removeItem(k)
      );

      localStorage.setItem(
        CD_PREFIX+id,
        JSON.stringify(data)
      );

    }catch(e2){}

  }

}

function cdClean(raw){

  return String(raw||'')
    .replace(/<[^>]*>/g,' ')
    .replace(/\s+/g,' ')
    .trim();

}

async function cdFetchCGRaw(id){

  let url =
    'https://api.coingecko.com/api/v3/coins/'+
    encodeURIComponent(id)+
    '?localization=false&tickers=false&market_data=false&community_data=false&developer_data=false&sparkline=false';

  if(CG_DEMO_KEY)
    url +=
      '&x_cg_demo_api_key='+
      encodeURIComponent(CG_DEMO_KEY);

  let lastError =
    null;

  for(let i=0;i<2;i++){

    try{

      const response =
        await fetchT(
          CG_ROUTES[i](url),
          {},
          i===0 ? 8000 : 12000
        );

      // id tidak dikenal CoinGecko (mis. koin dari CMC/Binance) -> langsung cadangan
      if(response.status===404){

        const err =
          new Error('CoinGecko 404');

        err.notFound =
          true;

        throw err;

      }

      if(!response.ok)
        throw new Error(
          'Coin detail HTTP '+
          response.status
        );

      const d =
        await response.json();

      if(!d || !d.id)
        throw new Error(
          'Detail CoinGecko kosong'
        );

      return d;

    }catch(e){

      lastError =
        e;

      if(e.notFound)
        break;

    }

  }

  throw lastError;

}

function cdFromCG(d){

  const links =
    d.links || {};

  const platforms =
    {};

  Object.entries(
    d.platforms || {}
  ).forEach(
    ([k,v])=>{

      if(
        k &&
        v &&
        String(v).trim() &&
        Object.keys(platforms).length<12
      )
        platforms[k] =
          String(v).trim();

    }
  );

  return {
    src:'cg',
    t:Date.now(),
    name:d.name,
    description:{
      en:cdClean(
        d.description &&
        d.description.en
      ).slice(0,900)
    },
    market_cap_rank:d.market_cap_rank || null,
    categories:(d.categories||[]).filter(Boolean).slice(0,4),
    genesis_date:d.genesis_date || '',
    platforms:platforms,
    links:{
      homepage:(links.homepage||[]).filter(Boolean).slice(0,3),
      blockchain_site:(links.blockchain_site||[]).filter(Boolean).slice(0,6)
    }
  };

}

async function cdFetchCMC(coin){

  const sym =
    String(coin.symbol||'')
      .toUpperCase();

  const query =
    coin._cmcId
      ?'id='+coin._cmcId
      :'symbol='+encodeURIComponent(sym);

  const url =
    CMC_BASE+
    '/v2/cryptocurrency/info?'+
    query;

  let lastError =
    null;

  for(let i=0;i<CG_ROUTES.length;i++){

    try{

      const response =
        await fetchT(
          CG_ROUTES[i](url),
          {},
          i===0 ? 10000 : 15000
        );

      if(!response.ok)
        throw new Error(
          'CMC info HTTP '+
          response.status
        );

      const json =
        await response.json();

      const map =
        json && json.data;

      if(!map)
        throw new Error(
          'CMC info kosong'
        );

      let v =
        coin._cmcId
          ?map[String(coin._cmcId)]
          :(
            map[sym] ||
            map[Object.keys(map)[0]]
          );

      // simbol bisa dipakai banyak koin -> pilih yang namanya sama
      if(Array.isArray(v)){

        const nm =
          x=>String(x||'')
            .toLowerCase()
            .replace(/[^a-z0-9]/g,'');

        v =
          v.find(
            x=>nm(x.name)===nm(coin.name)
          ) ||
          (
            v.length===1
              ?v[0]
              :null
          );

      }

      if(!v)
        throw new Error(
          'Koin tidak ada di CMC info'
        );

      return v;

    }catch(e){

      lastError =
        e;

    }

  }

  throw lastError;

}

function cdFromCMC(v){

  const urls =
    v.urls || {};

  const platforms =
    {};

  (v.contract_address||[]).forEach(
    x=>{

      const address =
        x && x.contract_address;

      const network =
        x &&
        x.platform &&
        x.platform.name;

      if(
        address &&
        network &&
        Object.keys(platforms).length<12
      )
        platforms[
          String(network).toLowerCase()
        ] =
          String(address);

    }
  );

  if(
    !Object.keys(platforms).length &&
    v.platform &&
    v.platform.token_address
  ){

    const network =
      v.platform.name ||
      v.platform.slug;

    if(network)
      platforms[
        String(network).toLowerCase()
      ] =
        String(v.platform.token_address);

  }

  return {
    src:'cmc',
    t:Date.now(),
    name:v.name,
    description:{
      en:cdClean(
        v.description
      ).slice(0,900)
    },
    market_cap_rank:null,
    categories:(v.tags||[])
      .map(
        t=>typeof t==='string'
          ?t
          :((t && t.name)||'')
      )
      .filter(Boolean)
      .slice(0,4),
    genesis_date:String(
      v.date_launched ||
      v.date_added ||
      ''
    ).slice(0,10),
    platforms:platforms,
    links:{
      homepage:(urls.website||[]).filter(Boolean).slice(0,3),
      blockchain_site:(urls.explorer||[]).filter(Boolean).slice(0,6)
    }
  };

}

function getCoinDetail(coin){

  const id =
    coin.id;

  if(cdMem.has(id))
    return Promise.resolve(
      cdMem.get(id)
    );

  if(cdInflight.has(id))
    return cdInflight.get(id);

  const job =
    (async()=>{

      const cached =
        cdLoad(id);

      // cache masih segar -> tanpa panggilan jaringan
      if(
        cached &&
        Date.now()-cached.t<CD_TTL
      ){

        cdMem.set(id,cached);

        return cached;

      }

      let data =
        null;

      try{

        data =
          cdFromCG(
            await cdFetchCG(id)
          );

      }catch(e){

        console.warn(
          'Detail CoinGecko gagal',
          e
        );

      }

      if(!data){

        try{

          data =
            cdFromCMC(
              await cdFetchCMC(coin)
            );

        }catch(e){

          console.warn(
            'Detail CoinMarketCap gagal',
            e
          );

        }

      }

      if(data){

        cdMem.set(id,data);

        cdSave(id,data);

        return data;

      }

      // semua sumber gagal -> data lama (kedaluwarsa) lebih baik daripada kosong
      if(cached){

        cdMem.set(id,cached);

        return cached;

      }

      throw new Error(
        'Detail koin tidak tersedia'
      );

    })();

  cdInflight.set(id,job);

  const done =
    ()=>cdInflight.delete(id);

  job.then(done,done);

  return job;

}

/* ---- Block Explorer: dari contract / jaringan koin ---- */

// koin native -> explorer chain-nya
const CD_NATIVE_EXPLORERS = {
  btc:'https://mempool.space',
  eth:'https://etherscan.io',
  bnb:'https://bscscan.com',
  sol:'https://solscan.io',
  trx:'https://tronscan.org',
  xrp:'https://xrpscan.com',
  doge:'https://blockchair.com/dogecoin',
  ltc:'https://blockchair.com/litecoin',
  ada:'https://cardanoscan.io',
  dot:'https://polkadot.subscan.io',
  avax:'https://snowtrace.io',
  ton:'https://tonviewer.com',
  xlm:'https://stellarchain.io',
  bch:'https://blockchair.com/bitcoin-cash',
  near:'https://nearblocks.io',
  atom:'https://www.mintscan.io/cosmos',
  sui:'https://suiscan.xyz',
  apt:'https://aptoscan.com',
  hbar:'https://hashscan.io',
  algo:'https://allo.info'
};

// token -> explorer jaringannya (urutan = prioritas jika ada di banyak jaringan)
const CD_TOKEN_EXPLORERS = [
  [/^ethereum$|^eth$|erc20/,'https://etherscan.io/token/'],
  [/binance|bnb|bep20|^bsc$/,'https://bscscan.com/token/'],
  [/^solana$|^sol$/,'https://solscan.io/token/'],
  [/^base$/,'https://basescan.org/token/'],
  [/arbitrum/,'https://arbiscan.io/token/'],
  [/polygon|matic/,'https://polygonscan.com/token/'],
  [/optimis/,'https://optimistic.etherscan.io/token/'],
  [/avalanche|avax/,'https://snowtrace.io/token/'],
  [/^tron$|trc20/,'https://tronscan.org/#/token20/'],
  [/^linea$/,'https://lineascan.build/token/']
];

function cdExplorerUrl(data,coin){

  const sym =
    String(coin.symbol||'')
      .toLowerCase();

  // koin native hanya jika id-nya memang koin aslinya (bukan token bersimbol sama)
  if(
    BN_KNOWN_IDS[sym]===coin.id &&
    CD_NATIVE_EXPLORERS[sym]
  )
    return CD_NATIVE_EXPLORERS[sym];

  const entries =
    Object.entries(
      (data && data.platforms) || {}
    ).filter(
      ([k,a])=>k && a && String(a).trim()
    );

  for(const [re,base] of CD_TOKEN_EXPLORERS){

    const hit =
      entries.find(
        ([k])=>re.test(
          String(k).toLowerCase()
        )
      );

    if(hit)
      return base+
        encodeURIComponent(
          String(hit[1]).trim()
        );

  }

  // jaringan tidak dikenal -> link explorer dari sumber data
  return (
    (
      data &&
      data.links &&
      data.links.blockchain_site
    ) || []
  ).find(Boolean) || '';

}

.coinBurst{

  position:absolute;

  position:absolute;

  height:6px;
  margin:-3px 0 0 -3px;
  border-radius:50%;

}

@keyframes burstRing{
  from{
    width:0;
    height:0;
    opacity:1;
  }
  to{
    width:var(--r);
    height:var(--r);
    opacity:0;
  }
}

@keyframes burstDot{
  from{
    transform:translate(0,0) scale(1);
    opacity:1;
  }
  to{
    transform:translate(var(--dx),var(--dy)) scale(.2);
    opacity:0;
  }
}

  '1H':'price_change_percentage_1h_in_currency',

  '1M':'price_change_percentage_30d_in_currency',
  '1Y':'price_change_percentage_1y_in_currency'
};

function getGain(coin){

  return Number(
    coin[
      TF_FIELDS[activeTimeFrame]
    ]
  )||0;

}

/* Ukuran bubble berdasarkan PERINGKAT persentase (percentile)
   di antara koin yang sedang tampil (semua filter & interval), jadi sebaran ukuran
   selalu sama rata di 1h / 1d / 1w / 1m / 1y. */

let sizeRank = [];

function rebuildSizeRank(){

  sizeRank =
    visibleCoins
      .map(
        c=>Math.abs(getGain(c))
      )
      .sort((a,b)=>a-b);

}

function sizeFromGain(gain){

  const g =
    Math.abs(
      Number(gain)||0
    );

  let normalized = 0;

  const n =
    sizeRank.length;

  if(n===1)
    return (MIN_SIZE+MAX_SIZE)/2;

  if(n>1){

    // binary search: jumlah koin dengan |gain| < g
    let lo = 0;
    let hi = n;

    while(lo<hi){

      const mid =
        (lo+hi)>>1;

      if(sizeRank[mid]<g)
        lo = mid+1;
      else
        hi = mid;

    }

    normalized =
      lo/(n-1);

  }

  // kurva: kebanyakan koin kecil, hanya sedikit yang besar
  normalized =
    Math.pow(
      Math.min(1,normalized),
      1.8
    );

  return (
    MIN_SIZE+
    (
      MAX_SIZE-
      MIN_SIZE
    )*
    normalized
  );

}


/* =====================================================
   GECKOTERMINAL (menu Terminal)
===================================================== */

const GT_BASE =
  'https://api.geckoterminal.com/api/v2';

let terminalMode =
  null;               // null | 'Trending' | 'Gainer' | 'Looser' | 'NewPool'

let srcReq =
  0;                  // penanda request terbaru (cegah hasil lama menimpa)

let gtInflight =
  {};

let terminalCache =
  {};                 // { trending:{t,coins}, new:{t,coins} }

const GT_TTL =
  180000;             // 3 menit (hemat limit API)


function gtSleep(ms){

  return new Promise(
    r=>setTimeout(r,ms)
  );

}


async function gtFetchPages(
  path,
  pages,
  include,
  extra
){

  const out = [];

  for(
    let page=1;
    page<=pages;
    page++
  ){

    // GeckoTerminal gratis dibatasi ±30 request/menit:
    // jeda antar halaman + ulangi otomatis saat kena limit (429)
    let response =
      null;

    for(
      let attempt=0;
      attempt<4;
      attempt++
    ){

      try{

        response =
          await fetch(
            GT_BASE+path+
            '?include='+(include||'base_token')+
            '&page='+page+
            (extra||''),
            {
              headers:{
                accept:
                  'application/json;version=20230302'
              }
            }
          );

      }catch(e){

        response =
          null;

      }

      if(
        response &&
        response.ok
      )
        break;

      // error selain limit/server -> tidak perlu diulang
      if(
        response &&
        response.status!==429 &&
        response.status<500
      )
        break;

      await gtSleep(
        1500*(attempt+1)
      );

    }

    if(
      !response ||
      !response.ok
    ){

      // sebagian data sudah didapat -> pakai yang ada
      if(out.length)
        break;

      throw new Error(
        'GeckoTerminal HTTP '+
        (response?response.status:'network')
      );

    }

    if(page<pages)
      await gtSleep(350);

    const json =
      await response.json();

    if(!(json.data||[]).length)
      break;

    const tokens =
      new Map(
        (json.included||[])
          .map(
            t=>[t.id,t.attributes||{}]
          )
      );

    (json.data||[]).forEach(
      pool=>{

        const a =
          pool.attributes||{};

        const tokenId =
          pool.relationships
            ?.base_token
            ?.data
            ?.id;

        const token =
          tokens.get(tokenId)||{};

        const pc =
          a.price_change_percentage||{};

        const h1 =
          Number(pc.h1)||0;

        const h24 =
          Number(pc.h24)||0;

        const network =
          (
            pool.relationships
              ?.network
              ?.data
              ?.id
          )||
          (
            pool.id||''
          ).split('_')[0];

        out.push({

          id:
            'gt_'+pool.id,

          _terminal:
            true,

          _source:
            'GeckoTerminal',

          _dex:
            (
              pool.relationships
                ?.dex
                ?.data
                ?.id
            )||'',

          _addr:
            (
              token.address||''
            ).toLowerCase(),

          _network:
            network,

          _pool:
            a.address,

          _created:
            a.pool_created_at,

          name:
            token.name||
            (a.name||'').split(' / ')[0],

          symbol:
            token.symbol||
            (a.name||'').split(' / ')[0],

          image:
            (
              token.image_url&&
              token.image_url!=='missing.png'
            )
              ?token.image_url
              :'',

          current_price:
            Number(
              a.base_token_price_usd
            ),

          market_cap:
            Number(
              a.market_cap_usd
            )||
            Number(
              a.fdv_usd
            ),

          total_volume:
            Number(
              a.volume_usd?.h24
            ),

          price_change_percentage_24h:
            h24,

          price_change_percentage_1h_in_currency:
            h1,

          // GeckoTerminal hanya punya 5m/1h/6h/24h
          price_change_percentage_7d_in_currency:
            h24,

          price_change_percentage_30d_in_currency:
            h24,

          price_change_percentage_1y_in_currency:
            h24

        });

      }
    );

  }

  return out;

}


async function loadTerminal(
  kind,
  pages=5
){

  const now =
    Date.now();

  const key =
    kind==='NewPool'
      ?'new'
      :'trending';

  pages =
    Math.min(10,Math.max(1,pages));

  const cached =
    terminalCache[key];

  if(
    cached &&
    cached.pages>=pages &&
    now-cached.t<GT_TTL
  )
    return cached.coins;

  // request yang sama sedang berjalan -> tunggu, jangan kirim ulang
  const inflightKey =
    key+':'+pages;

  if(gtInflight[inflightKey])
    return gtInflight[inflightKey];

  gtInflight[inflightKey] =
    (async()=>{

      try{

        const coins =
          await gtFetchPages(
            key==='new'
              ?'/networks/new_pools'
              :'/networks/trending_pools',
            pages
          );

        terminalCache[key] =
          {
            t:Date.now(),
            pages,
            coins
          };

        return coins;

      }catch(e){

        // gagal -> pakai data lama (walau kadaluarsa) daripada kosong
        if(cached && cached.coins.length){

          console.warn(e);

          return cached.coins;

        }

        throw e;

      }finally{

        delete gtInflight[inflightKey];

      }

    })();

  return gtInflight[inflightKey];

}


async function showTerminal(

  page=0

  nodes.clear();
  positions.clear();

  try{

    let list;

    if(
      kind==='All' ||
      kind==='Gainer' ||
      kind==='Looser'
    ){

      // gabung trending + pool baru lalu urutkan
      // berurutan (bukan paralel) agar tidak kena limit API
      const need =
        Math.min(10,(page+1)*3);

      const a =
        await loadTerminal('Trending',need);

      const b =
        await loadTerminal('NewPool',need);

      const unique =
        new Map();

      [...a,...b].forEach(
        c=>unique.set(c.id,c)
      );

      list =
        [...unique.values()]
          .filter(
            c=>c.current_price>0
          );

      if(kind!=='All')
        list.sort(
          (x,y)=>
            kind==='Gainer'
              ?getGain(y)-getGain(x)
              :getGain(x)-getGain(y)
        );

    }else{

      list =
        (
          await loadTerminal(
            kind,
            Math.min(10,(page+1)*5)
          )
        ).filter(
          c=>c.current_price>0
        );

    }

    // jika user pindah menu saat loading, abaikan hasil lama
    if(terminalMode!==kind || req!==srcReq)
      return;

    list.forEach(
      c=>coinMap.set(c.id,c)
    );

    visibleCoins =
      list.slice(
        page*COINS_PER_PAGE,
        (page+1)*COINS_PER_PAGE
      );

    if(!visibleCoins.length){

      cloud.innerHTML =
        '<div style="position:absolute;inset:0;'+
        'display:flex;align-items:center;'+
        'justify-content:center;color:#777;'+
        'font-size:11px;text-align:center;'+
        'padding:20px;">Tidak ada data di halaman ini.</div>';

      return;

    }

    createCoinNodes();

  }catch(error){

    console.error(error);

    if(terminalMode!==kind || req!==srcReq)
      return;

    cloud.innerHTML =
      '<div style="position:absolute;inset:0;'+
      'display:flex;align-items:center;'+
      'justify-content:center;color:#777;'+
      'font-size:11px;text-align:center;'+
      'padding:20px;">Gagal mengambil data '+
      'GeckoTerminal.<br>Coba lagi sebentar.<br><br>'+
      '<button id=\"gtRetry\" style=\"padding:8px 16px;'+
      'border:0;border-radius:14px;background:#303030;'+
      'color:#fff;font-size:11px;font-weight:800;'+
      'cursor:pointer;\">Coba lagi</button>'+
      '</div>';

    const rb =
      document.getElementById('gtRetry');

    if(rb)
      rb.onclick =
        ()=>showTerminal(kind,page);

  }

}

    price_change_percentage_7d_in_currency:

}

async function loadDex(){

  const now =
    Date.now();

  if(
    dexCache &&
    now-dexCache.t<120000
  )
    return dexCache;

  const safe =
    p=>dxJson(p).then(
      d=>Array.isArray(d)?d:[]
    ).catch(
      ()=>[]
    );

  const [top,latest,profiles,takeovers,ads] =
    await Promise.all([
      safe('/token-boosts/top/v1'),
      safe('/token-boosts/latest/v1'),
      safe('/token-profiles/latest/v1'),
      safe('/community-takeovers/latest/v1'),
      safe('/ads/latest/v1')
    ]);

  // pencarian luas -> tiap query memberi sampai ±30 pair aktif
  const DX_QUERIES = [
    'solana','ethereum','bsc','base','arbitrum','polygon',
    'avalanche','sui','ton','tron','optimism','pulsechain',
    'SOL','WETH','WBNB','USDC','USDT',
    'pump','meme','ai','dog','cat','pepe','trump',
    'agent','game','bonk','moon','baby','elon'
  ];

  const searchJobs =
    DX_QUERIES.map(
      q=>dxJson(
        '/latest/dex/search?q='+
        encodeURIComponent(q)
      ).then(
        d=>(d&&d.pairs)||[]
      ).catch(
        ()=>[]
      )
    );

  const key =
    t=>(
      t.chainId+':'+
      (t.tokenAddress||'').toLowerCase()
    );

  const icons =
    new Map();

  const byChain =
    new Map();

  [...top,...latest,...profiles,...takeovers,...ads].forEach(
    t=>{

      if(!t.chainId||!t.tokenAddress)
        return;

      if(t.icon)
        icons.set(
          key(t),
          t.icon
        );

      if(!byChain.has(t.chainId))
        byChain.set(
          t.chainId,
          new Set()
        );

      byChain
        .get(t.chainId)
        .add(t.tokenAddress);

    }
  );

  // ambil data pair per chain, maksimal 30 token per request
  const jobs = [];

  byChain.forEach(
    (set,chain)=>{

      const list =
        [...set];

      for(
        let i=0;
        i<list.length;
        i+=30
      ){

        jobs.push(
          dxJson(
            '/tokens/v1/'+chain+'/'+
            list
              .slice(i,i+30)
              .join(',')
          ).catch(
            ()=>[]
          )
        );

      }

    }
  );

  const searchPairs =
    (
      await Promise.all(searchJobs)
    ).flat().filter(
      pair=>
        pair &&
        (
          Number(pair.liquidity?.usd)||0
        )>=2000 &&
        (
          Number(pair.volume?.h24)||0
        )>0
    );

  const pairs =
    [
      ...(
        await Promise.all(jobs)
      ).flat(),
      ...searchPairs
    ];

  // pilih pair dengan likuiditas terbesar untuk tiap token
  const best =
    new Map();

  pairs.forEach(
    pair=>{

      if(
        !pair ||
        !pair.priceUsd ||
        !pair.baseToken
      )
        return;

      const k =
        pair.chainId+':'+
        (
          pair.baseToken.address||''
        ).toLowerCase();

      const liq =
        Number(pair.liquidity?.usd)||0;

      const old =
        best.get(k);

      if(
        !old ||
        liq>(
          Number(
            old.liquidity?.usd
          )||0
        )
      )
        best.set(k,pair);

    }
  );

  const coinOf =
    t=>{

      const pair =
        best.get(key(t));

      return pair
        ?dxToCoin(pair,icons)
        :null;

    };

  const uniq =
    arr=>{

      const seen =
        new Set();

      return arr.filter(
        c=>{

          if(!c||seen.has(c.id))
            return false;

          seen.add(c.id);

          return true;

        }
      );

    };

  const topCoins =
    uniq(top.map(coinOf));

  const freshCoins =
    uniq(
      [...latest,...profiles]
        .map(coinOf)
    ).sort(
      (a,b)=>b._created-a._created
    );

  // semua token unik dari seluruh sumber (boost + profil + pencarian)
  const extraCoins =
    uniq(
      [...best.values()].map(
        pair=>dxToCoin(pair,icons)
      )
    );

  const allCoins =
    uniq(
      [...topCoins,...freshCoins,...extraCoins]
    );

  // Trending = token boost dulu, lalu sisanya menurut volume 24 jam
  const trendCoins =
    uniq(
      [
        ...topCoins,
        ...[...allCoins].sort(
          (a,b)=>
            (b.total_volume||0)-
            (a.total_volume||0)
        )
      ]
    );

  // New Pair = semua pair diurutkan dari yang paling baru dibuat
  const newCoins =
    [...allCoins]
      .filter(c=>c._created)
      .sort(
        (a,b)=>b._created-a._created
      );

  dexCache = {
    t:now,
    top:trendCoins,
    fresh:newCoins,
    all:allCoins
  };

  return dexCache;

}

// data Dex untuk satu chain: data umum + pencarian khusus chain tsb
async function loadDexChain(chain){

  const now =
    Date.now();

  const cached =
    dexChainCache[chain];

  if(
    cached &&
    now-cached.t<120000
  )
    return cached.data;

  const base =
    await loadDex();

  const terms =
    [
      chain,
      DX_CHAIN_NATIVE[chain]||chain,
      'W'+(DX_CHAIN_NATIVE[chain]||chain),
      'USDC','USDT',
      'meme','ai','dog','cat','pepe','trump','agent'
    ];

  const found =
    (
      await Promise.all(
        terms.map(
          q=>dxJson(
            '/latest/dex/search?q='+
            encodeURIComponent(q)
          ).then(
            d=>(d&&d.pairs)||[]
          ).catch(
            ()=>[]
          )
        )
      )
    ).flat().filter(
      pair=>
        pair &&
        pair.chainId===chain &&
        pair.priceUsd &&
        pair.baseToken &&
        (Number(pair.liquidity?.usd)||0)>=2000 &&
        (Number(pair.volume?.h24)||0)>0
    );

  const best =
    new Map();

  found.forEach(
    pair=>{

      const k =
        (pair.baseToken.address||'').toLowerCase();

      const old =
        best.get(k);

      if(
        !old ||
        (Number(pair.liquidity?.usd)||0)>
        (Number(old.liquidity?.usd)||0)
      )
        best.set(k,pair);

    }
  );

  const uniq =
    arr=>{

      const seen =
        new Set();

      return arr.filter(
        c=>{

          if(!c||seen.has(c.id))
            return false;

          seen.add(c.id);

          return true;

        }
      );

    };

  const icons =
    new Map();

  const all =
    uniq(
      [
        ...base.all.filter(
          c=>c._network===chain
        ),
        ...[...best.values()].map(
          pair=>dxToCoin(pair,icons)
        )
      ]
    );

  const data = {
    all,
    top:uniq(
      [
        ...base.top.filter(
          c=>c._network===chain
        ),
        ...[...all].sort(
          (a,b)=>
            (b.total_volume||0)-
            (a.total_volume||0)
        )
      ]
    ),
    fresh:[...all]
      .filter(c=>c._created)
      .sort(
        (a,b)=>b._created-a._created
      )
  };

  dexChainCache[chain] =
    {
      t:now,
      data
    };

  return data;

}

const FM_API =
  'https://four.meme/meme-api/v1';

// jika ternyata nilai "increase" dari four.meme sudah berupa persen
// (bukan rasio 0.12 = 12%), ubah menjadi false.
const FM_INCREASE_IS_RATIO =
  true;

let launchMode =
  null;               // null | 'Trending' | 'Gainer' | 'Looser' | 'NewLaunch'

let launchCache =
  null;               // { t, hot, fresh, all }

let fmLogged =
  false;


async function fmRanking(type,size){

  const response =
    await fetch(
      FM_API+'/public/token/ranking',
      {
        method:'POST',
        headers:{
          'Content-Type':'application/json',
          Accept:'application/json'
        },
        body:JSON.stringify({
          type:type,
          pageSize:size
        })
      }
    );

  if(!response.ok)
    throw new Error(
      'four.meme HTTP '+
      response.status
    );

  const json =
    await response.json();

  const d =
    json && json.data;

  const list =
    Array.isArray(d)
      ?d
      :(
        d && (
          d.records||
          d.list||
          d.rows||
          d.tokenList||
          d.tokens
        )
      )||[];

  if(!fmLogged && list.length){

    fmLogged = true;

    // contoh 1 data asli four.meme, untuk pengecekan nama field
    console.info(
      'four.meme sample item:',
      list[0]
    );

  }

  return list;

}

function fmFirst(o,keys){

  for(const k of keys){

    if(
      o[k]!==undefined &&
      o[k]!==null &&
      o[k]!==''
    )
      return o[k];

  }

  return undefined;

}

function fmImage(u){

  if(!u)
    return '';

  if(/^https?:/i.test(u))
    return u;

  return 'https://static.four.meme/'+
         String(u).replace(/^\/+/,'');

}

function fmToCoin(it,bnbUsd){

  const addr =
    String(
      fmFirst(
        it,
        ['tokenAddress','address','token']
      )||''
    );

  if(!addr)
    return null;

  const symbol =
    fmFirst(
      it,
      ['shortName','tokenSymbol','symbol']
    )||'';

  const name =
    fmFirst(
      it,
      ['name','tokenName']
    )||symbol;

  const cap =
    Number(
      fmFirst(it,['cap','marketCap'])
    )||0;

  // harga: dari four.meme (dalam BNB) x harga BNB, atau cap / 1 miliar supply
  const rawPrice =
    Number(
      fmFirst(
        it,
        ['price','lastPrice','priceUsd']
      )
    )||0;

  const quote =
    String(
      fmFirst(
        it,
        ['raisedTokenSymbol','quoteSymbol']
      )||'BNB'
    ).toUpperCase();

  let priceUsd = 0;

  if(
    rawPrice>0 &&
    (
      quote==='USDT' ||
      quote==='USD1' ||
      quote==='USDC'
    )
  )
    priceUsd = rawPrice;

  else if(
    rawPrice>0 &&
    bnbUsd>0
  )
    priceUsd = rawPrice*bnbUsd;

  if(!(priceUsd>0) && cap>0)
    priceUsd = cap/1e9;

  if(!(priceUsd>0))
    return null;

  const toPct =
    v=>{

      const n =
        Number(v);

      if(!isFinite(n))
        return 0;

      return FM_INCREASE_IS_RATIO
        ?n*100
        :n;

    };

  const h24Raw =
    fmFirst(
      it,
      [
        'day1Increase',
        'dayIncrease',
        'increase',
        'priceChange24h'
      ]
    );

  const h1Raw =
    fmFirst(
      it,
      [
        'hourIncrease',
        'hour1Increase',
        'priceChange1h'
      ]
    );

  const h24 =
    toPct(h24Raw);

  const h1 =
    h1Raw===undefined
      ?h24
      :toPct(h1Raw);

  let created =
    Number(
      fmFirst(
        it,
        ['createDate','createTime','launchTime']
      )
    )||0;

  if(created && created<1e12)
    created *= 1000;

  return {

    id:
      'fm_'+addr.toLowerCase(),

    _terminal:
      true,

    _source:
      'four.meme',

    _network:
      'bsc',

    _pool:
      addr,

    _url:
      'https://four.meme/token/'+addr,

    _created:
      created,

    name:
      name,

    symbol:
      symbol,

    image:
      fmImage(
        fmFirst(
          it,
          ['img','image','logo','icon']
        )
      ),

    current_price:
      priceUsd,

    market_cap:
      cap||undefined,

    total_volume:
      Number(
        fmFirst(
          it,
          ['day1Vol','volume','vol']
        )
      )||undefined,

    price_change_percentage_24h:
      h24,

    price_change_percentage_1h_in_currency:
      h1,

    price_change_percentage_7d_in_currency:
      h24,

    price_change_percentage_30d_in_currency:
      h24,

    price_change_percentage_1y_in_currency:
      h24

  };

}

async function loadLaunchpad(){

  const now =
    Date.now();

  if(
    launchCache &&
    now-launchCache.t<GT_TTL
  )
    return launchCache;

  const bnbUsd =
    Number(
      coinMap.get('binancecoin')
        ?.current_price
    )||0;

  const conv =
    arr=>arr
      .map(
        it=>fmToCoin(it,bnbUsd)
      )
      .filter(Boolean);

  const load =
    type=>fmRanking(type,500)
      .catch(
        ()=>fmRanking(type,100)
      )
      .catch(
        e=>{
          if(type==='HOT')
            throw e;   // HOT wajib berhasil
          console.warn(e);
          return [];
        }
      );

  const [hotRaw,volRaw,newRaw,progRaw] =
    await Promise.all([
      load('HOT'),
      load('VOL_DAY_1'),
      load('NEW'),
      load('PROGRESS')
    ]);

  const hot =
    conv(hotRaw);

  const fresh =
    conv(newRaw);

  const seen =
    new Set();

  const all =
    [
      ...hot,
      ...conv(volRaw),
      ...fresh,
      ...conv(progRaw)
    ].filter(
      c=>{

        if(seen.has(c.id))
          return false;

        seen.add(c.id);

        return true;

      }
    );

  launchCache = {
    t:now,
    hot,
    fresh,
    all
  };

  return launchCache;

}

const BA_LIST_URL =

// jalur akses: langsung dulu; jika diblokir CORS -> lewat proxy publik
const BA_ROUTES = [
  u=>u,
  u=>'https://corsproxy.io/?url='+encodeURIComponent(u),
  u=>'https://api.allorigins.win/raw?url='+encodeURIComponent(u)
];

let alphaInflight =
  null;

let baRouteIdx =
  0;                  // jalur yang terakhir berhasil

async function baFetchList(){

  let lastError =
    null;

  for(
    let round=0;
    round<2;
    round++
  ){

    for(
      let k=0;
      k<BA_ROUTES.length;
      k++
    ){

      const idx =
        (baRouteIdx+k)%
        BA_ROUTES.length;

      try{

        const response =
          await fetchT(
            BA_ROUTES[idx](BA_LIST_URL),
            {
              cache:'no-store'
            },
            12000
          );

        if(!response.ok)
          throw new Error(
            'Binance Alpha HTTP '+
            response.status
          );

        const json =
          await response.json();

        const d =
          json && json.data;

        const list =
          Array.isArray(d)
            ?d
            :(
              d && Array.isArray(d.list)
                ?d.list
                :null
            );

        if(!list || !list.length)
          throw new Error(
            'Binance Alpha kosong'
          );

        baRouteIdx =
          idx;

        return list;

      }catch(e){

        lastError =
          e;

      }

    }

    await gtSleep(1500);

  }

  throw lastError;

}

function baToCoin(it){

  const DSCHAIN = {

    ];

  const viaProxy =

       encodeURIComponent(u)
      :'';

       (dsc==='solana'?addr:addr.toLowerCase())+

  const cexName =
    String(it.cexCoinName||'')
      .trim();

  const cexIcon =
    cexName
      ?'https://bin.bnbstatic.com/static/assets/logos/'+
       encodeURIComponent(cexName.toUpperCase())+
       '.png'
      :'';

  const logos =
    [
      binIcon,
      viaProxy(binIcon),
      cexIcon,
      dsIcon,
      viaProxy(dsIcon)
    ]
    .filter(
      (u,i,a)=>u && a.indexOf(u)===i
    );

  if(!logos.length)
    logos.push(
      letterLogo(symbol)
    );

  let listed =
    Number(it.listingTime)||0;

  if(listed && listed<1e12)
    listed *= 1000;

  return {

    id:
      'ba_'+String(key).toLowerCase(),

    _terminal:
      true,

    _source:
      'Binance Alpha',

    _network:
      chain||'-',

    _pool:
      addr,

    _url:
      (addr && slug)
        ?'https://www.binance.com/en/alpha/'+
         slug+'/'+addr
        :'https://www.binance.com/en/alpha',

    _created:
      listed,

    // API Alpha tidak punya waktu listing; ID makin besar (ALPHA_175 dst) = makin baru
    _ca:(String(it.contractAddress||'')+'@'+String(it.chainId||'')).toLowerCase(),
    _alphaNum:
      parseInt(
        String(it.alphaId||'').replace(/\D/g,'')
      )||0,

    name:
      it.name||symbol,

    symbol:
      symbol,

    image:
      logos[0],

    _imgs:
      logos,

    current_price:
      price,

    market_cap:
      Number(it.marketCap)||undefined,

    total_volume:
      Number(it.volume24h)||undefined,

    price_change_percentage_24h:
      h24,

    price_change_percentage_1h_in_currency:
      h24,

    price_change_percentage_7d_in_currency:
      h24,

    price_change_percentage_30d_in_currency:
      h24,

    price_change_percentage_1y_in_currency:
      h24

  };

}

async function loadAlpha(){

  const now =
    Date.now();

  if(
    alphaCache &&
    now-alphaCache.t<GT_TTL
  )
    return alphaCache.list;

  if(alphaInflight)
    return alphaInflight;

  alphaInflight =
    (async()=>{

      try{

        const raw =
          await baFetchList();

        const seen =
          new Set();

        const list =
          raw
            .map(baToCoin)
            .filter(
              c=>{

                if(!c || seen.has(c.id))
                  return false;

                seen.add(c.id);

                return true;

              }
            );

        if(!list.length)
          throw new Error(
            'Binance Alpha kosong'
          );

        alphaCache = {
          t:Date.now(),
          list
        };

        return list;

      }catch(e){

        // gagal tapi masih punya data lama -> pakai data lama
        if(alphaCache)
          return alphaCache.list;

        throw e;

      }finally{

        alphaInflight =
          null;

      }

    })();

  return alphaInflight;

}

async function showAlpha(kind,page=0){

  alphaMode =
    kind;

  const req =
    ++srcReq;

  cloud.innerHTML =
    '<div style="position:absolute;inset:0;'+
    'display:flex;align-items:center;'+
    'justify-content:center;color:#777;'+
    'font-size:11px;">Loading Binance Alpha...</div>';

  nodes.clear();
  positions.clear();

  try{

    const data =
      await loadAlpha();

    // jika user pindah menu saat loading, abaikan hasil lama
    if(alphaMode!==kind || req!==srcReq)
      return;

    const list =
      [...data];

    if(kind==='Gainer')
      list.sort(
        (x,y)=>getGain(y)-getGain(x)
      );

    else if(kind==='Looser')
      list.sort(
        (x,y)=>getGain(x)-getGain(y)
      );

    else if(kind==='NewListing')
      list.sort(
        (x,y)=>
          (y._alphaNum||0)-(x._alphaNum||0) ||
          (y._created||0)-(x._created||0)
      );

    else
      list.sort(          // Trending = volume 24 jam terbesar
        (x,y)=>(y.total_volume||0)-(x.total_volume||0)
      );

    list.forEach(
      c=>coinMap.set(c.id,c)
    );

    visibleCoins =
      list.slice(
        page*COINS_PER_PAGE,
        (page+1)*COINS_PER_PAGE
      );

    if(!visibleCoins.length){

      cloud.innerHTML =
        '<div style="position:absolute;inset:0;'+
        'display:flex;align-items:center;'+
        'justify-content:center;color:#777;'+
        'font-size:11px;text-align:center;'+
        'padding:20px;">Tidak ada data di halaman ini.</div>';

      return;

    }

    createCoinNodes();

  }catch(error){

    console.error(error);

    if(alphaMode!==kind || req!==srcReq)
      return;

    cloud.innerHTML =
      '<div style="position:absolute;inset:0;'+
      'display:flex;align-items:center;'+
      'justify-content:center;color:#777;'+
      'font-size:11px;text-align:center;'+
      'padding:20px;">Gagal mengambil data '+
      'Binance Alpha.<br>Coba lagi sebentar.'+
      '</div>';

  }

}

function applyMarketFilter(
  type,
  page=0
){

  let result =
    [...allCoins];

  if(type==='Trending'){

    result.sort(
      (
        a,
        b
      )=>
        (
          Math.abs(
            getGain(b)
          )
        )-
        (
          Math.abs(
            getGain(a)
          )
        )
    );

  }

  else if(type==='Gainer'){

    result.sort(
      (
        a,
        b
      )=>
        (
          getGain(b)
        )-
        (
          getGain(a)
        )
    );

  }

  else if(type==='Looser'){

    result.sort(
      (
        a,
        b
      )=>
        (
          getGain(a)
        )-
        (
          getGain(b)
        )
    );

  }

  else if(type==='Favorite'){

    result =
      result.filter(
        coin=>
          localStorage.getItem(
            'fav_'+coin.id
          )==='1'
      );

  }

  visibleCoins =
    result.slice(
      page*COINS_PER_PAGE,
      (page+1)*COINS_PER_PAGE
    );

  nodes.clear();
  positions.clear();

  createCoinNodes();

}

/* =====================================================
   FETCH DENGAN TIMEOUT
   (tanpa AbortSignal: di preview Claude/WebView fetch
    diteruskan lewat postMessage dan AbortSignal tidak
    bisa di-clone -> DataCloneError)
===================================================== */

function fetchT(url,opts,ms){

  return new Promise(
    (resolve,reject)=>{

      const t =
        setTimeout(
          ()=>reject(
            new Error('timeout')
          ),
          ms||8000
        );

      fetch(
        url,
        opts||{}
      ).then(
        r=>{
          clearTimeout(t);
          resolve(r);
        },
        e=>{
          clearTimeout(t);
          reject(e);
        }
      );

    }
  );

}

const CG_PER_PAGE =
  250;

const CG_PAGES =
  Math.ceil(
    TOTAL_COINS /
    CG_PER_PAGE
  );

let cgLoading =
  false;

let cgRetrying =
  false;

let cgLastRun =
  0;                 // waktu load daftar koin terakhir (untuk auto-update 5 menit)

function cgSleep(ms){

  return new Promise(
    r=>setTimeout(r,ms)
  );

}

// Kunci API Demo CoinGecko (gratis, opsional): daftar di coingecko.com/en/api
// lalu tempel di sini agar limit jauh lebih longgar & stabil. Kosongkan jika tidak punya.
const CG_DEMO_KEY = '';

// Jalur akses: langsung dulu, lalu lewat proxy CORS publik bila jalur langsung gagal / kena 429.
const API_PROXY = '';   // contoh: 'https://crypto-proxy.namamu.workers.dev'
const CG_ROUTES = [
  ...(API_PROXY?[u=>API_PROXY+'/?u='+encodeURIComponent(u)]:[]),
  u=>u,
  u=>'https://corsproxy.io/?url='+encodeURIComponent(u),
  u=>'https://api.allorigins.win/raw?url='+encodeURIComponent(u)
];

let cgRoute = 0;          // jalur yang terakhir berhasil
const CG_GAP = 1800;      // jeda antar halaman (ms) supaya tidak kena limit 429

// Ambil 1 halaman CoinGecko. Gagal (429 / timeout / jaringan / CORS) -> ganti jalur
// dan ulangi sampai 6x dengan jeda makin lama. 429 diberi jeda ekstra.
async function loadCGPageRaw(
  page
){

  let url =
    'https://api.coingecko.com/api/v3/coins/markets?'+
    'vs_currency=usd'+
    '&order=market_cap_desc'+
    '&per_page='+CG_PER_PAGE+
    '&page='+page+
    '&sparkline=false'+
    '&price_change_percentage=1h,24h,7d,30d,1y';

  if(CG_DEMO_KEY)
    url += '&x_cg_demo_api_key='+
      encodeURIComponent(CG_DEMO_KEY);

  const waits =
    [1500,4000,8000];

  let lastError =
    null;

  for(
    let attempt=0;
    attempt<4;
    attempt++
  ){

    const route =
      (cgRoute+attempt) % CG_ROUTES.length;

    let wait =
      waits[Math.min(attempt,waits.length-1)];

    try{

      const response =
        await fetchT(
          CG_ROUTES[route](url),
          {},
          route===0 ? 8000 : 12000
        );

      if(!response.ok){

        if(response.status===429)
          wait *= 2;

        throw new Error(
          'CoinGecko HTTP '+
          response.status
        );

      }

      const data =
        await response.json();

      if(
        !Array.isArray(data) ||
        !data.length
      )
        throw new Error(
          'CoinGecko data kosong'
        );

      cgRoute =
        route;

      return data;

    }catch(e){

      lastError =
        e;

      if(attempt<3)
        await cgSleep(wait);

    }

  }

  throw lastError;

}

   CADANGAN: BINANCE API PUBLIK
   Dipakai hanya jika halaman CoinGecko gagal dimuat.
   - ada cache  -> harga & perubahan 24 jam di-update dari Binance
   - tanpa cache -> daftar dibuat dari pasangan USDT Binance
===================================================== */

const BN_HOSTS = [
  'https://data-api.binance.vision',
  'https://api.binance.com',
  'https://api1.binance.com',
  'https://api3.binance.com'
];

const BN_SKIP_BASE = [
  'USDC','FDUSD','TUSD','USDP','BUSD','DAI','USDE','EUR','GBP','TRY','BRL','AEUR','USD1','XUSD'
];

// id CoinGecko untuk koin populer, supaya portofolio/favorit tetap cocok
const BN_KNOWN_IDS = {
  btc:'bitcoin', eth:'ethereum', bnb:'binancecoin', sol:'solana',
  xrp:'ripple', doge:'dogecoin', ada:'cardano', trx:'tron',
  avax:'avalanche-2', link:'chainlink', dot:'polkadot', ltc:'litecoin',
  bch:'bitcoin-cash', shib:'shiba-inu', matic:'matic-network',
  pol:'polygon-ecosystem-token', ton:'the-open-network', near:'near',
  atom:'cosmos', uni:'uniswap', etc:'ethereum-classic', xlm:'stellar',
  apt:'aptos', sui:'sui', arb:'arbitrum', op:'optimism', pepe:'pepe',
  inj:'injective-protocol', fil:'filecoin', usdt:'tether',
  usdc:'usd-coin', steth:'staked-ether', wbtc:'wrapped-bitcoin', xmr:'monero',
  hype:'hyperliquid', leo:'leo-token', dai:'dai', hbar:'hedera-hashgraph',
  cro:'crypto-com-chain', ena:'ethena', aave:'aave', algo:'algorand',
  vet:'vechain', icp:'internet-computer', xaut:'tether-gold', paxg:'pax-gold'
};

let binanceSymSet = null;   // daftar pasangan yang benar-benar ada di Binance (huruf kecil)
let bnTickerCache = null;

async function fetchBinanceTickers(){

  if(
    bnTickerCache &&
    Date.now()-bnTickerCache.t<60000
  )
    return bnTickerCache.list;

  let lastError =
    null;

  for(const host of BN_HOSTS){

    try{

      const response =
        await fetchT(
          host+'/api/v3/ticker/24hr',
          {},
          15000
        );

      if(!response.ok)
        throw new Error(
          'Binance HTTP '+
          response.status
        );

      const data =
        await response.json();

      if(
        !Array.isArray(data) ||
        !data.length
      )
        throw new Error(
          'Binance data kosong'
        );

      const list =
        [];

      const set =
        new Set();

      data.forEach(
        t=>{

          const sym =
            String(t.symbol||'');

          if(!/USDT$/.test(sym))
            return;

          const base =
            sym.slice(0,-4);

          if(
            !base ||
            BN_SKIP_BASE.includes(base)
          )
            return;

          const price =
            Number(t.lastPrice);

          const vol =
            Number(t.quoteVolume);

          if(
            !(price>0) ||
            !(vol>0)
          )
            return;

          set.add(
            sym.toLowerCase()
          );

          list.push({
            base:base,
            price:price,
            chg:Number(t.priceChangePercent)||0,
            vol:vol,
            high:Number(t.highPrice)||0,
            low:Number(t.lowPrice)||0
          });

        }
      );

      if(!list.length)
        throw new Error(
          'Binance tanpa pasangan USDT'
        );

      list.sort(
        (a,b)=>b.vol-a.vol
      );

      binanceSymSet =
        set;

      bnTickerCache = {
        t:Date.now(),
        list:list
      };

      return list;

    }catch(e){

      lastError =
        e;

    }

  }

  throw lastError ||
    new Error('Binance gagal');

}

// update harga koin yang sudah ada (koin pertama per simbol = market cap terbesar)
function applyBinanceToCoins(coins,list){

  const bySym =
    new Map();

  list.forEach(
    t=>{
      const k =
        t.base.toLowerCase();

      if(!bySym.has(k))
        bySym.set(k,t);
    }
  );

  const seen =
    new Set();

  coins.forEach(
    c=>{

      const k =
        String(c.symbol||'')
          .toLowerCase();

      if(
        !k ||
        seen.has(k)
      )
        return;

      seen.add(k);

      const t =
        bySym.get(k);

      if(!t)
        return;

      c.current_price =
        t.price;

      c.price_change_percentage_24h =
        t.chg;

      if(t.high)
        c.high_24h =
          t.high;

      if(t.low)
        c.low_24h =
          t.low;

    }
  );

}

// bentuk objek koin (format CoinGecko) dari data Binance
function binanceToCoins(list){

  return list.map(
    (t,i)=>{

      const sym =
        t.base.toLowerCase();

      return {
        id:BN_KNOWN_IDS[sym] || sym,
        symbol:sym,
        name:t.base,
        image:'',
        current_price:t.price,
        market_cap:0,
        market_cap_rank:i+1,
        total_volume:t.vol,
        high_24h:t.high,
        low_24h:t.low,
        price_change_percentage_24h:t.chg,
        price_change_percentage_1h_in_currency:0,
        price_change_percentage_7d_in_currency:0,
        price_change_percentage_30d_in_currency:0,
        price_change_percentage_1y_in_currency:0,
        circulating_supply:0,
        total_supply:0,
        max_supply:null,
        ath:0,
        atl:0,
        _source:'binance'
      };

    }
  );

}

/* =====================================================
   CADANGAN 1: COINMARKETCAP (Keyless Public API, tanpa API key)
   Satu permintaan 1000 koin. Dipakai jika CoinGecko lambat / gagal.
   Data CMC dipetakan ke format CoinGecko; jika koin ada di cache,
   id & logo CoinGecko dipertahankan agar portofolio/favorit tetap cocok.
===================================================== */

const CMC_BASE =
  'https://pro-api.coinmarketcap.com/public-api';

async function fetchCMCListRaw(){

  const url =
    CMC_BASE+
    '/v3/cryptocurrency/listings/latest'+
    '?start=1&limit='+TOTAL_COINS+
    '&convert=USD';

  let lastError =
    null;

  for(
    let attempt=0;
    attempt<4;
    attempt++
  ){

    // langsung -> proxy -> proxy -> langsung
    const route =
      attempt % CG_ROUTES.length;

    try{

      const response =
        await fetchT(
          CG_ROUTES[route](url),
          {},
          route===0 ? 12000 : 18000
        );

      if(!response.ok)
        throw new Error(
          'CMC HTTP '+
          response.status
        );

      const json =
        await response.json();

      const ec =
        json &&
        json.status &&
        json.status.error_code;

      if(
        ec &&
        String(ec)!=='0'
      )
        throw new Error(
          'CMC '+ec+' '+
          (json.status.error_message||'')
        );

      const data =
        Array.isArray(json)
          ?json
          :(json && json.data);

      if(
        !Array.isArray(data) ||
        !data.length
      )
        throw new Error(
          'CMC data kosong'
        );

      return data;

    }catch(e){

      lastError =
        e;

      if(attempt<3)
        await cgSleep(
          [1000,2500,5000][attempt]
        );

    }

  }

  throw lastError;

}

function cmcToCoins(data,cachedList){

  const norm =
    v=>String(v||'')
      .toLowerCase()
      .replace(/[^a-z0-9]/g,'');

  const bySymName =
    new Map();

  const bySym =
    new Map();

  (cachedList||[]).forEach(
    c=>{

      const sy =
        String(c.symbol||'')
          .toLowerCase();

      bySymName.set(
        sy+'|'+norm(c.name),
        c
      );

      if(!bySym.has(sy))
        bySym.set(sy,c);

    }
  );

  const out =
    [];

  data.forEach(
    (d,i)=>{

      if(!d)
        return;

      const q =
        Array.isArray(d.quote)
          ?(
            d.quote.find(
              x=>x && x.symbol==='USD'
            ) ||
            d.quote[0]
          )
          :(
            d.quote &&
            (d.quote.USD || d.quote)
          );

      if(!q)
        return;

      const price =
        Number(q.price);

      if(!(price>=0))
        return;

      const sy =
        String(d.symbol||'')
          .toLowerCase();

      if(!sy)
        return;

      const rank =
        Number(d.cmc_rank) || (i+1);

      let hit =
        bySymName.get(
          sy+'|'+norm(d.name)
        );

      if(
        !hit &&
        rank<=150
      ){

        const c =
          bySym.get(sy);

        if(
          c &&
          Number(c.market_cap_rank)<=300
        )
          hit = c;

      }

      const base =
        hit
          ?Object.assign({},hit)
          :{};

      const num =
        v=>Number(v)||0;

      out.push(
        Object.assign(
          base,
          {
            id:
              hit
                ?hit.id
                :(
                  rank<=300 && BN_KNOWN_IDS[sy]
                    ?BN_KNOWN_IDS[sy]
                    :(d.slug || sy)
                ),
            symbol:sy,
            name:d.name || sy.toUpperCase(),
            image:
              (hit && hit.image) ||
              'https://s2.coinmarketcap.com/static/img/coins/64x64/'+
              d.id+'.png',
            current_price:price,
            market_cap:num(q.market_cap),
            market_cap_rank:rank,
            total_volume:num(q.volume_24h),
            price_change_percentage_24h:num(q.percent_change_24h),
            price_change_percentage_1h_in_currency:num(q.percent_change_1h),
            price_change_percentage_7d_in_currency:num(q.percent_change_7d),
            price_change_percentage_30d_in_currency:num(q.percent_change_30d),
            circulating_supply:num(d.circulating_supply),
            total_supply:num(d.total_supply),
            max_supply:
              d.max_supply==null
                ?null
                :num(d.max_supply),
            _cmcId:d.id,
            _source:'cmc'
          }
        )
      );

    }
  );

  // pastikan field yang tidak disediakan CMC tidak undefined
  out.forEach(
    c=>{

      [
        'high_24h',
        'low_24h',
        'ath',
        'atl',
        'price_change_percentage_1y_in_currency'
      ].forEach(
        k=>{
          if(c[k]==null)
            c[k] = 0;
        }
      );

    }
  );

  return out;

}

/* =====================================================
   LOAD 1000 COINS
   - tampil instan dari cache (kunjungan berikutnya)
   - halaman 1 (250 koin) langsung ditampilkan
   - halaman 2-4 dimuat di latar belakang
===================================================== */

function setAllCoins(list){

  const unique =
    new Map();

  list.forEach(
    coin=>{

      if(
        coin &&
        !unique.has(coin.id)
      )
        unique.set(
          coin.id,
          coin
        );

    }
  );

  allCoins =
    Array.from(
      unique.values()
    ).slice(
      0,
      TOTAL_COINS
    );

  allCoins.forEach(
    coin=>coinMap.set(
      coin.id,
      coin
    )
  );

}

function mainListActive(){

  const popup =
    document.getElementById(
      'overlay'
    );

  return (
    !terminalMode &&
    !dexMode &&
    !launchMode &&
    !alphaMode &&
    activeFilter==='All' &&
    !(
      popup &&
      popup.classList.contains('show')
    )
  );

}

// silent=true -> auto-update 5 menit: tampilan yang ada tidak di-render ulang dari cache
async function loadAllCoins(silent){

  if(cgLoading)
    return;

  cgLoading =
    true;

  cgLastRun =
    Date.now();

  const cached =
    loadCachedCoins();

  let shown =
    silent===true;

  const pageData =
    {};              // halaman CoinGecko yang berhasil dimuat

  const slotFromCache =
    n=>cached
      ?cached.slice(
        (n-1)*CG_PER_PAGE,
        n*CG_PER_PAGE
      )
      :[];

  const fbData =
    {};              // cadangan Binance untuk halaman tanpa data & tanpa cache

  // CoinGecko gagal / lambat -> ambil 1000 koin dari CoinMarketCap (keyless)
  let cmcPromise =
    null;

  function cmcFallback(){

    if(cmcPromise)
      return cmcPromise;

    cmcPromise =
      (async()=>{

        try{

          const data =
            await fetchCMCList();

          const coins =
            cmcToCoins(
              data,
              cached || []
            );

          if(!coins.length)
            throw new Error(
              'CMC tanpa data'
            );

          for(
            let n=1;
            n<=CG_PAGES;
            n++
          )
            if(!pageData[n])
              fbData[n] =
                coins.slice(
                  (n-1)*CG_PER_PAGE,
                  n*CG_PER_PAGE
                );

          console.warn(
            'Memakai data CoinMarketCap sementara'
          );

          apply();

          // belum pernah ada cache -> simpan agar buka berikutnya langsung tampil
          if(
            !cached &&
            coins.length>=TOTAL_COINS-CG_PER_PAGE
          )
            saveCachedCoins(coins);

          return true;

        }catch(e){

          console.warn(
            'CoinMarketCap gagal',
            e
          );

          return false;

        }

      })();

    return cmcPromise;

  }

  // CoinGecko gagal -> pakai Binance untuk halaman yang belum terisi
  async function binanceFallback(){

    try{

      const list =
        await fetchBinanceTickers();

      const missing =
        [];

      for(
        let n=1;
        n<=CG_PAGES;
        n++
      )
        if(
          !pageData[n] &&
          !(fbData[n] && fbData[n].length)
        )
          missing.push(n);

      if(!missing.length)
        return;

      // 1) halaman yang punya cache -> segarkan harga dari Binance
      const cachedCoins =
        [];

      const empty =
        [];

      missing.forEach(
        n=>{

          const slot =
            slotFromCache(n);

          if(slot.length)
            cachedCoins.push(...slot);
          else
            empty.push(n);

        }
      );

      if(cachedCoins.length)
        applyBinanceToCoins(
          cachedCoins,
          list
        );

      // 2) halaman tanpa cache -> bangun dari daftar Binance
      if(empty.length){

        const known =
          new Set();

        for(
          let n=1;
          n<=CG_PAGES;
          n++
        )
          (
            pageData[n] ||
            slotFromCache(n)
          ).forEach(
            c=>known.add(
              String(c.symbol||'')
                .toLowerCase()
            )
          );

        const gen =
          binanceToCoins(list)
          .filter(
            c=>!known.has(c.symbol)
          );

        empty.forEach(
          (n,i)=>{

            fbData[n] =
              gen.slice(
                i*CG_PER_PAGE,
                (i+1)*CG_PER_PAGE
              );

          }
        );

      }

      console.warn(
        'CoinGecko gagal untuk halaman '+
        missing.join(',')+
        ' -> memakai Binance sementara'
      );

      apply();

    }catch(e){

      console.warn(
        'Binance cadangan gagal',
        e
      );

    }

  }

  // susun daftar 1..TOTAL_COINS per halaman:
  // data baru > (cadangan) > cache lama
  function build(useFallback){

    const out =
      [];

    for(
      let n=1;
      n<=CG_PAGES;
      n++
    )
      out.push(
        ...(
          pageData[n] ||
          (
            fbData[n] && fbData[n].length
              ?fbData[n]
              :slotFromCache(n)
          )
        )
      );

    return out;

  }

  function apply(){

    const merged =
      build(true).map(
        c=>{

          const old =
            coinMap.get(c.id);

          if(
            old &&
            old!==c
          ){

            Object.assign(old,c);

            return old;

          }

          return c;

        }
      );

    if(!merged.length)
      return;

    setAllCoins(merged);

    if(!shown){

      shown =
        true;

      renderCurrentPage();

      connectBinance();

      return;

    }

    if(!mainListActive())
      return;

    // gambar ulang hanya jika isi halaman yang sedang dilihat berubah
    const start =
      currentPage*
      COINS_PER_PAGE;

    const slice =
      allCoins.slice(
        start,
        start+
        COINS_PER_PAGE
      );

    if(
      slice.length!==visibleCoins.length ||
      slice.some(
        (c,i)=>c!==visibleCoins[i]
      )
    )
      renderCurrentPage();

  }

  if(silent){

    // auto-update: tampilan sudah ada, jangan timpa dengan data cache lama

  }else if(cached){

    // tampilan instan dari cache
    apply();

  }else{

    cloud.innerHTML =
      '<div style="position:absolute;inset:0;'+
      'display:flex;align-items:center;'+
      'justify-content:center;color:#777;'+
      'font-size:11px;">Loading...</div>';

  }

  // hemat request: CoinMarketCap paralel hanya jika belum ada cache sama sekali.
  // Jika CoinGecko gagal, cadangan CMC tetap dipanggil di bawah.
  if(!cached && !silent)
    cmcFallback();

  try{

    // halaman diminta berurutan dengan jeda (bukan serentak) agar tidak kena limit 429
    let failed =
      [];

    // simpan cache setiap ada halaman baru (asal semua slot 1..N terisi)
    function savePartial(){

      const out =
        [];

      for(
        let n=1;
        n<=CG_PAGES;
        n++
      ){

        const p =
          pageData[n] ||
          slotFromCache(n);

        if(
          !p.length ||
          (
            n<CG_PAGES &&
            p.length<CG_PER_PAGE
          )
        )
          return;

        out.push(...p);

      }

      saveCachedCoins(out);

    }

    for(
      let n=1;
      n<=CG_PAGES;
      n++
    ){

      if(n>1)
        await cgSleep(CG_GAP);

      try{

        pageData[n] =
          await loadCGPage(
            n,
            silent
              ?CG_PAGE_TTL-30000
              :undefined
          );

        apply();

        savePartial();

      }catch(e){

        console.warn(
          'Halaman '+n+' gagal',
          e
        );

        failed.push(n);

      }

    }

    if(failed.length){

      const okCmc =
        await cmcFallback();

      if(!okCmc)
        await binanceFallback();

    }

    failed.sort(
      (a,b)=>a-b
    );

    if(
      !shown &&
      !allCoins.length
    ){

      showCoinLoadError();

    }else{

      const real =
        build(false);

      // simpan hanya jika semua halaman lengkap (posisi urutan tidak bergeser)
      if(
        !failed.length &&
        real.length>=TOTAL_COINS-CG_PER_PAGE
      )
        saveCachedCoins(real);

      connectBinance();

      if(silent)
        cgRefreshView();

    }

    cgLoading =
      false;

    // halaman yang masih gagal -> coba ulang otomatis di latar belakang
    if(failed.length){

      cgRetrying =
        true;

      let round =
        0;

      const retry =
        async()=>{

          round++;

          const still =
            [];

          for(const n of failed){

            try{

              pageData[n] =
                await loadCGPage(n);

              apply();

            }catch(e){

              still.push(n);

            }

            await cgSleep(CG_GAP);

          }

          failed =
            still;

          if(!failed.length)
            cgRetrying =
              false;

          if(!failed.length){

            const real =
              build(false);

            if(real.length>=TOTAL_COINS-CG_PER_PAGE)
              saveCachedCoins(real);

            connectBinance();

            // filter Gainer/Loser dll perlu dihitung ulang dengan data lengkap
            const popup =
              document.getElementById('overlay');

            if(
              !terminalMode &&
              !dexMode &&
              !launchMode &&
              !alphaMode &&
              activeFilter!=='All' &&
              !(
                popup &&
                popup.classList.contains('show')
              )
            )
              applyMarketFilter(
                activeFilter,
                currentPage
              );

          }else if(round<10){

            setTimeout(
              retry,
              Math.min(8000*round,40000)
            );

          }else{

            cgRetrying =
              false;

            // menyerah: kalau layar masih kosong tampilkan tombol coba lagi
            if(!allCoins.length)
              showCoinLoadError();

          }

        };

      setTimeout(
        retry,
        6000
      );

    }

  }catch(error){

    console.error(
      error
    );

    cgLoading =
      false;

    // kalau data sudah tampil (cache), biarkan; jika belum -> pesan gagal + tombol coba lagi
    if(!shown)
      showCoinLoadError();

  }

}


// Jaringan pulih / tab dibuka lagi tapi daftar belum lengkap -> muat ulang otomatis
function cgResumeIfIncomplete(){

  if(
    !cgLoading &&
    !cgRetrying &&
    allCoins.length<TOTAL_COINS
  )
    loadAllCoins();

}


/* =====================================================
   EFEK INFO UPDATE KOIN (gaya komentar live TikTok / YouTube)
   - muncul saat load awal & saat kembali online
   - satu koin per baris: nama, harga, gain (langsung muncul)
   - baris baru muncul di kiri bawah, baris lama terdorong naik
     rapat, memudar & hilang saat sampai tengah kiri halaman
   - hanya koin di halaman yang sedang dibuka (100 per halaman)
===================================================== */

(function(){

  const box =
    document.createElement('div');

  box.style.cssText=
    'position:fixed;left:10px;bottom:14px;'+
    'width:72vw;max-width:320px;'+
    'height:calc(40vh - 14px);'+
    'overflow:hidden;pointer-events:none;z-index:30;'+
    'display:flex;flex-direction:column;'+
    'justify-content:flex-end;gap:2px;'+
    '-webkit-mask-image:linear-gradient(to bottom,transparent 0,#000 22%);'+
    'mask-image:linear-gradient(to bottom,transparent 0,#000 22%);';

  document.body.appendChild(box);

  const LIFE_MS  = 1000;   // muncul -> hilang, per baris
  const FADE_MS  = 300;    // bagian memudar di akhir umur baris
  const GAP_MS   = 30;     // jeda antar koin
  const MAX_ROWS = 60;

  let token = 0;
  let pending = true;      // true = jalankan efek pada render berikutnya
  let feedIds = '';

  function liveCoin(c){

    if(
      typeof allCoins!=='undefined' &&
      allCoins.length
    ){

      const f =
        allCoins.find(
          x=>x.id===c.id
        );

      if(f)
        return f;

    }

    return c;

  }

  function spawn(c){

    c = liveCoin(c);

    const g =
      getGain(c);

    const parts = [
      [
        String(c.name||c.id||'')+' '+
        String(c.symbol||'').toUpperCase(),
        '#e8e8e8'
      ],
      [
        price(c.current_price),
        '#a8a8a8'
      ],
      [
        percent(g),
        g>=0 ? '#55dc91' : '#ff5965'
      ]
    ];

    // FLIP: catat posisi baris lama supaya terdorong naik dengan halus
    const olds =
      Array.from(box.children).map(
        e=>[e,e.getBoundingClientRect().top]
      );

    const el =
      document.createElement('div');

    el.style.cssText=
      'flex:none;font-size:10px;line-height:1.3;'+
      'white-space:nowrap;overflow:hidden;'+
      'font-family:inherit;'+
      'text-shadow:0 0 6px rgba(0,0,0,.9);';

    const spans =
      parts.map(([,col],i)=>{

        const sp =
          document.createElement('span');

        sp.style.color = col;
        sp.textContent = parts[i][0];

        if(i)
          sp.style.marginLeft = '7px';

        el.appendChild(sp);

        return sp;

      });

    box.appendChild(el);

    olds.forEach(([e,top])=>{

      const d =
        top-e.getBoundingClientRect().top;

      if(d)
        e.animate(
          [
            {transform:'translateY('+d+'px)'},
            {transform:'translateY(0)'}
          ],
          {
            duration:120,
            easing:'ease-out'
          }
        );

    });

    el.animate(
      [
        {opacity:0},
        {opacity:1}
      ],
      {
        duration:160,
        fill:'both'
      }
    );

    // tiap baris: dari muncul sampai memudar hilang = LIFE_MS (3 detik)
    setTimeout(()=>{

      const f =
        el.animate(
          [{opacity:1},{opacity:0}],
          {
            duration:FADE_MS,
            fill:'forwards'
          }
        );

      f.onfinish = ()=>el.remove();

    },LIFE_MS-FADE_MS);

    // buang baris yang sudah terdorong lewat batas atas (tengah kiri halaman)
    const top =
      box.getBoundingClientRect().top;

    Array.from(box.children).forEach(e=>{

      if(e.getBoundingClientRect().bottom<top)
        e.remove();

    });

    while(box.children.length>MAX_ROWS)
      box.firstChild.remove();

  }

  function run(list){

    const my = ++token;

    box.innerHTML = '';

    const coins = list.slice();

    let i = 0;

    function next(){

      if(my!==token)
        return;

      if(i>=coins.length){

        pending = false;


        return;

      }

      if(!document.hidden)
        spawn(coins[i]);

      i++;

      setTimeout(next,GAP_MS);

    }

    next();

  }

  function ids(list){
    return list.map(c=>c.id).join(',');
  }

  // dipanggil tiap halaman koin dirender (halaman baru = koin halaman itu)
  const baseCreate =
    createCoinNodes;

  createCoinNodes = function(){

    const r =
      baseCreate.apply(
        this,
        arguments
      );

    if(
      typeof visibleCoins!=='undefined' &&
      visibleCoins.length
    ){

      const k = ids(visibleCoins);

      if(
        pending &&
        k!==feedIds
      ){

        feedIds = k;
        run(visibleCoins);

      }

    }

    return r;

  };

  // kembali online -> efek update semua koin di halaman yang sedang dibuka
  window.addEventListener(
    'online',
    ()=>{

      setTimeout(()=>{

        if(
          typeof visibleCoins!=='undefined' &&
          visibleCoins.length
        ){

          pending = true;
          feedIds = ids(visibleCoins);
          run(visibleCoins);

        }else{

          pending = true;
          feedIds = '';

        }

      },1200);

    }
  );

})();

window.addEventListener(
  'online',
  cgResumeIfIncomplete
);

document.addEventListener(
  'visibilitychange',
  ()=>{
    if(!document.hidden)
      cgResumeIfIncomplete();
  }
);

/* =====================================================
   EFEK MELETUS (koin lama pecah, koin baru muncul)
   Hanya saat online, saat data diperbarui otomatis,
   dan sebagian koin saja yang berganti.
===================================================== */

const BURST_COLORS =
  ['#ffd60a','#55dc91','#ff5965','#ffffff','#7cc4ff'];

function spawnBurst(cx,cy,size){

  const box =
    document.createElement('div');

  box.className =
    'coinBurst';

  box.style.left =
    cx+'px';

  box.style.top =
    cy+'px';

  const ring =
    document.createElement('i');

  ring.className =
    'burstRing';

  ring.style.setProperty(
    '--r',
    (size*1.5)+'px'
  );

  box.appendChild(ring);

  const n =
    14;

  for(let k=0;k<n;k++){

    const d =
      document.createElement('b');

    const a =
      (k/n)*Math.PI*2+
      Math.random()*.4;

    const dist =
      size*(.55+Math.random()*.55);

    d.style.setProperty(
      '--dx',
      Math.cos(a)*dist+'px'
    );

    d.style.setProperty(
      '--dy',
      Math.sin(a)*dist+'px'
    );

    d.style.background =
      BURST_COLORS[
        k%BURST_COLORS.length
      ];

    box.appendChild(d);

  }

  cloud.appendChild(box);

  setTimeout(
    ()=>box.remove(),
    800
  );

}

function burstReplaced(oldPos){

  if(
    navigator.onLine===false ||
    document.hidden
  )
    return;

  // ganti kategori / halaman lewat menu (All, Terminal, Dex, Launchpad, Binance)
  const fresh =
    performance.now()-
    (window.__burstPending||-1e9)<30000;

  if(!oldPos.size && !fresh)
    return;

  const newIds =
    visibleCoins.map(c=>c.id);

  const removed =
    [];

  const added =
    [];

  let kept =
    0;

  oldPos.forEach(
    (v,id)=>{

      if(nodes.has(id))
        kept++;
      else
        removed.push(v);

    }
  );

  newIds.forEach(
    id=>{

      if(!oldPos.has(id))
        added.push(id);

    }
  );

  const partial =
    removed.length &&
    added.length &&
    oldPos.size &&
    kept>=Math.min(oldPos.size,newIds.length)*.5;

  if(fresh)
    window.__burstPending = -1e9;

  // kategori / halaman baru: koin lama meletus, koin baru muncul dengan letupan
  if(!partial){

    if(!fresh)
      return;

    removed.slice(0,12).forEach(
      o=>spawnBurst(
        o.x+o.size/2,
        o.y+o.size/2,
        o.size
      )
    );

    newIds.slice(0,60).forEach(
      (id,k)=>{

        const node =
          nodes.get(id);

        const p =
          positions.get(id);

        if(!node||!p)
          return;

        const body =
          node.querySelector('.coinBody');

        if(k<12)
          spawnBurst(
            p.x+p.size/2,
            p.y+p.size/2,
            p.size
          );

        if(body)
          body.style.animationDelay =
            (k*14)+'ms';

        node.classList.add('popIn');

        setTimeout(
          ()=>{
            node.classList.remove('popIn');
            if(body)
              body.style.animationDelay='';
          },
          1400
        );

      }
    );

    return;

  }

  // koin yang tidak berganti tetap di tempatnya
  newIds.forEach(
    id=>{

      const o =
        oldPos.get(id);

      const p =
        positions.get(id);

      if(!o||!p)
        return;

      p.x =
        p.homeX =
          o.hx;

      p.y =
        p.homeY =
          o.hy;

      clampPosition(p);

      p.homeX =
        p.x;

      p.homeY =
        p.y;

      applyPosition(id);

    }
  );

  // koin baru menempati tempat koin yang meletus
  added
    .slice(0,12)
    .forEach(
      (id,k)=>{

        const o =
          removed[k];

        const p =
          positions.get(id);

        const node =
          nodes.get(id);

        if(!node||!p)
          return;

        if(o){

          p.x =
            o.hx+
            (o.size-p.size)/2;

          p.y =
            o.hy+
            (o.size-p.size)/2;

          clampPosition(p);

          p.homeX =
            p.x;

          p.homeY =
            p.y;

          applyPosition(id);

          spawnBurst(
            o.x+o.size/2,
            o.y+o.size/2,
            o.size
          );

        }

        node.classList.add(
          'popIn'
        );

        setTimeout(
          ()=>node.classList.remove('popIn'),
          700
        );

      }
    );

}


/* =====================================================
   LOGO COIN  (rantai cadangan: coin._imgs -> huruf)
===================================================== */

function letterLogo(sym){
  const raw=String(sym||'?');
  const t=raw.replace(/[^A-Za-z0-9]/g,'').slice(0,2).toUpperCase()||'?';
  let h=0; for(let i=0;i<raw.length;i++) h=(h*31+raw.charCodeAt(i))%360;
  return 'data:image/svg+xml;utf8,'+encodeURIComponent(
    '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64"><circle cx="32" cy="32" r="32" fill="hsl('+h+',45%,32%)"/>'+
    '<text x="32" y="41" font-size="26" font-weight="700" font-family="Arial,sans-serif" text-anchor="middle" fill="#fff">'+t+'</text></svg>');
}

// peta CMC id (simbol|nama -> id) agar semua koin punya logo CMC
const cmcIdMap=new Map();
function cmcIndex(d){
  (d||[]).forEach(x=>{
    if(!x||!x.id) return;
    const sy=String(x.symbol||'').toLowerCase();
    cmcIdMap.set(sy+'|'+String(x.name||'').toLowerCase().replace(/[^a-z0-9]/g,''),x.id);
  });
}
async function fetchCMCList(){
  const d=await fetchCMCListRaw();
  cmcIndex(d);
  idbSet('cmcids',{t:Date.now(),m:Array.from(cmcIdMap)});
  return d;
}
const logoWin=new Map();
const logoCache=new Map();   // id koin -> data URL 64px (tersimpan di IndexedDB)   // koin -> sumber yang berhasil
const WSRV='https://wsrv.nl/?w=128&h=128&fit=cover&url=';
function logoChain(coin){
  const sym=String(coin.symbol||'').toLowerCase().replace(/[^a-z0-9]/g,'');
  const nm=String(coin.name||'').toLowerCase().replace(/[^a-z0-9]/g,'');
  const cid=coin._cmcId||cmcIdMap.get(sym+'|'+nm);
  const C='https://s2.coinmarketcap.com/static/img/coins/';
  const w=logoWin.get(coin.id);
  const l=[logoCache.get(coin.id),w,coin.image];
  if(cid) l.push(C+'64x64/'+cid+'.png');
  if(coin.image) l.push(WSRV+encodeURIComponent(coin.image));
  if(cid) l.push(WSRV+encodeURIComponent(C+'128x128/'+cid+'.png'));
  if(sym){
    l.push('https://assets.coincap.io/assets/icons/'+sym+'@2x.png');
    l.push('https://cdn.jsdelivr.net/gh/spothq/cryptocurrency-icons@master/128/color/'+sym+'.png');
  }
  return l.filter((v,k)=>v&&l.indexOf(v)===k);
}
function attachLogo(img,coin){
  if(!img) return;
  img.referrerPolicy='no-referrer';
  img.decoding='async';
  img.loading='eager';
  const base=coin._imgs||null;
  let i=-1, timer=0, tries=0;
  const list=()=>base?base.filter(Boolean):logoChain(coin);
  function next(){
    clearTimeout(timer);
    const l=list();
    i++;
    if(i>=l.length){
      img.onerror=img.onload=null;
      img.src=letterLogo(coin.symbol);
      // coba ulang sekali setelah 45 detik (jaringan / CDN sempat bermasalah)
      if(tries++<1) setTimeout(()=>{ if(img.isConnected){ i=-1; img.onerror=next; img.onload=ok; next(); } },45000);
      return;
    }
    img.src=l[i];
    timer=setTimeout(()=>{ if(!(img.complete&&img.naturalWidth)) next(); },6500);
  }
  function ok(){
    clearTimeout(timer);
    if(img.naturalWidth<2) return next();
    const l=list();
    if(!base&&l[i]&&!l[i].startsWith('data:')) logoWin.set(coin.id,l[i]);
  }
  img.onerror=next;
  img.onload=ok;
  next();
}
