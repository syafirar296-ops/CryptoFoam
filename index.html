<script id="coinWebsiteJS">
(function(){
  var old=document.getElementById('coinWebsite');
  if(!old||!old.parentNode) return;
  var btn=old.cloneNode(true);           /* buang handler lama (alert bawaan) */
  old.parentNode.replaceChild(btn,old);

  var note=document.createElement('div');
  note.id='webNotice';
  note.setAttribute('role','status');
  document.body.appendChild(note);
  var tm=null;
  function notice(html,ms){
    note.innerHTML=html;
    note.classList.add('show');
    clearTimeout(tm);
    if(ms!==0) tm=setTimeout(function(){ note.classList.remove('show'); },ms||2200);
  }
  function hideNotice(){ clearTimeout(tm); note.classList.remove('show'); }

  function clean(u){
    u=String(u||'').trim();
    if(!u || /^(javascript|data):/i.test(u)) return '';
    if(!/^https?:\/\//i.test(u)) u='https://'+u;
    try{ new URL(u); }catch(e){ return ''; }
    return u;
  }
  function firstUrl(list){
    if(!Array.isArray(list)) list=[list];
    for(var i=0;i<list.length;i++){
      var x=list[i]; if(x&&typeof x==='object') x=x.url||x.link;
      var c=clean(x); if(c) return c;
    }
    return '';
  }

  /* ambil JSON: langsung dulu, lalu lewat proxy CORS bila gagal */
  async function getJSON(url,ms){
    var routes=(typeof CG_ROUTES!=='undefined'&&CG_ROUTES.length)?CG_ROUTES.slice(0,2):[function(u){return u;}];
    for(var i=0;i<routes.length;i++){
      try{
        var r=await Promise.race([
          fetch(routes[i](url)),
          new Promise(function(_,rej){ setTimeout(function(){rej(new Error('timeout'));},ms||7000); })
        ]);
        if(r.status===404) return null;
        if(!r.ok) continue;
        return await r.json();
      }catch(e){}
    }
    return null;
  }

  var DS_CHAIN={eth:'ethereum',polygon_pos:'polygon',avax:'avalanche',bsc:'bsc'};
  var GT_NET={ethereum:'eth',polygon:'polygon_pos',avalanche:'avax'};
  function dsChain(n){ n=String(n||'').toLowerCase(); return DS_CHAIN[n]||n; }
  function gtNet(n){ n=String(n||'').toLowerCase(); return GT_NET[n]||n; }

  /* DexScreener: website dari info pair (pilih pair dengan likuiditas terbesar) */
  function siteFromPairs(pairs){
    if(!Array.isArray(pairs)) return '';
    pairs=pairs.slice().sort(function(a,b){
      return ((b.liquidity&&b.liquidity.usd)||0)-((a.liquidity&&a.liquidity.usd)||0);
    });
    for(var i=0;i<pairs.length;i++){
      var w=pairs[i]&&pairs[i].info&&pairs[i].info.websites;
      var u=firstUrl(w||[]);
      if(u) return u;
    }
    return '';
  }
  async function dsByToken(addr){
    if(!addr) return '';
    var j=await getJSON('https://api.dexscreener.com/latest/dex/tokens/'+encodeURIComponent(addr));
    return siteFromPairs(j&&j.pairs);
  }
  async function dsByPair(chain,pool){
    if(!chain||!pool) return {site:'',token:''};
    var j=await getJSON('https://api.dexscreener.com/latest/dex/pairs/'+encodeURIComponent(dsChain(chain))+'/'+encodeURIComponent(pool));
    var pairs=(j&&(j.pairs||(j.pair?[j.pair]:[])))||[];
    var tok=(pairs[0]&&pairs[0].baseToken&&pairs[0].baseToken.address)||'';
    return {site:siteFromPairs(pairs),token:tok};
  }
  /* GeckoTerminal: info token */
  async function gtInfo(net,addr){
    if(!net||!addr||net==='-') return '';
    var j=await getJSON('https://api.geckoterminal.com/api/v2/networks/'+encodeURIComponent(gtNet(net))+'/tokens/'+encodeURIComponent(addr)+'/info');
    var at=j&&j.data&&j.data.attributes;
    return at?firstUrl(at.websites||[]):'';
  }

  /* koin DEX / Terminal / four.meme / Binance Alpha */
  async function resolveTerminal(c){
    var src=String(c._source||'');
    var net=c._network, pool=c._pool, addr=c._addr||'';
    var site='';
    if(src==='four.meme'||src==='Binance Alpha'){
      addr=addr||pool;                                  /* _pool = alamat token */
      site=await dsByToken(addr);
      if(!site) site=await gtInfo(net==='-'?'bsc':net,addr);
      if(!site&&src==='four.meme') site=await gtInfo('bsc',addr);
    }else{
      var tok=addr;
      var r=await dsByPair(net,pool);
      site=r.site; tok=tok||r.token;
      if(!site&&tok) site=await gtInfo(net,tok);
      if(!site&&tok) site=await dsByToken(tok);
    }
    return site;
  }

  /* koin CoinGecko / Binance (CEX) / CMC */
  async function resolveMarket(c){
    var site='';
    try{
      if(typeof getCoinDetail==='function'){
        var d=await getCoinDetail(c);
        site=firstUrl((d&&d.links&&d.links.homepage)||[]);
      }
    }catch(e){}
    if(!site && typeof cdFetchCMC==='function'){        /* cadangan: CoinMarketCap */
      try{
        var v=await cdFetchCMC(c);
        site=firstUrl((v&&v.urls&&v.urls.website)||[]);
      }catch(e){}
    }
    if(!site){                                          /* cadangan: cari id CoinGecko dari simbol */
      try{
        var sym=String(c.symbol||'').toLowerCase();
        var nm=function(x){return String(x||'').toLowerCase().replace(/[^a-z0-9]/g,'');};
        var j=await getJSON('https://api.coingecko.com/api/v3/search?query='+encodeURIComponent(c.symbol||c.name||''));
        var hit=((j&&j.coins)||[]).find(function(x){
          return String(x.symbol||'').toLowerCase()===sym && (nm(x.name)===nm(c.name)||!c.name);
        })||((j&&j.coins)||[]).find(function(x){ return String(x.symbol||'').toLowerCase()===sym; });
        if(hit&&hit.id&&hit.id!==c.id){
          var d2=await getJSON('https://api.coingecko.com/api/v3/coins/'+encodeURIComponent(hit.id)+'?localization=false&tickers=false&market_data=false&community_data=false&developer_data=false&sparkline=false');
          site=firstUrl((d2&&d2.links&&d2.links.homepage)||[]);
        }
      }catch(e){}
    }
    return site;
  }

  var cache=new Map();
  async function resolveSite(c){
    if(!c) return '';
    if(cache.has(c.id)) return cache.get(c.id);
    var site=clean(c._website||'');
    try{
      if(!site) site=(c._terminal||/^(dx_|gt_|fm_|ba_)/.test(String(c.id||'')))
        ? await resolveTerminal(c)
        : await resolveMarket(c);
      /* cadangan silang: koin DEX yang ternyata ada di CoinGecko */
      if(!site && c._terminal && typeof getCoinDetail==='function' && !/^(dx_|gt_|fm_|ba_)/.test(String(c.id||''))){
        site=await resolveMarket(c);
      }
    }catch(e){ console.warn('website lookup',e); }
    if(site) cache.set(c.id,site);   /* hanya simpan hasil sukses; gagal boleh dicoba lagi */
    return site;
  }

  var busy=false;
  btn.addEventListener('click',async function(e){
    e.preventDefault(); e.stopPropagation();
    if(busy) return; busy=true;
    var coin=(typeof selectedCoin!=='undefined')?selectedCoin:null;
    notice('Mencari website…',0);
    var url='';
    try{ url=await resolveSite(coin); }catch(err){ console.warn(err); }
    busy=false;
    if(url){
      hideNotice();
      var w=window.open(url,'_blank','noopener,noreferrer');
      if(!w) location.href=url;
    }else{

<script id="coinWebsiteFix">
(function(){
  var btn=document.getElementById('coinWebsite');
  if(!btn) return;
  var PFX='cfweb_', TTL=30*24*3600*1000, mem={}, busy={};

  function firstUrl(a){
    return (a||[]).filter(function(x){return typeof x==='string' && /^https?:\/\//i.test(x);})[0]||'';
  }
  function slug(t){ return String(t||'').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,''); }

  // ---- cache permanen (localStorage, 30 hari) + memori ----
  function cacheGet(id){
    if(mem[id]) return mem[id];
    try{
      var raw=localStorage.getItem(PFX+id);
      if(raw){
        var o=JSON.parse(raw);
        if(o && o.u && Date.now()-o.t<TTL){ mem[id]=o.u; return o.u; }
        localStorage.removeItem(PFX+id);
      }
    }catch(_){}
    return '';
  }
  function cacheSet(id,u){
    mem[id]=u;
    try{ localStorage.setItem(PFX+id,JSON.stringify({u:u,t:Date.now()})); }
    catch(_){
      try{
        Object.keys(localStorage).filter(function(k){return k.indexOf(PFX)===0;})
          .slice(0,200).forEach(function(k){localStorage.removeItem(k);});
        localStorage.setItem(PFX+id,JSON.stringify({u:u,t:Date.now()}));
      }catch(__){}
    }
  }
  // detail yang sudah dimuat popup (tanpa jaringan)
  function memDetailUrl(c){
    try{
      var d=cdMem.get(c.id);
      return firstUrl(d&&d.links&&d.links.homepage);
    }catch(_){ return ''; }
  }
  function syncUrl(c){
    var u=cacheGet(c.id);
    if(u) return u;
    u=memDetailUrl(c);
    if(u) cacheSet(c.id,u);
    return u;
  }

  // ---- ambil dari API (hanya hasil sukses yang disimpan) ----
  async function fetchReal(c){
    var url='';
    for(var t=0;t<2 && !url;t++){
      try{
        var d=await getCoinDetail(c);
        url=firstUrl(d&&d.links&&d.links.homepage);
        if(!url) break;
      }catch(e){
        try{ cdMem.delete(c.id); }catch(_){}
      }
    }
    if(!url){
      try{ url=firstUrl(cdFromCMC(await cdFetchCMC(c)).links.homepage); }catch(_){}
    }
    if(url) cacheSet(c.id,url);
    return url;
  }
  function fallback(c){
    if(c._source==='cmc' || c._cmcId)
      return 'https://coinmarketcap.com/currencies/'+slug(c.name||c.id)+'/';
    return 'https://www.coingecko.com/en/coins/'+encodeURIComponent(c.id);
  }

  // ---- prefetch diam-diam saat popup koin dibuka, supaya klik pertama pun instan ----
  var lastId='';
  setInterval(function(){
    var c=null;
    try{ c=selectedCoin; }catch(_){}
    if(!c || !c.id || c._terminal || c.id===lastId) return;
    lastId=c.id;
    if(cacheGet(c.id) || busy[c.id]) return;
    busy[c.id]=1;
    fetchReal(c).then(function(){ delete busy[c.id]; },function(){ delete busy[c.id]; });
  },400);

  btn.addEventListener('click',function(e){
    var c=null;
    try{ c=selectedCoin; }catch(_){}
    if(!c || c._terminal) return;            // koin terminal tetap pakai alur lama (sudah tanpa API)
    e.stopImmediatePropagation();
    e.preventDefault();

    // cache ada -> langsung buka, tanpa loading
    var hit=syncUrl(c);
    if(hit){ window.open(hit,'_blank'); return; }

    // belum ada cache -> cari sekali, lalu tersimpan untuk klik berikutnya
    var win=window.open('','_blank');
    try{
      if(win){
        win.document.write('<!doctype html><meta name="viewport" content="width=device-width,initial-scale=1"><title>Website</title><body style="margin:0;background:#000;color:#8b9298;font:14px sans-serif;display:flex;align-items:center;justify-content:center;height:100vh">Membuka website...</body>');
        win.document.close();
      }
    }catch(_){}
    fetchReal(c).then(function(u){
      u=u||fallback(c);
      if(win){ try{ win.opener=null; }catch(_){} win.location.href=u; }
      else window.open(u,'_blank');
    });
  },true);
})();
</script>

<script id="secMenuJS">
(function(){
  var SVG='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">';
  var ICO_SEC=SVG+'<path d="M12 3l7 3v5c0 4.5-3 8.2-7 10-4-1.8-7-5.5-7-10V6l7-3z"/><path d="M9 12l2 2 4-4"/></svg>';
  var ICO_ARK=SVG+'<circle cx="12" cy="12" r="9.5"/><path d="M7.5 17L12 6.5 16.5 17M9.2 13.5h5.6"/></svg>';
  var ICO_RUG=SVG+'<path d="M12 3l7 3v5c0 4.5-3 8.2-7 10-4-1.8-7-5.5-7-10V6l7-3z"/><path d="M12 8v5M12 16v.5"/></svg>';
  var CHAINS=[['1','Ethereum'],['56','BNB Chain'],['8453','Base'],['42161','Arbitrum'],['137','Polygon'],['10','Optimism'],['43114','Avalanche'],['sol','Solana']];

  function mk(tag,cls,txt){ var e=document.createElement(tag); if(cls) e.className=cls; if(txt!=null) e.textContent=txt; return e; }
  function input(ph){
    var i=mk('input','arkInput'); i.type='text'; i.placeholder=ph;
    ['autocomplete','autocapitalize','spellcheck'].forEach(function(k){ i.setAttribute(k,k==='spellcheck'?'false':'off'); });
    return i;
  }
  function btn(txt,fn){ var b=mk('button','arkBtn',txt); b.type='button'; b.addEventListener('click',fn); return b; }
  function open(u){ window.open(u,'_blank'); }

  function item(key,icon,title,body){
    var it=mk('div','secItem'); it.dataset.k=key;
    var h=mk('button','secHead'); h.type='button';
    h.innerHTML=icon+'<span></span><i>›</i>'; h.querySelector('span').textContent=title;
    var bd=mk('div','secBody'); bd.appendChild(body);
    h.addEventListener('click',function(){
      var was=it.classList.contains('open');
      var all=it.parentNode.querySelectorAll('.secItem'); for(var i=0;i<all.length;i++) all[i].classList.remove('open');
      if(!was) it.classList.add('open');
    });
    it.appendChild(h); it.appendChild(bd); return it;
  }

  /* ---------- Arkham ---------- */
  function arkham(){
    var w=mk('div','arkBox'), inp=input('Paste alamat wallet / contract'), row=mk('div','arkRow');
    function go(kind){ var a=inp.value.trim(); if(!a){ inp.focus(); return; } open('https://intel.arkm.com/explorer/'+kind+'/'+encodeURIComponent(a)); }
    row.appendChild(btn('Wallet',function(){ go('address'); }));
    row.appendChild(btn('Token',function(){ go('token'); }));
    row.appendChild(btn('Arkham',function(){ open('https://intel.arkm.com'); }));
    w.appendChild(inp); w.appendChild(row); return w;
  }

  /* ---------- Rug Checker ---------- */
  function rugChecker(){
    var w=mk('div','arkBox'), inp=input('Paste contract token'), sel=mk('select','secSel'), row=mk('div','arkRow'), res=mk('div','secRes');
    CHAINS.forEach(function(c){ var o=mk('option',null,c[1]); o.value=c[0]; sel.appendChild(o); });
    function kind(a){
      if(/^0x[a-fA-F0-9]{40}$/.test(a)) return 'evm';
      if(/^[1-9A-HJ-NP-Za-km-z]{32,44}$/.test(a)) return 'sol';
      return '';
    }
    function cid(){ return /^\d+$/.test(sel.value)?sel.value:'1'; }
    function line(label,val,cls){
      var r=mk('div','sr'); r.appendChild(mk('span',null,label)); r.appendChild(mk('span',cls,val)); res.appendChild(r);
    }
    function pct(v){ var n=Number(v); return Number.isFinite(n)?(n*100).toFixed(1).replace(/\.0$/,'')+'%':'-'; }
    async function check(){
      var a=inp.value.trim(); if(!a){ inp.focus(); return; }
      var k=kind(a); res.innerHTML='';
      if(!k){ res.textContent='Alamat tidak valid.'; return; }
      res.textContent='Memeriksa…';
      try{
        if(k==='evm'){
          var r=await fetch('https://api.gopluslabs.io/api/v1/token_security/'+cid()+'?contract_addresses='+encodeURIComponent(a));
          var j=await r.json(); var d=j&&j.result&&j.result[a.toLowerCase()];
          if(!d) throw new Error('kosong');
          res.innerHTML='';
          if(d.is_honeypot!=null) line('Honeypot',d.is_honeypot==='1'?'Ya':'Tidak',d.is_honeypot==='1'?'bad':'good');
          if(d.buy_tax!=null&&d.buy_tax!=='') line('Pajak beli',pct(d.buy_tax),Number(d.buy_tax)>0.1?'bad':'good');
          if(d.sell_tax!=null&&d.sell_tax!=='') line('Pajak jual',pct(d.sell_tax),Number(d.sell_tax)>0.1?'bad':'good');
          if(d.is_open_source!=null) line('Kode open source',d.is_open_source==='1'?'Ya':'Tidak',d.is_open_source==='1'?'good':'warn');
          if(d.is_mintable!=null) line('Bisa mint token baru',d.is_mintable==='1'?'Ya':'Tidak',d.is_mintable==='1'?'warn':'good');
          if(d.is_proxy!=null) line('Kontrak proxy',d.is_proxy==='1'?'Ya':'Tidak',d.is_proxy==='1'?'warn':'good');
          if(d.hidden_owner!=null) line('Owner tersembunyi',d.hidden_owner==='1'?'Ya':'Tidak',d.hidden_owner==='1'?'bad':'good');
          if(d.can_take_back_ownership!=null) line('Owner bisa ambil alih',d.can_take_back_ownership==='1'?'Ya':'Tidak',d.can_take_back_ownership==='1'?'bad':'good');
          if(d.cannot_sell_all!=null) line('Tidak bisa jual semua',d.cannot_sell_all==='1'?'Ya':'Tidak',d.cannot_sell_all==='1'?'bad':'good');
          if(d.is_blacklisted!=null) line('Ada blacklist',d.is_blacklisted==='1'?'Ya':'Tidak',d.is_blacklisted==='1'?'warn':'good');
          if(!res.children.length) throw new Error('kosong');
        }else{
          var r2=await fetch('https://api.rugcheck.xyz/v1/tokens/'+encodeURIComponent(a)+'/report/summary');
          var j2=await r2.json();
          if(!j2||(j2.score==null&&!j2.risks)) throw new Error('kosong');
          res.innerHTML='';
          if(j2.score_normalised!=null) line('Skor risiko RugCheck',String(j2.score_normalised)+' (makin tinggi makin berisiko)','warn');
          var rs=j2.risks||[];
          if(!rs.length) line('Risiko terdeteksi','Tidak ada','good');
          rs.slice(0,10).forEach(function(x){
            var lv=String(x.level||'').toLowerCase();
            line(String(x.name||'Risiko'),lv||'info',lv==='danger'?'bad':(lv==='warn'?'warn':'good'));
          });
        }
        res.appendChild(mk('div','note','Hasil otomatis, bukan jaminan keamanan. Selalu cek ulang sebelum membeli.'));
      }catch(e){
        res.textContent='Hasil tidak bisa dimuat. Buka lewat tombol GoPlus / RugCheck di atas.';
      }
    }
    row.appendChild(btn('Cek',check));
    row.appendChild(btn('GoPlus',function(){
      var a=inp.value.trim(); if(!a){ inp.focus(); return; }
      open(kind(a)==='sol'?'https://gopluslabs.io/token-security/solana/'+encodeURIComponent(a)
                          :'https://gopluslabs.io/token-security/'+cid()+'/'+encodeURIComponent(a));
    }));
    row.appendChild(btn('RugCheck',function(){
      var a=inp.value.trim(); if(!a){ inp.focus(); return; }
      open('https://rugcheck.xyz/tokens/'+encodeURIComponent(a));
    }));
    w.appendChild(inp); w.appendChild(sel); w.appendChild(row); w.appendChild(res); return w;
  }

  function add(){
    var row=document.querySelector('#pageMenu .subMenu[data-lp] [data-w3]');
    if(!row||row.querySelector('.secBtn')) return;
    function tile(icon,label,url){
      var b=mk('button','subToggle secBtn'); b.type='button'; b.title=label; b.setAttribute('aria-label',label);
      b.innerHTML=icon.replace('<svg ','<svg class="menuIcon" style="color:#f4f1e6" ')+'<span class="chainName"></span>';
      b.querySelector('.chainName').textContent=label;
      b.addEventListener('click',function(){ try{ window.open(url,'_blank','noopener'); }catch(e){} });
      row.appendChild(b);
    }
    tile(ICO_ARK,'Arkham','https://intel.arkm.com');
    tile(ICO_RUG,'Rug Check','https://rugcheck.xyz');
    // Favorite & News: pindah dari baris ikon atas ke sini (tombol asli disembunyikan, dipanggil lewat tile)
    var fav=document.querySelector('#pageMenu .menuTools [data-view="fav"]');
    var news=document.querySelector('#pageMenu .menuTools [data-view="news"]');
    function proxy(src,label,fn){
      if(!src) return;
      var svg=src.querySelector('svg'); if(!svg) return;
      var b=mk('button','subToggle secBtn'); b.type='button'; b.title=label; b.setAttribute('aria-label',label);
      var ic=svg.outerHTML.replace('<svg ','<svg class="menuIcon" style="color:#f4f1e6" ');
      b.innerHTML=ic+'<span class="chainName"></span>';
      b.querySelector('.chainName').textContent=label;
      b.addEventListener('click',function(e){ e.preventDefault(); fn(); });
      row.appendChild(b);
    }
    proxy(fav,'Favorite',function(){
      var ev=new PointerEvent('pointerdown',{bubbles:true,cancelable:true}); ev.__tap=true; fav.dispatchEvent(ev);
    });
    proxy(news,'News',function(){ news.click(); });
  }
  add();
  var pm0=document.getElementById('pageMenu');
  if(pm0) new MutationObserver(add).observe(pm0,{childList:true,subtree:true});
})();
</script>

<script id="hdrToolsJS">
(function(){
  var tools  = document.getElementById('hdrTools');

  if(!tools||!panels) return;

  function open(k){
    cur = k||null;
    panels.classList.toggle('open',!!cur);
    [].forEach.call(panels.querySelectorAll('.hdrPanel'),function(p){
      p.classList.toggle('on',!!cur);
    });
    [].forEach.call(tools.querySelectorAll('.hdrBtn'),function(b){
      b.classList.toggle('on',b.getAttribute('data-p')===cur);
    });
    if(cur&&window.__hdrSync) window.__hdrSync();
  }

  tools.addEventListener('click',function(e){
    var b = e.target.closest('.hdrBtn');
    if(!b) return;
    var k = b.getAttribute('data-p');
    open(cur===k?null:k);
  });

  // ketuk di luar = tutup (ketukan tetap diteruskan)
  window.__hdrClose = function(e){
    if(!cur) return false;
    var t = e.target;
    if(t && t.closest && t.closest('#hdrTools,#hdrPanels')) return false;
    open(null);
    return true;
  };
})();
</script>

<script id="returnToCoinJS">
/* Dari pop up detail koin buka link luar (chart / website / explorer dll):
   saat kembali ke aplikasi dan halaman dimuat ulang, pop up koin yang sama dibuka SATU kali dengan fade halus.
   Tidak ada proses otomatis lain: setelah itu pengguna bebas menutup pop up dan mengetuk layar. */
(function(){
  var KEY='cf_ret_coin', TTL=5*60*1000;
  var ov=document.getElementById('overlay');
  if(!ov) return;
  var root=document.documentElement;

  function slim(c){
    try{
      return JSON.parse(JSON.stringify(c,function(k,v){
        if(typeof v==='function') return undefined;
        if(Array.isArray(v) && v.length>60) return undefined;
        return v;
      }));
    }catch(_){ return {id:c && c.id}; }
  }
  function read(){
    try{
      var o=JSON.parse(localStorage.getItem(KEY)||'null');
      if(o && o.id && o.x===1 && Date.now()-o.t<TTL) return o;
    }catch(_){}
    return null;
  }
  function isOpen(){ return ov.classList.contains('show'); }
  function save(){
    try{
      if(!isOpen()) return;
      var c=(typeof selectedCoin!=='undefined')?selectedCoin:null;
      if(!c || !c.id) return;
      localStorage.setItem(KEY,JSON.stringify({id:c.id,x:1,t:Date.now(),coin:slim(c)}));
    }catch(_){}
  }
  function clear(){ try{ localStorage.removeItem(KEY); }catch(_){} }
  function reveal(){ root.classList.remove('cf-restoring'); }

  window.__cfSaveCoin=save;
  window.__cfKeepCoin=function(){ return isOpen(); };

  // catatan disimpan saat membuka link luar / saat aplikasi masuk background dengan pop up terbuka
  ['pointerdown','click','touchstart'].forEach(function(ev){
    document.addEventListener(ev,function(e){
      var t=e.target; if(!t||!t.closest) return;
      if(t.closest('#blockExplorer,#coinWebsite,#tradingViewIcon,.arkhamContract,.expContract,a[href^="http"]')) save();
    },true);
  });
  // semua link luar yang dibuka dari pop up (chart, website, explorer, Arkham, dll; semua kategori)
  try{
    var _wo=window.open;
    window.open=function(){
      try{ if(isOpen()) save(); }catch(_){}
      return _wo.apply(window,arguments);
    };
  }catch(_){}
  document.addEventListener('visibilitychange',function(){
    if(!document.hidden) setTimeout(clear,1500);   // kembali tanpa muat ulang: pop up masih terbuka, catatan tidak dipakai lagi
  });
  // pop up ditutup pengguna -> catatan dihapus (buka aplikasi nanti tidak memunculkan pop up)
  new MutationObserver(function(){ if(!isOpen() && !window.__cfRestoring) clear(); }).observe(ov,{attributes:true,attributeFilter:['class']});

  // pulihkan SEKALI setelah halaman dimuat ulang
  var o=read();
  clear();
  if(!o){ reveal(); return; }

  var tries=0;
  function restore(){
    var ready=(typeof openPopup==='function' && typeof coinMap!=='undefined');
    if(!ready){
      if(++tries<40) return setTimeout(restore,100);
      return reveal();
    }
    if(!coinMap.get(o.id) && o.coin && o.coin.id) coinMap.set(o.id,o.coin);
    if(!coinMap.get(o.id)) return reveal();
    window.__cfRestoring=true;
    ov.style.transition='none';
    ov.style.opacity='0';
    try{ openPopup(o.id); }catch(_){ ov.style.opacity=''; ov.style.transition=''; return reveal(); }
    requestAnimationFrame(function(){ requestAnimationFrame(function(){
      ov.style.transition='opacity .32s ease';

<script id="virtChartJS">
(function(){
  var $=function(i){return document.getElementById(i);};
  var box=null, raf=0, alive=false, vcTf='1d', TFS=['1h','4h','1d','1w','1m','1y'], TFV={'1h':.55,'4h':.8,'1d':1,'1w':1.6,'1m':2.4,'1y':3.8};

  function rng(seed){ var h=2166136261>>>0; for(var i=0;i<seed.length;i++){ h^=seed.charCodeAt(i); h=Math.imul(h,16777619); }
    return function(){ h+=0x6D2B79F5; var t=h; t=Math.imul(t^t>>>15,t|1); t^=t+Math.imul(t^t>>>7,t|61); return ((t^t>>>14)>>>0)/4294967296; }; }
  function fmt(v){ try{ return price(v); }catch(_){ return '$'+Number(v).toPrecision(4); } }

  function stop(){ if(box){ try{ var c0=selectedCoin,pe0=$('pPrice'); if(pe0&&c0) pe0.textContent=fmt(Number(c0.current_price)||0); }catch(_){} } alive=false; cancelAnimationFrame(raf); if(box&&box.parentNode) box.parentNode.removeChild(box); box=null; }

  function start(c){
    stop();
    var d=$('pDescription'); if(!d||!d.parentNode) return;
    var P=Number(c.current_price)||1;
    var ch=Number(c.price_change_percentage_24h)||0;
    box=document.createElement('div'); box.id='pVirtChart';
    box.innerHTML='<canvas></canvas><div class="vcTfs">'+TFS.map(function(t){return '<button type="button" class="vcTf'+(t===vcTf?' on':'')+'" data-tf="'+t+'">'+t+'</button>';}).join('')+'</div><div class="vcPow">Powered by TradingView<span class="vcTv">TV</span></div>';
    d.parentNode.insertBefore(box,d);
    var cv=box.querySelector('canvas'), ctx=cv.getContext('2d');
    box.querySelector('.vcTfs').addEventListener('click',function(e){ var b=e.target.closest('.vcTf'); if(!b) return; vcTf=b.getAttribute('data-tf'); start(c); });
    var R=rng(String(c.id||c.symbol||'x')+vcTf);
    var N=46, vol=Math.min(0.06,Math.max(0.004,(Math.abs(ch)/100/5+0.008)*TFV[vcTf]));
    // harga virtual (relatif, 1 = harga sekarang), dibangun mundur dari harga sekarang
    var cs=[], px=1;
    for(var i=0;i<N;i++){
      var o=px, tr=(ch>=0?-1:1)*0.0015; // mundur: kebalikan tren
      var cl=o*(1+tr+(R()-0.5)*2*vol);
      var hi=Math.max(o,cl)*(1+R()*vol*0.7), lo=Math.min(o,cl)*(1-R()*vol*0.7);
      cs.unshift({o:cl,c:o,h:hi,l:lo,v:0.3+R()*0.7}); px=cl;
    }
    // susun ulang: o/c urut waktu (tiap candle: open = close sebelumnya)
    for(var j=1;j<N;j++){ cs[j].o=cs[j-1].c; cs[j].h=Math.max(cs[j].h,cs[j].o,cs[j].c); cs[j].l=Math.min(cs[j].l,cs[j].o,cs[j].c); }
    var shift=0, last=performance.now(), tickAt=0, W=0,H=0,dpr=Math.min(2,window.devicePixelRatio||1);
    alive=true; var born=performance.now(); box.__dirty=true;

    function size(){ var r=cv.getBoundingClientRect(); W=r.width; H=r.height; cv.width=Math.round(W*dpr); cv.height=Math.round(H*dpr); ctx.setTransform(dpr,0,0,dpr,0,0); }
    size();

    function frame(t){
      if(!alive) return;
      if(!box||!box.isConnected){ alive=false; return; }
      if(performance.now()-born>1800){ alive=false; try{ var pe9=$('pPrice'); if(pe9) pe9.textContent=fmt(P*cs[cs.length-1].c); }catch(_){} draw(); return; }
      var dt=Math.min(100,t-last); last=t;
      var cur=cs[cs.length-1];
      // candle terakhir bergerak hidup
      if(t>tickAt){ tickAt=t+380;
        var drift=(1-cur.c)*0.25;
        cur.c=Math.min(1.006,Math.max(0.994,cur.c*(1+drift*0.5+(R()-0.5)*0.0045)));
        var pe=$('pPrice'); if(pe) pe.textContent=fmt(P*cur.c);
        cur.h=Math.max(cur.h,cur.c); cur.l=Math.min(cur.l,cur.c); cur.v=Math.min(1,cur.v+R()*0.01);
      }
      // candle baru tiap ~2.6 detik, geser halus
      cur.age=(cur.age||0)+dt;
      if(cur.age>7000){
        var nc={o:1,c:1,h:1,l:1,v:0.2+R()*0.3,age:0};
        cs.push(nc); cs.shift(); shift=1;
      }
      if(shift>0){ shift=Math.max(0,shift-dt/900); }
      draw();
      raf=requestAnimationFrame(frame);
    }

    function draw(){
      if(!W) size();
      ctx.clearRect(0,0,W,H);
      var padR=58, padT=8, padB=10, cw=(W-padR-6)/N, plotH=H-padT-padB, volH=0;
      var mn=Infinity,mx=-Infinity;
      for(var i=0;i<cs.length;i++){ if(cs[i].l<mn)mn=cs[i].l; if(cs[i].h>mx)mx=cs[i].h; }
      var pad=(mx-mn)*0.12||0.001; mn-=pad; mx+=pad;
      var py=function(v){ return padT+(mx-v)/(mx-mn)*(plotH-volH-4); };
      ctx.font="10px Inter, sans-serif"; ctx.textBaseline='middle'; ctx.textAlign='right';
      // grid
      ctx.strokeStyle='rgba(255,255,255,0)'; ctx.lineWidth=1; ctx.fillStyle='#7b838a';
      for(var g=0;g<=4;g++){ var gv=mn+(mx-mn)*g/4, gy=py(gv); ctx.beginPath(); ctx.moveTo(0,gy); ctx.lineTo(W-padR,gy); ctx.stroke(); ctx.fillText(fmt(P*gv),W-2,gy); }
      var off=shift*cw, xs=[], ys=[];
      for(var k=0;k<cs.length;k++){ xs.push(k*cw+cw/2+off); ys.push(py(cs[k].c)); }
      var lineUp=cs[cs.length-1].c>=cs[0].c, lineCol=lineUp?'#39ff14':'#fb038d';
      // animasi awal: garis & area terbuka dari kiri ke kanan
      var rp=Math.min(1,(performance.now()-born)/1100); rp=1-Math.pow(1-rp,3);
      ctx.save(); ctx.beginPath(); ctx.rect(0,0,rp>=1?W:(W-padR)*rp,H); ctx.clip();
      // area gradasi di bawah garis
      var gr=ctx.createLinearGradient(0,padT,0,padT+plotH);
      gr.addColorStop(0,lineUp?'rgba(57,255,20,.45)':'rgba(251,3,141,.45)'); gr.addColorStop(.55,lineUp?'rgba(57,255,20,.12)':'rgba(251,3,141,.12)'); gr.addColorStop(1,'rgba(0,0,0,0)');
      ctx.beginPath(); ctx.moveTo(xs[0],ys[0]);
      for(var k2=1;k2<xs.length;k2++){ var mx2=(xs[k2-1]+xs[k2])/2; ctx.bezierCurveTo(mx2,ys[k2-1],mx2,ys[k2],xs[k2],ys[k2]); }
      ctx.save(); ctx.lineTo(xs[xs.length-1],padT+plotH); ctx.lineTo(xs[0],padT+plotH); ctx.closePath(); ctx.fillStyle=gr; ctx.fill(); ctx.restore();
      // garis (model CoinGecko)
      ctx.beginPath(); ctx.moveTo(xs[0],ys[0]);
      for(var k3=1;k3<xs.length;k3++){ var mx3=(xs[k3-1]+xs[k3])/2; ctx.bezierCurveTo(mx3,ys[k3-1],mx3,ys[k3],xs[k3],ys[k3]); }
      ctx.save(); ctx.shadowColor=lineCol; ctx.shadowBlur=8; ctx.shadowOffsetY=4; ctx.strokeStyle=lineCol; ctx.lineWidth=1.1; ctx.lineJoin='round'; ctx.stroke(); ctx.restore();
      // titik harga terakhir
      ctx.beginPath(); ctx.arc(xs[xs.length-1],ys[ys.length-1],2.5,0,6.2832); ctx.fillStyle=lineCol; ctx.fill();
      ctx.restore();
      ctx.globalAlpha=rp;
      // garis harga sekarang (berkedip halus)
      var lc=cs[cs.length-1], ly=py(lc.c), up2=lc.c>=cs[0].c, lcol=up2?'#39ff14':'#fb038d';
      ctx.setLineDash([2,4]); ctx.lineWidth=0.5; ctx.strokeStyle=lcol; ctx.globalAlpha=(0.5+0.3*Math.sin(performance.now()/700))*rp; ctx.beginPath(); ctx.moveTo(0,ly); ctx.lineTo(W-padR,ly); ctx.stroke(); ctx.setLineDash([]); ctx.globalAlpha=rp;
      ctx.fillStyle=lcol; ctx.font="bold 10px Inter, sans-serif"; ctx.fillText(fmt(P*lc.c),W-2,ly); ctx.globalAlpha=1;
      // sumbu waktu
      ctx.fillStyle='#6b7278'; ctx.font="9px Inter, sans-serif";
    }
    box.__redraw=function(){ size(); draw(); };
    raf=requestAnimationFrame(frame);
  }

  window.addEventListener('cf-popup-fit',function(){ if(box&&box.__redraw) box.__redraw(); });

  function show(){
    var c=null; try{ c=selectedCoin; }catch(_){}
    var ov=$('overlay');
    if(c && ov && ov.classList.contains('show')) start(c); else stop();
  }
  try{ var o2=openPopup; openPopup=function(){ var r=o2.apply(this,arguments); try{ show(); }catch(_){} return r; }; }catch(_){}
  var ov=$('overlay');
  if(ov) new MutationObserver(function(){ if(!ov.classList.contains('show')) stop(); }).observe(ov,{attributes:true,attributeFilter:['class']});
  window.addEventListener('resize',function(){ var c; try{c=selectedCoin;}catch(_){} if(box&&c) start(c); });
})();
</script>
<script id="tidyEmptyJS">
(function(){
  var EMPTY=/^(|—|-|–|n\/a|na|null|undefined|nan|memuat…?|memuat\.\.\.|\$?0(\.0+)?)$/i;
  var CHG=/^(oneH|twentyFourH|sevenD|thirtyD)$/;
  var t=0;
  function run(){
    var pop=document.getElementById('popup'); if(!pop) return;
    [].forEach.call(pop.querySelectorAll('.infoGrid .info'),function(it){
      var v=it.querySelector('.value'); if(!v) return;
      var s=(v.textContent||'').replace(/\s+/g,' ').trim();
      var empty=EMPTY.test(s)&&!(CHG.test(v.id)&&/^\$?0/.test(s)&&s!=='');
      if(CHG.test(v.id)&&/^0(\.0+)?%$/.test(s)) empty=false;
      it.classList.toggle('emptyHide',empty);
    });
    var d=document.getElementById('pDescription');
    if(d){ var ds=(d.textContent||'').trim(); d.classList.toggle('emptyHide',!ds||/Network:\s*-(\s|$)/.test(ds)); }
  }
  function sched(){ clearTimeout(t); t=setTimeout(run,60); }
  var g=document.getElementById('popup');
  if(g) new MutationObserver(sched).observe(g,{childList:true,subtree:true,characterData:true});
  var ov=document.getElementById('overlay');
  if(ov) new MutationObserver(sched).observe(ov,{attributes:true,attributeFilter:['class']});
})();
</script>

<script id="selfUpdate">
/* Selalu pakai versi terbaru: saat kembali dari link luar / background / cache lama,
   cek versi di server; kalau beda, muat ulang otomatis dengan versi baru. */
(function(){
  var m=document.querySelector('meta[name="app-build"]'), cur=m?m.getAttribute('content'):'', busy=false;
  if(!cur || location.protocol==='file:') return;
  var re=new RegExp('<meta name="app-build" content="([^"]+)"');
  function check(){
    if(busy) return; busy=true;
    fetch(location.pathname+'?_='+Date.now(),{cache:'no-store'})
      .then(function(r){ return r.text(); })
      .then(function(t){
        var x=t.match(re);
        if(x && x[1]!==cur){
          var k='cf_upd_'+x[1];
          try{ if(sessionStorage.getItem(k)){ busy=false; return; } sessionStorage.setItem(k,'1'); }catch(_){}
          location.replace(location.pathname+'?v='+encodeURIComponent(x[1]));
        } else busy=false;
      })
      .catch(function(){ busy=false; });
  }
  window.addEventListener('pageshow',function(e){ if(e.persisted) check(); });
  document.addEventListener('visibilitychange',function(){ if(!document.hidden) check(); });
  setTimeout(check,1200);
})();
</script>

<script id="searchInPopupJS">
(function(){
  var sp=document.getElementById('searchPanel'), hp=document.getElementById('hdrPanels'),
      sr=document.getElementById('searchResults'), si=document.getElementById('searchInput');
  if(!sp||!hp) return;
  function place(){
    if(!sr) return;
    var r=sp.getBoundingClientRect();
    sr.style.setProperty('top',(r.bottom+6)+'px','important');
    sr.style.setProperty('width',Math.min(window.innerWidth-24,420)+'px','important');
    sr.style.setProperty('left','12px','important');
    sr.style.setProperty('right','auto','important');
  }
  if(si){ ['input','focus'].forEach(function(e){ si.addEventListener(e,place); }); }
  window.addEventListener('resize',place);
})();
</script>

<script id="popupMoversJS">
(function(){
  var ov=document.getElementById('overlay'); if(!ov) return;
  function esc(t){return String(t==null?'':t).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
  function chg(c){ var v=c.price_change_percentage_24h; if(v==null||v==='') v=c.chg24||c.change24h||c.priceChange24h; return Number(v); }
  function row(c){
    var v=chg(c);
    return '<div class="mvRow" data-id="'+esc(c.id)+'">'+(c.image?'<img src="'+esc(c.image)+'" alt="">':'<span style="width:18px"></span>')+
      '<span class="mvSym">'+esc(String(c.symbol||c.name||'').toUpperCase())+'</span><span class="mvPct">'+(v>0?'+':'')+v.toFixed(2)+'%</span></div>';
  }
  function render(){
    var pop=ov.querySelector('.popup'); if(!pop) return;
    var list=[];
    function ok(c){ return c && isFinite(chg(c)) && c.price_change_percentage_24h!=null; }
    try{
      var sel=null; try{ sel=selectedCoin; }catch(_){}
      var vis=(visibleCoins||[]);
      var base=(sel&&sel._terminal)? vis.filter(function(c){return c&&c._terminal;}) : (allCoins||[]);
      list=base.filter(ok);
      if(list.length<10) list=vis.concat(allCoins||[]).filter(ok);
      var seen={}; list=list.filter(function(c){var k=c.id; if(seen[k]) return false; seen[k]=1; return true;});
    }catch(e){}
    var box=document.getElementById('pMovers');
    if(!box){ box=document.createElement('div'); box.id='pMovers'; pop.appendChild(box); }
    else if(box.parentNode!==pop || pop.lastChild!==box){ pop.appendChild(box); }
    var sorted=list.slice().sort(function(a,b){return chg(b)-chg(a);});
    var up=sorted.slice(0,5), dn=sorted.slice(-5).reverse();
    box.innerHTML='<div class="mvCol mvUp"><div class="mvTit">Top Gainer 24H</div>'+up.map(row).join('')+'</div>'+
                  '<div class="mvCol mvDn"><div class="mvTit">Top Loser 24H</div>'+dn.map(row).join('')+'</div>';
  }
  box_click();
  function box_click(){
    ov.addEventListener('click',function(e){
      var r=e.target.closest&&e.target.closest('#pMovers .mvRow'); if(!r) return;
      e.stopPropagation(); try{ openPopup(r.getAttribute('data-id')); }catch(_){}
    },true);
  }
  new MutationObserver(function(){ if(ov.classList.contains('show')) setTimeout(render,0); }).observe(ov,{attributes:true,attributeFilter:['class']});
})();
</script>

<script id="swipePagesJS">
/* Geser kanan/kiri di halaman bubble = pindah halaman (100 koin per halaman, urut ranking) */
(function(){
  var cloud=document.getElementById('cloud'); if(!cloud) return;
  var g=null, busy=false, tip=null, tipT=0;

  function ctl(){ var c=window.__pageCtls||{}; return c[window.__activeCat]||null; }
  function blocked(){
    if(cloud.classList.contains('asList')) return true;             // mode list: tidak dipakai
    try{ if(typeof layerOpen==='function' && layerOpen()) return true; }catch(_){}
    if(document.getElementById('overlay')&&document.getElementById('overlay').classList.contains('show')) return true;
    return false;
  }
  function showTip(c,i){
    if(!tip){
      tip=document.createElement('div');
      tip.style.cssText='position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 22px);transform:translateX(-50%);'+
        'z-index:50001;padding:7px 16px;border-radius:999px;background:rgba(0,0,0,.78);color:#39ff14;'+
        'border:1px solid rgba(57,255,20,.45);font-size:13px;font-weight:700;pointer-events:none;'+
        'opacity:0;transition:opacity .2s ease;white-space:nowrap;';
      document.body.appendChild(tip);
    }
    var lbl=''; try{ lbl=c.label(i); }catch(_){}
    tip.textContent='Rank '+lbl+'  \u2022  '+(i+1)+'/'+c.count;
    tip.style.opacity='1';
    clearTimeout(tipT); tipT=setTimeout(function(){ tip.style.opacity='0'; },1300);
  }
  function go(dir){
    var c=ctl(); if(!c||busy) return;
    var i=c.index()+dir;
    if(i<0||i>=c.count){ showTip(c,Math.max(0,Math.min(c.count-1,c.index()))); return; }
    busy=true;
    try{ if(typeof cancelDrag==='function') cancelDrag(); }catch(_){}
    try{
      cloud.animate([{opacity:1,transform:'translateX(0)'},{opacity:0,transform:'translateX('+(dir>0?-28:28)+'px)'}],{duration:120,easing:'ease-in'});
    }catch(_){}
    setTimeout(function(){
      c.go(i);
      showTip(c,i);
      try{
        cloud.animate([{opacity:0,transform:'translateX('+(dir>0?28:-28)+'px)'},{opacity:1,transform:'translateX(0)'}],{duration:200,easing:'ease-out'});
      }catch(_){}
      setTimeout(function(){ busy=false; },320);
    },110);
  }

  cloud.addEventListener('pointerdown',function(e){
    if(e.pointerType==='mouse'&&e.button!==0) return;
    if(blocked()||!ctl()){ g=null; return; }
    g={id:e.pointerId,x:e.clientX,y:e.clientY,lx:e.clientX,ly:e.clientY,t:performance.now()};
  },true);
  window.addEventListener('pointermove',function(e){
    if(g&&e.pointerId===g.id){ g.lx=e.clientX; g.ly=e.clientY; }
  },true);
  function end(e){
    if(!g||e.pointerId!==g.id) return;
    var dx=(e.clientX||g.lx)-g.x, dy=(e.clientY||g.ly)-g.y, dt=performance.now()-g.t;
    g=null;
    if(blocked()) return;
    if(Math.abs(dx)>=70 && Math.abs(dx)>Math.abs(dy)*1.6 && dt<900){
      go(dx<0?1:-1);          // geser kiri = halaman berikutnya, geser kanan = sebelumnya
    }
  }
  window.addEventListener('pointerup',end,true);
  window.addEventListener('pointercancel',end,true);
})();
</script>

<script id="hdrViewJS">
/* ikon bubble di pop up titik 3: klik pertama = halaman bubble, klik lagi = halaman list coin (bergantian) */
(function(){
  var hp=document.getElementById('hdrPanels');
  if(!hp) return;
  var SVG='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="8.5" cy="14.5" r="5"/><circle cx="17" cy="8" r="3.5"/><circle cx="17.5" cy="17.5" r="2.2"/></svg>';
  function src(){ return document.querySelector('#pageMenu .menuTools [data-view="bubble"]'); }
  function paint(btn){
    var inList=!!(window.__isListView && window.__isListView());
    btn.classList.toggle('on',inList);
    btn.title=inList?'Halaman list (ketuk = bubble)':'Halaman bubble (ketuk = list)';
  }
  function ensure(){
    var panel=hp.querySelector('.hdrPanel');
    if(!panel) return;
    var btn=document.getElementById('hdrView');
    if(btn && btn.parentNode===panel && panel.firstChild===btn){ paint(btn); return; }
    if(!btn){
      btn=document.createElement('button');
      btn.type='button'; btn.id='hdrView'; btn.className='hdrViewItem';
      btn.setAttribute('aria-label','Bubble / List');
      btn.innerHTML=SVG;
      btn.addEventListener('click',function(e){
        e.preventDefault(); e.stopPropagation();
        var s=src(); if(!s) return;
        var ev;
        try{ ev=new PointerEvent('pointerdown',{bubbles:true,cancelable:true}); }
        catch(_){ ev=document.createEvent('Event'); ev.initEvent('pointerdown',true,true); }
        // penutup panel bawaan menelan ketukan di luar panel: nonaktifkan sesaat saat meneruskan ketukan
        var keepClose=window.__hdrClose; window.__hdrClose=null;
        ev.__tap=true;   // tanda ketukan sah (dipakai penjaga ketukan menu)
        try{ s.dispatchEvent(ev); } finally{ window.__hdrClose=keepClose; }
        setTimeout(function(){ paint(btn); },60);
      });
    }
    panel.insertBefore(btn,panel.firstChild);
    paint(btn);
  }
  ensure();
  new MutationObserver(function(){
    var b=document.getElementById('hdrView');
    var panel=hp.querySelector('.hdrPanel');
    if(!b||!panel||b.parentNode!==panel||panel.firstChild!==b) ensure();
  }).observe(hp,{childList:true,subtree:true});
  document.addEventListener('click',function(){ var b=document.getElementById('hdrView'); if(b) setTimeout(function(){paint(b);},80); },true);
})();
</script>
<script id="menuCatPopupJS">
/* menu: daftar kategori (ikon + teks); memilih kategori memunculkan pop up chain / isi kontennya */
(function(){
  var pm=document.getElementById('pageMenu');
  if(!pm) return;
  var ready=false, head=null, nameEl=null, iconEl=null, current=null, pending=null;

  function close(){ current=null; if(pm.classList.contains('subOpen')) pm.classList.remove('subOpen'); }

  function open(it){
    if(!it||!head) return;
    var lab=it.querySelector('.menuLabel > span:not(.menuIcon)');
    nameEl.textContent=lab?lab.textContent:(it.title||'');
    iconEl.innerHTML='';
    var ic=it.querySelector('.menuIcon,.arkIcon');
    if(ic) iconEl.appendChild(ic.cloneNode(true));
    current=it;
    pm.classList.add('subOpen');
    var subs=pm.querySelector('.menuSubs'); if(subs) subs.scrollTop=0;
  }

  function init(){
    if(ready) return true;
    var cards=pm.querySelector('.menuCards'), subs=pm.querySelector('.menuSubs');
    if(!cards||!subs) return false;
    ready=true;

    head=document.createElement('div');
    head.className='subPopHead';
    head.innerHTML='<span class="spIcon"></span><span class="spName"></span>'+
                   '<button type="button" class="subPopClose" aria-label="Tutup">\u00d7</button>';
    subs.insertBefore(head,subs.firstChild);
    iconEl=head.querySelector('.spIcon'); nameEl=head.querySelector('.spName');
    head.querySelector('.subPopClose').addEventListener('click',function(e){
      e.preventDefault(); e.stopPropagation(); close();
    });
    // ketukan di area kosong pop up tidak menutup seluruh menu
    subs.addEventListener('click',function(e){
      if(!e.target.closest('.subMenu,.subPopClose')) e.stopPropagation();
    },true);

    // fase capture: kategori yang sudah aktif hanya membuka/menutup pop up (tidak dinonaktifkan)
    cards.addEventListener('click',function(e){
      var it=e.target.closest('.menuItem'); if(!it) return;
      if(it.classList.contains('active')){
        e.stopImmediatePropagation(); e.preventDefault();
        if(pm.classList.contains('subOpen') && current===it) close(); else open(it);
      }else{
        pending=it;   // handler lama mengaktifkan kategori + memuat data; pop up dibuka sesudahnya
      }
    },true);
    cards.addEventListener('click',function(){
      if(pending){ var it=pending; pending=null; if(!pm.classList.contains('show')) pm.classList.add('show'); open(it); }
    });
    return true;
  }

  if(!init()){
    var mo=new MutationObserver(function(){ if(init()) mo.disconnect(); });
    mo.observe(pm,{childList:true,subtree:true});
  }
  // menu ditutup -> pop up isi kategori ikut tertutup
  new MutationObserver(function(){ if(!pm.classList.contains('show') && pm.classList.contains('subOpen')) close(); })
    .observe(pm,{attributes:true,attributeFilter:['class']});
})();
</script>
