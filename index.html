          if(
            !cached &&
            coins.length>=TOTAL_COINS-CG_PER_PAGE
          )
            saveCachedCoins(coins);

          return true;

        }catch(e){

          console.warn(
            'CoinMarketCap gagal',
            e
          );

          return false;

        }

      })();

    return cmcPromise;

  }

  // CoinGecko gagal -> pakai Binance untuk halaman yang belum terisi
  async function binanceFallback(){

    try{

      const list =
        await fetchBinanceTickers();

      const missing =
        [];

      for(
        let n=1;
        n<=CG_PAGES;
        n++
      )
        if(
          !pageData[n] &&
          !(fbData[n] && fbData[n].length)
        )
          missing.push(n);

      if(!missing.length)
        return;

      // 1) halaman yang punya cache -> segarkan harga dari Binance
      const cachedCoins =
        [];

      const empty =
        [];

      missing.forEach(
        n=>{

          const slot =
            slotFromCache(n);

          if(slot.length)
            cachedCoins.push(...slot);
          else
            empty.push(n);

        }
      );

      if(cachedCoins.length)
        applyBinanceToCoins(
          cachedCoins,
          list
        );

      // 2) halaman tanpa cache -> bangun dari daftar Binance
      if(empty.length){

        const known =
          new Set();

        for(
          let n=1;
          n<=CG_PAGES;
          n++
        )
          (
            pageData[n] ||
            slotFromCache(n)
          ).forEach(
            c=>known.add(
              String(c.symbol||'')
                .toLowerCase()
            )
          );

        const gen =
          binanceToCoins(list)
          .filter(
            c=>!known.has(c.symbol)
          );

        empty.forEach(
          (n,i)=>{

            fbData[n] =
              gen.slice(
                i*CG_PER_PAGE,
                (i+1)*CG_PER_PAGE
              );

          }
        );

      }

      console.warn(
        'CoinGecko gagal untuk halaman '+
        missing.join(',')+
        ' -> memakai Binance sementara'
      );

      apply();

    }catch(e){

      console.warn(
        'Binance cadangan gagal',
        e
      );

    }

  }

  // susun daftar 1..TOTAL_COINS per halaman:
  // data baru > (cadangan) > cache lama
  function build(useFallback){

    const out =
      [];

    for(
      let n=1;
      n<=CG_PAGES;
      n++
    )
      out.push(
        ...(
          pageData[n] ||
          (
            fbData[n] && fbData[n].length
              ?fbData[n]
              :slotFromCache(n)
          )
        )
      );

    return out;

  }

  function apply(){

    const merged =
      build(true).map(
        c=>{

          const old =
            coinMap.get(c.id);

          if(
            old &&
            old!==c
          ){

            Object.assign(old,c);

            return old;

          }

          return c;

        }
      );

    if(!merged.length)
      return;

    setAllCoins(merged);

    if(!shown){

      shown =
        true;

      renderCurrentPage();

      connectBinance();

      return;

    }

    if(!mainListActive())
      return;

    // gambar ulang hanya jika isi halaman yang sedang dilihat berubah
    const start =
      currentPage*
      COINS_PER_PAGE;

    const slice =
      allCoins.slice(
        start,
        start+
        COINS_PER_PAGE
      );

    if(
      slice.length!==visibleCoins.length ||
      slice.some(
        (c,i)=>c!==visibleCoins[i]
      )
    )
      renderCurrentPage();

  }

  if(silent){

    // auto-update: tampilan sudah ada, jangan timpa dengan data cache lama

  }else if(cached){

    // tampilan instan dari cache
    apply();

  }else{

    cloud.innerHTML =
      '<div style="position:absolute;inset:0;'+
      'display:flex;align-items:center;'+
      'justify-content:center;color:#777;'+
      'font-size:11px;">Loading...</div>';

  }

  // hemat request: CoinMarketCap paralel hanya jika belum ada cache sama sekali.
  // Jika CoinGecko gagal, cadangan CMC tetap dipanggil di bawah.
  if(!cached && !silent)
    cmcFallback();

  try{

    // halaman diminta berurutan dengan jeda (bukan serentak) agar tidak kena limit 429
    let failed =
      [];

    // simpan cache setiap ada halaman baru (asal semua slot 1..N terisi)
    function savePartial(){

      const out =
        [];

      for(
        let n=1;
        n<=CG_PAGES;
        n++
      ){

        const p =
          pageData[n] ||
          slotFromCache(n);

        if(
          !p.length ||
          (
            n<CG_PAGES &&
            p.length<CG_PER_PAGE
          )
        )
          return;

        out.push(...p);

      }

      saveCachedCoins(out);

    }

    for(
      let n=1;
      n<=CG_PAGES;
      n++
    ){

      if(n>1)
        await cgSleep(CG_GAP);

      try{

        pageData[n] =
          await loadCGPage(
            n,
            silent
              ?CG_PAGE_TTL-30000
              :undefined
          );

        apply();

        savePartial();

      }catch(e){

        console.warn(
          'Halaman '+n+' gagal',
          e
        );

        failed.push(n);

      }

    }

    if(failed.length){

      const okCmc =
        await cmcFallback();

      if(!okCmc)
        await binanceFallback();

    }

    failed.sort(
      (a,b)=>a-b
    );

    if(
      !shown &&
      !allCoins.length
    ){

      showCoinLoadError();

    }else{

      const real =
        build(false);

      // simpan hanya jika semua halaman lengkap (posisi urutan tidak bergeser)
      if(
        !failed.length &&
        real.length>=TOTAL_COINS-CG_PER_PAGE
      )
        saveCachedCoins(real);

      connectBinance();

      if(silent)
        cgRefreshView();

    }

    cgLoading =
      false;

    // halaman yang masih gagal -> coba ulang otomatis di latar belakang
    if(failed.length){

      cgRetrying =
        true;

      let round =
        0;

      const retry =
        async()=>{

          round++;

          const still =
            [];

          for(const n of failed){

            try{

              pageData[n] =
                await loadCGPage(n);

              apply();

            }catch(e){

              still.push(n);

            }

            await cgSleep(CG_GAP);

          }

          failed =
            still;

          if(!failed.length)
            cgRetrying =
              false;

          if(!failed.length){

            const real =
              build(false);

            if(real.length>=TOTAL_COINS-CG_PER_PAGE)
              saveCachedCoins(real);

            connectBinance();

            // filter Gainer/Loser dll perlu dihitung ulang dengan data lengkap
            const popup =
              document.getElementById('overlay');

            if(
              !terminalMode &&
              !dexMode &&
              !launchMode &&
              !alphaMode &&
              !hlMode &&
              !bsMode &&
              !web3Mode &&
              activeFilter!=='All' &&
              !(
                popup &&
                popup.classList.contains('show')
              )
            )
              applyMarketFilter(
                activeFilter,
                currentPage
              );

          }else if(round<10){

            setTimeout(
              retry,
              Math.min(8000*round,40000)
            );

          }else{

            cgRetrying =
              false;

            // menyerah: kalau layar masih kosong tampilkan tombol coba lagi
            if(!allCoins.length)
              showCoinLoadError();

          }

        };

      setTimeout(
        retry,
        6000
      );

    }

  }catch(error){

    console.error(
      error
    );

    cgLoading =
      false;

    // kalau data sudah tampil (cache), biarkan; jika belum -> pesan gagal + tombol coba lagi
    if(!shown)
      showCoinLoadError();

  }

}

/* =====================================================
   EFEK INFO UPDATE KOIN (gaya komentar live TikTok / YouTube)
   - muncul saat load awal & saat kembali online
   - satu koin per baris: nama, harga, gain (langsung muncul)
   - baris baru muncul di kiri bawah, baris lama terdorong naik
     rapat, memudar & hilang saat sampai tengah kiri halaman
   - hanya koin di halaman yang sedang dibuka (100 per halaman)
===================================================== */

(function(){

  const box =
    document.createElement('div');

  box.style.cssText=
    'position:fixed;left:10px;bottom:14px;'+
    'width:72vw;max-width:320px;'+
    'height:calc(40vh - 14px);'+
    'overflow:hidden;pointer-events:none;z-index:30;'+
    'display:flex;flex-direction:column;'+
    'justify-content:flex-end;gap:2px;'+
    '-webkit-mask-image:linear-gradient(to bottom,transparent 0,#000 22%);'+
    'mask-image:linear-gradient(to bottom,transparent 0,#000 22%);';

  document.body.appendChild(box);

  const LIFE_MS  = 1000;   // muncul -> hilang, per baris
  const FADE_MS  = 300;    // bagian memudar di akhir umur baris
  const GAP_MS   = 30;     // jeda antar koin
  const MAX_ROWS = 60;

  let token = 0;
  let pending = true;      // true = jalankan efek pada render berikutnya
  let feedIds = '';

  function liveCoin(c){

    if(
      typeof allCoins!=='undefined' &&
      allCoins.length
    ){

      const f =
        allCoins.find(
          x=>x.id===c.id
        );

      if(f)
        return f;

    }

    return c;

  }

  function spawn(c){

    c = liveCoin(c);

    const g =
      getGain(c);

    const parts = [
      [
        String(c.name||c.id||'')+' '+
        String(c.symbol||'').toUpperCase(),
        '#e8e8e8'
      ],
      [
        price(c.current_price),
        '#a8a8a8'
      ],
      [
        percent(g),
        g>=0 ? '#7dfa00' : '#fb038d'
      ]
    ];

    // FLIP: catat posisi baris lama supaya terdorong naik dengan halus
    const olds =
      Array.from(box.children).map(
        e=>[e,e.getBoundingClientRect().top]
      );

    const el =
      document.createElement('div');

    el.style.cssText=
      'flex:none;font-size:10px;line-height:1.3;'+
      'white-space:nowrap;overflow:hidden;'+
      'font-family:inherit;'+
      'text-shadow:0 0 6px rgba(0,0,0,.9);';

    const spans =
      parts.map(([,col],i)=>{

        const sp =
          document.createElement('span');

        sp.style.color = col;
        sp.textContent = parts[i][0];

        if(i)
          sp.style.marginLeft = '7px';

        el.appendChild(sp);

        return sp;

      });

    box.appendChild(el);

    olds.forEach(([e,top])=>{

      const d =
        top-e.getBoundingClientRect().top;

      if(d)
        e.animate(
          [
            {transform:'translateY('+d+'px)'},
            {transform:'translateY(0)'}
          ],
          {
            duration:120,
            easing:'ease-out'
          }
        );

    });

    el.animate(
      [
        {opacity:0},
        {opacity:1}
      ],
      {
        duration:160,
        fill:'both'
      }
    );

    // tiap baris: dari muncul sampai memudar hilang = LIFE_MS (3 detik)
    setTimeout(()=>{

      const f =
        el.animate(
          [{opacity:1},{opacity:0}],
          {
            duration:FADE_MS,
            fill:'forwards'
          }
        );

      f.onfinish = ()=>el.remove();

    },LIFE_MS-FADE_MS);

    // buang baris yang sudah terdorong lewat batas atas (tengah kiri halaman)
    const top =
      box.getBoundingClientRect().top;

    Array.from(box.children).forEach(e=>{

      if(e.getBoundingClientRect().bottom<top)
        e.remove();

    });

    while(box.children.length>MAX_ROWS)
      box.firstChild.remove();

  }

  function run(list){

    const my = ++token;

    box.innerHTML = '';

    const coins = list.slice();

    let i = 0;

    function next(){

      if(my!==token)
        return;

      if(i>=coins.length){

        pending = false;


        return;

      }

      if(!document.hidden)
        spawn(coins[i]);

      i++;

      setTimeout(next,GAP_MS);

    }

    next();

  }

  function ids(list){
    return list.map(c=>c.id).join(',');
  }

  // dipanggil tiap halaman koin dirender (halaman baru = koin halaman itu)
  const baseCreate =
    createCoinNodes;

  createCoinNodes = function(){

    const r =
      baseCreate.apply(
        this,
        arguments
      );

    if(
      typeof visibleCoins!=='undefined' &&
      visibleCoins.length
    ){

      const k = ids(visibleCoins);

      if(
        pending &&
        k!==feedIds
      ){

        feedIds = k;
        run(visibleCoins);

      }

    }

    return r;

  };

  // kembali online -> efek update semua koin di halaman yang sedang dibuka
  window.addEventListener(
    'online',
    ()=>{

      setTimeout(()=>{

        if(
          typeof visibleCoins!=='undefined' &&
          visibleCoins.length
        ){

          pending = true;
          feedIds = ids(visibleCoins);
          run(visibleCoins);

        }else{

          pending = true;
          feedIds = '';

        }

      },1200);

    }
  );

})();

window.addEventListener(
  'online',
  cgResumeIfIncomplete
);

document.addEventListener(
  'visibilitychange',
  ()=>{
    if(!document.hidden)
      cgResumeIfIncomplete();
  }
);

/* =====================================================
   EFEK MELETUS (koin lama pecah, koin baru muncul)
   Hanya saat online, saat data diperbarui otomatis,
   dan sebagian koin saja yang berganti.
===================================================== */

const BURST_COLORS =
  ['#ffd60a','#7dfa00','#fb038d','#ffffff','#7cc4ff'];

function spawnBurst(cx,cy,size){

  const box =
    document.createElement('div');

  box.className =
    'coinBurst';

  box.style.left =
    cx+'px';

  box.style.top =
    cy+'px';

  const ring =
    document.createElement('i');

  ring.className =
    'burstRing';

  ring.style.setProperty(
    '--r',
    (size*1.5)+'px'
  );

  box.appendChild(ring);

  const n =
    14;

  for(let k=0;k<n;k++){

    const d =
      document.createElement('b');

    const a =
      (k/n)*Math.PI*2+
      Math.random()*.4;

    const dist =
      size*(.55+Math.random()*.55);

    d.style.setProperty(
      '--dx',
      Math.cos(a)*dist+'px'
    );

    d.style.setProperty(
      '--dy',
      Math.sin(a)*dist+'px'
    );

    d.style.background =
      BURST_COLORS[
        k%BURST_COLORS.length
      ];

    box.appendChild(d);

  }

  cloud.appendChild(box);

  setTimeout(
    ()=>box.remove(),
    800
  );

}

function burstReplaced(oldPos){

  if(
    navigator.onLine===false ||
    document.hidden
  )
    return;

  // ganti kategori / halaman lewat menu (All, Terminal, Dex, Launchpad, Binance)
  const fresh =
    performance.now()-
    (window.__burstPending||-1e9)<30000;

  if(!oldPos.size && !fresh)
    return;

  const newIds =
    visibleCoins.map(c=>c.id);

  const removed =
    [];

  const added =
    [];

  let kept =
    0;

  oldPos.forEach(
    (v,id)=>{

      if(nodes.has(id))
        kept++;
      else
        removed.push(v);

    }
  );

  newIds.forEach(
    id=>{

      if(!oldPos.has(id))
        added.push(id);

    }
  );

  const partial =
    removed.length &&
    added.length &&
    oldPos.size &&
    kept>=Math.min(oldPos.size,newIds.length)*.5;

  if(fresh)
    window.__burstPending = -1e9;

  // kategori / halaman baru: koin lama meletus, koin baru muncul dengan letupan
  if(!partial){

    if(!fresh)
      return;

    removed.slice(0,12).forEach(
      o=>spawnBurst(
        o.x+o.size/2,
        o.y+o.size/2,
        o.size
      )
    );

    newIds.slice(0,60).forEach(
      (id,k)=>{

        const node =
          nodes.get(id);

        const p =
          positions.get(id);

        if(!node||!p)
          return;

        const body =
          node.querySelector('.coinBody');

        if(k<12)
          spawnBurst(
            p.x+p.size/2,
            p.y+p.size/2,
            p.size
          );

        if(body)
          body.style.animationDelay =
            (k*14)+'ms';

        node.classList.add('popIn');

        setTimeout(
          ()=>{
            node.classList.remove('popIn');
            if(body)
              body.style.animationDelay='';
          },
          1400
        );

      }
    );

    return;

  }

  // koin yang tidak berganti tetap di tempatnya
  newIds.forEach(
    id=>{

      const o =
        oldPos.get(id);

      const p =
        positions.get(id);

      if(!o||!p)
        return;

      p.x =
        p.homeX =
          o.hx;

      p.y =
        p.homeY =
          o.hy;

      clampPosition(p);

      p.homeX =
        p.x;

      p.homeY =
        p.y;

      applyPosition(id);

    }
  );

  // koin baru menempati tempat koin yang meletus
  added
    .slice(0,12)
    .forEach(
      (id,k)=>{

        const o =
          removed[k];

        const p =
          positions.get(id);

        const node =
          nodes.get(id);

        if(!node||!p)
          return;

        if(o){

          p.x =
            o.hx+
            (o.size-p.size)/2;

          p.y =
            o.hy+
            (o.size-p.size)/2;

          clampPosition(p);

          p.homeX =
            p.x;

          p.homeY =
            p.y;

          applyPosition(id);

          spawnBurst(
            o.x+o.size/2,
            o.y+o.size/2,
            o.size
          );

        }

        node.classList.add(
          'popIn'
        );

        setTimeout(
          ()=>node.classList.remove('popIn'),
          700
        );

      }
    );

}


/* =====================================================
   LOGO COIN  (rantai cadangan: coin._imgs -> huruf)
===================================================== */

function letterLogo(sym){
  const raw=String(sym||'?');
  const t=raw.replace(/[^A-Za-z0-9]/g,'').slice(0,2).toUpperCase()||'?';
  let h=0; for(let i=0;i<raw.length;i++) h=(h*31+raw.charCodeAt(i))%360;
  return 'data:image/svg+xml;utf8,'+encodeURIComponent(
    '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64"><circle cx="32" cy="32" r="32" fill="hsl('+h+',45%,32%)"/>'+
    '<text x="32" y="41" font-size="26" font-weight="700" font-family="Arial,sans-serif" text-anchor="middle" fill="#fff">'+t+'</text></svg>');
}

// peta CMC id (simbol|nama -> id) agar semua koin punya logo CMC
const cmcIdMap=new Map();
function cmcIndex(d){
  (d||[]).forEach(x=>{
    if(!x||!x.id) return;
    const sy=String(x.symbol||'').toLowerCase();

const logoWin=new Map();
const logoCache=new Map();   // id koin -> data URL 64px (tersimpan di IndexedDB)   // koin -> sumber yang berhasil
const WSRV='https://wsrv.nl/?w=128&h=128&fit=cover&url=';
function logoChain(coin){
  const sym=String(coin.symbol||'').toLowerCase().replace(/[^a-z0-9]/g,'');
  const nm=String(coin.name||'').toLowerCase().replace(/[^a-z0-9]/g,'');
  const cid=coin._cmcId||cmcIdMap.get(sym+'|'+nm);
  const C='https://s2.coinmarketcap.com/static/img/coins/';
  const w=logoWin.get(coin.id);
  const l=[logoCache.get(coin.id),w,coin.image];
  if(cid) l.push(C+'64x64/'+cid+'.png');
  if(coin.image) l.push(WSRV+encodeURIComponent(coin.image));

  }
  return l.filter((v,k)=>v&&l.indexOf(v)===k);
}
function attachLogo(img,coin){
  if(!img) return;
  img.referrerPolicy='no-referrer';
  img.decoding='async';
  img.loading='eager';
  const base=coin._imgs||null;
  let i=-1, timer=0, tries=0;
  const list=()=>base?base.filter(Boolean):logoChain(coin);
  function next(){
    clearTimeout(timer);
    const l=list();
    i++;
    if(i>=l.length){
      img.onerror=img.onload=null;
      img.src=letterLogo(coin.symbol);
      // coba ulang sekali setelah 45 detik (jaringan / CDN sempat bermasalah)
      if(tries++<1) setTimeout(()=>{ if(img.isConnected){ i=-1; img.onerror=next; img.onload=ok; next(); } },45000);
      return;
    }
    img.src=l[i];
    timer=setTimeout(()=>{ if(!(img.complete&&img.naturalWidth)) next(); },6500);
  }
  function ok(){
    clearTimeout(timer);
    if(img.naturalWidth<2) return next();
    const l=list();
    if(!base&&l[i]&&!l[i].startsWith('data:')) logoWin.set(coin.id,l[i]);
  }
  img.onerror=next;
  img.onload=ok;
  next();
}

/* =====================================================
   POSITIONS
===================================================== */

function random(
  min,
  max
){

  return (
    Math.random()*
    (
      max-min
    )+
    min
  );

}


function createPositions(){

  positions.clear();

  const width = getFieldW();

  const height = getFieldH();

  const placed =
    [];

  visibleCoins.forEach(
    coin=>{

      const size =
        sizeFromGain(getGain(coin));

      let x=0;
      let y=0;

      let found=false;

      for(
        let attempt=0;
        attempt<350;
        attempt++
      ){

        x =
          random(
            1,
            Math.max(
              2,
              width-size-1
            )
          );

        y =
          random(
            SAFE_TOP,
            Math.max(
              SAFE_TOP+1,
              height-size-1
            )
          );

        let good =
          true;

        for(
          const p of placed
        ){

          const dx =
            (
              x+
              size/2
            )-
            (
              p.x+
              p.size/2
            );

          const dy =
            (
              y+
              size/2
            )-
            (
              p.y+
              p.size/2
            );

          const distance =
            Math.sqrt(
              dx*dx+
              dy*dy
            );

          const minimum =
            (
              size/2+
              p.size/2
            )*.78;

          if(
            distance<
            minimum
          ){

            good=false;

            break;

          }

        }

        if(good){

          found=true;

          break;

        }

      }

      if(!found){

        x =
          random(
            0,
            Math.max(
              1,
              width-size
            )
          );

        y =
          random(
            SAFE_TOP,
            Math.max(
              SAFE_TOP+1,
              height-size
            )
          );

      }

      const p = {

        x:x,
        y:y,

        homeX:x,
        homeY:y,

        vx:0,
        vy:0,

        size:size,

        phaseX:
          Math.random()*
          Math.PI*2,

        phaseY:
          Math.random()*
          Math.PI*2,

        speedX:
          random(
            .00032,
            .00072
          ),

        speedY:
          random(
            .00032,
            .00072
          ),

        amplitudeX:
          random(
            4,
            12
          ),

        amplitudeY:
          random(
            4,
            12
          ),

        rotation:0,

        rotSpeed:
          random(
            .0002,
            .0005
          )

      };

      positions.set(
        coin.id,
        p
      );

      placed.push(
        p
      );

    }
  );

  positions.forEach(
    (
      p,
      id
    )=>
      applyPosition(
        id
      )
  );

}


/* =====================================================
   APPLY POSITION
===================================================== */

function applyPosition(
  id
){

  const p =
    positions.get(
      id
    );

  const node =
    nodes.get(
      id
    );

  if(!p||!node)
    return;

  node.style.setProperty(
    '--x',
    p.x+'px'
  );

  node.style.setProperty(
    '--y',
    p.y+'px'
  );

  node.style.setProperty(
    '--rot',
    p.rotation+'deg'
  );

}


/* =====================================================
   CLAMP
===================================================== */

function clampPosition(
  p
){

  const width = getFieldW();

  const height = getFieldH();

  p.x =
    Math.max(
      0,
      Math.min(
        width-p.size,
        p.x
      )
    );

  p.y =
    Math.max(
      SAFE_TOP,
      Math.min(
        height-p.size,
        p.y
      )
    );

}

function layerOpen(){

  const ids =
    ['overlay','walletOverlay','qrOverlay'];

  for(const i of ids){

    const el =
      document.getElementById(i);

    if(
      el&&
      el.classList.contains('show')
    )
      return true;

  }

  const pm =
    document.getElementById('pageMenu');

  return !!(

  );

}

function cancelDrag(){

  if(!drag)
    return;

  const node =
    nodes.get(
      drag.id
    );

  if(node){

    node.classList.remove(
      'dragging'
    );

    try{
      if(drag.pid!=null)
        node.releasePointerCapture(
          drag.pid
        );
    }catch(err){}

  }

  drag =
    null;

}


function pointerDown(
  e,
  id
){

  e.preventDefault();

  const node =
    nodes.get(
      id
    );

  const p =
    positions.get(
      id
    );

  if(!node||!p)
    return;

  // abaikan bila ada pop up/layer lain terbuka atau bukan klik utama
  if(
    (e.pointerType==='mouse'&&e.button!==0)||
    layerOpen()
  )
    return;

  // sisa drag lama (mis. pointercancel) dibuang tanpa membuka pop up
  if(drag)
    cancelDrag();

  drag = {

    id:id,

    pid:e.pointerId,

    t:performance.now(),

    startX:e.clientX,
    startY:e.clientY,

    originalX:p.x,
    originalY:p.y,

    moved:false

  };

  node.classList.add(
    'dragging'
  );

  try{
    node.setPointerCapture(
      e.pointerId
    );
  }catch(err){}

}


window.addEventListener(
  'pointermove',
  e=>{

    if(!drag)
      return;

    if(e.pointerId!==drag.pid)
      return;

    const p =
      positions.get(
        drag.id
      );

    if(!p)
      return;

    const dx =
      e.clientX-
      drag.startX;

    const dy =
      e.clientY-
      drag.startY;

    if(
      Math.abs(dx)>4||
      Math.abs(dy)>4
    ){

      drag.moved=true;

    }

    p.x =
      drag.originalX+
      dx;

    p.y =
      drag.originalY+
      dy;

    clampPosition(
      p
    );

    applyPosition(
      drag.id
    );

  },
  {
    passive:false
  }
);


window.addEventListener(
  'pointerup',
  e=>{

    if(!drag)
      return;

    // pointer lain (multi-touch) tidak boleh memicu klik
    if(e.pointerId!==drag.pid)
      return;

    const d =
      drag;

    const dist =
      Math.hypot(
        e.clientX-d.startX,
        e.clientY-d.startY
      );

    const dur =
      performance.now()-d.t;

    cancelDrag();

    // pop up detail HANYA untuk ketukan asli: tidak digeser, tidak ditahan lama,
    // dan tidak ada layer lain yang sedang terbuka
    if(
      d.moved||
      dist>8||
      dur>1200||
      layerOpen()
    )
      return;

    openPopup(
      d.id
    );

  }
);

// sentuhan dibatalkan browser (scroll/gesture/telepon masuk): JANGAN buka pop up
window.addEventListener(
  'pointercancel',
  cancelDrag
);

window.addEventListener(
  'blur',
  cancelDrag
);

document.addEventListener(
  'visibilitychange',
  cancelDrag
);

window.addEventListener(

    if(drag)
      cancelDrag();
  }
);


/* =====================================================
   PHYSICS
===================================================== */

function bounceFromEdges(
  p
){

  const width = getFieldW();

  const height = getFieldH();

  if(
    p.x<=0
  ){

    p.x=0;

    p.vx=
      Math.abs(
        p.vx
      )*.5;

  }

  if(
    p.x+p.size>=width
  ){

    p.x=
      width-
      p.size;

    p.vx=
      -Math.abs(
        p.vx
      )*.5;

  }

  if(
    p.y<=SAFE_TOP
  ){

    p.y=
      SAFE_TOP;

    p.vy=
      Math.abs(
        p.vy
      )*.5;

  }

  if(
    p.y+p.size>=height
  ){

    p.y=
      height-
      p.size;

    p.vy=
      -Math.abs(
        p.vy
      )*.5;

  }

}


function resolveCollisions(){

  const ids =
    [...positions.keys()];

  for(
    let i=0;
    i<ids.length;
    i++
  ){

    const a =
      positions.get(
        ids[i]
      );

    if(!a)
      continue;

    for(
      let j=i+1;
      j<ids.length;
      j++
    ){

      const b =
        positions.get(
          ids[j]
        );

      if(!b)
        continue;

      const dx =
        (
          b.x+
          b.size/2
        )-
        (
          a.x+
          a.size/2
        );

      const dy =
        (
          b.y+
          b.size/2
        )-
        (
          a.y+
          a.size/2
        );

      const distance =
        Math.sqrt(
          dx*dx+
          dy*dy
        );

      const minimum =
        (
          a.size/2+
          b.size/2
        )*(drag?.97:.82);

      if(
        distance<
        minimum &&
        distance>
        .001
      ){

        const nx =
          dx/
          distance;

        const ny =
          dy/
          distance;

        const overlap =
          minimum-
          distance;

        const aHeld = drag && drag.id===ids[i];
        const bHeld = drag && drag.id===ids[j];
        const hard = aHeld || bHeld;

        const push =
          overlap*(hard?.6:.045);

        const wa = aHeld?0:(bHeld?1:.5);
        const wb = bHeld?0:(aHeld?1:.5);

        a.x-=
          nx*
          push*(hard?wa*2:1);

        a.y-=
          ny*
          push*(hard?wa*2:1);

        b.x+=
          nx*
          push*(hard?wb*2:1);

        b.y+=
          ny*
          push*(hard?wb*2:1);

        const bounce =
          .008;

        a.vx-=
          nx*
          bounce;

        a.vy-=
          ny*
          bounce;

        b.vx+=
          nx*
          bounce;

        b.vy+=
          ny*
          bounce;

        clampPosition(a);
        clampPosition(b);

      }

    }

  }

}


/* =====================================================
   FLOATING PHYSICS
===================================================== */

let _wOv = null;

function animate(){

  _wOv =
    _wOv ||
    document.getElementById(
      'walletOverlay'
    );

  // menu / wallet menutupi layar: jangan hitung animasi koin (klik jadi ringan)
  if(
    pageMenu.classList.contains('show') ||
    (_wOv && _wOv.classList.contains('show'))
  ){

    requestAnimationFrame(
      animate
    );

    return;

  }

  const now =
    performance.now();

  positions.forEach(
    (
      p,
      id
    )=>{

      const held =
        drag &&
        drag.id===
        id;

      if(!held){

        const fx =
          Math.sin(
            now*
            p.speedX+
            p.phaseX
          )*
          p.amplitudeX;

        const fy =
          Math.cos(
            now*
            p.speedY+
            p.phaseY
          )*
          p.amplitudeY;

        const targetX =
          p.homeX+
          fx;

        const targetY =
          p.homeY+
          fy;

        p.vx+=
          (
            targetX-
            p.x
          )*.012;

        p.vy+=
          (
            targetY-
            p.y
          )*.012;

        p.vx*=.93;
        p.vy*=.93;

        p.x+=
          p.vx;

        p.y+=
          p.vy;

        p.rotation =
          Math.sin(
            now*
            p.rotSpeed+
            p.phaseX
          )*
          2.2;

      }

      bounceFromEdges(
        p
      );

      applyPosition(
        id
      );

    }
  );

  resolveCollisions();

  requestAnimationFrame(
    animate
  );

}

let searchSeq =
  0;

async function searchCoinGecko(
  query
){

  const seq =
    ++searchSeq;

  const q =
    query.trim();

  // null = masih memuat, [] = tidak ada hasil
  const groups = {
    cg:null,
    dx:null,
    gt:null,
    fm:null
  };

  searchResults.classList.add(
    'show'
  );

  const note =
    text=>(
      '<div style="padding:12px;color:#777;'+
      'font-size:11px;text-align:center;">'+
      text+
      '</div>'
    );

  function render(){

    if(seq!==searchSeq)
      return;

    const items =
      [
        ...(groups.cg||[]),
        ...(groups.dx||[]),
        ...(groups.gt||[]),
        ...(groups.fm||[])
      ];

    const loading =
      Object.values(groups).some(
        g=>g===null
      );

    searchResults.innerHTML =
      '';

    if(!items.length){

      searchResults.innerHTML =
        note(
          loading
            ?'<span style="display:block;height:4px"></span>'
            :'Coin tidak ditemukan.'
        );

      return;

    }

    items.forEach(
      it=>{

        const d =
          document.createElement(
            'div'
          );

        d.className =
          'searchResult';

        d.innerHTML =
          '<img src="'+
          escapeHtml(it.image||'')+
          '" alt="" onerror="this.style.visibility=\'hidden\'">'+
          '<b>'+
          escapeHtml(it.name||'')+
          '<br><small>'+
          escapeHtml(
            String(it.symbol||'').toUpperCase()
          )+
          ' · '+
          escapeHtml(it.tag||'')+
          '</small></b>'+
          '<span>'+
          (it.priceText||'')+
          '</span>';

        d.addEventListener(
          'click',
          ()=>{

            searchInput.blur();

            searchResults.classList.remove(
              'show'
            );

            searchInput.value='';

            it.open();

          }
        );

        searchResults.appendChild(
          d
        );

      }
    );

    if(loading){

      const l =
        document.createElement('div');

      l.innerHTML =
        note('Memuat sumber lain...');

      searchResults.appendChild(l);

    }

  }

  render();

  // hasil dari DexScreener / GeckoTerminal / four.meme -> buka popup langsung
  const openCoin =
    coin=>()=>{

      coinMap.set(
        coin.id,
        coin
      );

      openPopup(
        coin.id
      );

    };

  const asItem =
    (coin,tag)=>({

      name:coin.name,
      symbol:coin.symbol,
      image:coin.image,
      tag:tag,
      priceText:price(
        coin.current_price
      ),
      open:openCoin(coin)

    });

  const jobs = [];

  // 1. CoinGecko
  jobs.push(
    (async()=>{

      try{

        const response =
          await fetch(
            'https://api.coingecko.com/api/v3/search?query='+
            encodeURIComponent(q),
            {cache:'no-store'}
          );

        if(!response.ok)
          throw new Error(
            'Search HTTP '+response.status
          );

        const data =
          await response.json();

        const hits =
          (data.coins||[]).slice(0,15);

        const marketMap =
          new Map();

        if(hits.length){

          try{

            const marketResponse =
              await fetch(
                'https://api.coingecko.com/api/v3/coins/markets?'+
                'vs_currency=usd&ids='+
                encodeURIComponent(
                  hits.map(c=>c.id).filter(Boolean).join(',')
                )+
                '&order=market_cap_desc&per_page=250&page=1'+
                '&sparkline=false'+
                '&price_change_percentage=1h,24h,7d,30d,1y',
                {cache:'no-store'}
              );

            if(marketResponse.ok){

              (
                await marketResponse.json()
              ).forEach(
                coin=>{

                  marketMap.set(coin.id,coin);

                  coinMap.set(coin.id,coin);

                }
              );

            }

          }catch(err){

            console.warn(
              'Market search error',
              err
            );

          }

        }

        groups.cg =
          hits.map(
            c=>{

              const market =
                marketMap.get(c.id);

              return {

                name:c.name,
                symbol:c.symbol,
                image:
                  market?.image||
                  c.large||
                  c.thumb||
                  '',
                tag:'CoinGecko',
                priceText:
                  market
                    ?price(market.current_price)
                    :'',
                open:()=>openSearchCoin(
                  c.id,
                  market
                )

              };

            }
          );

      }catch(error){

        console.warn(error);

        groups.cg =
          [];

      }

      render();

    })()
  );

  // 2. DexScreener
  jobs.push(
    (async()=>{

      try{

        const d =
          await dxJson(
            '/latest/dex/search?q='+
            encodeURIComponent(q)
          );

        const seen =
          new Set();

        groups.dx =
          ((d&&d.pairs)||[])
            .filter(
              pair=>
                pair &&
                pair.priceUsd &&
                pair.baseToken
            )
            .sort(
              (a,b)=>
                (Number(b.liquidity?.usd)||0)-
                (Number(a.liquidity?.usd)||0)
            )
            .filter(
              pair=>{

                const k =
                  pair.chainId+':'+
                  (pair.baseToken.address||'').toLowerCase();

/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHtml(
  value
){

  return String(
    value==null
      ?''
      :value
  )
  .replace(
    /&/g,
    '&amp;'
  )
  .replace(
    /</g,
    '&lt;'
  )
  .replace(
    />/g,
    '&gt;'
  )
  .replace(
    /"/g,
    '&quot;'
  )
  .replace(
    /'/g,
    '&#039;'
  );

}

/* =====================================================
   NEW LISTING (CoinGecko)
   1) Resmi: endpoint coins/list/new (butuh COINGECKO_PRO_API_KEY)
   2) Tanpa key: dari data market CoinGecko (top 1500) - koin yang
      ATH & ATL-nya sama-sama terjadi dalam 90 hari terakhir = koin baru
===================================================== */
let cgNewCache = null;
let cgNewReq = 0;
let cgNewExtra = null;
const CG_NEW_TTL = 600000;       // 10 menit
const CG_NEW_DAYS = 90;          // batas umur "baru" untuk mode tanpa key
function cgNewFresh(){
  return !!(cgNewCache && Date.now()-cgNewCache.t<CG_NEW_TTL);
}
async function cgNewListingCoins(){
  if(cgNewFresh()) return cgNewCache.coins;
  let coins = [];
  // 1) endpoint resmi CoinGecko (berbayar)
  if(typeof COINGECKO_PRO_API_KEY!=='undefined' && COINGECKO_PRO_API_KEY){
    try{
      const r = await fetch(
        'https://pro-api.coingecko.com/api/v3/coins/list/new',
        {cache:'no-store',headers:{'x-cg-pro-api-key':COINGECKO_PRO_API_KEY}}
      );
      if(r.ok){
        const list = await r.json();
        const ids = (list||[]).map(c=>c.id).filter(Boolean).slice(0,250);
        const when = new Map((list||[]).map(c=>[c.id,Number(c.activated_at)||0]));
        if(ids.length){
          const mr = await fetch(
            'https://api.coingecko.com/api/v3/coins/markets?vs_currency=usd'+
            '&ids='+encodeURIComponent(ids.join(','))+
            '&order=market_cap_desc&per_page=250&page=1&sparkline=false'+
            '&price_change_percentage=1h,24h,7d,30d,1y',
            {cache:'no-store'}
          );
          if(mr.ok){
            const md = await mr.json();
            const m = new Map(md.map(c=>[c.id,c]));
            coins = ids.map(id=>m.get(id)).filter(Boolean);
            coins.forEach(c=>{ c._listedAt=(when.get(c.id)||0)*1000; });
          }
        }
      }
    }catch(e){ console.error('New listing resmi gagal',e); }
  }
  // 2) tanpa key: saring dari data market CoinGecko
  if(!coins.length){
    let pool = allCoins.slice();
    // tambah peringkat 1001-1500 (koin baru biasanya di sana)
    if(!cgNewExtra){
      cgNewExtra = [];
      for(const p of [5,6]){
        try{
          const d = await loadCGPageRaw(p);
          if(Array.isArray(d)) cgNewExtra.push(...d);
        }catch(e){ console.error('CoinGecko halaman '+p+' gagal',e); }
        await cgSleep(CG_GAP);
      }
      if(!cgNewExtra.length) cgNewExtra = null;   // coba lagi lain kali
    }
    if(cgNewExtra) pool = pool.concat(cgNewExtra);
    const seen = new Set();
    const now = Date.now();
    const lim = CG_NEW_DAYS*864e5;
    const ts = v=>{ const t=Date.parse(v); return Number.isFinite(t)?t:0; };
    coins = pool
      .filter(c=>{
        if(!c||!c.id||seen.has(c.id)) return false;
        seen.add(c.id);
        return Number(c.current_price)>0;
      })
      .map(c=>({c,t:Math.min(ts(c.ath_date),ts(c.atl_date))}))
      .filter(x=>x.t && now-x.t<=lim)
      .sort((a,b)=>b.t-a.t)
      .map(x=>{ x.c._listedAt=x.t; return x.c; });
  }
  if(coins.length) cgNewCache = {t:Date.now(),coins:coins};
  return coins;
}
function cgNewMsg(html){
  cloud.innerHTML =
    '<div style="position:absolute;inset:0;display:flex;align-items:center;'+
    'justify-content:center;color:#777;font-size:11px;text-align:center;'+
    'padding:20px;">'+html+'</div>';
}

  return (

  );

   BINANCE WEBSOCKET
===================================================== */

let wsSockets =
  [];

let wsGen =
  0;

let wsBackoff =
  0;

let wsCoinBySym =
  new Map();

// daftar pasangan USDT yang benar-benar ada di Binance (ringan, 1 permintaan)
async function loadBinanceSymbolSet(){

  for(const host of BN_HOSTS){

    try{

      const response =
        await fetchT(
          host+'/api/v3/ticker/price',
          {},
          8000
        );

      if(!response.ok)
        continue;

      const list =
        await response.json();

      if(
        !Array.isArray(list) ||
        !list.length
      )
        continue;

      const set =
        new Set();

      list.forEach(
        t=>{

          const sym =
            String(t.symbol||'');

          if(/USDT$/.test(sym))
            set.add(
              sym.toLowerCase()
            );

        }
      );

      if(set.size){

        binanceSymSet =
          set;

        return;

      }

    }catch(e){}

  }

}

// satu tick harga dari Binance -> koin dengan peringkat tertinggi untuk simbol itu
function handleBinanceTick(data){

  if(!data)
    return;

  const symbol =
    String(data.s)
    .replace(/USDT$/i,'')
    .toLowerCase();

  const coin =
    wsCoinBySym.get(symbol);

  if(!coin)
    return;

  const px =
    Number(data.c);

  if(!(px>0))
    return;

  // tick pertama harus mirip harga koin (cegah simbol kembar / koin lain)
  if(!coin._bnOk){

    const ref =
      Number(coin.current_price)||0;

    if(
      ref>0 &&
      (
        px/ref>3 ||
        px/ref<0.33
      )
    )
      return;

    coin._bnOk =
      true;

  }

  coin.current_price =
    px;

  coin.price_change_percentage_24h =
    Number(data.P);

  const node =
    nodes.get(
      coin.id
    );

  if(node){

    const priceEl =
      node.querySelector(
        '.coinPrice'
      );

    const gainEl =
      node.querySelector(
        '.coinGain'
      );

    if(priceEl)
      priceEl.textContent =
        price(
          coin.current_price
        );

    if(
      gainEl &&
      activeTimeFrame==='1D'
    ){

      const gain =
        Number(
          data.P
        )||0;

      gainEl.textContent =
        percent(
          gain
        );

      gainEl.className =
        'coinGain '+
        (
          gain>=0
            ?'up'
            :'down'
        );

    }

  }

  if(
    selectedCoin &&
    selectedCoin.id===
    coin.id
  )
    updatePopup(
      coin
    );

}

function createBinanceSocket(symbols,gen){

  let ws;

  try{

    ws =
      new WebSocket(
        'wss://stream.binance.com:9443/stream?streams='+
        symbols
          .map(v=>v+'@ticker')
          .join('/')
      );

  }catch(error){

    console.error(
      error
    );

    return;

  }

  wsSockets.push(
    ws
  );

  ws.onmessage =
    event=>{

      if(gen!==wsGen)
        return;

      wsBackoff =
        0;

      try{

        const packet =
          JSON.parse(
            event.data
          );

        handleBinanceTick(
          packet.data
        );

      }catch(error){

        console.warn(
          error
        );

      }

    };

  ws.onclose =
    ()=>{

      // socket lama yang sengaja ditutup tidak memicu sambung ulang
      if(gen!==wsGen)
        return;

      clearTimeout(
        reconnectTimer
      );

      wsBackoff =
        Math.min(
          wsBackoff+1,
          5
        );

      reconnectTimer =
        setTimeout(
          connectBinance,
          Math.min(
            5000*Math.pow(2,wsBackoff-1),
            60000
          )
        );

    };

  ws.onerror =
    ()=>{

      try{
        ws.close();
      }catch(e){}

    };

}

async function connectBinanceOld(){

  const gen =
    ++wsGen;

  clearTimeout(
    reconnectTimer
  );

  // lepas handler socket lama dulu, baru ditutup
  wsSockets.forEach(
    ws=>{

      try{

        ws.onclose =
          null;

        ws.onerror =
          null;

        ws.onmessage =
          null;

        ws.close();

      }catch(e){}

    }
  );

  wsSockets =
    [];

  try{

    // simbol -> koin peringkat tertinggi (urutan allCoins = urutan peringkat)
    const bySym =
      new Map();

    allCoins.forEach(
      coin=>{

        const key =
          String(coin.symbol||'')
            .toLowerCase()
            .replace(/[^a-z0-9]/g,'');

        if(
          key &&
          !bySym.has(key)
        )
          bySym.set(
            key,
            coin
          );

      }
    );

    wsCoinBySym =
      bySym;

    let symbols =
      Array.from(
        bySym.keys()
      ).map(
        k=>k+'usdt'
      );

    if(!binanceSymSet)
      await loadBinanceSymbolSet();

    if(gen!==wsGen)
      return;

    // hanya pasangan yang ada di Binance
    if(binanceSymSet)
      symbols =
        symbols.filter(
          v=>binanceSymSet.has(v)
        );

    if(!symbols.length)
      return;

    // dipecah beberapa koneksi agar URL tidak terlalu panjang
    const CHUNK =
      150;

    for(
      let i=0;
      i<symbols.length;
      i+=CHUNK
    )
      createBinanceSocket(
        symbols.slice(
          i,
          i+CHUNK
        ),
        gen
      );

  }catch(error){

    console.error(
      error
    );

  }

}

/* popup koin Dex/GeckoTerminal/Four.meme/Binance: muat satu layar tanpa scroll atas-bawah */
let _fitBusy=false;
function fitCompactPopup(){
  if(_fitBusy) return;
  const pop=document.getElementById('popup');
  if(!pop || !pop.classList.contains('popCompact')) return;
  const parts=pop.querySelectorAll('.infoGrid,.contractBox,.popupDescription,#pMovers');
  parts.forEach(el=>{ el.style.zoom=''; });
  const used=()=>{
    let b=0; const top=pop.getBoundingClientRect().top;
    [...pop.children].forEach(e=>{
      if(getComputedStyle(e).display==='none') return;
      const r=e.getBoundingClientRect(); if(r.height) b=Math.max(b,r.bottom-top);
    });
    return b+34;
  };
  const MIN=70;
  pop.style.setProperty('--cvh',MIN+'px');
  let free=pop.clientHeight-used();
  if(free>0){
    pop.style.setProperty('--cvh',Math.min(MIN+free,460)+'px');
  }else{
    let z=1,g=0;
    while(pop.clientHeight-used()<0 && z>0.55 && g++<14){
      z-=0.04; parts.forEach(el=>{ el.style.zoom=z.toFixed(2); });
    }
    const f2=pop.clientHeight-used();
    if(f2>0) pop.style.setProperty('--cvh',Math.min(MIN+f2,460)+'px');
  }
  const cv=pop.style.getPropertyValue('--cvh');
  if(cv!==pop._lastCvh){
    pop._lastCvh=cv;
    try{ window.dispatchEvent(new Event('cf-popup-fit')); }catch(_){}
  }
}
window.addEventListener('resize',fitCompactPopup);

// explorer per jaringan untuk koin Terminal / Dex / Launchpad / Alpha
const TERM_EXPLORERS = [
  [/^(eth|ethereum)$/,'https://etherscan.io'],
  [/^(bsc|bnb|binance|bnb chain|bnbchain|smartchain)/,'https://bscscan.com'],
  [/^(solana|sol)$/,'https://solscan.io'],
  [/^base$/,'https://basescan.org'],
  [/^(arbitrum|arbitrum_one|arbitrum-one)$/,'https://arbiscan.io'],
  [/^(polygon|polygon_pos|matic|polygon pos)$/,'https://polygonscan.com'],
  [/^(optimism|optimistic-ethereum)$/,'https://optimistic.etherscan.io'],
  [/^(avax|avalanche)$/,'https://snowtrace.io'],
  [/^(tron|trx)$/,'https://tronscan.org'],
  [/^linea$/,'https://lineascan.build'],
  [/^(ton)$/,'https://tonviewer.com'],
  [/^(sui|sui-network)$/,'https://suiscan.xyz'],
  [/^(cronos)$/,'https://cronoscan.com'],
  [/^(fantom|ftm)$/,'https://ftmscan.com'],
  [/^(blast)$/,'https://blastscan.io'],
  [/^(scroll)$/,'https://scrollscan.com'],
  [/^(zksync|zksync-era)$/,'https://explorer.zksync.io']
];

function termExplorerUrl(c){

  const net =
    String(c._network||'')
      .toLowerCase()
      .trim();

  const hit =
    TERM_EXPLORERS.find(
      ([re])=>re.test(net)
    );

  if(!hit)
    return '';

  const base =
    hit[1];

  // token contract bila ada, kalau tidak pakai alamat pool/pair
  const token =
    c._addr ||
    (
      (
        c._source==='four.meme' ||
        c._source==='Binance Alpha'
      )
        ?c._pool
        :''
    );

  const addr =
    token || c._pool;

  if(!addr)
    return base;

  if(net==='solana' || net==='sol')
    return base+(token?'/token/':'/account/')+addr;

  if(net==='ton')
    return base+'/'+addr;

  if(net==='sui' || net==='sui-network')
    return base+(token?'/coin/':'/object/')+addr;

  if(net==='tron' || net==='trx')
    return base+'/#/'+(token?'token20/':'contract/')+addr;

  return base+(token?'/token/':'/address/')+addr;

}

function termWebsiteUrl(c){

  if(c._website)
    return c._website;

  // tanpa website resmi: buka halaman koin di sumber datanya
  if(c._url)
    return c._url;

  if(c._pool && c._network)
    return 'https://dexscreener.com/'+
      encodeURIComponent(c._network)+'/'+
      encodeURIComponent(c._pool);

  return 'https://dexscreener.com/search?q='+
    encodeURIComponent(c._addr||c.symbol||c.name||'');

}

const tvCache =

  try{

        {},
        ms||3500
      );

    if(!r.ok)
      return null;

    return await r.json();

  }catch(e){

}

// urutan prioritas sumber TradingView; tiap sumber mengembalikan harga terakhir
const TV_SOURCES = [

  {

    price:async S=>{

// harga bursa harus mirip harga koin (cegah salah koin karena simbol kembar)
function tvPriceOk(p,ref){

  if(!(p>0))
    return false;

  if(!(ref>0))
    return true;

  return Math.abs(p/ref-1)<=0.3;

}

async function tvDexUrl(sym,ref){

  const j =
    await tvJson(
      DX_BASE+
      '/latest/dex/search?q='+
      encodeURIComponent(sym),
      5000
    );

  const same =
    (
      (j&&j.pairs)||[]
    ).filter(
      pair=>
        pair &&
        pair.url &&
        pair.baseToken &&
        String(pair.baseToken.symbol||'').toUpperCase()===sym &&
        Number(pair.priceUsd)>0
    );

  const close =
    same.filter(
      pair=>
        !(ref>0) ||
        Math.abs(Number(pair.priceUsd)/ref-1)<=0.5
    );

  const list =
    (close.length?close:same)
      .sort(
        (x,y)=>
          (Number(y.liquidity?.usd)||0)-
          (Number(x.liquidity?.usd)||0)
      );

  return list.length
    ?list[0].url
    :'https://dexscreener.com/search?q='+
     encodeURIComponent(sym);

}

async function tvResolve(coin){

  if(tvCache.has(coin.id))
    return tvCache.get(coin.id);

  const sym =
    String(coin.symbol||'')
      .toUpperCase()
      .replace(/[^A-Z0-9]/g,'');

  const ref =
    Number(coin.current_price)||0;

  let url =
    '';

  if(sym){

    const prices =
      await Promise.all(
        TV_SOURCES.map(
          src=>src.price(sym)
        )
      );

    const hit =
      TV_SOURCES.findIndex(
        (src,i)=>tvPriceOk(prices[i],ref)
      );

    if(hit>=0)
      url =
        'https://www.tradingview.com/chart/?symbol='+
        TV_SOURCES[hit].tv+'%3A'+
        encodeURIComponent(
          TV_SOURCES[hit].pair(sym)
        );

    else
      url =
        await tvDexUrl(sym,ref);

  }else{

    url =
      'https://dexscreener.com/search?q='+
      encodeURIComponent(coin.name||'');

  }

  tvCache.set(coin.id,url);

  return url;

}

// ---- AKUMULASI: koin lama ikut disimpan, tidak hilang saat daftar API berganti ----
// Koin lama dibuang otomatis bila tidak ada transaksi (volume 0) atau >7 hari tidak muncul lagi.
// Koin dari request terbaru selalu dipertahankan apa adanya. Maksimal 1000 koin per daftar.
const ACC_MAX=1000, ACC_AGE=7*86400000;
function accMerge(oldL,newL,now,oldT){
  const out=[], seen=new Set();
  (Array.isArray(newL)?newL:[]).forEach(c=>{
    if(!c||!c.id||seen.has(c.id)) return;
    seen.add(c.id);
    if(!c._seen) c._seen=now;
    out.push(c);
  });
  const keep=[];
  (Array.isArray(oldL)?oldL:[]).forEach(c=>{
    if(!c||!c.id||seen.has(c.id)) return;
    seen.add(c.id);
    const t=c._seen||oldT||0;
    if(now-t>=ACC_AGE) return;                  // lama tidak muncul
    if(!(Number(c.total_volume)>0)) return;     // tidak ada transaksi
    if(!c._seen) c._seen=t;
    keep.push(c);
  });
  keep.sort((a,b)=>(b._seen-a._seen)||((b.total_volume||0)-(a.total_volume||0)));
  return out.concat(keep).slice(0,ACC_MAX);
}
// objek { all, top-ish, fresh-ish }: 'all' jadi acuan, daftar lain ikut koin yang masih ada di 'all'
function accMergeSet(prev,m,keyAll,keyTop,keyFresh,sortFresh){
  if(!m) return;
  const now=Date.now(), pt=prev&&prev.t;
  const all=accMerge(prev&&prev[keyAll],m[keyAll],now,pt);
  const canon=new Map(all.map(c=>[c.id,c]));
  const sub=k=>accMerge(prev&&prev[k],m[k],now,pt).map(c=>canon.get(c.id)).filter(Boolean);
  m[keyAll]=all;
  if(keyTop) m[keyTop]=sub(keyTop);
  if(keyFresh){
    m[keyFresh]=sortFresh
      ?all.filter(c=>c._created).sort((a,b)=>b._created-a._created)
      :sub(keyFresh);
  }
}
const mergeTerm=(prev,m)=>{ if(m) m.coins=accMerge(prev&&prev.coins,m.coins,Date.now(),prev&&prev.t); };

const mergeLaunch=(prev,m)=>accMergeSet(prev,m,'all','hot','fresh',false);

// cache bertingkat: memori -> IndexedDB (TANPA batas umur, selalu data terakhir) -> jaringan.
// Data lama langsung tampil (tanpa loading), lalu diperbarui di belakang layar.
function wrapTier(orig,keyOf,getMem,setMem,pick,okHit,good,merge){
  const usable=(h,a)=>h&&h.t&&(!okHit||okHit(h,...a));
  const newest=(x,y)=>(x&&x.t&&(!y||!y.t||x.t>=y.t))?x:(y&&y.t?y:null);
  const run=a=>{
    const key=keyOf(...a);
    if(tierBusy[key]) return tierBusy[key];
    if(!navigator.onLine) return Promise.resolve();
    return tierBusy[key]=(async()=>{
      const prev=getMem(...a);
      const base=newest(prev,await idbGet('tier:'+key));   // data lama (memori / IndexedDB) untuk digabung
      await orig.apply(null,a);
      const m=getMem(...a);
      // hasil kosong (API gagal diam-diam) jangan menimpa data bagus
      if(m&&m!==prev&&good&&!good(m)){ if(prev) setMem(prev,...a); return; }
      if(m&&merge&&base&&m!==base) merge(base,m);
      if(m&&m.t&&tierT[key]!==m.t){ tierT[key]=m.t; idbSet('tier:'+key,m); }
      tierSync();
    })().catch(()=>{}).finally(()=>{ delete tierBusy[key]; });
  };
  const w=async function(...a){
    const key=keyOf(...a);
    const mem=getMem(...a);
    if(usable(mem,a)){
      if(Date.now()-mem.t<TIER_FRESH) return pick(mem);
      window.__stalePaint=true;
      run(a);
      return pick(mem);
    }
    const h=await idbGet('tier:'+key);
    if(usable(h,a)&&(!good||good(h))){
      tierT[key]=h.t; setMem(h,...a);
      if(Date.now()-h.t>=TIER_FRESH){ window.__stalePaint=true; run(a); }
      return pick(h);
    }
    try{
      const r=await orig.apply(null,a);
      const m=getMem(...a);
      const base=newest(mem,h);
      if(m&&merge&&base&&m!==base) merge(base,m);
      if(m&&m.t&&tierT[key]!==m.t){ tierT[key]=m.t; idbSet('tier:'+key,m); }
      return m?pick(m):r;
    }catch(e){
      const h2=await idbGet('tier:'+key);
      if(usable(h2,a)){ window.__stalePaint=true; setMem(h2,...a); return pick(h2); }
      throw e;
    }
  };
  w.force=(...a)=>run(a);
  return w;
}

async function cacheWarm(){

      document.querySelector('#overlay.show,#pageMenu.show,#newsOverlay.show,#chartViewer.show') )) await gap(500);
  };
  const step=async(fn,ms)=>{
    await calm();
    const t0=Date.now();
    try{ await fn(); }catch(e){}
    await gap(Date.now()-t0<400?40:(ms||500));
  };
  // jalur GeckoTerminal (limit ±30 request/menit): Terminal semua + tiap chain
  const gtLane=async()=>{
    await step(()=>loadTerminal.force('Trending',10),1500);
    await step(()=>loadTerminal.force('NewPool',10),1500);
    for(const n of WARM_TERM_CHAINS){
      for(const k of ['All','Trending','NewPool']){
        if(!ok()) return;
        await step(()=>loadTerminalChain.force(n,k,5),5*1700);
      }
    }
  };
  // jalur DexScreener / four.meme / Binance Alpha + semua chain Dex
  const dexLane=async()=>{
    await step(()=>loadDex.force());
    await step(()=>loadLaunchpad.force());
    await step(()=>loadAlpha.force());
    for(const c of WARM_DEX_CHAINS){
      if(!ok()) return;
      await step(()=>loadDexChain.force(c),700);
    }
  };
  // jalur CoinGecko: daftar koin tiap chain Cryptocurrency (dijeda agar tidak kena limit)
  const cgLane=async()=>{
    await gap(15000);                                // beri jalan dulu untuk daftar utama
    const w=window.__cgChainWarm;
    if(!w) return;
    for(const k of w.keys){
      if(!ok()) return;
      await step(()=>w.run(k),5000);
    }
  };
  try{
    await Promise.all([gtLane(),dexLane(),cgLane()]);
  }finally{
    warmBusy=false;
    tierSync();
  }
}

}):0).catch(()=>{});
const logoFail=new Map(), logoT0=Date.now();
let logoRun=false;
function logoToast(t){
  let e=document.getElementById('logoToast');
  if(!e){
    e=document.createElement('div'); e.id='logoToast';
    e.style.cssText='position:fixed;left:8px;bottom:8px;z-index:99999;background:rgba(17,17,17,.85);color:#c5cacf;font:11px Arial,sans-serif;padding:5px 9px;border-radius:8px;pointer-events:none';
    document.body.appendChild(e);
  }
  e.textContent=t; e.style.display=t?'block':'none';
}
async function logoBlobData(u){
  const r=await fetchT(u,{referrerPolicy:'no-referrer'},9000);
  if(!r.ok) throw new Error('http');
  const b=await r.blob();
  if(b.size<100||(b.type&&b.type.indexOf('image/')!==0)) throw new Error('bukan gambar');
  try{
    const bm=await createImageBitmap(b);
    const c=document.createElement('canvas'); c.width=c.height=64;
    const k=Math.min(64/bm.width,64/bm.height);
    c.getContext('2d').drawImage(bm,(64-bm.width*k)/2,(64-bm.height*k)/2,bm.width*k,bm.height*k);
    let d=c.toDataURL('image/webp',0.85);
    if(d.indexOf('data:image/webp')!==0) d=c.toDataURL('image/png');
    return d;
  }catch(e){
    if(b.size>30000) throw e;   // SVG kecil boleh disimpan apa adanya
    return new Promise((res,rej)=>{ const f=new FileReader(); f.onload=()=>res(f.result); f.onerror=rej; f.readAsDataURL(b); });
  }
}
function logoSwap(c,d){
  const n=nodes.get(c.id), im=n&&n.querySelector('img');
  if(!im) return;
  if(/^data:image\/svg/.test(im.src||'')||!(im.complete&&im.naturalWidth)) im.src=d;
}
async function logoPass(){
  if(logoRun||document.hidden||!allCoins.length) return;
  if(allCoins.length<750&&Date.now()-logoT0<120000) return;   // tunggu daftar hampir lengkap
  const list=allCoins.slice().sort((a,b)=>(a.market_cap_rank||9999)-(b.market_cap_rank||9999));
  const todo=list.filter(c=>c&&c.id&&!logoCache.has(c.id)&&!(logoFail.get(c.id)>Date.now()));
  if(!todo.length) return;
  logoRun=true;
  const total=list.length;
  const worker=async()=>{
    while(todo.length){
      const c=todo.shift();
      let d=null;
      for(const u of logoChain(c).filter(x=>x.indexOf('data:')!==0)){
        try{ d=await logoBlobData(u); break; }catch(e){}
      }
      if(d){ logoCache.set(c.id,d); idbSet('logo:'+c.id,{id:c.id,d:d,t:Date.now()}); logoSwap(c,d); }
      else logoFail.set(c.id,Date.now()+600000);   // coba lagi 10 menit kemudian
      logoToast('Menyimpan logo… '+logoCache.size+'/'+total);
    }
  };
  await Promise.all(Array.from({length:6},worker));
  logoRun=false;
  logoToast('Logo tersimpan '+logoCache.size+'/'+total);
  setTimeout(()=>logoToast(''),4000);
}
setTimeout(logoPass,6000);
setInterval(logoPass,15000);

/* =====================================================
   OPSIONAL: kode Cloudflare Worker (proxy + cache 60 detik)
   Tidak dijalankan di sini. Salin isi di bawah ke Cloudflare Workers,
   lalu isi URL-nya ke API_PROXY. Secret opsional: CG_KEY.

// Cloudflare Worker: proxy + cache 60 detik. Secret opsional: CG_KEY (API key demo CoinGecko)
const ALLOW=['api.coingecko.com','pro-api.coinmarketcap.com','api.dexscreener.com','api.geckoterminal.com','www.binance.com'];
export default{
  async fetch(req,env,ctx){
    const h={'access-control-allow-origin':'*'};
    if(req.method==='OPTIONS') return new Response(null,{headers:{...h,'access-control-allow-methods':'GET','access-control-allow-headers':'*'}});
    let u;
    try{u=new URL(new URL(req.url).searchParams.get('u'));}catch(e){return new Response('bad url',{status:400,headers:h});}
    if(!ALLOW.includes(u.hostname)) return new Response('forbidden',{status:403,headers:h});
    if(u.hostname==='api.coingecko.com'&&env.CG_KEY) u.searchParams.set('x_cg_demo_api_key',env.CG_KEY);
    const key=new Request(u.toString()),cache=caches.default;
    let r=await cache.match(key);
    if(!r){
      const o=await fetch(u,{headers:{accept:'application/json'}});
      r=new Response(o.body,o);
      r.headers.set('cache-control','public, max-age=60');
      if(o.ok) ctx.waitUntil(cache.put(key,r.clone()));
    }
    r=new Response(r.body,r);
    for(const k in h) r.headers.set(k,h[k]);
    return r;
  }
};

===================================================== */
