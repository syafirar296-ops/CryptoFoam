<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

<title>Crypto Coin Cloud</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  width:100%;
  height:100%;
  margin:0;
  overflow:hidden;
  background:#000;
  color:#fff;
  font-family:Arial,Helvetica,sans-serif;
}

body{
  touch-action:none;
}

.app{
  position:relative;
  width:100vw;
  height:100dvh;
  overflow:hidden;
  background:#000;
}

/* =====================================================
   GRID BUTTON + CRYPTOFOAM BRAND
===================================================== */

.cryptofoamBrand{
  position:absolute;
  top:10px;
  left:16px;
  z-index:50001;
  color:#fff;
  font-size:18px;
  line-height:30px;
  font-weight:900;
  letter-spacing:.4px;
  white-space:nowrap;
  pointer-events:none;
  text-shadow:0 2px 10px rgba(255,255,255,.16);
}

.pageButton{
  position:absolute;
  top:9px;
  left:9px;
  width:30px;
  height:30px;
  z-index:50000;
  border-radius:50%;
  border:0;
  outline:0;
  background:transparent;
  color:#d5d8da;
  display:flex;
  align-items:center;
  justify-content:center;
  cursor:pointer;
  transition:
    transform .22s ease,
    filter .22s ease,
    opacity .22s ease;
}

.pageButton:hover{
  transform:translateY(-2px) scale(1.08);
  filter:drop-shadow(0 5px 10px rgba(255,255,255,.22));
}

.pageButton:active{
  transform:translateY(0) scale(.88);
}

.gridIcon{
  width:14px;
  height:14px;
  display:grid;
  grid-template-columns:repeat(2,1fr);
  grid-template-rows:repeat(2,1fr);
  gap:2px;
  filter:drop-shadow(0 3px 6px rgba(255,255,255,.18));
  transition:
    transform .22s ease,
    filter .22s ease;
}

.pageButton:hover .gridIcon{
  transform:translateY(-1px);
  filter:drop-shadow(0 5px 9px rgba(255,255,255,.30));
}

.gridIcon span{
  display:block;
  width:100%;
  height:100%;
  border:1.2px solid #aeb3b7;
  border-radius:2px;
  box-shadow:0 1px 4px rgba(255,255,255,.10);
}

/* =====================================================
   PAGE MENU
===================================================== */

.pageMenu{
  position:absolute;
  top:auto;
  left:auto;
  right:10px;
  bottom:10px;
  height:40px;
  z-index:49000;

  display:flex;
  align-items:center;
  gap:6px;

  overflow-x:auto;
  overflow-y:hidden;

  opacity:0;
  pointer-events:none;

  justify-content:flex-end;

  transform:translateY(8px);

  transition:
    opacity .2s ease,
    transform .2s ease;

  scrollbar-width:none;
}

.pageMenu::-webkit-scrollbar{
  display:none;
}

.pageMenu.show{
  opacity:1;
  pointer-events:auto;
  transform:translateY(0);
}

.pageItem{
  flex:0 0 auto;
  height:32px;
  padding:0 13px;
  border-radius:16px;
  border:1px solid #555b60;
  background:rgba(10,10,10,.9);
  color:#aeb4b9;
  font-size:10px;
  font-weight:800;
  white-space:nowrap;

  display:flex;
  align-items:center;
  justify-content:center;
}

.pageItem.active{
  color:#fff;
  border-color:#999fa4;
  background:rgba(130,135,140,.17);
}

/* =====================================================
   COIN CLOUD
===================================================== */

.cloud{
  position:absolute;
  inset:0;
  overflow:hidden;
  touch-action:none;
}

/* =====================================================
   COIN
===================================================== */

.coinCard{
  position:absolute;

  left:0;
  top:0;

  width:var(--size);
  height:var(--size);

  border-radius:50%;

  touch-action:none;
  user-select:none;
  -webkit-user-select:none;

  will-change:
    transform,
    width,
    height;

  cursor:grab;

  transform:
    translate3d(
      var(--x),
      var(--y),
      0
    )
    rotate(
      var(--rot)
    )
    scale(var(--pulse,1));

  z-index:10;
}

.coinCard.dragging{
  z-index:60000;
  cursor:grabbing;
}

.coinBody{
  position:relative;

  width:100%;
  height:100%;

  border-radius:50%;

  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;

  gap:calc(var(--size) * .012);

  overflow:hidden;

  border:
    1px solid
    rgba(120,126,132,.85);

  background:
    radial-gradient(
      circle at 35% 25%,
      rgba(180,185,190,.12),
      rgba(18,18,18,.91) 62%,
      #000 100%
    );

  box-shadow:
    inset 0 0 15px
    rgba(190,195,200,.055),

    0 0 13px
    rgba(180,185,190,.025);

  pointer-events:none;
}

.coinBody::after{
  content:"";

  position:absolute;
  inset:calc(var(--size) * .025);

  border-radius:50%;

  border:
    1px solid
    rgba(180,185,190,.08);
}

.coinLogo{
  width:44%;
  height:44%;

  min-width:0;
  min-height:0;

  max-width:none;
  max-height:none;

  border-radius:50%;

  object-fit:contain;

  background:#000;

  border:
    1px solid #72797f;

  padding:1px;
}

.coinSymbol{
  width:96%;
  margin-top:2px;

  text-align:center;

  color:#eee;

  font-size:
    clamp(
      7px,
      calc(var(--size)*.105),
      20px
    );

  font-weight:900;

  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.coinPrice{
  width:96%;
  text-align:center;
  margin-top:1px;

  color:#c5cacf;

  font-size:
    clamp(
      7px,
      calc(var(--size)*.070),
      16px
    );

  font-weight:700;

  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.coinGain{
  margin-top:1px;

  font-size:
    clamp(
      7px,
      calc(var(--size)*.068),
      16px
    );

  font-weight:900;
}

.up{
  color:#55dc91;
}

.down{
  color:#ff5965;
}

/* =====================================================
   POPUP
===================================================== */

.overlay{
  position:fixed;
  inset:0;
  z-index:100000;

  display:none;

  align-items:center;
  justify-content:center;

  padding:10px;

  background:rgba(0,0,0,.20);

  backdrop-filter:blur(7px);
  -webkit-backdrop-filter:blur(7px);
}

.overlay.show{
  display:flex;
}

.popup{
  position:relative;

  width:min(390px,95vw);

  max-height:
    calc(100dvh - 36px);

  overflow:auto;

  padding:12px 14px;

  border-radius:21px;

  border:
    1px solid
    rgba(135,142,149,.65);

  background:
    linear-gradient(
      145deg,
      rgba(31,33,35,.80),
      rgba(2,2,2,.64)
    );

  box-shadow:
    0 20px 55px
    rgba(0,0,0,.78);

  backdrop-filter:blur(20px);
  -webkit-backdrop-filter:blur(20px);

  animation:
    popupIn .2s ease-out;
}

@keyframes popupIn{
  from{
    opacity:0;
    transform:scale(.94);
  }

  to{
    opacity:1;
    transform:scale(1);
  }
}

.close{
  position:absolute;

  top:7px;
  right:7px;

  width:30px;
  height:30px;

  border:0;
  border-radius:0;
  background:transparent;

  color:#ddd;

  font-size:22px;
  line-height:1;
}

.popupHead{
  display:flex;
  align-items:center;
  gap:9px;

  padding-right:34px;
  margin-bottom:6px;
}

.popupLogo{
  width:45px;
  height:45px;

  border-radius:50%;

  object-fit:contain;

  background:#000;

  border:
    1px solid #777e84;

  padding:3px;
}

.popupName{
  font-size:21px;
  font-weight:900;
  color:#fff;
}

.popupSymbol{
  margin-top:2px;

  color:#a0a7ad;

  font-size:13px;
  font-weight:800;
  text-transform:uppercase;
}

.priceRow{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.favoriteStar{width:38px;height:38px;border:0;outline:0;background:transparent;color:#777;display:flex;align-items:center;justify-content:center;cursor:pointer;border-radius:50%;flex:0 0 auto;margin-top:-2px}
.favoriteStar svg{width:24px;height:24px;fill:transparent;stroke:currentColor;stroke-width:1.8;transition:.18s}
.favoriteStar:hover{background:rgba(255,255,255,.07);color:#fff}
.favoriteStar.active{color:#ffd84d}.favoriteStar.active svg{fill:currentColor}
.popupActions{display:flex;align-items:center;gap:2px;flex:0 0 auto;margin-top:-2px}
.popupAction{width:38px;height:38px;border:0;outline:0;background:transparent;color:#777;display:flex;align-items:center;justify-content:center;cursor:pointer;border-radius:50%;transition:.18s}
.popupAction svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.popupAction:hover{background:rgba(255,255,255,.07);color:#fff}
.popupPrice{
  font-size:31px;
  line-height:1.05;
  font-weight:900;
  color:#fff;
}

.popupGain{
  margin-top:3px;
  font-size:15px;
  font-weight:900;
}

.chart{
  width:100%;
  height:38px;

  margin-top:7px;

  border-radius:12px;

  border:
    1px solid
    rgba(135,142,149,.55);

  background:
    rgba(255,255,255,.035);

  color:#ddd;

  display:flex;

  align-items:center;
  justify-content:center;

  gap:9px;

  font-size:11px;
  font-weight:900;
}

.chart svg{
  width:20px;
  height:20px;
}

.infoGrid{
  display:grid;

  grid-template-columns:
    1fr 1fr;

  gap:5px;

  margin-top:7px;
}

.info{
  min-height:47px;

  padding:6px 8px;

  border-radius:11px;

  background:
    rgba(255,255,255,.028);

  border:
    1px solid
    rgba(115,123,130,.30);
}

.label{
  margin-bottom:3px;

  color:#8f979d;

  font-size:10px;
  font-weight:800;

  text-transform:uppercase;
}

.value{
  color:#f0f1f2;

  font-size:13px;
  font-weight:900;

  word-break:break-word;
}

@media (max-width:520px){

  .popup{
    width:min(390px,92vw);
    max-height:calc(100dvh - 44px);
    padding:10px 11px;
    border-radius:16px;
  }

  .popupHead{
    gap:8px;
    margin-bottom:5px;
  }

  .popupLogo{
    width:42px;
    height:42px;
  }

  .popupName{
    font-size:20px;
  }

  .popupSymbol{
    font-size:12px;
  }

  .popupPrice{
    font-size:29px;
  }

  .popupGain{
    font-size:14px;
  }

  .chart{
    height:36px;
    margin-top:6px;
    font-size:12px;
  }

  .infoGrid{
    gap:4px;
    margin-top:6px;
  }

  .info{
    min-height:44px;
    padding:5px 7px;
  }

  .label{
    font-size:9px;
    margin-bottom:2px;
  }

  .value{
    font-size:12px;
  }
}


/* UPDATED MENU + SEARCH */
.searchButton{position:absolute;top:7px;right:8px;width:40px;height:40px;z-index:50002;border:0;outline:0;border-radius:50%;background:transparent;color:#ddd;display:flex;align-items:center;justify-content:center;font-size:18px;cursor:pointer;backdrop-filter:none}
.searchButton:hover{background:rgba(255,255,255,.06)}
.searchButton svg{width:21px;height:21px}
.searchPanel{position:fixed;top:10px;right:50px;width:min(230px,34vw);height:38px;z-index:50003;display:flex;align-items:center;padding:0 12px;border:0;outline:0;border-radius:19px;background:rgba(0,0,0,.18);backdrop-filter:blur(14px);box-shadow:none}
.searchPanel.show{display:flex}.searchPanel input{width:100%;background:none;border:0;outline:0;color:#fff;font-size:13px}.searchPanel input::placeholder{color:#777}
.searchResults{position:fixed;top:55px;right:50px;width:min(230px,34vw);max-height:65vh;overflow:auto;z-index:50004;display:none;border:0;outline:0;border-radius:14px;background:rgba(0,0,0,.18);backdrop-filter:blur(14px)}
.searchResults.show{display:block}.searchResult{display:flex;align-items:center;gap:10px;padding:10px 13px;border-bottom:1px solid rgba(255,255,255,.08);cursor:pointer}.searchResult img{width:30px;height:30px;border-radius:50%;background:#000}.searchResult b{font-size:12px}.searchResult span{margin-left:auto;font-size:11px;color:#999}
.pageButton{top:auto;left:auto;right:14px;bottom:30px;width:52px;height:52px;border:0;outline:0;background:transparent;backdrop-filter:none;border-radius:50%;z-index:50010;box-shadow:none}
.pageButton:hover{background:rgba(255,255,255,.06)}
.pageButton .gridIcon{width:22px;height:22px;gap:3px}
.pageMenu{position:fixed;inset:0;width:100vw;height:100dvh;z-index:50009;padding:72px 18px 90px;display:block;opacity:0;pointer-events:none;transform:none;background:rgba(0,0,0,.20);backdrop-filter:blur(18px);overflow:auto}
.pageMenu.show{opacity:1;pointer-events:auto;transform:none}.pageMenu::before{content:'Menu';display:block;font-size:28px;font-weight:900;margin-bottom:20px}
.menuList{display:flex;flex-direction:column;gap:2px;max-width:520px}
.menuItem{width:100%;min-height:48px;padding:0 12px;border:0;border-bottom:1px solid #202020;background:transparent;color:#aaa;display:flex;align-items:center;justify-content:space-between;text-align:left;font-size:14px;font-weight:800;cursor:pointer}
.menuItem:hover,.menuItem.active{color:#fff;background:rgba(255,255,255,.045)}
.menuItem .chevron{font-size:18px;color:#666;transition:transform .2s}.menuItem.active .chevron{color:#aaa;transform:rotate(90deg)}
.subMenu{display:none;padding:7px 0 10px 12px}.subMenu.show{display:block}
.subTitle{font-size:10px;color:#666;text-transform:uppercase;font-weight:800;margin:5px 0 8px;padding-left:2px}
.subRow{display:flex;gap:7px;overflow-x:auto;padding:2px 0 5px;scrollbar-width:none}.subRow::-webkit-scrollbar{display:none}
.subToggle{flex:0 0 auto;padding:9px 13px;border:0;border-radius:18px;background:#151515;color:#999;font-size:11px;font-weight:800;cursor:pointer}.subToggle.active{background:#303030;color:#fff}
@media(max-width:600px){.searchPanel,.searchResults{width:190px}.searchPanel{right:48px}.searchResults{right:48px}}
</style>
</head>

<body>

<div class="app">

  
<button id="searchButton" class="searchButton" aria-label="Search"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-4-4"></path></svg></button>
<div id="searchPanel" class="searchPanel"><input id="searchInput" placeholder="Search all coins..." autocomplete="off"></div><div id="searchResults" class="searchResults"></div>
<div class="cryptofoamBrand">
    Cryptofoam
  </div>

  <button
    id="pageButton"
    class="pageButton"
    aria-label="Coin pages">

    <span class="gridIcon">
      <span></span>
      <span></span>
      <span></span>
      <span></span>
    </span>

  </button>

  <div
    id="pageMenu"
    class="pageMenu">
  </div>

  <div
    id="cloud"
    class="cloud">

  </div>

  <div
    id="overlay"
    class="overlay">

    <div
      id="popup"
      class="popup">

      <button
        id="close"
        class="close">
        ×
      </button>

      <div class="popupHead">

        <img
          id="pLogo"
          class="popupLogo"
          draggable="false">

        <div>

          <div
            id="pName"
            class="popupName">
          </div>

          <div
            id="pSymbol"
            class="popupSymbol">
          </div>

        </div>

      </div>

      <div class="priceRow">
        <div id="pPrice" class="popupPrice"></div>
        <div class="popupActions">
          <button id="favoriteStar" class="favoriteStar" aria-label="Save to Favorite" title="Favorite">
            <svg viewBox="0 0 24 24" fill="none">
              <path d="M12 3.8l2.55 5.17 5.7.83-4.13 4.03.98 5.68L12 16.83l-5.1 2.68.98-5.68-4.13-4.03 5.7-.83L12 3.8z"/>
            </svg>
          </button>
          <button id="blockExplorer" class="popupAction" aria-label="Block Explorer" title="Block Explorer">
            <svg viewBox="0 0 24 24"><path d="M12 3v18M3 12h18"/><path d="M7 7l10 10M17 7L7 17"/></svg>
          </button>
          <button id="coinWebsite" class="popupAction" aria-label="Coin Website" title="Coin Website">
            <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M3.8 12h16.4M12 3.5c2.2 2.3 3.3 5.1 3.3 8.5S14.2 18.2 12 20.5C9.8 18.2 8.7 15.4 8.7 12S9.8 5.8 12 3.5Z"/></svg>
          </button>
          <button id="tradingViewIcon" class="popupAction" aria-label="Open TradingView Chart" title="TradingView Chart">
            <svg viewBox="0 0 24 24"><path d="M4 19V9M10 19V5M16 19v-7M22 19V3"/><path d="M2 19h20"/></svg>

      <div

      <div class="infoGrid">

        <div class="info">
          <div class="label">Market Cap</div>

        </div>

        <div class="info">
          <div class="label">Volume 24H</div>
          <div id="volume" class="value"></div>
        </div>

        <div class="info">
          <div class="label">High 24H</div>
          <div id="high" class="value"></div>
        </div>

        <div class="info">
          <div class="label">Low 24H</div>
          <div id="low" class="value"></div>
        </div>

        <div class="info">
          <div class="label">Rank</div>
          <div id="rank" class="value"></div>
        </div>

        <div class="info">
          <div class="label">Circulating</div>
          <div id="supply" class="value"></div>
        </div>

        <div class="info">
          <div class="label">Total Supply</div>
          <div id="totalSupply" class="value"></div>
        </div>

        <div class="info">
          <div class="label">Max Supply</div>
          <div id="maxSupply" class="value"></div>
        </div>

        <div class="info">
          <div class="label">ATH</div>
          <div id="ath" class="value"></div>
        </div>

        <div class="info">
          <div class="label">ATL</div>
          <div id="atl" class="value"></div>
        </div>

        <div class="info">
          <div class="label">1H</div>
          <div id="oneH" class="value"></div>
        </div>

        <div class="info">
          <div class="label">24H</div>
          <div id="twentyFourH" class="value"></div>
        </div>

        <div class="info">
          <div class="label">7D</div>
          <div id="sevenD" class="value"></div>
        </div>

        <div class="info">
          <div class="label">30D</div>
          <div id="thirtyD" class="value"></div>
        </div>

      </div>

    </div>

  </div>

</div>

<script>

/* =====================================================
   CONFIG
===================================================== */

const TOTAL_COINS = 1000;

const COINS_PER_PAGE = 100;

const TOTAL_PAGES =
  Math.ceil(
    TOTAL_COINS /
    COINS_PER_PAGE
  );

const MIN_SIZE = 52;

const MAX_SIZE = 118;

const SAFE_TOP = 55;


/* =====================================================
   STATE
===================================================== */

let allCoins = [];

let visibleCoins = [];

let currentPage = 0;

let selectedCoin = null;

let drag = null;

let socket = null;

let reconnectTimer = null;

let positions = new Map();

let nodes = new Map();

let coinMap = new Map();


/* =====================================================
   DOM
===================================================== */

const cloud =
  document.getElementById(
    'cloud'
  );

const pageButton =
  document.getElementById(
    'pageButton'
  );

const pageMenu =
  document.getElementById(
    'pageMenu'
  );


/* =====================================================
   FORMAT
===================================================== */

function price(v){

  if(v == null)
    return '—';

  v=Number(v);

  if(v>=1000)
    return '$'+
      v.toLocaleString(
        'en-US',
        {
          maximumFractionDigits:1
        }
      );

  if(v>=1)
    return '$'+
      v.toLocaleString(
        'en-US',
        {
          maximumFractionDigits:3
        }
      );

  if(v>=0.01)
    return '$'+
      v.toLocaleString(
        'en-US',
        {
          maximumFractionDigits:4
        }
      );

  return '$'+
    v.toLocaleString(
      'en-US',
      {
        maximumFractionDigits:8
      }
    );
}


function percent(v){

  if(v==null)
    return '—';

  v=Number(v);

  return (
    v>=0
      ?'+'
      :''
  )+
  v.toFixed(2)+
  '%';
}


function large(v){

  if(v==null)
    return '—';

  v=Number(v);

  if(v>=1e12)
    return '$'+
      (v/1e12).toFixed(2)+
      'T';

  if(v>=1e9)
    return '$'+
      (v/1e9).toFixed(2)+
      'B';

  if(v>=1e6)
    return '$'+
      (v/1e6).toFixed(2)+
      'M';

  if(v>=1e3)
    return '$'+
      (v/1e3).toFixed(2)+
      'K';

  return '$'+
    v.toLocaleString();
}


function supply(v){

  if(v==null)
    return '—';

  v=Number(v);

  if(v>=1e12)
    return (v/1e12).toFixed(2)+'T';

  if(v>=1e9)
    return (v/1e9).toFixed(2)+'B';

  if(v>=1e6)
    return (v/1e6).toFixed(2)+'M';

  return v.toLocaleString(
    'en-US',
    {
      maximumFractionDigits:0
    }
  );
}


/* =====================================================
   COIN SIZE BASED ON GAIN
===================================================== */

function sizeFromGain(gain){

  const g=
    Math.min(
      Math.abs(
        Number(gain)||0
      ),
      100
    );

  const n=
    Math.pow(
      g/100,
      .48
    );

  return Math.round(
    MIN_SIZE+
    (
      MAX_SIZE-
      MIN_SIZE
    )*n
  );
}


/* =====================================================
   RANDOM
===================================================== */

function random(min,max){

  return Math.random()*
    (max-min)+min;
}

function applyMarketFilter(name){let base=[...allCoins]; if(name==='Gainer')base.sort((a,b)=>(b.price_change_percentage_24h||0)-(a.price_change_percentage_24h||0)); if(name==='Looser')base.sort((a,b)=>(a.price_change_percentage_24h||0)-(b.price_change_percentage_24h||0)); if(name==='Favorite')base=base.filter(c=>localStorage.getItem('fav_'+c.id)==='1'); visibleCoins=base.slice(0,COINS_PER_PAGE); cloud.innerHTML='';nodes.clear();createPositions();visibleCoins.forEach(c=>cloud.appendChild(createCoin(c)))}
let activeTimeFrame='1D';
function getLiveTimeframeGain(c,name){
  if(name==='1H')return Number(c.price_change_percentage_1h_in_currency)||0;
  if(name==='1D')return Number(c.price_change_percentage_24h)||0;
  if(name==='1W')return Number(c.price_change_percentage_7d_in_currency)||0;
  if(name==='1M')return Number(c.price_change_percentage_30d_in_currency)||0;
  // CoinGecko does not provide 4H/1Y in the markets endpoint used here.
  // Use the current 24H value as the live fallback until a historical source is available.
  return Number(c.price_change_percentage_24h)||0;
}
function applyTimeFilter(name){
  if(!allCoins.length)return;
  if(name.startsWith('Rank')){
    activeTimeFrame='RANK';
    const m=name.match(/(\d+)–(\d+)/);
    const base=allCoins.slice(Number(m[1])-1,Number(m[2]));
    visibleCoins=base.slice(0,COINS_PER_PAGE);
  }else{
    activeTimeFrame=name;
    const base=[...allCoins];
    base.sort((a,b)=>getLiveTimeframeGain(b,name)-getLiveTimeframeGain(a,name));
    visibleCoins=base.slice(0,COINS_PER_PAGE);
  }
  cloud.innerHTML='';nodes.clear();createPositions();visibleCoins.forEach(c=>cloud.appendChild(createCoin(c)));
}

function refreshActiveTimeframe(){
  if(!allCoins.length)return;
  if(activeTimeFrame==='RANK')return;
  const base=[...allCoins].sort((a,b)=>getLiveTimeframeGain(b,activeTimeFrame)-getLiveTimeframeGain(a,activeTimeFrame));
  visibleCoins=base.slice(0,COINS_PER_PAGE);
  visibleCoins.forEach(c=>updateCoin(c));
  // Rebuild only when the ordering changes so the live cloud follows the selected timeframe.
  const ids=visibleCoins.map(c=>c.id).join('|');
  const currentIds=[...nodes.keys()].join('|');
  if(ids!==currentIds){
    cloud.innerHTML='';nodes.clear();createPositions();visibleCoins.forEach(c=>cloud.appendChild(createCoin(c)));
  }
}

/* =====================================================
   POSITIONS
===================================================== */

function createPositions(){

  positions.clear();

  const width=
    innerWidth;

  const height=
    innerHeight;

  const placed=[];

  visibleCoins.forEach(
    coin=>{

      const size=
        sizeFromGain(
          coin.price_change_percentage_24h
        );

      let x=0;
      let y=0;

      let found=false;

      for(
        let attempt=0;
        attempt<350;
        attempt++
      ){

        x=
          random(
            1,
            Math.max(
              2,
              width-size-1
            )
          );

        y=
          random(
            SAFE_TOP,
            Math.max(
              SAFE_TOP+1,
              height-size-1
            )
          );

        let good=true;

        for(
          const p of placed
        ){

          const dx=
            (
              x+
              size/2
            )-
            (
              p.x+
              p.size/2
            );

          const dy=
            (
              y+
              size/2
            )-
            (
              p.y+
              p.size/2
            );

          const distance=
            Math.sqrt(
              dx*dx+
              dy*dy
            );

          const minimum=
            (
              size/2+
              p.size/2
            )*.78;

          if(
            distance<
            minimum
          ){

            good=false;

            break;

          }

        }

        if(good){

          found=true;

          break;

        }

      }

      if(!found){

        x=
          random(
            0,
            Math.max(
              1,
              width-size
            )
          );

        y=
          random(
            SAFE_TOP,
            Math.max(
              SAFE_TOP+1,
              height-size
            )
          );

      }

      const p={

        x:x,
        y:y,

        homeX:x,
        homeY:y,

        vx:0,
        vy:0,

        size:size,

        phaseX:
          Math.random()*
          Math.PI*2,

        phaseY:
          Math.random()*
          Math.PI*2,

        speedX:
          random(
            .00032,
            .00072
          ),

        speedY:
          random(
            .00028,
            .00068
          ),

        amplitudeX:
          random(2.0,5.0),

        amplitudeY:
          random(2.0,5.0),

        rotation:0,

        pulsePhase:
          Math.random()*
          Math.PI*2,

        pulseSpeed:
          random(
            .00065,
            .00125
          ),

        rotSpeed:
          random(
            .00012,
            .00032
          )

      };

      placed.push(p);

      positions.set(
        coin.id,
        p
      );

    }
  );

}


/* =====================================================
   CLAMP
===================================================== */

function clampPosition(p){

  const w=
    innerWidth;

  const h=
    innerHeight;

  const maxX=
    Math.max(
      0,
      w-p.size
    );

  const maxY=
    Math.max(
      SAFE_TOP,
      h-p.size
    );

  p.x=
    Math.max(
      0,
      Math.min(
        maxX,
        p.x
      )
    );

  p.y=
    Math.max(
      SAFE_TOP,
      Math.min(
        maxY,
        p.y
      )
    );

}


function bounceFromEdges(p){

  const w=
    innerWidth;

  const h=
    innerHeight;

  const maxX=
    Math.max(
      0,
      w-p.size
    );

  const maxY=
    Math.max(
      SAFE_TOP,
      h-p.size
    );

  const bounce=.82;

  if(
    p.x<=0
  ){

    p.x=0;

    if(p.vx<0)
      p.vx=
        -p.vx*bounce;

  }else if(
    p.x>=maxX
  ){

    p.x=maxX;

    if(p.vx>0)
      p.vx=
        -p.vx*bounce;

  }

  if(
    p.y<=SAFE_TOP
  ){

    p.y=SAFE_TOP;

    if(p.vy<0)
      p.vy=
        -p.vy*bounce;

  }else if(
    p.y>=maxY
  ){

    p.y=maxY;

    if(p.vy>0)
      p.vy=
        -p.vy*bounce;

  }

}


/* =====================================================
   APPLY
===================================================== */

function applyPosition(id){

  const p=
    positions.get(id);

  const node=
    nodes.get(id);

  if(
    !p ||
    !node
  )
    return;

  node.card.style.setProperty(
    '--x',
    p.x+'px'
  );

  node.card.style.setProperty(
    '--y',
    p.y+'px'
  );

  node.card.style.setProperty(
    '--size',
    p.size+'px'
  );

  node.card.style.setProperty(
    '--rot',
    p.rotation+'deg'
  );

  const pulse=
    1+
    Math.sin(
      performance.now()*
      p.pulseSpeed+
      p.pulsePhase
    )*.035;

  node.card.style.setProperty(
    '--pulse',
    pulse.toFixed(4)
  );

}

/* =====================================================
   BINANCE WEBSOCKET
===================================================== */

function connectBinance(){

  if(socket){

    try{
      socket.close();
    }catch(e){}

  }

  const symbols=
    allCoins
    .map(
      coin=>
        coin.symbol
        .toLowerCase()+
        'usdt@ticker'
    )
    .filter(
      (v,i,a)=>
        a.indexOf(v)===i
    )
    .slice(
      0,
      1000
    );

  if(
    !symbols.length
  )
    return;

  const url=
    'wss://stream.binance.com:9443/stream?streams='+
    symbols.join('/');

  try{

    socket=
      new WebSocket(
        url
      );

    socket.onmessage=
      event=>{

        try{

          const packet=
            JSON.parse(
              event.data
            );

          const data=
            packet.data;

          if(!data)
            return;

          const symbol=
            String(
              data.s
            )
            .replace(
              /USDT$/i,
              ''
            )
            .toLowerCase();

          allCoins.forEach(
            coin=>{

              if(
                coin.symbol
                .toLowerCase()===
                symbol
              ){

                coin.current_price=
                  Number(data.c);

                coin.price_change_percentage_24h=
                  Number(data.P);

                updateCoin(
                  coin
                );

                refreshActiveTimeframe();

                if(
                  selectedCoin &&
                  selectedCoin.id===
                  coin.id
                ){

                  updatePopup(
                    coin
                  );

                }

              }

            }
          );

        }catch(e){

          console.warn(e);

        }

      };

    socket.onclose=()=>{

      clearTimeout(
        reconnectTimer
      );

      reconnectTimer=
        setTimeout(
          connectBinance,
          5000
        );

    };

  }catch(error){

    console.warn(
      error
    );

  }

}


/* =====================================================
   UPDATE COIN
===================================================== */

function updateCoin(coin){

  const node=
    nodes.get(
      coin.id
    );

  if(!node)
    return;

  node.priceEl.textContent=
    price(
      coin.current_price
    );

  const gain=
    Number(
      coin.price_change_percentage_24h
    )||0;

  node.gainEl.textContent=
    percent(gain);

  node.gainEl.className=
    'coinGain '+
    (
      gain>=0
        ?'up'
        :'down'
    );

  const p=
    positions.get(
      coin.id
    );

  if(!p)
    return;

  const oldSize=
    p.size;

  const newSize=
    sizeFromGain(
      gain
    );

  if(
    Math.abs(
      oldSize-newSize
    )>=1
  ){

    const cx=
      p.x+
      oldSize/2;

    const cy=
      p.y+
      oldSize/2;

    p.size=
      newSize;

    p.x=
      cx-
      newSize/2;

    p.y=
      cy-
      newSize/2;

    p.homeX=
      p.x;

    p.homeY=
      p.y;

    clampPosition(p);

    applyPosition(
      coin.id
    );

  }

}


/* =====================================================
   DRAG
===================================================== */

function enableDrag(
  card,
  id
){

  let pointerId=null;

  let startPointerX=0;
  let startPointerY=0;

  let startX=0;
  let startY=0;

  let lastX=0;
  let lastY=0;

  let velocityX=0;
  let velocityY=0;

  let moved=false;

  card.addEventListener(
    'pointerdown',
    e=>{

      const p=
        positions.get(id);

      if(!p)
        return;

      pointerId=
        e.pointerId;

      card.setPointerCapture(
        pointerId
      );

      startPointerX=
        e.clientX;

      startPointerY=
        e.clientY;

      startX=p.x;
      startY=p.y;

      lastX=e.clientX;
      lastY=e.clientY;

      velocityX=0;
      velocityY=0;

      moved=false;

      drag={
        id:id
      };

      card.classList.add(
        'dragging'
      );

    },
    {
      passive:true
    }
  );

  card.addEventListener(
    'pointermove',
    e=>{

      if(
        pointerId!==
        e.pointerId
      )
        return;

      if(
        !drag ||
        drag.id!==id
      )
        return;

      const p=
        positions.get(id);

      if(!p)
        return;

      const dx=
        e.clientX-
        startPointerX;

      const dy=
        e.clientY-
        startPointerY;

      if(
        Math.abs(dx)>3 ||
        Math.abs(dy)>3
      ){

        moved=true;

      }

      p.x=
        startX+
        dx;

      p.y=
        startY+
        dy;

      clampPosition(p);

      velocityX=
        velocityX*.55+
        (
          e.clientX-
          lastX
        )*.45;

      velocityY=
        velocityY*.55+
        (
          e.clientY-
          lastY
        )*.45;

      lastX=e.clientX;
      lastY=e.clientY;

      p.rotation=
        Math.max(
          -7,
          Math.min(
            7,
            velocityX*.7
          )
        );

      pushNeighbors(
        id,
        velocityX,
        velocityY
      );

      applyPosition(id);

    },
    {
      passive:true
    }
  );

  function release(e){

    if(
      pointerId!==
      e.pointerId
    )
      return;

    pointerId=null;

    const p=
      positions.get(id);

    if(p){

      p.vx+=
        velocityX*.45;

      p.vy+=
        velocityY*.45;

      p.homeX=
        p.x;

      p.homeY=
        p.y;

      p.rotation=0;

    }

    card.classList.remove(
      'dragging'
    );

    const wasClick=
      !moved;

    drag=null;

    if(wasClick){

      openPopup(id);

    }

  }

  card.addEventListener(
    'pointerup',
    release
  );

  card.addEventListener(
    'pointercancel',
    release
  );

}


/* =====================================================
   PUSH NEIGHBORS
===================================================== */

function pushNeighbors(
  movingId,
  vx,
  vy
){

  const moving=
    positions.get(
      movingId
    );

  if(!moving)
    return;

  positions.forEach(
    (other,id)=>{

      if(
        id===
        movingId
      )
        return;

      const dx=
        (
          other.x+
          other.size/2
        )-
        (
          moving.x+
          moving.size/2
        );

      const dy=
        (
          other.y+
          other.size/2
        )-
        (
          moving.y+
          moving.size/2
        );

      const distance=
        Math.sqrt(
          dx*dx+
          dy*dy
        );

      const minimum=
        (
          moving.size/2+
          other.size/2
        )*.92;

      if(
        distance<
        minimum
      ){

        const d=
          Math.max(
            distance,
            .001
          );

        const nx=
          dx/d;

        const ny=
          dy/d;

        const overlap=
          minimum-distance;

        const speed=
          Math.min(
            13,
            Math.sqrt(
              vx*vx+
              vy*vy
            )
          );

        const impulse=
          overlap*.95+
          speed*.42;

        other.vx+=
          nx*
          impulse;

        other.vy+=
          ny*
          impulse;

        other.rotation+=
          nx*
          impulse*
          .7;

        other.vx=
          Math.max(
            -8,
            Math.min(
              8,
              other.vx
            )
          );

        other.vy=
          Math.max(
            -8,
            Math.min(
              8,
              other.vy
            )
          );

        other.homeX+=
          nx*
          Math.min(
            11,
            overlap+
            speed*.65
          );

        other.homeY+=
          ny*
          Math.min(
            11,
            overlap+
            speed*.65
          );

        clampPosition(
          other
        );

      }

    }
  );

}


/* =====================================================
   FLOATING PHYSICS
===================================================== */

function animate(){

  const now=
    performance.now();

  positions.forEach(
    (p,id)=>{

      const held=
        drag &&
        drag.id===
        id;

      if(!held){

        const fx=
          Math.sin(
            now*
            p.speedX+
            p.phaseX
          )*
          p.amplitudeX;

        const fy=
          Math.cos(
            now*
            p.speedY+
            p.phaseY
          )*
          p.amplitudeY;

        const targetX=
          p.homeX+
          fx;

        const targetY=
          p.homeY+
          fy;

        p.vx+=
          (
            targetX-
            p.x
          )*.012;

        p.vy+=
          (
            targetY-
            p.y
          )*.012;

        p.vx*=.93;
        p.vy*=.93;

        p.x+=p.vx;
        p.y+=p.vy;

        p.rotation=
          Math.sin(
            now*
            p.rotSpeed+
            p.phaseX
          )*2.2;

      }

      bounceFromEdges(p);

      clampPosition(p);

      applyPosition(id);

    }
  );

  collisionPhysics();

  requestAnimationFrame(
    animate
  );

}


/* =====================================================
   COLLISION
===================================================== */

function collisionPhysics(){

  const ids=
    Array.from(
      positions.keys()
    );

  for(
    let i=0;
    i<ids.length;
    i++
  ){

    const a=
      positions.get(
        ids[i]
      );

    if(!a)
      continue;

    for(
      let j=i+1;
      j<ids.length;
      j++
    ){

      const b=
        positions.get(
          ids[j]
        );

      if(!b)
        continue;

      const dx=
        (
          b.x+
          b.size/2
        )-
        (
          a.x+
          a.size/2
        );

      const dy=
        (
          b.y+
          b.size/2
        )-
        (
          a.y+
          a.size/2
        );

      const distance=
        Math.sqrt(
          dx*dx+
          dy*dy
        );

      const minimum=
        (
          a.size/2+
          b.size/2
        )*.82;

      if(
        distance<
        minimum &&
        distance>.001
      ){

        const nx=
          dx/
          distance;

        const ny=
          dy/
          distance;

        const overlap=
          minimum-
          distance;

        const push=
          overlap*.045;

        a.x-=
          nx*
          push;

        a.y-=
          ny*
          push;

        b.x+=
          nx*
          push;

        b.y+=
          ny*
          push;

        const bounce=
          .008;

        a.vx-=
          nx*
          bounce;

        a.vy-=
          ny*
          bounce;

        b.vx+=
          nx*
          bounce;

        b.vy+=
          ny*
          bounce;

        clampPosition(a);
        clampPosition(b);

      }

    }

  }

}

/* =====================================================
   TRADINGVIEW
===================================================== */

function openTradingView(){
  if(!selectedCoin)return;
  const symbol=selectedCoin.symbol.toUpperCase();
  const url='https://www.tradingview.com/chart/?symbol=BINANCE%3A'+encodeURIComponent(symbol+'USDT');
  window.open(url,'_blank');
}

async function openCoinLink(type){
  if(!selectedCoin)return;
  try{
    const response=await fetch('https://api.coingecko.com/api/v3/coins/'+encodeURIComponent(selectedCoin.id)+'?localization=false&tickers=false&market_data=false&community_data=false&developer_data=false&sparkline=false');
    if(!response.ok)throw new Error('Coin detail HTTP '+response.status);
    const data=await response.json();
    const links=data.links||{};
    let url='';
    if(type==='explorer')url=(links.blockchain_site||[]).find(Boolean)||'';
    if(type==='website')url=(links.homepage||[]).find(Boolean)||'';
    if(url)window.open(url,'_blank');
    else alert(type==='explorer'?'Block Explorer tidak tersedia untuk coin ini.':'Website coin tidak tersedia untuk coin ini.');
  }catch(error){
    console.warn(error);
    alert('Link coin belum tersedia. Silakan coba lagi.');
  }
}

document.getElementById('tradingViewIcon').addEventListener('click',openTradingView);
document.getElementById('blockExplorer').addEventListener('click',()=>openCoinLink('explorer'));
document.getElementById('coinWebsite').addEventListener('click',()=>openCoinLink('website'));
