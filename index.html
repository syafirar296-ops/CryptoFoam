<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

<title>Crypto Coin Cloud</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  width:100%;
  height:100%;
  margin:0;
  overflow:hidden;
  background:#000;
  color:#fff;
  font-family:Arial,Helvetica,sans-serif;
}

body{
  touch-action:none;
}

.app{
  position:relative;
  width:100vw;
  height:100dvh;
  overflow:hidden;
  background:#000;
}


/* =====================================================
   GRID BUTTON
===================================================== */

.pageButton{
  position:absolute;
  top:9px;
  left:9px;

  width:30px;
  height:30px;

  z-index:50000;

  border-radius:50%;

  border:0;
  outline:0;

  background:transparent;

  color:#d5d8da;

  display:flex;
  align-items:center;
  justify-content:center;

  cursor:pointer;

  transition:
    transform .22s ease,
    filter .22s ease,
    opacity .22s ease;
}

.pageButton:hover{
  transform:translateY(-2px) scale(1.08);
  filter:drop-shadow(0 5px 10px rgba(255,255,255,.22));
}

.pageButton:active{
  transform:translateY(0) scale(.88);
}

.gridIcon{
  width:14px;
  height:14px;

  display:grid;

  grid-template-columns:
    repeat(2,1fr);

  grid-template-rows:
    repeat(2,1fr);

  gap:2px;

  filter:drop-shadow(0 3px 6px rgba(255,255,255,.18));
  transition:
    transform .22s ease,
    filter .22s ease;
}

.pageButton:hover .gridIcon{
  transform:translateY(-1px);
  filter:drop-shadow(0 5px 9px rgba(255,255,255,.30));
}

.gridIcon span{
  display:block;

  width:100%;
  height:100%;

  border:1.2px solid #aeb3b7;

  border-radius:2px;

  box-shadow:
    0 1px 4px rgba(255,255,255,.10);
}


/* =====================================================
   PAGE MENU
===================================================== */

.pageMenu{
  position:absolute;

  top:10px;
  left:58px;
  right:8px;

  height:40px;

  z-index:49000;

  display:flex;
  align-items:center;

  gap:6px;

  overflow-x:auto;
  overflow-y:hidden;

  opacity:0;

  pointer-events:none;

  transform:translateX(-8px);

  transition:
    opacity .2s ease,
    transform .2s ease;

  scrollbar-width:none;
}

.pageMenu::-webkit-scrollbar{
  display:none;
}

.pageMenu.show{
  opacity:1;

  pointer-events:auto;

  transform:translateX(0);
}

.pageItem{
  flex:0 0 auto;

  height:32px;

  padding:0 13px;

  border-radius:16px;

  border:1px solid #555b60;

  background:rgba(10,10,10,.9);

  color:#aeb4b9;

  font-size:10px;

  font-weight:800;

  white-space:nowrap;

  display:flex;

  align-items:center;
  justify-content:center;
}

.pageItem.active{
  color:#fff;

  border-color:#999fa4;

  background:
    rgba(130,135,140,.17);
}


/* =====================================================
   COIN CLOUD
===================================================== */

.cloud{
  position:absolute;

  inset:0;

  overflow:hidden;

  touch-action:none;
}


/* =====================================================
   COIN
===================================================== */

.coinCard{
  position:absolute;

  left:0;
  top:0;

  width:var(--size);
  height:var(--size);

  border-radius:50%;

  touch-action:none;

  user-select:none;
  -webkit-user-select:none;

  will-change:
    transform,
    width,
    height;

  cursor:grab;

  transform:
    translate3d(
      var(--x),
      var(--y),
      0
    )
    rotate(
      var(--rot)
    );

  z-index:10;
}

.coinCard.dragging{
  z-index:60000;

  cursor:grabbing;
}

.coinBody{
  position:relative;

  width:100%;
  height:100%;

  border-radius:50%;

  display:flex;

  flex-direction:column;

  align-items:center;
  justify-content:center;

  overflow:hidden;

  border:
    1px solid
    rgba(120,126,132,.85);

  background:
    radial-gradient(
      circle at 35% 25%,
      rgba(180,185,190,.12),
      rgba(18,18,18,.91) 62%,
      #000 100%
    );

  box-shadow:
    inset 0 0 15px
    rgba(190,195,200,.055),

    0 0 13px
    rgba(180,185,190,.025);

  pointer-events:none;
}

.coinBody::after{
  content:"";

  position:absolute;

  inset:calc(var(--size) * .025);

  border-radius:50%;

  border:
    1px solid
    rgba(180,185,190,.08);
}

.coinLogo{
  width:31%;
  height:31%;

  min-width:0;
  min-height:0;

  max-width:none;
  max-height:none;

  border-radius:50%;

  object-fit:contain;

  background:#000;

  border:
    1px solid #72797f;

  padding:1px;
}

.coinSymbol{
  width:96%;

  margin-top:2px;

  text-align:center;

  color:#eee;

  font-size:clamp(7px,calc(var(--size)*.072),16px);

  font-weight:900;

  white-space:nowrap;

  overflow:hidden;

  text-overflow:ellipsis;
}

.coinPrice{
  width:96%;

  text-align:center;

  margin-top:1px;

  color:#c5cacf;

  font-size:clamp(6px,calc(var(--size)*.062),15px);

  font-weight:700;

  white-space:nowrap;

  overflow:hidden;

  text-overflow:ellipsis;
}

.coinGain{
  margin-top:1px;

  font-size:clamp(6px,calc(var(--size)*.060),15px);

  font-weight:900;
}

.up{
  color:#55dc91;
}

.down{
  color:#ff5965;
}


/* =====================================================
   POPUP
===================================================== */

.overlay{
  position:fixed;

  inset:0;

  z-index:100000;

  display:none;

  align-items:center;
  justify-content:center;

  padding:10px;

  background:
    rgba(0,0,0,.20);

  backdrop-filter:blur(7px);
  -webkit-backdrop-filter:blur(7px);
}

.overlay.show{
  display:flex;
}

 .popup{
  position:relative;

  width:min(390px,95vw);

  max-height:
    calc(100dvh - 36px);

  overflow:auto;

  padding:12px 14px;

  border-radius:21px;

  border:
    1px solid
    rgba(135,142,149,.65);

  background:
    linear-gradient(
      145deg,
      rgba(31,33,35,.80),
      rgba(2,2,2,.64)
    );

  box-shadow:
    0 20px 55px
    rgba(0,0,0,.78);

  backdrop-filter:blur(20px);
  -webkit-backdrop-filter:blur(20px);

  animation:
    popupIn .2s ease-out;
}

@keyframes popupIn{
  from{
    opacity:0;

    transform:
      scale(.94);
  }

  to{
    opacity:1;

    transform:
      scale(1);
  }
}

 .close{
  position:absolute;

  top:7px;
  right:7px;

  width:30px;
  height:30px;

  border-radius:50%;

  border:
    1px solid
    rgba(140,146,152,.60);

  background:
    rgba(0,0,0,.45);

  color:#ddd;

  font-size:22px;

  line-height:1;
}

 .popupHead{
  display:flex;

  align-items:center;

  gap:9px;

  padding-right:34px;

  margin-bottom:6px;
}

 .popupLogo{
  width:45px;
  height:45px;

  border-radius:50%;

  object-fit:contain;

  background:#000;

  border:
    1px solid #777e84;

  padding:3px;
}

 .popupName{
  font-size:21px;

  font-weight:900;

  color:#fff;
}

 .popupSymbol{
  margin-top:2px;

  color:#a0a7ad;

  font-size:13px;

  font-weight:800;

  text-transform:uppercase;
}

 .popupPrice{
  font-size:31px;

  line-height:1.05;

  font-weight:900;

  color:#fff;
}

 .popupGain{
  margin-top:3px;

  font-size:15px;

  font-weight:900;
}

 .chart{
  width:100%;
  height:38px;

  margin-top:7px;

  border-radius:12px;

  border:
    1px solid
    rgba(135,142,149,.55);

  background:
    rgba(255,255,255,.035);

  color:#ddd;

  display:flex;

  align-items:center;
  justify-content:center;

  gap:9px;

  font-size:11px;

  font-weight:900;
}

.chart svg{
  width:20px;
  height:20px;
}

 .infoGrid{
  display:grid;

  grid-template-columns:
    1fr 1fr;

  gap:5px;

  margin-top:7px;
}

 .info{
  min-height:47px;

  padding:6px 8px;

  border-radius:11px;

  background:
    rgba(255,255,255,.028);

  border:
    1px solid
    rgba(115,123,130,.30);
}

 .label{
  margin-bottom:3px;

  color:#8f979d;

  font-size:10px;

  font-weight:800;

  text-transform:uppercase;
}

 .value{
  color:#f0f1f2;

  font-size:13px;

  font-weight:900;

  word-break:break-word;
}

@media (max-width:520px){
  .popup{
    width:min(390px,92vw);
    max-height:calc(100dvh - 44px);
    padding:10px 11px;
    border-radius:16px;
  }

  .popupHead{
    gap:8px;
    margin-bottom:5px;
  }

  .popupLogo{
    width:42px;
    height:42px;
  }

  .popupName{
    font-size:20px;
  }

  .popupSymbol{
    font-size:12px;
  }

  .popupPrice{
    font-size:29px;
  }

  .popupGain{
    font-size:14px;
  }

  .chart{
    height:36px;
    margin-top:6px;
    font-size:12px;
  }

  .infoGrid{
    gap:4px;
    margin-top:6px;
  }

  .info{
    min-height:44px;
    padding:5px 7px;
  }

  .label{
    font-size:9px;
    margin-bottom:2px;
  }

  .value{
    font-size:12px;
  }
}

</style>
</head>


<body>

<div class="app">


  <!-- GRID BUTTON -->

  <button
    id="pageButton"
    class="pageButton"
    aria-label="Coin pages">

    <span class="gridIcon">

      <span></span>
      <span></span>
      <span></span>
      <span></span>

    </span>

  </button>


  <!-- PAGE MENU -->

  <div
    id="pageMenu"
    class="pageMenu">
  </div>


  <!-- COIN CLOUD -->

  <div
    id="cloud"
    class="cloud">

    <div class="loading">
      Loading 1000 coins...
    </div>

  </div>


  <!-- POPUP -->

  <div
    id="overlay"
    class="overlay">

    <div
      id="popup"
      class="popup">


      <button
        id="close"
        class="close">

        ×

      </button>


      <div class="popupHead">

        <img
          id="pLogo"
          class="popupLogo"
          draggable="false">

        <div>

          <div
            id="pName"
            class="popupName">
          </div>

          <div
            id="pSymbol"
            class="popupSymbol">
          </div>

        </div>

      </div>


      <div
        id="pPrice"
        class="popupPrice">
      </div>


      <div
        id="pGain"
        class="popupGain">
      </div>


      <!-- TRADINGVIEW -->

      <button
        id="chart"
        class="chart">

        <svg
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.7"
          stroke-linecap="round"
          stroke-linejoin="round">

          <path d="M6 3v5"/>

          <rect
            x="4"
            y="8"
            width="4"
            height="7"
            rx="1"/>

          <path d="M6 15v6"/>

          <path d="M12 3v3"/>

          <rect
            x="10"
            y="6"
            width="4"
            height="10"
            rx="1"/>

          <path d="M12 16v5"/>

          <path d="M18 3v7"/>

          <rect
            x="16"
            y="10"
            width="4"
            height="6"
            rx="1"/>

          <path d="M18 16v5"/>

        </svg>

        Open TradingView Chart

      </button>


      <div class="infoGrid">

        <div class="info">
          <div class="label">Market Cap</div>
          <div id="marketCap" class="value"></div>
        </div>

        <div class="info">
          <div class="label">Volume 24H</div>
          <div id="volume" class="value"></div>
        </div>

        <div class="info">
          <div class="label">High 24H</div>
          <div id="high" class="value"></div>
        </div>

        <div class="info">
          <div class="label">Low 24H</div>
          <div id="low" class="value"></div>
        </div>

        <div class="info">
          <div class="label">Rank</div>
          <div id="rank" class="value"></div>
        </div>

        <div class="info">
          <div class="label">Circulating</div>
          <div id="supply" class="value"></div>
        </div>

        <div class="info">
          <div class="label">Total Supply</div>
          <div id="totalSupply" class="value"></div>
        </div>

        <div class="info">
          <div class="label">Max Supply</div>
          <div id="maxSupply" class="value"></div>
        </div>

        <div class="info">
          <div class="label">ATH</div>
          <div id="ath" class="value"></div>
        </div>

        <div class="info">
          <div class="label">ATL</div>
          <div id="atl" class="value"></div>
        </div>

        <div class="info">
          <div class="label">1H</div>
          <div id="oneH" class="value"></div>
        </div>

        <div class="info">
          <div class="label">24H</div>
          <div id="twentyFourH" class="value"></div>
        </div>

        <div class="info">
          <div class="label">7D</div>
          <div id="sevenD" class="value"></div>
        </div>

        <div class="info">
          <div class="label">30D</div>
          <div id="thirtyD" class="value"></div>
        </div>

      </div>

    </div>

  </div>

</div>


<script>

/* =====================================================
   CONFIG
===================================================== */

const TOTAL_COINS = 1000;

const COINS_PER_PAGE = 100;

const TOTAL_PAGES =
  Math.ceil(
    TOTAL_COINS /
    COINS_PER_PAGE
  );

const MIN_SIZE = 48;

const MAX_SIZE = 100;

const SAFE_TOP = 55;


/* =====================================================
   STATE
===================================================== */

let allCoins = [];

let visibleCoins = [];

let currentPage = 0;

let selectedCoin = null;

let drag = null;

let socket = null;

let reconnectTimer = null;

let positions = new Map();

let nodes = new Map();

let coinMap = new Map();


/* =====================================================
   DOM
===================================================== */

const cloud =
  document.getElementById(
    'cloud'
  );

const pageButton =
  document.getElementById(
    'pageButton'
  );

const pageMenu =
  document.getElementById(
    'pageMenu'
  );


/* =====================================================
   FORMAT
===================================================== */

function price(v){

  if(v == null)
    return '—';

  v=Number(v);

  if(v>=1000)
    return '$'+
      v.toLocaleString(
        'en-US',
        {
          maximumFractionDigits:1
        }
      );

  if(v>=1)
    return '$'+
      v.toLocaleString(
        'en-US',
        {
          maximumFractionDigits:3
        }
      );

  if(v>=0.01)
    return '$'+
      v.toLocaleString(
        'en-US',
        {
          maximumFractionDigits:4
        }
      );

  return '$'+
    v.toLocaleString(
      'en-US',
      {
        maximumFractionDigits:8
      }
    );
}


function percent(v){

  if(v==null)
    return '—';

  v=Number(v);

  return (
    v>=0
      ?'+'
      :''
  )+
  v.toFixed(2)+
  '%';
}


function large(v){

  if(v==null)
    return '—';

  v=Number(v);

  if(v>=1e12)
    return '$'+
      (v/1e12).toFixed(2)+
      'T';

  if(v>=1e9)
    return '$'+
      (v/1e9).toFixed(2)+
      'B';

  if(v>=1e6)
    return '$'+
      (v/1e6).toFixed(2)+
      'M';

  if(v>=1e3)
    return '$'+
      (v/1e3).toFixed(2)+
      'K';

  return '$'+
    v.toLocaleString();
}


function supply(v){

  if(v==null)
    return '—';

  v=Number(v);

  if(v>=1e12)
    return (v/1e12).toFixed(2)+'T';

  if(v>=1e9)
    return (v/1e9).toFixed(2)+'B';

  if(v>=1e6)
    return (v/1e6).toFixed(2)+'M';

  return v.toLocaleString(
    'en-US',
    {
      maximumFractionDigits:0
    }
  );
}


/* =====================================================
   COIN SIZE BASED ON GAIN
===================================================== */

function sizeFromGain(gain){

  const g=
    Math.min(
      Math.abs(
        Number(gain)||0
      ),
      100
    );

  const n=
    Math.sqrt(
      g/100
    );

  return Math.round(
    MIN_SIZE+
    (
      MAX_SIZE-
      MIN_SIZE
    )*n
  );
}


/* =====================================================
   RANDOM
===================================================== */

function random(min,max){

  return Math.random()*
    (max-min)+min;
}


/* =====================================================
   PAGE MENU
===================================================== */

function createPageMenu(){

  pageMenu.innerHTML='';


  for(
    let i=0;
    i<TOTAL_PAGES;
    i++
  ){

    const start=
      i*
      COINS_PER_PAGE+
      1;

    const end=
      Math.min(
        (i+1)*
        COINS_PER_PAGE,
        TOTAL_COINS
      );


    const button=
      document.createElement(
        'button'
      );


    button.className=
      'pageItem';


    if(
      i===
      currentPage
    ){

      button.classList.add(
        'active'
      );

    }


    button.textContent=
      start+
      '–'+
      end;


    button.addEventListener(
      'click',
      ()=>{

        currentPage=i;

        createPageMenu();

        renderCurrentPage();

      }
    );


    pageMenu.appendChild(
      button
    );

  }

}


pageButton.addEventListener(
  'click',
  ()=>{

    pageMenu.classList.toggle(
      'show'
    );

  }
);


/* =====================================================
   POSITIONS
===================================================== */

function createPositions(){

  positions.clear();


  const width=
    innerWidth;

  const height=
    innerHeight;


  const placed=[];


  visibleCoins.forEach(
    coin=>{

      const size=
        sizeFromGain(
          coin.price_change_percentage_24h
        );


      let x=0;
      let y=0;

      let found=false;


      for(
        let attempt=0;
        attempt<350;
        attempt++
      ){

        x=
          random(
            1,
            Math.max(
              2,
              width-size-1
            )
          );


        y=
          random(
            SAFE_TOP,
            Math.max(
              SAFE_TOP+1,
              height-size-1
            )
          );


        let good=true;


        for(
          const p of placed
        ){

          const dx=
            (
              x+
              size/2
            )-
            (
              p.x+
              p.size/2
            );


          const dy=
            (
              y+
              size/2
            )-
            (
              p.y+
              p.size/2
            );


          const distance=
            Math.sqrt(
              dx*dx+
              dy*dy
            );


          const minimum=
            (
              size/2+
              p.size/2
            )*.78;


          if(
            distance<
            minimum
          ){

            good=false;

            break;

          }

        }


        if(good){

          found=true;

          break;

        }

      }


      if(!found){

        x=
          random(
            0,
            Math.max(
              1,
              width-size
            )
          );

        y=
          random(
            SAFE_TOP,
            Math.max(
              SAFE_TOP+1,
              height-size
            )
          );

      }


      const p={

        x:x,
        y:y,

        homeX:x,
        homeY:y,

        vx:0,
        vy:0,

        size:size,

        phaseX:
          Math.random()*
          Math.PI*2,

        phaseY:
          Math.random()*
          Math.PI*2,

        speedX:
          random(
            .00045,
            .0011
          ),

        speedY:
          random(
            .0004,
            .001
          ),

        amplitudeX:
          random(
            1.8,
            4.8
          ),

        amplitudeY:
          random(
            1.8,
            4.8
          ),

        rotation:0,

        rotSpeed:
          random(
            .00015,
            .0004
          )

      };


      placed.push(p);

      positions.set(
        coin.id,
        p
      );

    }
  );

}


/* =====================================================
   CLAMP
===================================================== */

function clampPosition(p){

  const w=
    innerWidth;

  const h=
    innerHeight;

  const maxX=
    Math.max(0,w-p.size);

  const maxY=
    Math.max(SAFE_TOP,h-p.size);

  p.x=
    Math.max(
      0,
      Math.min(
        maxX,
        p.x
      )
    );

  p.y=
    Math.max(
      SAFE_TOP,
      Math.min(
        maxY,
        p.y
      )
    );

}

function bounceFromEdges(p){

  const w=innerWidth;
  const h=innerHeight;
  const maxX=Math.max(0,w-p.size);
  const maxY=Math.max(SAFE_TOP,h-p.size);
  const bounce=.82;

  if(p.x<=0){
    p.x=0;
    if(p.vx<0) p.vx=-p.vx*bounce;
  }else if(p.x>=maxX){
    p.x=maxX;
    if(p.vx>0) p.vx=-p.vx*bounce;
  }

  if(p.y<=SAFE_TOP){
    p.y=SAFE_TOP;
    if(p.vy<0) p.vy=-p.vy*bounce;
  }else if(p.y>=maxY){
    p.y=maxY;
    if(p.vy>0) p.vy=-p.vy*bounce;
  }
}


/* =====================================================
   APPLY
===================================================== */

function applyPosition(id){

  const p=
    positions.get(id);

  const node=
    nodes.get(id);


  if(
    !p ||
    !node
  )
    return;


  node.card.style.setProperty(
    '--x',
    p.x+'px'
  );

  node.card.style.setProperty(
    '--y',
    p.y+'px'
  );

  node.card.style.setProperty(
    '--size',
    p.size+'px'
  );

  node.card.style.setProperty(
    '--rot',
    p.rotation+'deg'
  );

}


/* =====================================================
   CREATE COIN
===================================================== */

function createCoin(coin){

  const card=
    document.createElement(
      'div'
    );

  card.className=
    'coinCard';


  const body=
    document.createElement(
      'div'
    );

  body.className=
    'coinBody';


  const logo=
    document.createElement(
      'img'
    );

  logo.className=
    'coinLogo';

  logo.src=
    coin.image;

  logo.draggable=false;


  const symbol=
    document.createElement(
      'div'
    );

  symbol.className=
    'coinSymbol';

  symbol.textContent=
    coin.symbol.toUpperCase();


  const priceEl=
    document.createElement(
      'div'
    );

  priceEl.className=
    'coinPrice';

  priceEl.textContent=
    price(
      coin.current_price
    );


  const gain=
    Number(
      coin.price_change_percentage_24h
    )||0;


  const gainEl=
    document.createElement(
      'div'
    );

  gainEl.className=
    'coinGain '+
    (
      gain>=0
        ?'up'
        :'down'
    );

  gainEl.textContent=percent(gain);


  body.appendChild(logo);
  body.appendChild(symbol);
  body.appendChild(priceEl);
  body.appendChild(gainEl);

  card.appendChild(body);


  nodes.set(
    coin.id,
    {
      card:card,
      priceEl:priceEl,
      gainEl:gainEl
    }
  );


  enableDrag(
    card,
    coin.id
  );


  applyPosition(
    coin.id
  );


  return card;

}


/* =====================================================
   RENDER PAGE
===================================================== */

function renderCurrentPage(){

  cloud.innerHTML='';

  nodes.clear();


  const start=
    currentPage*
    COINS_PER_PAGE;


  visibleCoins=
    allCoins.slice(
      start,
      start+
      COINS_PER_PAGE
    );


  createPositions();


  visibleCoins.forEach(
    coin=>{

      cloud.appendChild(
        createCoin(coin)
      );

    }
  );

}


/* =====================================================
   COINGECKO
===================================================== */

async function loadCGPage(page){

  const url=
    'https://api.coingecko.com/api/v3/coins/markets?'+
    'vs_currency=usd'+
    '&order=market_cap_desc'+
    '&per_page=250'+
    '&page='+page+
    '&sparkline=false'+
    '&price_change_percentage=1h,24h,7d,30d';


  const response=
    await fetch(
      url,
      {
        cache:'no-store'
      }
    );


  if(!response.ok){

    throw new Error(
      'CoinGecko HTTP '+
      response.status
    );

  }


  return response.json();

}


/* =====================================================
   LOAD 1000 COINS
===================================================== */

async function loadAllCoins(){

  try{

    const results=
      await Promise.all(
        [
          loadCGPage(1),
          loadCGPage(2),
          loadCGPage(3),
          loadCGPage(4)
        ]
      );


    allCoins=
      results
      .flat()
      .slice(
        0,
        TOTAL_COINS
      );


    const unique=
      new Map();


    allCoins.forEach(
      coin=>{

        if(
          !unique.has(
            coin.id
          )
        ){

          unique.set(
            coin.id,
            coin
          );

        }

      }
    );


    allCoins=
      Array.from(
        unique.values()
      )
      .slice(
        0,
        TOTAL_COINS
      );


    coinMap.clear();


    allCoins.forEach(
      coin=>{

        coinMap.set(
          coin.id,
          coin
        );

      }
    );


    createPageMenu();

    renderCurrentPage();

    connectBinance();


  }catch(error){

    console.error(
      error
    );


    cloud.innerHTML=
      `
        <div
          style="
          position:absolute;
          inset:0;
          display:flex;
          align-items:center;
          justify-content:center;
          color:#777;
          font-size:11px;
          text-align:center;
          padding:20px;
          ">
          Gagal mengambil data coin.
          <br>
          Silakan refresh halaman.
        </div>
      `;

  }

}


/* =====================================================
   BINANCE WEBSOCKET
===================================================== */

function connectBinance(){

  if(socket){

    try{
      socket.close();
    }catch(e){}

  }


  const symbols=
    allCoins
    .map(
      coin=>
        coin.symbol
        .toLowerCase()+
        'usdt@ticker'
    )
    .filter(
      (v,i,a)=>
        a.indexOf(v)===i
    )
    .slice(
      0,
      1000
    );


  if(
    !symbols.length
  )
    return;


  const url=
    'wss://stream.binance.com:9443/stream?streams='+
    symbols.join('/');


  try{

    socket=
      new WebSocket(
        url
      );


    socket.onmessage=
      event=>{

        try{

          const packet=
            JSON.parse(
              event.data
            );


          const data=
            packet.data;


          if(!data)
            return;


          const symbol=
            String(
              data.s
            )
            .replace(
              /USDT$/i,
              ''
            )
            .toLowerCase();


          allCoins.forEach(
            coin=>{

              if(
                coin.symbol
                .toLowerCase()===
                symbol
              ){

                coin.current_price=
                  Number(data.c);

                coin.price_change_percentage_24h=
                  Number(data.P);

                updateCoin(
                  coin
                );


                if(
                  selectedCoin &&
                  selectedCoin.id===
                  coin.id
                ){

                  updatePopup(
                    coin
                  );

                }

              }

            }
          );


        }catch(e){

          console.warn(e);

        }

      };


    socket.onclose=()=>{

      clearTimeout(
        reconnectTimer
      );


      reconnectTimer=
        setTimeout(
          connectBinance,
          5000
        );

    };

  }catch(error){

    console.warn(
      error
    );

  }

}


/* =====================================================
   UPDATE COIN
===================================================== */

function updateCoin(coin){

  const node=
    nodes.get(
      coin.id
    );


  if(!node)
    return;


  node.priceEl.textContent=
    price(
      coin.current_price
    );


  const gain=
    Number(
      coin.price_change_percentage_24h
    )||0;


  node.gainEl.textContent=percent(gain);


  node.gainEl.className=
    'coinGain '+
    (
      gain>=0
        ?'up'
        :'down'
    );


  const p=
    positions.get(
      coin.id
    );


  if(!p)
    return;


  const oldSize=
    p.size;

  const newSize=
    sizeFromGain(
      gain
    );


  if(
    Math.abs(
      oldSize-newSize
    )>=1
  ){

    const cx=
      p.x+
      oldSize/2;

    const cy=
      p.y+
      oldSize/2;


    p.size=
      newSize;


    p.x=
      cx-
      newSize/2;

    p.y=
      cy-
      newSize/2;


    p.homeX=
      p.x;

    p.homeY=
      p.y;


    clampPosition(p);

    // Re-apply CSS size immediately when realtime gain changes.
    applyPosition(coin.id);

  }

}


/* =====================================================
   DRAG
===================================================== */

function enableDrag(
  card,
  id
){

  let pointerId=null;

  let startPointerX=0;

  let startPointerY=0;

  let startX=0;

  let startY=0;

  let lastX=0;

  let lastY=0;

  let velocityX=0;

  let velocityY=0;

  let moved=false;


  card.addEventListener(
    'pointerdown',
    e=>{

      const p=
        positions.get(id);

      if(!p)
        return;


      pointerId=
        e.pointerId;


      card.setPointerCapture(
        pointerId
      );


      startPointerX=
        e.clientX;

      startPointerY=
        e.clientY;


      startX=p.x;

      startY=p.y;


      lastX=e.clientX;

      lastY=e.clientY;


      velocityX=0;

      velocityY=0;

      moved=false;


      drag={
        id:id
      };


      card.classList.add(
        'dragging'
      );

    },
    {
      passive:true
    }
  );


  card.addEventListener(
    'pointermove',
    e=>{

      if(
        pointerId!==
        e.pointerId
      )
        return;


      if(
        !drag ||
        drag.id!==id
      )
        return;


      const p=
        positions.get(id);

      if(!p)
        return;


      const dx=
        e.clientX-
        startPointerX;


      const dy=
        e.clientY-
        startPointerY;


      if(
        Math.abs(dx)>3 ||
        Math.abs(dy)>3
      ){

        moved=true;

      }


      p.x=
        startX+
        dx;

      p.y=
        startY+
        dy;


      clampPosition(p);


      velocityX=
        velocityX*.55+
        (
          e.clientX-
          lastX
        )*.45;


      velocityY=
        velocityY*.55+
        (
          e.clientY-
          lastY
        )*.45;


      lastX=e.clientX;

      lastY=e.clientY;


      p.rotation=
        Math.max(
          -7,
          Math.min(
            7,
            velocityX*.7
          )
        );


      pushNeighbors(
        id,
        velocityX,
        velocityY
      );


      applyPosition(id);

    },
    {
      passive:true
    }
  );


  function release(e){

    if(
      pointerId!==
      e.pointerId
    )
      return;


    pointerId=null;


    const p=
      positions.get(id);


    if(p){

      p.vx+=
        velocityX*.45;

      p.vy+=
        velocityY*.45;

      p.homeX=
        p.x;

      p.homeY=
        p.y;

      p.rotation=0;

    }


    card.classList.remove(
      'dragging'
    );


    const wasClick=
      !moved;


    drag=null;


    if(wasClick){

      openPopup(id);

    }

  }


  card.addEventListener(
    'pointerup',
    release
  );


  card.addEventListener(
    'pointercancel',
    release
  );

}


/* =====================================================
   PUSH NEIGHBORS
===================================================== */

function pushNeighbors(
  movingId,
  vx,
  vy
){

  const moving=
    positions.get(
      movingId
    );

  if(!moving)
    return;


  positions.forEach(
    (other,id)=>{

      if(
        id===
        movingId
      )
        return;


      const dx=
        (
          other.x+
          other.size/2
        )-
        (
          moving.x+
          moving.size/2
        );


      const dy=
        (
          other.y+
          other.size/2
        )-
        (
          moving.y+
          moving.size/2
        );


      const distance=
        Math.sqrt(
          dx*dx+
          dy*dy
        );


      const minimum=
        (
          moving.size/2+
          other.size/2
        )*.92;


      if(
        distance<
        minimum
      ){

        const d=
          Math.max(
            distance,
            .001
          );


        const nx=
          dx/d;

        const ny=
          dy/d;


        const overlap=
          minimum-distance;


        const speed=
          Math.min(
            13,
            Math.sqrt(
              vx*vx+
              vy*vy
            )
          );


        const impulse=
          overlap*.95+
          speed*.42;


        other.vx+=
          nx*
          impulse;

        other.vy+=
          ny*
          impulse;


        other.rotation+=
          nx*
          impulse*
          .7;


        other.vx=
          Math.max(
            -8,
            Math.min(
              8,
              other.vx
            )
          );


        other.vy=
          Math.max(
            -8,
            Math.min(
              8,
              other.vy
            )
          );


        other.homeX+=
          nx*
          Math.min(
            11,
            overlap+
            speed*.65
          );


        other.homeY+=
          ny*
          Math.min(
            11,
            overlap+
            speed*.65
          );


        clampPosition(
          other
        );

      }

    }
  );

}


/* =====================================================
   FLOATING PHYSICS
===================================================== */

function animate(){

  const now=
    performance.now();


  positions.forEach(
    (p,id)=>{

      const held=
        drag &&
        drag.id===
        id;


      if(!held){

        const fx=
          Math.sin(
            now*
            p.speedX+
            p.phaseX
          )*
          p.amplitudeX;


        const fy=
          Math.cos(
            now*
            p.speedY+
            p.phaseY
          )*
          p.amplitudeY;


        const targetX=
          p.homeX+
          fx;


        const targetY=
          p.homeY+
          fy;


        p.vx+=
          (
            targetX-
            p.x
          )*.018;


        p.vy+=
          (
            targetY-
            p.y
          )*.018;


        p.vx*=.83;

        p.vy*=.83;


        p.x+=p.vx;

        p.y+=p.vy;


        p.rotation=
          Math.sin(
            now*
            p.rotSpeed+
            p.phaseX
          )*2.1;

      }


      bounceFromEdges(p);
      clampPosition(p);

      applyPosition(id);

    }
  );


  collisionPhysics();


  requestAnimationFrame(
    animate
  );

}


/* =====================================================
   COLLISION
===================================================== */

function collisionPhysics(){

  const ids=
    Array.from(
      positions.keys()
    );


  for(
    let i=0;
    i<ids.length;
    i++
  ){

    const a=
      positions.get(
        ids[i]
      );


    if(!a)
      continue;


    for(
      let j=i+1;
      j<ids.length;
      j++
    ){

      const b=
        positions.get(
          ids[j]
        );


      if(!b)
        continue;


      const dx=
        (
          b.x+
          b.size/2
        )-
        (
          a.x+
          a.size/2
        );


      const dy=
        (
          b.y+
          b.size/2
        )-
        (
          a.y+
          a.size/2
        );


      const distance=
        Math.sqrt(
          dx*dx+
          dy*dy
        );


      const minimum=
        (
          a.size/2+
          b.size/2
        )*.82;


      if(
        distance<
        minimum &&
        distance>.001
      ){

        const nx=
          dx/
          distance;

        const ny=
          dy/
          distance;


        const overlap=
          minimum-
          distance;


        const push=
          overlap*.13;


        a.x-=
          nx*
          push;

        a.y-=
          ny*
          push;


        b.x+=
          nx*
          push;

        b.y+=
          ny*
          push;


        const bounce=
          .035;


        a.vx-=
          nx*
          bounce;

        a.vy-=
          ny*
          bounce;


        b.vx+=
          nx*
          bounce;

        b.vy+=
          ny*
          bounce;


        clampPosition(a);

        clampPosition(b);

      }

    }

  }

}


/* =====================================================
   POPUP
===================================================== */

function setChange(
  id,
  value
){

  const el=
    document.getElementById(
      id
    );


  if(!el)
    return;


  el.textContent=
    percent(value);


  el.style.color=
    Number(value)>=0
      ?'#55dc91'
      :'#ff5965';

}


function updatePopup(
  coin
){

  const gain=
    Number(
      coin.price_change_percentage_24h
    )||0;


  document.getElementById(
    'pPrice'
  ).textContent=
    price(
      coin.current_price
    );


  const gainEl=
    document.getElementById(
      'pGain'
    );


  gainEl.textContent=percent(gain);


  gainEl.className=
    'popupGain '+
    (
      gain>=0
        ?'up'
        :'down'
    );


  setChange(
    'twentyFourH',
    coin.price_change_percentage_24h
  );

}


function openPopup(id){

  const coin=
    coinMap.get(id);


  if(!coin)
    return;


  selectedCoin=
    coin;


  document.getElementById(
    'pLogo'
  ).src=
    coin.image;


  document.getElementById(
    'pName'
  ).textContent=
    coin.name;


  document.getElementById(
    'pSymbol'
  ).textContent=
    coin.symbol;


  updatePopup(
    coin
  );


  document.getElementById(
    'marketCap'
  ).textContent=
    large(
      coin.market_cap
    );


  document.getElementById(
    'volume'
  ).textContent=
    large(
      coin.total_volume
    );


  document.getElementById(
    'high'
  ).textContent=
    price(
      coin.high_24h
    );


  document.getElementById(
    'low'
  ).textContent=
    price(
      coin.low_24h
    );


  document.getElementById(
    'rank'
  ).textContent=
    coin.market_cap_rank
      ?'#'+coin.market_cap_rank
      :'—';


  document.getElementById(
    'supply'
  ).textContent=
    supply(
      coin.circulating_supply
    );


  document.getElementById(
    'totalSupply'
  ).textContent=
    supply(
      coin.total_supply
    );


  document.getElementById(
    'maxSupply'
  ).textContent=
    supply(
      coin.max_supply
    );


  document.getElementById(
    'ath'
  ).textContent=
    price(
      coin.ath
    );

    'atl'

      coin.atl

    'oneH',

  );


  setChange(

    coin.price_change_percentage_7d_in_currency

  );

    'overlay'

  );

}


/* =====================================================
   CLOSE POPUP
===================================================== */

function closePopup(){

  document.getElementById(
    'overlay'
  ).classList.remove(
    'show'
  );

  selectedCoin=null;

}


document.getElementById(
  'close'
).addEventListener(
  'click',
  closePopup
);


document.getElementById(
  'overlay'
).addEventListener(
  'pointerdown',
  e=>{

    if(
      e.target.id===
      'overlay'
    ){

      closePopup();

    }

  }
);


/* =====================================================
   TRADINGVIEW
===================================================== */

document.getElementById(
  'chart'
).addEventListener(

  ()=>{

      return;


    const symbol=
      selectedCoin.symbol
      .toUpperCase();

      encodeURIComponent(
        symbol+
        'USDT'
      );

      url,

/* =====================================================
   RESIZE
===================================================== */

window.addEventListener(
  'resize',
  ()=>{
    if(visibleCoins.length){
      createPositions();
      positions.forEach((p,id)=>applyPosition(id));
    }else{
      positions.forEach(p=>clampPosition(p));
    }
  }
);


/* =====================================================
   START
===================================================== */

createPageMenu();

loadAllCoins();

requestAnimationFrame(
  animate
);
